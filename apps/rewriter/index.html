<title>Rewriter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script type="application/json" id="claude-artifacts-manifest">{"permissions":["shortcuts"]}</script>
<style>
/* Layout: top bar (history, file, export, voice, more), a mode bar (modes, synonym strength, freeze words),
   then two panes: your text on the left (with AI-tell highlights drawn behind the textarea) and the rewrite on
   the right (changed words highlighted, click a word or sentence for alternatives, or switch to the AI tells list). */
:root{
  --bg:#f4f4f6; --panel:#ffffff; --fg:#17181d; --muted:#6b6f7a; --line:#e2e3e8; --chip:#eeeef2; --hover:#f0f0f4;
  --accent:#6d4ed8; --accent-fg:#ffffff; --accent-soft:rgba(109,78,216,.11);
  --chg:#c2510b; --long:rgba(37,99,235,.13); --tell:rgba(234,179,8,.28); --tell-line:#d97706; --tell-on:rgba(234,88,12,.32);
  --ok:#1f9d63; --danger:#d23f3f;
  --shadow:0 10px 30px rgba(15,18,35,.14),0 1px 3px rgba(15,18,35,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141518;--panel:#1c1d22;--fg:#ecedf1;--muted:#949aa6;--line:#2d2f36;--chip:#26282e;--hover:#25272d;--accent:#a68ffc;--accent-fg:#160f33;--accent-soft:rgba(166,143,252,.15);--chg:#fb9a55;--long:rgba(96,165,250,.18);--tell:rgba(234,179,8,.22);--tell-line:#f0b429;--tell-on:rgba(251,146,60,.35);--ok:#3ccf8e;--danger:#ff7676;--shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141518;--panel:#1c1d22;--fg:#ecedf1;--muted:#949aa6;--line:#2d2f36;--chip:#26282e;--hover:#25272d;--accent:#a68ffc;--accent-fg:#160f33;--accent-soft:rgba(166,143,252,.15);--chg:#fb9a55;--long:rgba(96,165,250,.18);--tell:rgba(234,179,8,.22);--tell-line:#f0b429;--tell-on:rgba(251,146,60,.35);--ok:#3ccf8e;--danger:#ff7676;--shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--font);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ic{width:16px;height:16px;flex:none}
kbd{font:500 11px/1 var(--font);opacity:.72;margin-left:4px}
/* top bar */
.top{display:flex;align-items:center;gap:4px;padding:10px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));flex:none}
body.app .top{app-region:drag;-webkit-app-region:drag;padding-left:max(80px,env(safe-area-inset-left,0px))}
.top>*{app-region:no-drag;-webkit-app-region:no-drag}
.top .sp{flex:1;align-self:stretch;app-region:drag;-webkit-app-region:drag}
.brand{font-weight:650;font-size:13.5px;margin:0 6px 0 4px;letter-spacing:-.01em}
.ib{border:0;background:transparent;border-radius:7px;width:30px;height:30px;display:inline-grid;place-items:center;cursor:pointer;color:var(--fg);flex:none;padding:0}
.ib:hover{background:var(--hover)}
.ib:disabled{opacity:.4;cursor:default}
.tb{border:0;background:transparent;border-radius:7px;height:30px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:550;white-space:nowrap}
.tb:hover{background:var(--hover)}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;height:30px;padding:0 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:560}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.pri:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:default}
.lnk{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px 6px;border-radius:6px;font-weight:550}
.lnk:hover{color:var(--fg);background:var(--hover)}
.menuwrap{position:relative}
.menu{position:absolute;top:34px;right:0;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;z-index:40}
.menu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:7px 9px;border-radius:7px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
.menu button kbd{margin-left:auto}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
/* mode bar */
.modebar{display:flex;align-items:center;gap:10px;padding:0 max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));flex:none;flex-wrap:wrap}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 420px;padding:1px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:0 11px;height:28px;cursor:pointer;font-weight:560;color:var(--muted);white-space:nowrap;flex:none}
.chip:hover{color:var(--fg)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.ctrl{display:flex;align-items:center;gap:8px;flex:none}
.syn{display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:550;white-space:nowrap}
.syn input{width:96px;accent-color:var(--accent)}
.syn b{color:var(--fg);font-weight:600;min-width:52px}
.subrow{display:flex;align-items:center;gap:8px;padding:0 max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));flex:none}
.subrow label{color:var(--muted);font-weight:550;white-space:nowrap}
.subrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:8px;height:30px;padding:0 10px;outline:none}
.subrow input:focus{border-color:var(--accent)}
/* panes */
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.ph{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 14px;border-bottom:1px solid var(--line);min-height:41px;flex:none}
.ph .pt{font-weight:650}
.ph .meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .sp{flex:1}
.tab{border:0;background:transparent;height:28px;padding:0 10px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);background:var(--chip)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--tell);color:var(--fg);font-size:11px;font-weight:650;display:inline-grid;place-items:center}
.badge:empty{display:none}
.badge.zero{background:rgba(31,157,99,.16);color:var(--ok)}
.vers{display:flex;align-items:center;gap:2px;color:var(--muted);font-size:12px;white-space:nowrap}
.vers .ib{width:24px;height:24px}
.edwrap{position:relative;flex:1;min-height:0}
#backdrop,#in{position:absolute;inset:0;margin:0;padding:14px 16px 40px;font:15.5px/1.62 var(--font);white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;letter-spacing:normal;scrollbar-gutter:stable;tab-size:4}
#backdrop{color:transparent;overflow:hidden;pointer-events:none;z-index:0}
#backdrop mark{color:transparent;background:var(--tell);border-radius:3px;box-shadow:inset 0 -2px 0 var(--tell-line)}
#backdrop mark.on{background:var(--tell-on)}
#in{z-index:1;background:transparent;border:0;resize:none;outline:none;color:var(--fg);overflow:auto;width:100%;height:100%}
#in::placeholder{color:var(--muted)}
.inempty{position:absolute;left:14px;right:14px;bottom:12px;z-index:2;display:flex;gap:6px;flex-wrap:wrap}
.pf{display:flex;align-items:center;gap:4px;padding:6px 8px;border-top:1px solid var(--line);flex:none;flex-wrap:wrap;min-height:44px}
.pf .st{flex:1;min-width:80px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.tg{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;font-weight:550;cursor:pointer;padding:0 5px;white-space:nowrap}
.tg input{accent-color:var(--accent);margin:0}
.outbody{flex:1;min-height:0;overflow:auto;position:relative}
#out{padding:14px 16px 24px;font:15.5px/1.62 var(--font);white-space:pre-wrap;overflow-wrap:break-word;outline:none;min-height:100%;-webkit-user-select:text;user-select:text}
#out .s{border-radius:4px;cursor:pointer}
#out .s:hover{background:var(--hover)}
#out .w{border-radius:3px}
#out .w:hover{text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:3px}
#out .c{color:var(--chg);font-weight:560}
#out .l{background:var(--long)}
#out .tl{background:var(--tell);box-shadow:inset 0 -2px 0 var(--tell-line)}
#out .tl.on{background:var(--tell-on)}
#out .pk{background:var(--accent-soft);outline:1px solid var(--accent);border-radius:3px}
#out.streaming .s,#out.streaming .w{cursor:default}
#out.streaming::after{content:"";display:inline-block;width:7px;height:16px;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#outEdit{position:absolute;inset:0;width:100%;height:100%;border:0;resize:none;outline:none;background:var(--panel);padding:14px 16px 24px;font:15.5px/1.62 var(--font)}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);gap:10px}
.empty h3{margin:0;color:var(--fg);font-size:15px;font-weight:650}
.empty p{margin:0;max-width:340px;line-height:1.5}
.keys{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px}
.keys span b{color:var(--fg);font-weight:600;margin-right:4px}
.shim{padding:16px;display:flex;flex-direction:column;gap:10px}
.shim i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--chip),var(--hover),var(--chip));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
/* tells */
.tsrc{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;flex-wrap:wrap;position:sticky;top:0;background:var(--panel);z-index:2}
.seg{display:flex;background:var(--chip);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;padding:0 10px;height:26px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.tsum{flex:1;color:var(--muted);font-size:12px;min-width:120px}
#tellsList{padding:2px 12px 16px}
.tgrp{margin-top:10px}
.tgh{display:flex;align-items:center;gap:6px;font-weight:650;margin-bottom:2px}
.tgh .n{color:var(--muted);font-weight:550}
.twhy{color:var(--muted);font-size:12px;margin:0 0 6px;line-height:1.45}
.ti{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.ti:hover,.ti.on{border-color:var(--tell-line)}
.snip{font-size:13px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.snip b{color:var(--fg);background:var(--tell);border-radius:3px;font-weight:550;padding:0 1px}
.tact{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tact .sug{font-size:12.5px;color:var(--ok);font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.tact .sug.ai{color:var(--accent)}
.sm{height:26px;padding:0 9px;font-size:12px;border-radius:7px}
.tnone{padding:30px 10px;text-align:center;color:var(--muted)}
.tnone h3{margin:0 0 6px;color:var(--fg);font-size:15px}
/* popover */
.pop{position:fixed;z-index:60;width:min(360px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:4px;max-height:min(440px,calc(100vh - 24px));overflow:auto}
.poph{display:flex;align-items:center;gap:8px;padding:2px 4px 4px;color:var(--muted);font-size:12px}
.poph b{color:var(--fg);font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.poph .sp{flex:1}
.alt{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;border-radius:7px;padding:6px 8px;cursor:pointer;line-height:1.45}
.alt:hover,.alt:focus-visible{background:var(--accent-soft);outline:none}
.alt .k{color:var(--muted);font-size:11px;min-width:10px;padding-top:2px}
.ld{color:var(--muted);padding:8px;font-size:12.5px}
.pstyles{display:flex;gap:4px;flex-wrap:wrap;padding:4px 2px 2px;border-top:1px solid var(--line);margin-top:2px}
.pstyles button{border:1px solid var(--line);background:transparent;border-radius:999px;height:24px;padding:0 9px;font-size:12px;cursor:pointer;color:var(--muted);font-weight:550}
.pstyles button:hover,.pstyles button.on{color:var(--accent);border-color:var(--accent)}
/* drawer */
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(340px,92vw);background:var(--panel);border-right:1px solid var(--line);box-shadow:var(--shadow);z-index:45;display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;gap:6px;padding:12px 10px 8px 14px}
body.app .drawer .dh{padding-top:30px}
.drawer .dh h2{font-size:14px;margin:0;flex:1}
.drawer .ds{margin:0 12px 8px;border:1px solid var(--line);background:var(--bg);border-radius:8px;height:30px;padding:0 10px;outline:none}
.drawer .ds:focus{border-color:var(--accent)}
#histList{flex:1;overflow:auto;padding:0 6px 10px}
.hitem{display:flex;align-items:flex-start;gap:6px;padding:8px;border-radius:8px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left}
.hitem:hover{background:var(--hover)}
.hitem.on{background:var(--accent-soft)}
.hitem .hb{flex:1;min-width:0}
.hitem .hp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.hitem .hm{color:var(--muted);font-size:11.5px;margin-top:2px}
.hitem .ib{width:24px;height:24px;opacity:0}
.hitem:hover .ib,.hitem:focus-within .ib{opacity:1}
.scrim{position:fixed;inset:0;z-index:44;background:rgba(10,10,20,.18)}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,10,20,.35);display:grid;place-items:center;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.dlg.wide{width:min(1040px,100%)}
.dlg .dh{display:flex;align-items:center;gap:8px;padding:14px 14px 10px 18px;border-bottom:1px solid var(--line)}
.dlg .dh h2{margin:0;font-size:15px;flex:1}
.dlg .db{padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.dlg .df{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg .df .sp{flex:1}
.dlg p.note{margin:0;color:var(--muted);line-height:1.5}
.dlg label.f{display:flex;flex-direction:column;gap:5px;font-weight:600}
.dlg label.f span.h{font-weight:450;color:var(--muted);font-size:12px}
.dlg input[type=text],.dlg select,.dlg textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;outline:none;font-weight:400}
.dlg textarea{resize:vertical;line-height:1.5;min-height:90px}
.dlg input:focus,.dlg select:focus,.dlg textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.chk input{accent-color:var(--accent)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:150px}
.card .chh{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 12px;border-bottom:1px solid var(--line);font-weight:650}
.card .chh .sp{flex:1}
.card .ct{padding:10px 12px;white-space:pre-wrap;overflow-wrap:break-word;line-height:1.55;font-size:14px;flex:1;max-height:340px;overflow:auto}
.card .ct .c{color:var(--chg);font-weight:560}
.card .ct del{color:var(--danger);text-decoration:line-through;opacity:.8}
.kl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.kl dt{font-weight:600;white-space:nowrap}
.kl dd{margin:0;color:var(--muted)}
/* toast, drop */
.toast{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);background:#1d1e24;color:#fff;border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:12px;z-index:70;box-shadow:var(--shadow);max-width:calc(100vw - 32px);font-size:13px}
.toast button{border:0;background:transparent;color:#c4b5fd;font-weight:650;cursor:pointer;padding:2px 4px}
.drop{position:fixed;inset:8px;border:2px dashed var(--accent);border-radius:16px;background:var(--accent-soft);z-index:80;display:grid;place-items:center;font-weight:650;font-size:15px;color:var(--accent);pointer-events:none}
@media (max-width:760px){
  body{overflow:auto}
  main{display:flex;flex-direction:column;min-height:auto;flex:none}
  .pane{height:58vh;min-height:300px;flex:none}
  .brand{display:none}
  .tb .lbl{display:none}
  .syn input{width:72px}
  .syn b{min-width:0}
}
@media (max-width:460px){
  .modebar{gap:6px}
  .vers .lnk{display:none}
}
</style>

  <button class="ib" id="histBtn" title="History (⌘⇧H)" aria-label="History"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button>
  <button class="ib" id="newBtn" title="New text (⌥N)" aria-label="New text"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

    <div class="menu" id="exportMenu" role="menu" hidden>

      <button data-x="md">Result as Markdown (.md)</button>
      <button data-x="txt">Result as plain text (.txt)</button>

      <button data-x="all">Your text and all versions (.md)</button>
      <button data-x="copy">Copy result<kbd>⌘⇧C</kbd></button>

function detectTells(text){

  let m;while((m=tre.exec(text)))triads.push({s:m.index,e:m.index+m[0].length,cat:"three",rep:null,m:m[0]});
  if(triads.length>=2)found.push(...triads);

  const cl=[];const cre=zh?/[^，,；;。！？!?\n、]+/g:/[^,;.!?\n]+/g;while((m=cre.exec(text))){const t=m[0];const lead=t.match(/^\s*/)[0].length;cl.push({s:m.index+lead,e:m.index+t.length,t:t.trim()});}

    let a=i;
    // Chinese: "它让…，让…，让…" — the first clause starts with a subject, the rest repeat the verb
    if(zh&&j-i===2&&i>0&&cl[i-1].t.slice(1,3).includes(h)&&text.slice(cl[i-1].e,cl[i].s).length<=3)a=i-1;
    if(j-a>=3&&okC(cl[i]))found.push({s:cl[a].s,e:cl[j-1].e,cat:"parallel",rep:null,m:text.slice(cl[a].s,cl[j-1].e)});

  for(const f of found){if(f.s<end)continue;if(ignored.has(f.cat+":"+f.m.trim().toLowerCase()))continue;res.push(f);end=f.e;}

  const ss=sentences(text).map(x=>text.slice(x.s,x.e).trim()).filter(x=>x.length>2&&!/^#/.test(x));

  return res;
}
function applyLocal(text,f){ // returns {s,e,t}
  let s=f.s,e=f.e,t=f.rep;

  }
  return {s,e,t};
}

function mergeDisk(){ // keep sessions another tab saved since we loaded
  try{const d=JSON.parse(localStorage.getItem("rewriter.sessions")||"[]");if(!Array.isArray(d))return;
    const have=new Set(sessions.map(s=>s.id));

  if(e.key!=="rewriter.sessions")return;let d;try{d=JSON.parse(e.newValue||"[]");}catch{return;}if(!Array.isArray(d))return;
  d=d.filter(validSession);const i=d.findIndex(s=>s.id===S.id);if(i>=0)d[i]=S;else if(sessions.includes(S))d.unshift(S);

  mergeDisk();

  for(let n=list.length;n>=0;n=n?Math.floor(n*0.6):-1){
    try{localStorage.setItem("rewriter.sessions",JSON.stringify(list.slice(0,n)));sessions=sessions.slice(0,Math.max(n,1));return;}catch(e){if(n===0){warnStorage();return;}}
  }

let persistT=0;
function persist(now){
  clearTimeout(persistT);
  const go=()=>{const has=S.input.trim()||S.versions.length;
    const i=sessions.indexOf(S);
    if(has){S.at=Date.now();if(i<0)sessions.unshift(S);else if(i>0){sessions.splice(i,1);sessions.unshift(S);}}

const ERR={rate_limited:["Claude is busy or you hit your usage limit. Try again in a bit.","Claude 正忙，或你已达到用量上限，请稍后再试。"],not_granted:["Claude isn't allowed for this app. Allow it to rewrite.","此应用未获准使用 Claude，允许后才能改写。"],sampling_disabled:["Claude isn't available on this account.","此账号无法使用 Claude。"],refused:["Claude declined this text.","Claude 拒绝处理这段文字。"],session_expired:["Sign in to Claude again.","请重新登录 Claude。"],prompt_too_large:["That's too long for one request. Try a shorter piece.","一次处理的内容太长，换短一点的试试。"],invalid_json:["Claude's answer couldn't be read. Try again.","没能读懂 Claude 的回答，请重试。"]};

function tierOpts(m){

function buildPrompt(text,o){
  const zh=isZh(text);const L=[];
  L.push("Rewrite the text below so it reads like a thoughtful person wrote it by hand.");
  if(o.mode==="voice"){
    const v=o.voice;
    L.push(`Write it the way this person writes. Match their word choice, sentence length, punctuation habits, formality and quirks. Do not copy their content.`);
    if(v?.profile?.trim())L.push(`Their style, described:\n${v.profile.trim().slice(0,3000)}`);
    if(v?.samples?.trim())L.push(`Samples of their own writing:\n<<<\n${v.samples.trim().slice(0,9000)}\n>>>`);
  }else if(o.mode==="custom"){
    L.push(`Make it sound: ${(o.custom||"natural").slice(0,200)}.`);
  }else L.push(`Mode: ${MODE[o.mode].d}`);
  L.push(`How much to change: ${STRENGTH[o.strength]||STRENGTH[2]}`);
  if(o.freeze?.length)L.push(`Keep these words and phrases exactly as written: ${o.freeze.map(x=>`"${x}"`).join(", ")}.`);
  if(!zh&&settings.spelling!=="keep")L.push(`Use ${settings.spelling} English spelling and vocabulary.`);
  if(zh&&settings.script==="simplified")L.push("Write in Simplified Chinese characters.");
  if(zh&&settings.script==="traditional")L.push("Write in Traditional Chinese characters.");
  L.push(`Keep the meaning, facts, names, numbers, links, code and Markdown formatting (headings, lists, bold). Keep the paragraph breaks. Write in the same language as the text${zh?" (Chinese)":""}; do not translate.`);
  L.push(AVOID);

}
function cleanOut(t){

  t=t.replace(/^(?:here(?:'s|’s| is)[^\n]{0,80}:|sure[^\n]{0,60}:|rewritten(?: text)?:)\s*\n+/i,"");
  return t.replace(/^\n+|\s+$/g,"");
}
function chunks(text,max=6000){
  if(text.length<=max)return [text];
  const paras=text.split(/(\n{2,})/);const res=[];let cur="";
  for(const p of paras){if((cur+p).length>max&&cur.trim()){res.push(cur);cur="";}cur+=p;}
  if(cur.trim())res.push(cur);
  // a single giant paragraph: split by sentences
  return res.flatMap(c=>{if(c.length<=max*1.3)return [c];const out=[];let b="";for(const sn of sentences(c)){const x=c.slice(sn.s,sn.e);if((b+x).length>max&&b){out.push(b);b="";}b+=x;}if(b)out.push(b);return out;});
}

async function rewrite(){

  if(!text.trim()){ta.focus();setInStatus(T("Type or paste some text first.","先输入或粘贴要改写的文字。"));return;}
  if(!sample){noClaude();return;}
  const o={mode,strength,freeze:freezeList(),custom:$("customIn").value.trim()};
  if(mode==="voice"){o.voice=curVoice();if(!o.voice||!(o.voice.samples||"").trim()){openVoice();return;}}
  if(mode==="custom"&&!o.custom){$("customRow").hidden=false;$("customIn").focus();setInStatus(T("Describe the sound you want first.","先描述你想要的感觉。"));return;}
  closePop();finishEdit(false);setTab("result");
  const my=ctl=new AbortController();setRunning(true);
  const parts=chunks(text);let done="";streamText="";
  $("outEmpty").hidden=true;out.classList.remove("streaming");out.innerHTML=`<div class="shim"><i style="width:92%"></i><i style="width:80%"></i><i style="width:88%"></i><i style="width:60%"></i></div>`;
  $("outSt").textContent=T("Thinking…","思考中…");
  try{
    for(let i=0;i<parts.length;i++){
      const prefix=done;
      const r=await sample(buildPrompt(parts[i],o),{signal:my.signal,cache:false,...tierOpts(mode),onText:({text:t})=>{if(ctl!==my)return;streamText=prefix+cleanOut(t);out.classList.add("streaming");out.textContent=streamText;$("outSt").textContent=parts.length>1?T(`Writing part ${i+1} of ${parts.length}…`,`正在写第 ${i+1}/${parts.length} 部分…`):T("Writing…","输出中…");}});
      const piece=cleanOut(r.text);
      const sep=parts[i].match(/\n*$/)[0]||(i<parts.length-1?"\n\n":"");
      done=prefix+piece+(i<parts.length-1?(sep.length>=2?sep:"\n\n"):"");
      if(r.truncated){toast(T("The answer was cut short. Try a shorter piece.","回答被截断了，换短一点的试试。"));}
    }
    if(ctl!==my)return;
    ctl=null;setRunning(false);streamText="";
    const v={id:uid(),mode:o.mode,strength:o.strength,custom:o.custom,voice:o.voice?.name||"",input:text,text:done,at:Date.now()};
    S.versions.push(v);S.cur=S.versions.length-1;S.input=text;persist(true);
    out.classList.remove("streaming");renderAll();
    const miss=o.freeze.filter(f=>!done.toLowerCase().includes(f.toLowerCase()));
    if(miss.length)toast(T(`Not kept: ${miss.join(", ")}. Click the word to fix it, or rewrite again.`,`没保留：${miss.join("、")}。可点击该词修改，或再改写一次。`));
  }catch(e){

    ctl=null;setRunning(false);streamText="";
    out.classList.remove("streaming");renderOut();updateButtons();
    if(e?.code==="cancelled")$("outSt").textContent=T("Stopped.","已停止。");
    else{$("outSt").textContent=errText(e);if(e?.code==="not_granted"){sample=null;}}
  }finally{if(ctl===my){ctl=null;setRunning(false);}}
}

let OT=null; // analysed result: {key,text,toks,same,sents,best,pct}
function analyze(){
  const v=curV();if(!v){OT=null;return null;}
  const key=v.input+"\u0000"+v.text;if(OT&&OT.key===key)return OT;
  const toks=tokenize(v.text);const same=sameArr(tokenize(v.input),toks);const sents=sentences(v.text);
  let best=[0,-1],bestW=0,runS=-1,runW=0,words=0,chg=0;
  toks.forEach((t,i)=>{if(t.w){words++;if(!same[i])chg++;}
    if(t.w&&!same[i]){runS=-1;runW=0;return;}
    if(runS<0){if(!t.w)return;runS=i;runW=0;}
    if(t.w){runW++;if(runW>bestW){bestW=runW;best=[runS,i];}}});
  if(bestW<3)best=[0,-1];
  OT={key,text:v.text,toks,same,sents,best,pct:words?Math.round(chg/words*100):0,words};
  return OT;
}

    let c=t.w?"w":"p";
    if(t.w&&!A.same[i]&&settings.showChg)c+=" c";
    if(settings.showLong&&i>=A.best[0]&&i<=A.best[1])c+=" l";

async function fixTells(items){
  const src=tellsSrc;const text=src==="in"?ta.value:(curV()?.text||"");
  items=items.filter(t=>t&&!t.doc);if(!items.length)return;
  const local=items.filter(t=>t.rep!=null),ai=items.filter(t=>t.rep==null);
  const edits=[];

  if(ai.length){
    if(!sample){if(!local.length){noClaude();return;}}
    else{
      const sents=[];for(const t of ai){const sn=sentenceAt(text,t.s);const e=Math.max(coreEnd(text,sn),Math.min(t.e,text.length));let x=sents.find(q=>q.s===sn.s);if(x){x.cats.add(t.cat);x.e=Math.max(x.e,e);}else sents.push({s:sn.s,e,cats:new Set([t.cat])});}
      sents.sort((a,b)=>a.s-b.s);for(let i=1;i<sents.length;i++)if(sents[i].s<sents[i-1].e){sents[i-1].e=Math.max(sents[i-1].e,sents[i].e);sents[i].cats.forEach(c=>sents[i-1].cats.add(c));sents.splice(i--,1);}

        const r=await sample.json(`Each numbered sentence below has an AI-writing habit, named after it. Rewrite each sentence to remove that habit so it sounds like a person wrote it. Keep the meaning, the language${isZh(text)?" (Chinese)":""}, names and numbers. Do not introduce other habits (em dashes, "it's not X, it's Y", stock phrases, lists of three). Keep any leading Markdown such as "- " or "## ".\nReply with only JSON: {"fixes":[{"id":0,"text":"rewritten sentence"}]}\n\n`+use.map((x,i)=>`${i}. ${text.slice(x.s,x.e)}\n   Habit: ${[...x.cats].map(c=>CAT[c].en+" ("+CAT[c].why[0]+")").join("; ")}`).join("\n"),{modelTier:"quick",cache:false});
        const fixes=Array.isArray(r?.fixes)?r.fixes:[];
        for(const f of fixes){const x=use[+f.id];if(x&&typeof f.text==="string"&&f.text.trim())edits.push({s:x.s,e:x.e,t:f.text.trim()});}

      if((src==="in"?ta.value:(curV()?.text||""))!==text){toast(T("The text changed while Claude was working. Try again.","Claude 修改期间文字变了，请重试。"));renderTells();return;}
    }
  }
  for(const t of local){if(edits.some(x=>t.s<x.e&&t.e>x.s))continue;edits.push(applyLocal(text,t));}
  if(!edits.length){renderTells();return;}
  edits.sort((a,b)=>b.s-a.s);
  let nt=text;for(const x of edits)nt=nt.slice(0,x.s)+x.t+nt.slice(x.e);
  nt=nt.replace(/ ,/g,",").replace(/,\s*,/g,",").replace(/，，/g,"，").replace(/([.!?])\s*,/g,"$1");
  const msg=edits.length===1?T("Fixed.","已修改。"):T(`Fixed ${edits.length} spots.`,`已修改 ${edits.length} 处。`);
  if(src==="in"){
    if(edits.length===1&&nt===text.slice(0,edits[0].s)+edits[0].t+text.slice(edits[0].e))replaceInputRange(edits[0].s,edits[0].e,edits[0].t);

    tellsIn=detectTells(ta.value);activeTell=-1;renderTells();drawBackdrop();
    toast(msg,()=>{ta.focus();document.execCommand("undo");});
  }else{pushUndo();setOutText(nt);activeTell=-1;toast(msg,doUndo);}
}

function htmlToMd(html){ // Word headings, lists, bold and italics come back as the Markdown this app exports
  const doc=new DOMParser().parseFromString(`<body>${html}</body>`,"text/html");
  const inl=n=>[...n.childNodes].map(c=>{if(c.nodeType===3)return c.nodeValue;if(c.nodeType!==1)return "";const t=c.tagName,x=inl(c);
    if(t==="BR")return "\n";if(/^(UL|OL)$/.test(t))return "";if((t==="STRONG"||t==="B")&&x.trim())return `**${x}**`;if((t==="EM"||t==="I")&&x.trim())return `*${x}*`;return x;}).join("");
  const list=(el,d)=>[...el.children].filter(li=>li.tagName==="LI").map((li,i)=>{const sub=[...li.children].filter(c=>/^(UL|OL)$/.test(c.tagName)).map(c=>list(c,d+1)).join("\n");
    return "  ".repeat(d)+(el.tagName==="OL"?`${i+1}. `:"- ")+inl(li).trim()+(sub?"\n"+sub:"");}).join("\n");
  const out=[];
  for(const el of doc.body.children){const t=el.tagName,h=/^H([1-6])$/.exec(t);
    if(h)out.push("#".repeat(+h[1])+" "+inl(el).trim());
    else if(t==="UL"||t==="OL")out.push(list(el,0));
    else if(t==="TABLE")out.push([...el.querySelectorAll("tr")].map(r=>[...r.children].map(c=>c.textContent.trim()).join(" | ")).join("\n"));
    else out.push(inl(el));}
  return out.join("\n\n");
}

  try{
    if(ext==="docx"){if(!window.mammoth)throw new Error("lib");const r=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()});return htmlToMd(r.value).replace(/\n{3,}/g,"\n\n").trim();}
    if(["doc","pdf","pages","rtf","odt"].includes(ext)){toast(T(`.${ext} files can't be opened here. Save it as .docx, .txt or .md first.`,`这里打不开 .${ext} 文件，请先另存为 .docx、.txt 或 .md。`));return null;}
    return (await f.text()).replace(/\r\n?/g,"\n").replace(/^\uFEFF/,"");
  }catch(e){toast(e?.message==="lib"?T("The Word reader didn't load. Check your connection and reopen the app.","Word 读取组件没加载，请检查网络后重新打开。"):T(`Couldn't read “${f.name}”. Is it a valid .${ext} file?`,`读不了“${f.name}”，确认是有效的 .${ext} 文件吗？`));return null;}
}

/* paste: anywhere outside a text field pastes into Your text and rewrites */
ta.addEventListener("paste",e=>{
  const wasEmpty=!ta.value.trim()||(ta.selectionStart===0&&ta.selectionEnd===ta.value.length);
  const t=e.clipboardData?.getData("text/plain")||"";
  if(!wasEmpty||!t.trim())return;
  if(S.versions.length){S=freshSession();undoSt=[];redoSt=[];renderAll();}
  setTimeout(()=>{onInput();if(settings.onPaste&&sample&&!running)rewrite();},20);
});
document.addEventListener("paste",e=>{
  if(!$("modal").hidden)return;
  const tg=e.target;if(tg.closest?.("input,textarea,select,[contenteditable]"))return;
  const t=e.clipboardData?.getData("text/plain");if(!t||!t.trim())return;
  e.preventDefault();
  if(S.input.trim()||S.versions.length)newSession(true);
  setInput(t.replace(/\r\n?/g,"\n"));
  if(settings.onPaste&&sample&&!running)rewrite();else setInStatus(T("Pasted. Press ⌘↵ to rewrite.","已粘贴。按 ⌘↵ 改写。"));
});

const xmlEsc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,"");
function runs(s){
  const out=[];const re=/(\*\*[^*\n]+\*\*|__[^_\n]+__|\*[^*\n]+\*|_[^_\n]+_)/g;let last=0,m;
  const r=(t,b,i)=>`<w:r>${b||i?`<w:rPr>${b?"<w:b/>":""}${i?"<w:i/>":""}</w:rPr>`:""}<w:t xml:space="preserve">${xmlEsc(t)}</w:t></w:r>`;
  while((m=re.exec(s))){if(m.index>last)out.push(r(s.slice(last,m.index)));const tk=m[0];if(/^(\*\*|__)/.test(tk))out.push(r(tk.slice(2,-2),true));else out.push(r(tk.slice(1,-1),false,true));last=m.index+tk.length;}
  if(last<s.length)out.push(r(s.slice(last)));
  return out.join("");
}
async function buildDocx(text,title){
  const z=new JSZip();
  z.file("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`);
  z.file("_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`);
  z.file("docProps/core.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${xmlEsc(title)}</dc:title><dcterms:modified xsi:type="dcterms:W3CDTF">${new Date().toISOString().slice(0,19)}Z</dcterms:modified></cp:coreProperties>`);
  z.file("word/_rels/document.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/></Relationships>`);
  const st=(id,name,ppr,rpr)=>`<w:style w:type="paragraph" w:styleId="${id}"><w:name w:val="${name}"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr>${ppr}</w:pPr><w:rPr>${rpr}</w:rPr></w:style>`;
  z.file("word/styles.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="PingFang SC" w:cs="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="160" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>${st("Heading1","heading 1",'<w:keepNext/><w:spacing w:before="360" w:after="120"/><w:outlineLvl w:val="0"/>','<w:b/><w:sz w:val="36"/>')}${st("Heading2","heading 2",'<w:keepNext/><w:spacing w:before="240" w:after="100"/><w:outlineLvl w:val="1"/>','<w:b/><w:sz w:val="30"/>')}${st("Heading3","heading 3",'<w:keepNext/><w:spacing w:before="200" w:after="80"/><w:outlineLvl w:val="2"/>','<w:b/><w:sz w:val="26"/>')}${st("ListParagraph","List Paragraph",'<w:spacing w:after="60"/><w:ind w:left="720" w:hanging="360"/><w:contextualSpacing/>',"")}${st("Quote","Quote",'<w:ind w:left="720"/>','<w:i/>')}</w:styles>`);
  const paras=[],nums=[];let olNum=0,prevOl=false;
  const lvlXml=(fmt,i)=>`<w:lvl w:ilvl="${i}"><w:start w:val="1"/><w:numFmt w:val="${fmt}"/><w:lvlText w:val="${fmt==="bullet"?["•","◦","▪"][i%3]:`%${i+1}.`}"/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="${720+i*360}" w:hanging="360"/></w:pPr></w:lvl>`;
  const li=(lvl,numId,body)=>`<w:p><w:pPr><w:pStyle w:val="ListParagraph"/><w:numPr><w:ilvl w:val="${Math.min(lvl,8)}"/><w:numId w:val="${numId}"/></w:numPr></w:pPr>${body}</w:p>`;
  for(const raw of text.split("\n")){
    if(!raw.trim())continue;
    let m;const isOl=/^\s*\d+[.)]\s+/.test(raw);
    if(isOl&&!prevOl){olNum=3+nums.length;nums.push(olNum);}prevOl=isOl;
    if((m=/^(#{1,6})\s+(.*)$/.exec(raw)))paras.push(`<w:p><w:pPr><w:pStyle w:val="Heading${Math.min(3,m[1].length)}"/></w:pPr>${runs(m[2])}</w:p>`);
    else if((m=/^(\s*)([-*•])\s+(.*)$/.exec(raw)))paras.push(li(Math.floor(m[1].replace(/\t/g,"  ").length/2),1,runs(m[3])));
    else if((m=/^(\s*)(\d+[.)])\s+(.*)$/.exec(raw)))paras.push(li(Math.floor(m[1].length/2),olNum,runs(m[3])));
    else if((m=/^>\s?(.*)$/.exec(raw)))paras.push(`<w:p><w:pPr><w:pStyle w:val="Quote"/></w:pPr>${runs(m[1])}</w:p>`);
    else paras.push(`<w:p>${runs(raw.replace(/\t/g,"    "))}</w:p>`);
  }
  z.file("word/numbering.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:abstractNum w:abstractNumId="0"><w:multiLevelType w:val="hybridMultilevel"/>${[0,1,2,3,4,5,6,7,8].map(i=>lvlXml("bullet",i)).join("")}</w:abstractNum><w:abstractNum w:abstractNumId="1"><w:multiLevelType w:val="hybridMultilevel"/>${[0,1,2,3,4,5,6,7,8].map(i=>lvlXml("decimal",i)).join("")}</w:abstractNum><w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>${nums.map(n=>`<w:num w:numId="${n}"><w:abstractNumId w:val="1"/><w:lvlOverride w:ilvl="0"><w:startOverride w:val="1"/></w:lvlOverride></w:num>`).join("")}</w:numbering>`);
  z.file("word/document.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${paras.join("")||"<w:p/>"}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>`);
  return z.generateAsync({type:"uint8array",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
function baseName(){const src=(S.input||curV()?.text||"").trim();let t=src.split("\n")[0].replace(/^#+\s*/,"");t=isZh(t)?t.slice(0,16):t.split(/\s+/).slice(0,6).join(" ");t=t.replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim();return t||T("Rewrite","改写");}
async function save(filename,data){
  if(!downloads){toast(T("Saving files isn't available here. Use Copy instead.","这里无法保存文件，请改用复制。"));return;}
  try{await downloads.save({filename,data});toast(T(`Saved ${filename}.`,`已保存 ${filename}。`));}
  catch(e){if(e?.code==="declined")return;toast(T("Couldn't save the file. Try again.","没能保存文件，请重试。"));}
}
async function exportAs(kind){
  if(editing)finishEdit();
  const v=curV();
  if(kind==="all"){
    if(!S.input.trim()&&!v){toast(T("Nothing to export yet.","还没有可导出的内容。"));return;}
    const md=[`# ${baseName()}`,"",`## ${T("Your text","你的文字")}`,"",S.input.trim(),""];
    S.versions.forEach((x,i)=>{md.push(`## ${T("Version","版本")} ${i+1} · ${mName(x.mode)} · ${new Date(x.at).toLocaleString()}`,"",x.text.trim(),"");});
    save(`${baseName()} - ${T("all versions","全部版本")}.md`,md.join("\n"));return;
  }
  if(!v){toast(T("Nothing to export yet. Rewrite something first.","还没有可导出的结果，先改写一段文字。"));return;}
  const name=`${baseName()} (${T("rewritten","改写")})`;
  if(kind==="docx"){if(!window.JSZip){toast(T("The Word exporter didn't load. Check your connection and reopen the app.","Word 导出组件没加载，请检查网络后重新打开。"));return;}save(name+".docx",await buildDocx(v.text,name));}
  else if(kind==="md")save(name+".md",v.text);
  else if(kind==="txt")save(name+".txt",v.text.replace(/^#{1,6}\s+/gm,"").replace(/\*\*([^*\n]+)\*\*/g,"$1"));
}

/* ---------- keyboard ---------- */
const MODEKEYS=["standard","fluent","natural","formal","academic","simple","shorten","expand","creative","voice"];
document.addEventListener("keydown",e=>{
  if(e.isComposing||e.keyCode===229)return;
  const mod=e.metaKey||e.ctrlKey,k=e.key,inField=!!e.target.closest?.("input,textarea,select,[contenteditable]");
  if(k==="Escape"){
    if(!pop.hidden){closePop();e.preventDefault();return;}
    if(!$("exportMenu").hidden||!$("moreMenu").hidden){closeMenus();e.preventDefault();return;}
    if(!$("modal").hidden){closeModal();e.preventDefault();return;}
    if(!$("hist").hidden){closeHist();e.preventDefault();return;}
    if(editing){finishEdit();e.preventDefault();return;}
    if(running){ctl?.abort();e.preventDefault();return;}
    if(tab==="tells"){setTab("result");e.preventDefault();}
    return;
  }
  if(!$("modal").hidden)return;
  if(mod&&k==="Enter"){e.preventDefault();if(editing)finishEdit();rewrite();return;}
  if(mod&&k==="."){if(running){e.preventDefault();ctl?.abort();}return;}
  if(mod&&e.shiftKey&&e.code==="KeyC"){e.preventDefault();copyResult();return;}
  if(mod&&e.shiftKey&&e.code==="KeyU"){e.preventDefault();useAsInput();return;}
  if(mod&&e.shiftKey&&e.code==="KeyK"){e.preventDefault();toggleTells();return;}
  if(mod&&e.shiftKey&&e.code==="KeyH"){e.preventDefault();$("hist").hidden?openHist():closeHist();return;}
  if(mod&&!e.shiftKey&&!e.altKey&&e.code==="KeyO"){e.preventDefault();$("file").click();return;}
  if(mod&&!e.shiftKey&&!e.altKey&&e.code==="KeyS"){e.preventDefault();exportAs("docx");return;}
  if(e.altKey&&!mod){
    const d=e.code.match(/^Digit(\d)$/);
    if(d){e.preventDefault();const id=MODEKEYS[(+d[1]+9)%10];setMode(id);return;}
    if(e.code==="BracketLeft"||e.code==="BracketRight"){e.preventDefault();strength=Math.min(4,Math.max(1,strength+(e.code==="BracketRight"?1:-1)));store.set("strength",strength);renderStrength();setInStatus(T(`Synonyms: ${SLBL[strength][0]}`,`同义词：${SLBL[strength][1]}`));return;}
    if(e.code==="KeyN"){e.preventDefault();newSession();return;}
    if(e.code==="KeyM"){e.preventDefault();openCompare();return;}
  }
  if(!inField&&mod&&e.code==="KeyZ"){e.preventDefault();e.shiftKey?doRedo():doUndo();return;}
  if(!inField&&!mod&&!e.altKey&&k==="?"){e.preventDefault();openKeys();return;}
},true);

function dockIconArt(){return new Promise(res=>{const img=new Image();img.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");x.shadowColor="rgba(0,0,0,.3)";x.shadowBlur=20;x.shadowOffsetY=8;x.drawImage(img,50,44,412,412);res(c.toDataURL("image/png"))}catch{res(dockIcon())}};img.onerror=()=>res(dockIcon());img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(DOCK_SVG)})}

function dockIcon(){
  const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,"#8b6cf6");g.addColorStop(1,"#4c2fb8");
  x.fillStyle=g;x.beginPath();x.roundRect(8,8,240,240,54);x.fill();
  x.fillStyle="rgba(255,255,255,.95)";[[52,62,150],[52,88,118]].forEach(([a,b,w])=>{x.beginPath();x.roundRect(a,b,w,14,7);x.fill();});
  x.fillStyle="#ffb36b";[[52,160,152],[52,186,104]].forEach(([a,b,w])=>{x.beginPath();x.roundRect(a,b,w,14,7);x.fill();});
  x.strokeStyle="#fff";x.lineWidth=12;x.lineCap="round";x.beginPath();x.moveTo(184,92);x.bezierCurveTo(214,104,214,136,184,146);x.stroke();
  x.fillStyle="#fff";x.beginPath();x.moveTo(166,146);x.lineTo(192,128);x.lineTo(194,162);x.closePath();x.fill();
  return c.toDataURL("image/png");
}

<script>

})();
