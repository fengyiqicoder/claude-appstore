<title>Homework Helper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: history + mistake notebook in a sidebar on the left; the main pane shows the composer (type with a math
   keyboard or drop a photo), a solved problem (answer + verification, expandable steps, graph, practice, follow-ups),
   a hint-only tutoring thread, or the mistake notebook and its review mode. */
:root{
  --bg:#f3f4f7; --panel:#ffffff; --fg:#16181d; --muted:#6a7080; --line:#e2e5eb; --chip:#eef0f4; --hover:#f0f2f6;
  --accent:#2f66db; --accent-fg:#ffffff; --accent-soft:rgba(47,102,219,.11);
  --ok:#1b8f5a; --ok-soft:rgba(27,143,90,.12); --warn:#b8720a; --warn-soft:rgba(200,130,10,.14); --bad:#cf3b3b; --bad-soft:rgba(207,59,59,.11);
  --canvas:#fbfcfd; --grid:#e9ecf1; --axis:#9aa1ae;
  --shadow:0 10px 30px rgba(15,20,40,.12),0 1px 3px rgba(15,20,40,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --math:"STIX Two Math","Cambria Math","Latin Modern Math",math,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141619;--panel:#1c1f24;--fg:#eceef2;--muted:#959cab;--line:#2c3038;--chip:#262a31;--hover:#252930;--accent:#7aa2ff;--accent-fg:#0d1730;--accent-soft:rgba(122,162,255,.15);--ok:#4cc98f;--ok-soft:rgba(76,201,143,.15);--warn:#f0b04a;--warn-soft:rgba(240,176,74,.15);--bad:#ff7070;--bad-soft:rgba(255,112,112,.13);--canvas:#181b1f;--grid:#262a31;--axis:#6c7380;--shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141619;--panel:#1c1f24;--fg:#eceef2;--muted:#959cab;--line:#2c3038;--chip:#262a31;--hover:#252930;--accent:#7aa2ff;--accent-fg:#0d1730;--accent-soft:rgba(122,162,255,.15);--ok:#4cc98f;--ok-soft:rgba(76,201,143,.15);--warn:#f0b04a;--warn-soft:rgba(240,176,74,.15);--bad:#ff7070;--bad-soft:rgba(255,112,112,.13);--canvas:#181b1f;--grid:#262a31;--axis:#6c7380;--shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:var(--fg)}
.ic{width:16px;height:16px;flex:none}
#app{display:flex;height:100vh;height:100dvh;width:100vw;overflow:hidden}
math{font-family:var(--math);font-size:1.08em}
/* sidebar */
#side{width:256px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg);min-height:0}
.sidehead{display:flex;align-items:center;gap:6px;padding:12px 10px 8px max(12px,env(safe-area-inset-left,0px));min-height:48px}
body.app .sidehead{padding-left:80px;app-region:drag;-webkit-app-region:drag}
body.app .sidehead>*{app-region:no-drag;-webkit-app-region:no-drag}
.sidehead h1{font-size:13px;font-weight:650;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.app .sidehead h1{app-region:drag;-webkit-app-region:drag}
.navb{display:flex;align-items:center;gap:8px;width:calc(100% - 12px);margin:0 6px 2px max(6px,env(safe-area-inset-left,0px));padding:7px 9px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left;font-weight:550}
.navb:hover{background:var(--hover)}
.navb.on{background:var(--accent-soft);color:var(--accent)}
.navb .ct{margin-left:auto;font-size:11.5px;font-weight:650;color:var(--muted);background:var(--chip);border-radius:999px;padding:1px 7px}
.navb .ct.due{background:var(--warn-soft);color:var(--warn)}
.sidesearch{margin:8px 10px 6px max(10px,env(safe-area-inset-left,0px));position:relative}
.sidesearch input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 8px 6px 28px;outline:none;font-size:13px}
.sidesearch input:focus{border-color:var(--accent)}
.sidesearch .ic{position:absolute;left:8px;top:8px;width:14px;height:14px;color:var(--muted)}
.slabel{font-size:11px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px 16px 4px}
#hlist{flex:1;overflow:auto;padding:0 6px 10px max(6px,env(safe-area-inset-left,0px))}
.hi{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;width:100%;border:0;background:transparent;text-align:left;cursor:pointer;position:relative}
.hi:hover{background:var(--hover)}
.hi.on{background:var(--accent-soft)}
.hi .sj{width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--chip);color:var(--muted)}
.hi .tx{flex:1;min-width:0}
.hi .tt{display:block;font-size:13px;font-weight:520;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi .ts{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi .x{opacity:0;border:0;background:transparent;color:var(--muted);border-radius:6px;width:24px;height:24px;display:grid;place-items:center;cursor:pointer;flex:none}
.hi:hover .x,.hi.on .x,.hi:focus-within .x{opacity:1}
.hi .x:hover{background:var(--chip);color:var(--fg)}
.emptyside{color:var(--muted);font-size:12.5px;padding:10px 12px}
.sidefoot{border-top:1px solid var(--line);padding:8px 10px max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.top{display:flex;align-items:center;gap:6px;min-height:48px;padding:10px max(14px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
body.app .top{app-region:drag;-webkit-app-region:drag}
body.app .top>*{app-region:no-drag;-webkit-app-region:no-drag}
body.app .top .sp,body.app .top .crumb{app-region:drag;-webkit-app-region:drag}
body.app.noside .top{padding-left:80px}
.top .crumb{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .sp{flex:1;align-self:stretch}
#scroll{flex:1;overflow:auto;min-height:0;padding:4px max(16px,env(safe-area-inset-right,0px)) 90px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:820px;margin:0 auto}
/* buttons */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:550;font-size:13px;line-height:1.2}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.pri:hover{filter:brightness(1.07);background:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn kbd,.kb{font:500 11px/1 var(--font);opacity:.7;margin-left:2px}
.btn.big{padding:9px 16px;font-size:14px;border-radius:10px}
.ib{border:0;background:transparent;border-radius:7px;width:30px;height:30px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);flex:none;padding:0}
.ib:hover{background:var(--hover);color:var(--fg)}
.ib.on{background:var(--accent-soft);color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;padding:5px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:550;cursor:pointer}
.chip:hover{background:var(--hover)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
select.sel{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px;font-size:12.5px;font-weight:550}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 12px}
.card h3{flex-wrap:wrap;margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.md{font-size:14.5px;line-height:1.6;overflow-wrap:anywhere}
.md p{margin:.35em 0}
.md ul,.md ol{margin:.3em 0;padding-left:1.4em}
.md code{background:var(--chip);border-radius:5px;padding:1px 5px;font-size:.92em}
.md pre{background:var(--chip);border-radius:8px;padding:10px;overflow:auto}
.md table{border-collapse:collapse;margin:.4em 0;display:block;overflow:auto}
.md td,.md th{border:1px solid var(--line);padding:4px 8px}
.md .mdisp{overflow-x:auto;overflow-y:hidden;padding:4px 0;margin:.3em 0}
.md .mdisp math{font-size:1.15em}
.md h1,.md h2,.md h3,.md h4{font-size:1em;margin:.6em 0 .2em;text-transform:none;letter-spacing:0;color:var(--fg)}
.texraw{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--chip);border-radius:4px;padding:0 4px}
/* composer */
.hero{padding:18px 0 10px}
.hero h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted)}
.opts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.opts .lbl{font-size:12px;color:var(--muted);font-weight:600}
.composer{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer.drag{border-color:var(--accent);border-style:dashed;background:var(--accent-soft)}
#q{display:block;width:100%;min-height:96px;max-height:40vh;border:0;outline:0;resize:vertical;background:transparent;padding:14px 16px 8px;font-size:15px;line-height:1.55}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 8px}
.thumb{position:relative;width:92px;height:72px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--chip)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.cbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
.cbar .sp{flex:1}
.cbar .note{font-size:12px;color:var(--muted)}
.preview{border-top:1px dashed var(--line);padding:8px 16px 10px;min-height:20px}
.preview .pl{font-size:11px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
/* math keyboard */
.mkb{border-top:1px solid var(--line);background:var(--canvas);padding:8px 10px 10px}
.mkb .tabs{display:flex;gap:2px;margin-bottom:8px;flex-wrap:wrap}
.mkb .tabs button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;cursor:pointer}
.mkb .tabs button.on{background:var(--chip);color:var(--fg)}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px}
.key{height:38px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;display:grid;place-items:center;font-size:14px;padding:0 2px;overflow:hidden;white-space:nowrap}
.key:hover{background:var(--hover)}
.key:active{transform:translateY(1px)}
.key.fn{background:var(--chip);color:var(--muted);font-size:12.5px;font-weight:600}
.key math{font-size:15px;pointer-events:none}
.examples{margin:18px 0 6px}
.examples .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.ex{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.ex:hover{background:var(--hover)}
.ex .s{font-size:11.5px;color:var(--muted);font-weight:600;display:block}
.ex .md .mdisp{text-align:left;padding:0;margin:0}.ex .md .mdisp math{display:inline-block}
.tip{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.6}
.tip b{color:var(--fg);font-weight:600}
/* result */
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tag{text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:650;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--muted)}
.qimgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qimgs img{max-height:150px;max-width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.ans{border-width:1.5px}
.ans .big{font-size:19px;font-weight:600}
.ans .big math{font-size:1.2em}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;text-transform:none;letter-spacing:0;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.wait{background:var(--chip);color:var(--muted)}
.ans.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.ans.bad{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.ans.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.alert{border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.alert.bad{background:var(--bad-soft)}
.alert.warn{background:var(--warn-soft)}
.alert .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.checks{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.checks summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px}
.checks summary::-webkit-details-marker{display:none}
.checks summary::before{content:"▸";font-size:10px}
.checks[open] summary::before{content:"▾"}
.chk{display:grid;grid-template-columns:22px 1fr;gap:4px 8px;padding:8px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk .st{font-weight:800;font-size:14px;text-align:center}
.chk .st.ok{color:var(--ok)}.chk .st.bad{color:var(--bad)}.chk .st.wait{color:var(--muted)}.chk .st.warn{color:var(--warn)}
.chk .nm{font-weight:600;font-size:13px}
.chk .dt{grid-column:2;font-size:13px;color:var(--muted)}
.chk .dt .md{font-size:13.5px;color:var(--fg)}
.mc{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.steps{counter-reset:s}
.step{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:var(--panel)}
.step .sh{display:flex;align-items:flex-start;gap:10px}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;display:grid;place-items:center;flex:none;margin-top:1px}
.step .t{font-weight:600;flex:1;min-width:0}
.step .work{margin:6px 0 0 34px}
.step .why{margin:8px 0 0 34px;background:var(--canvas);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 12px;font-size:13.5px}
.step .whyb{margin:6px 0 0 30px}
.whyb{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer;padding:3px 6px;border-radius:6px}
.whyb:hover{background:var(--accent-soft)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.skel{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px;padding:6px 0}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.shimmer{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--chip),var(--hover),var(--chip));background-size:200% 100%;animation:sh 1.2s ease-in-out infinite;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
.err{background:var(--bad-soft);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.err .sp{flex:1}
/* graph */
.gwrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--canvas);touch-action:none}
.gwrap canvas{display:block;width:100%;height:320px;cursor:grab}
.gwrap canvas.drag{cursor:grabbing}
.gtools{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.gtools .ib{background:var(--panel);border:1px solid var(--line);width:28px;height:28px;color:var(--fg)}
.ginfo{position:absolute;left:8px;bottom:6px;font:12px ui-monospace,Menlo,monospace;color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 6px;border-radius:5px;pointer-events:none}
.gfns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.gfn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font:12.5px ui-monospace,Menlo,monospace}
.gfn i{width:10px;height:10px;border-radius:50%;display:inline-block}
.gfn button{border:0;background:transparent;color:var(--muted);cursor:pointer;width:20px;height:20px;border-radius:50%;padding:0}
.gfn button:hover{background:var(--chip)}
.gadd{display:flex;gap:6px;margin-top:8px}
.gadd input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 9px;font:13px ui-monospace,Menlo,monospace;outline:none}
.gadd input:focus{border-color:var(--accent)}
/* chat */
.msg{margin:10px 0;display:flex;flex-direction:column}
.msg.me{align-items:flex-end}
.msg .b{max-width:88%;border-radius:14px;padding:9px 13px}
.msg.me .b{background:var(--accent-soft);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.ai .b{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .who{font-size:11px;color:var(--muted);font-weight:600;margin:0 4px 3px}
.ask{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.ask textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 12px;resize:none;outline:none;min-height:42px;max-height:160px;font-size:14px;line-height:1.45}
.ask textarea:focus{border-color:var(--accent)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
/* practice */
.pq{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.pq .ph{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px;color:var(--muted);font-weight:650}
.pq .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.pq input{flex:1;min-width:140px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 9px;outline:none}
.pq input:focus{border-color:var(--accent)}
.pq .reveal{margin-top:8px;background:var(--canvas);border-radius:8px;padding:8px 12px}
.pq .res{font-weight:700;font-size:12.5px}
.pq .res.ok{color:var(--ok)}.pq .res.bad{color:var(--bad)}
/* notebook */
.nbhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:14px 0 8px}
.nbhead h2{margin:0;font-size:21px;letter-spacing:-.02em}
.nbhead .sp{flex:1}
.stats{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:96px}
.stat b{display:block;font-size:20px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.nbf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.nbf input{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 9px;outline:none;min-width:160px;flex:1;max-width:260px}
.mi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.mi .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.mi .mh .sp{flex:1}
.mi .due{font-size:11.5px;font-weight:650;color:var(--muted)}
.mi .due.now{color:var(--warn)}
.mi .due.done{color:var(--ok)}
.mi .clamp{max-height:9.5em;overflow:hidden;position:relative}
.mi .clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2em;background:linear-gradient(transparent,var(--panel))}
.mi .more{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.mi .lab{font-size:11.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 2px}
.mi textarea{width:100%;border:1px solid var(--line);background:var(--canvas);border-radius:8px;padding:7px 10px;resize:vertical;min-height:52px;outline:none}
.mi textarea:focus{border-color:var(--accent)}
.mi .bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:48px 20px}
.empty .art{font-size:34px;margin-bottom:6px}
.empty h3{color:var(--fg);margin:0 0 6px;font-size:16px}
.empty p{margin:0 auto 14px;max-width:420px}
/* review */
.rv{max-width:680px;margin:0 auto;padding-top:10px}
.rv .prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:10px}
.rv .prog .bar{flex:1;height:5px;border-radius:3px;background:var(--chip);overflow:hidden}
.rv .prog .bar i{display:block;height:100%;background:var(--accent)}
.rv textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;outline:none;resize:vertical}
.rv textarea:focus{border-color:var(--accent)}
.rv .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center}
/* dialogs, menus, toast */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.38);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:18px 20px}
.dlg h2{margin:0 0 4px;font-size:17px}
.dlg .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.dlg label{display:block;font-size:12px;font-weight:650;color:var(--muted);margin:10px 0 4px}
.dlg input,.dlg textarea,.dlg select{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;outline:none}
.dlg textarea{resize:vertical;min-height:70px}
.dlg input:focus,.dlg textarea:focus{border-color:var(--accent)}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.dlg .chips{margin-top:6px}
.menu{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:200px}
.menu button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:7px 10px;border-radius:7px;cursor:pointer;text-align:left;font-size:13px}
.menu button:hover,.menu button:focus{background:var(--hover);outline:0}
.menu .sepr{height:1px;background:var(--line);margin:4px 2px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1d2026;color:#fff;border-radius:10px;padding:8px 10px 8px 14px;font-size:13px;display:flex;gap:10px;align-items:center;z-index:70;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
#toast button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:7px;padding:4px 10px;font-weight:600;cursor:pointer}
.zoomimg{max-width:min(1000px,96vw);max-height:90dvh;border-radius:10px}
.kbdlist{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13px}
.kbdlist kbd{font:12px var(--font);background:var(--chip);border-radius:5px;padding:2px 7px;justify-self:end}
#nohint{font-size:12px;color:var(--muted)}
/* narrow */
@media (max-width:760px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:40;box-shadow:var(--shadow);transform:translateX(-105%);visibility:hidden;transition:transform .18s,visibility 0s .18s}
  body.sideopen #side{transform:none;visibility:visible;transition:transform .18s}
  #sidescrim{position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.25)}
  .ans .big{font-size:17px}
  .card{padding:14px 14px}
  .step .work,.step .why{margin-left:0}
  .step .whyb{margin-left:-4px}
}
@media (min-width:761px){ body.hideside #side{display:none} #sidescrim{display:none} }
@media print{#side,.top{display:none}}

<script>

const $=id=>document.getElementById(id);

const LS={get(k,d){try{const v=localStorage.getItem("hwh."+k);return v==null?d:JSON.parse(v)}catch{storageOK=false;return d}},
  set(k,v){try{localStorage.setItem("hwh."+k,JSON.stringify(v));return true}catch(e){if(e&&/quota/i.test(e.name+e.message))return "quota";storageOK=false;return false}}};
const S={
  history:LS.get("history",[]),
  notebook:LS.get("notebook",[]),
  settings:Object.assign({subject:"auto",level:"auto",mode:"solve",thorough:false,kb:true,kbTab:"basic",side:true},LS.get("settings",{})),
};
if(!Array.isArray(S.history))S.history=[];
if(!Array.isArray(S.notebook))S.notebook=[];
function saveSettings(){LS.set("settings",S.settings)}
function saveHistory(){
  let r=LS.set("history",S.history.slice(0,80));
  if(r==="quota"){ // free space: drop photos from the oldest problems first
    for(let i=S.history.length-1;i>=0&&r==="quota";i--){const h=S.history[i];if(h.images?.length){h.images=[];h.imagesDropped=true;r=LS.set("history",S.history.slice(0,80));}}
    if(r==="quota"){S.history=S.history.slice(0,20);r=LS.set("history",S.history);}
    if(r==="quota")toast(T("Storage is full. Export your notebook and delete old problems.","存储空间已满。请导出错题本并删除旧题目。"));
  }
}
function saveNotebook(){const r=LS.set("notebook",S.notebook);if(r==="quota"){saveHistoryTrim();if(LS.set("notebook",S.notebook)==="quota")toast(T("Storage is full. Export your notebook and delete old problems.","存储空间已满。请导出错题本并删除旧题目。"));}}

function tex(t,disp){
  t=String(t??"").trim();

  if(src==null||src==="")return "";

async function fileToDataURL(f,max=1280,q=.8){
  const url=URL.createObjectURL(f);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",q)}
  finally{URL.revokeObjectURL(url)}
}

async function solve(h,extra){
  if(!sample)return;
  running.get(h.id)?.ctl.abort();
  const ctl=new AbortController();running.set(h.id,{ctl,kind:"solve"});
  h.error=null;h.progress=T("Reading the problem…","正在读题…");
  if(!extra){h.result=null;h.verify=null}
  rerender(h);
  const p=pinfo(h);if(extra)p.extra=extra;
  try{
    const r=await sample.json(solvePrompt(p),{signal:ctl.signal,images:imgs(h),cache:false,modelTier:h.thorough||extra?"complex":"default",
      onText:({text})=>{const n=(text.match(/"title"\s*:/g)||[]).length;const np=n?T(`Writing step ${n}…`,`正在写第 ${n} 步…`):T("Solving…","正在解题…");if(np!==h.progress){h.progress=np;updProgress(h)}}});
    if(!r||typeof r!=="object"||!Array.isArray(r.steps))throw {code:"invalid_json"};
    if(h.result&&extra)h.prevResult={result:h.result,verify:h.verify};
    h.result=normResult(fixTex(r));h.progress=null;
    if(["math","physics","chemistry","other"].includes(r.subject))h.subject=r.subject;

    h.updated=Date.now();saveHistory();running.delete(h.id);rerender(h);

function normResult(r){
  const arr=x=>Array.isArray(x)?x:[];
  return {problem:String(r.problem||""),unclear:String(r.unclear||""),steps:arr(r.steps).map(s=>({title:String(s?.title||""),work:String(s?.work||""),why:String(s?.why||"")})),
    answer:String(r.answer||""),values:arr(r.answer_values).map(Number).filter(isFinite),
    self:r.self_check&&typeof r.self_check==="object"?{method:String(r.self_check.method||""),work:String(r.self_check.work||""),passed:r.self_check.passed!==false}:null,
    machine:arr(r.machine_checks).filter(c=>c&&c.expr!=null).slice(0,8).map(c=>({expr:String(c.expr),expect:Number(c.expect),tol:c.tol!=null?Number(c.tol):null,note:String(c.note||"")})),
    graph:r.graph&&Array.isArray(r.graph.functions)&&r.graph.functions.length?{functions:r.graph.functions.map(String).slice(0,5),xmin:Number(r.graph.xmin),xmax:Number(r.graph.xmax),points:arr(r.graph.points).filter(p=>Array.isArray(p)&&p.length===2&&p.every(v=>isFinite(+v))).map(p=>p.map(Number)).slice(0,12)}:null,

async function verify(h){
  const R=h.result;if(!R)return;
  h.verify={machine:null,indep:{state:"wait"},compare:null};rerender(h);
  // 1) computed checks, run locally
  const m=await ensureMath();
  if(!m)h.verify.machine={state:"na",items:[]};
  else{const items=R.machine.map(c=>{try{const v=evalNum(c.expr);const ok=isFinite(c.expect)?close(v,c.expect,c.tol&&c.tol>0?Math.min(c.tol,.05):1e-6):false;return {...c,value:v,ok}}catch{return {...c,value:null,ok:null}}});
    h.verify.machine={state:"done",items}}
  rerender(h);
  // 2) independent solve by a second, separate call
  if(!sample)return;
  const ctl=new AbortController();running.set(h.id+":v",{ctl,kind:"verify"});
  try{
    let r=await sample.json(verifyPrompt(pinfo(h)),{signal:ctl.signal,images:imgs(h),cache:false,modelTier:"default"});
    r=fixTex(r);const ind={state:"done",answer:String(r?.answer||""),values:(Array.isArray(r?.answer_values)?r.answer_values:[]).map(Number).filter(isFinite),method:String(r?.method||"")};
    h.verify.indep=ind;rerender(h);

      const a=[...R.values].sort((x,y)=>x-y),b=[...ind.values].sort((x,y)=>x-y);
      agree=a.length===b.length&&a.every((v,i)=>close(v,b[i],.006));
      if(!agree&&a.length!==b.length&&new Set(a.map(v=>v.toPrecision(6))).size===new Set(b.map(v=>v.toPrecision(6))).size)agree=[...new Set(a.map(v=>+v.toPrecision(6)))].every((v,i)=>close(v,[...new Set(b.map(v=>+v.toPrecision(6)))][i],.006));
    }
    if(agree===null||agree===false){
      const j=await sample.json(`Two tutors solved the same problem. Are their final answers mathematically equivalent (same value(s), allowing different but equivalent forms, rounding to the stated precision, and order)? If the problem has several parts, every part must match.\nProblem:\n${R.problem.slice(0,4000)}\nAnswer A:\n${R.answer}\nAnswer B:\n${ind.answer}\nReply with only JSON: {"equivalent": true|false, "note": "one short sentence${ZH?" in Simplified Chinese":""}"}`,{signal:ctl.signal,modelTier:"quick",cache:false});
      h.verify.compare={equivalent:!!j?.equivalent,note:String(j?.note||"")};
    }else h.verify.compare={equivalent:agree,note:""};
  }catch(e){
    if(e?.code==="cancelled"){h.verify.indep={state:"na",why:T("Stopped","已停止")}}

  }

}
function verdict(h){

  const self=R.self?R.self.passed:null;
  const mi=V?.machine?.items||[];const mFail=mi.filter(x=>x.ok===false).length,mPass=mi.filter(x=>x.ok===true).length;
  const ind=V?.indep;const agree=V?.compare?V.compare.equivalent:null;
  if(!V||ind?.state==="wait"&&!V.compare)return {cls:"wait",label:T("Checking…","核对中…"),state:"wait"};
  if(self===false||mFail||agree===false)return {cls:"bad",label:T("Checks disagree","核对结果不一致"),state:"bad",mFail,agree,self};
  if(self&&agree&&(mPass||!mi.length))return {cls:"ok",label:T("Checked","已核对"),state:"ok"};
  return {cls:"warn",label:T("Partly checked","部分核对"),state:"warn",agree,self};
}

  else{const eq=V.compare?.equivalent;s+=row(eq==null?"wait":eq?"ok":"bad",esc(T("Independent solve","独立重解"))+(ind.method?` · <span class="uc">${esc(ind.method)}</span>`:""),`${mdEl(ind.answer)}${eq==null?esc(T("Comparing answers…","正在比对答案…")):eq?esc(T("Same answer.","答案一致。")):esc(T("Different answer.","答案不同。"))}`)}

  else if(mc.state==="na")s+=row("warn",esc(T("Computed checks","计算核对")),esc(T("The calculator didn't load, so these were skipped.","计算器没有加载，已跳过。")));
  else if(!mc.items.length)s+=row("warn",esc(T("Computed checks","计算核对")),esc(T("None for this kind of problem.","这类题没有计算核对。")));
  else{const p=mc.items.filter(x=>x.ok).length,f=mc.items.filter(x=>x.ok===false).length;
    s+=row(f?"bad":p?"ok":"warn",esc(T(`Computed checks · ${p} of ${mc.items.length} passed`,`计算核对 · 通过 ${p}/${mc.items.length} 项`)),mc.items.map(c=>`<div><span class="mc uc">${esc(c.expr)}</span> → <b class="mc">${c.value==null?"?":esc(+c.value.toPrecision(10))}</b> ${c.ok===true?`<span style="color:var(--ok)">✓</span>`:c.ok===false?`<span style="color:var(--bad)">✗ ${esc(T("expected","应为"))} ${esc(c.expect)}</span>`:`<span>${esc(T("couldn't run","无法运行"))}</span>`}${c.note?` <span class="uc">· ${esc(c.note)}</span>`:""}</div>`).join(""))}
  const v=verdict(h);
  return `<details class="checks"${v.state==="bad"?" open":""}><summary>${esc(T("How this was checked","核对方式"))}</summary>${s}</details>`;
}
function wireProblem(V,h){
  const on=(id,f)=>{const el=$(id);if(el)el.onclick=f};
  on("editBtn",()=>editProblem(h));on("fixRead",()=>editProblem(h));
  on("retryBtn",()=>solve(h));on("stopBtn",()=>{running.get(h.id)?.ctl.abort()});
  on("resolveBtn",()=>resolveCarefully(h));on("recheckBtn",()=>verify(h));
  on("askDiff",()=>{const t=$("fq");if(t){t.value=T("The independent check got a different answer. Re-examine your solution step by step and tell me which answer is right and why.","独立核对得到的答案不同。请逐步检查你的解法，告诉我哪个答案是对的，为什么。");t.focus();sendFollow(h)}});
  on("undoResolve",()=>{if(!h.prevResult)return;const p=h.prevResult;h.prevResult=null;h.result=p.result;h.verify=p.verify;saveHistory();rerender(h);toast(T("Went back to the earlier solution","已恢复之前的解法"))});
  on("allWhy",()=>{h.allWhy=!h.allWhy;if(!h.allWhy)h.open=[];rerender(h)});
  V.querySelectorAll("[data-why]").forEach(b=>b.onclick=()=>{const i=+b.dataset.why;h.open=h.open||[];if(h.allWhy){h.allWhy=false;h.open=h.result.steps.map((_,k)=>k)}const k=h.open.indexOf(i);k<0?h.open.push(i):h.open.splice(k,1);rerender(h)});
  V.querySelectorAll("[data-zoom]").forEach(im=>im.onclick=()=>dialog(`<img class="zoomimg" src="${im.src}" alt="Problem photo"><div class="row"><button class="btn" data-close>Close</button></div>`,d=>{d.style.width="auto";d.style.maxWidth="96vw";d.querySelector("[data-close]").onclick=closeDlg}));
  on("saveMis",()=>saveMistakeDlg(h));on("pracBtn",()=>practice(h));
  on("copyMd",()=>copyText(problemMd(h)));
  on("moreBtn",()=>menu($("moreBtn"),[{label:T("Save solution as Markdown","将解答存为 Markdown"),run:()=>saveFile(fileName(h.title)+".md",problemMd(h),"text/markdown")},{label:T("Solve again from scratch","从头重新解"),run:()=>solve(h)},{label:T("Re-solve carefully (strongest model)","仔细重解（最强模型）"),run:()=>resolveCarefully(h)},"-",{label:T("Delete problem","删除题目"),run:()=>delProblem(h.id)}]));
  if($("gcv"))initGraph(h);

function editProblem(h){
  draft={text:h.result?.problem||h.text||"",images:(h.images||[]).slice()};LS.set("draft",draft.text);
  S.settings.mode=h.mode;S.settings.subject=h.subjectSet||h.subject;saveSettings();go({name:"compose"});
}
function resolveCarefully(h){
  const R=h.result;if(!R||!sample)return;
  const ind=h.verify?.indep;
  const extra=`A first attempt gave this answer: ${R.answer}\n${ind?.answer?`An independent check got: ${ind.answer}\n`:""}${(h.verify?.machine?.items||[]).filter(x=>x.ok===false).map(x=>`Computed check failed: ${x.expr} gave ${x.value} but ${x.expect} was expected (${x.note}).\n`).join("")}At least one of these is wrong. Do not trust either; solve from scratch with extra care, double-check each arithmetic step, and decide which answer (if any) is right.`;
  solve(h,extra);
}

/* ---------- graph ---------- */
const GCOL=["#2f66db","#d9480f","#2b8a3e","#ae3ec9","#e8590c"];
function initGraph(h){
  const cv=$("gcv");const R=h.result;
  const fns=[...(R.graph?.functions||[]),...(h.userFns||[])];
  const pts=R.graph?.points||[];
  let compiled=[];let ready=false;
  const g=h._g||(h._g={});
  const defaults=()=>{let a=R.graph&&isFinite(R.graph.xmin)?R.graph.xmin:-10,b=R.graph&&isFinite(R.graph.xmax)?R.graph.xmax:10;if(!(b>a)){a=-10;b=10}
    let ys=[];for(const f of compiled){if(!f)continue;for(let i=0;i<=200;i++){const x=a+(b-a)*i/200;try{const y=f(x);if(isFinite(y))ys.push(y)}catch{}}}
    pts.forEach(p=>ys.push(p[1]));ys.sort((p,q)=>p-q);
    let lo=ys.length?ys[Math.floor(ys.length*.03)]:-10,hi=ys.length?ys[Math.ceil(ys.length*.97)-1]:10;if(!(hi>lo)){lo-=5;hi+=5}const pad=(hi-lo)*.12;
    lo=Math.min(lo-pad,0-pad*.3);hi=Math.max(hi+pad,0+pad*.3);
    return {x0:a,x1:b,y0:lo,y1:hi}};
  ensureMath().then(m=>{
    if(!m){$("ginfo").textContent=T("The graphing engine didn't load.","绘图引擎没有加载。");return}
    compiled=fns.map(f=>{try{const c=m.compile(normExpr(f));return x=>{let v=c.evaluate({x});if(v&&typeof v==="object"&&m.isComplex?.(v))v=Math.abs(v.im)<1e-9?v.re:NaN;return typeof v==="number"?v:Number(v)}}catch{return null}});
    if(!g.vp)g.vp=defaults();ready=true;draw();
  });
  $("gfns").innerHTML=fns.map((f,i)=>`<span class="gfn"><i style="background:${GCOL[i%GCOL.length]}"></i><span class="uc">y = ${esc(f)}</span>${i>=(R.graph?.functions||[]).length?`<button data-rmf="${i-(R.graph?.functions||[]).length}" title="Remove function" aria-label="Remove function">×</button>`:""}</span>`).join("");
  $("gfns").querySelectorAll("[data-rmf]").forEach(b=>b.onclick=()=>{h.userFns.splice(+b.dataset.rmf,1);saveHistory();rerender(h)});
  const add=()=>{const v=$("gnew").value.trim();if(!v)return;const m=window.math;if(m){try{m.compile(normExpr(v.replace(/^y\s*=\s*/,"")))}catch{toast(T("That function couldn't be read. Try something like 2*x+1.","这个函数读不懂，试试 2*x+1 这样的写法。"));return}}(h.userFns=h.userFns||[]).push(v.replace(/^y\s*=\s*/,""));saveHistory();rerender(h)};
  $("gAddBtn").onclick=add;$("gnew").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add()}};
  const zoom=(k,cx,cy)=>{const v=g.vp;if(!v)return;const px=cx??(v.x0+v.x1)/2,py=cy??(v.y0+v.y1)/2;g.vp={x0:px+(v.x0-px)*k,x1:px+(v.x1-px)*k,y0:py+(v.y0-py)*k,y1:py+(v.y1-py)*k};draw()};
  $("gIn").onclick=()=>zoom(.7);$("gOut").onclick=()=>zoom(1/.7);$("gReset").onclick=()=>{g.vp=defaults();draw()};
  function draw(){
    if(!ready||!cv.isConnected)return;
    const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
    const x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);
    const cs=getComputedStyle(document.documentElement);const col=n=>cs.getPropertyValue(n).trim();
    const v=g.vp;const sx=X=>(X-v.x0)/(v.x1-v.x0)*W,sy=Y=>H-(Y-v.y0)/(v.y1-v.y0)*H;
    x.fillStyle=col("--canvas");x.fillRect(0,0,W,H);
    const step=r=>{const raw=r/8;const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<1.5?1:n<3.5?2:n<7.5?5:10)*p};
    const dx=step(v.x1-v.x0),dy=step(v.y1-v.y0);
    x.lineWidth=1;x.strokeStyle=col("--grid");x.beginPath();
    for(let X=Math.ceil(v.x0/dx)*dx;X<=v.x1;X+=dx){x.moveTo(Math.round(sx(X))+.5,0);x.lineTo(Math.round(sx(X))+.5,H)}
    for(let Y=Math.ceil(v.y0/dy)*dy;Y<=v.y1;Y+=dy){x.moveTo(0,Math.round(sy(Y))+.5);x.lineTo(W,Math.round(sy(Y))+.5)}x.stroke();
    x.strokeStyle=col("--axis");x.beginPath();const ax=Math.min(Math.max(sy(0),0),H),ay=Math.min(Math.max(sx(0),0),W);x.moveTo(0,Math.round(ax)+.5);x.lineTo(W,Math.round(ax)+.5);x.moveTo(Math.round(ay)+.5,0);x.lineTo(Math.round(ay)+.5,H);x.stroke();
    x.fillStyle=col("--muted");x.font="11px -apple-system,system-ui,sans-serif";
    const fmt=n=>{const r=+n.toPrecision(6);return Math.abs(r)<1e-12?"0":String(r)};
    x.textAlign="center";x.textBaseline="top";for(let X=Math.ceil(v.x0/dx)*dx;X<=v.x1;X+=dx){if(Math.abs(X)<dx/2)continue;x.fillText(fmt(X),sx(X),Math.min(H-14,ax+3))}
    x.textAlign="left";x.textBaseline="middle";for(let Y=Math.ceil(v.y0/dy)*dy;Y<=v.y1;Y+=dy){if(Math.abs(Y)<dy/2)continue;x.fillText(fmt(Y),Math.min(W-30,ay+4),sy(Y))}
    compiled.forEach((f,i)=>{if(!f)return;x.strokeStyle=GCOL[i%GCOL.length];x.lineWidth=2.2;x.beginPath();let pen=false,lastY=null;
      for(let px=0;px<=W;px+=1){const X=v.x0+(v.x1-v.x0)*px/W;let Y;try{Y=f(X)}catch{Y=NaN}
        if(!isFinite(Y)){pen=false;continue}const py=sy(Y);
        if(pen&&lastY!=null&&Math.abs(py-lastY)>H*2){pen=false}
        if(!pen){x.moveTo(px,py);pen=true}else x.lineTo(px,Math.max(-H,Math.min(2*H,py)));lastY=py}
      x.stroke()});
    pts.forEach(p=>{x.fillStyle=col("--panel");x.strokeStyle=col("--fg");x.lineWidth=2;x.beginPath();x.arc(sx(p[0]),sy(p[1]),4.5,0,7);x.fill();x.stroke();x.fillStyle=col("--fg");x.textAlign="left";x.textBaseline="bottom";x.fillText(`(${fmt(p[0])}, ${fmt(p[1])})`,sx(p[0])+7,sy(p[1])-4)});
    if(g.hover!=null&&compiled[0]){const X=g.hover;let Y;try{Y=compiled[0](X)}catch{}if(isFinite(Y)){x.fillStyle=GCOL[0];x.beginPath();x.arc(sx(X),sy(Y),4,0,7);x.fill();$("ginfo").textContent=`x = ${fmt(X)}, y = ${fmt(Y)}`}}
  }
  let drag=null;
  cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,vp:{...g.vp}};cv.classList.add("drag")};
  cv.onpointermove=e=>{const r=cv.getBoundingClientRect();if(!g.vp)return;
    if(drag&&e.buttons){const v=drag.vp;const ddx=(e.clientX-drag.x)/r.width*(v.x1-v.x0),ddy=(e.clientY-drag.y)/r.height*(v.y1-v.y0);g.vp={x0:v.x0-ddx,x1:v.x1-ddx,y0:v.y0+ddy,y1:v.y1+ddy};}
    g.hover=g.vp.x0+(g.vp.x1-g.vp.x0)*(e.clientX-r.left)/r.width;draw()};
  const end=()=>{drag=null;cv.classList.remove("drag")};
  cv.onpointerup=end;cv.onpointerleave=()=>{end();g.hover=null;$("ginfo").textContent="";draw()};
  cv.onwheel=e=>{if(!g.vp)return;e.preventDefault();const r=cv.getBoundingClientRect();const v=g.vp;const cx=v.x0+(v.x1-v.x0)*(e.clientX-r.left)/r.width,cy=v.y1-(v.y1-v.y0)*(e.clientY-r.top)/r.height;zoom(e.deltaY>0?1.12:1/1.12,cx,cy)};
  new ResizeObserver(()=>draw()).observe(cv);
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",draw);
}

function practiceHtml(h){
  const busy=running.get(h.id+":p");
  if(!h.practice?.length&&!busy&&!h.practiceErr)return "";
  let s=`<div class="card" id="practice"><h3>Practice<span class="sp"></span>${h.practice?.length&&!busy?`<button class="btn ghost" id="pracMore">More problems</button>`:""}</h3>`;
  if(h.practiceErr)s+=`<div class="err">${esc(h.practiceErr)}</div>`;
  s+=(h.practice||[]).map((p,i)=>`<div class="pq" data-pi="${i}"><div class="ph">${esc(T("Problem","题目"))} ${i+1}${p.result?` · <span class="res ${p.result==="right"?"ok":"bad"}">${p.result==="right"?esc(T("Correct","正确")):esc(T("Not quite","不太对"))}</span>`:""}</div>${mdEl(p.problem)}
    <div class="row"><input data-pin="${i}" placeholder="Your answer" aria-label="Your answer" value="${esc(p.mine||"")}"><button class="btn" data-pcheck="${i}">Check</button>${p.shown?"":`<button class="btn ghost" data-pshow="${i}">Show answer</button>`}</div>
    ${p.shown?`<div class="reveal"><b>${esc(T("Answer: ","答案："))}</b><span class="md" style="display:inline">${md(p.answer).replace(/^<p>|<\/p>\s*$/g,"")}</span>${p.solOpen?mdEl(p.solution):""}<div class="row">${p.solution?`<button class="btn ghost" data-psol="${i}">${p.solOpen?"Hide solution":"Show solution"}</button>`:""}${p.result==="right"?"":`<button class="btn ghost" data-pright="${i}">I got it right</button>`}<button class="btn ghost" data-pwrong="${i}">${p.saved?"✓ Saved to notebook":"I got it wrong · Save"}</button></div></div>`:""}</div>`).join("");
  if(busy)s+=`<div class="skel"><span class="spin"></span>${esc(T("Writing practice problems and checking their answers…","正在出练习题并核对答案…"))}<span style="flex:1"></span><button class="btn" id="pracStop">Stop</button></div>`;
  return s+"</div>";

async function practice(h){
  if(!sample||!h.result){toast(T("Practice needs Claude.","练习需要 Claude。"));return}
  if(running.get(h.id+":p")){document.getElementById("practice")?.scrollIntoView({behavior:"smooth",block:"start"});return}
  const ctl=new AbortController();running.set(h.id+":p",{ctl,kind:"practice"});h.practiceErr=null;rerender(h);
  document.getElementById("practice")?.scrollIntoView({behavior:"smooth",block:"start"});
  const prev=(h.practice||[]).map(p=>p.problem).join("\n---\n");
  try{
    let r=await sample.json(`Write 3 new practice problems that train the same skill as this solved problem, from slightly easier to slightly harder, with different numbers and contexts. Solve each one carefully yourself and check the answer by substitution or a second method before writing it.
Original problem:\n${h.result.problem.slice(0,3000)}\nIts answer: ${h.result.answer}\n${prev?`Do not repeat these earlier practice problems:\n${prev.slice(0,3000)}\n`:""}${LANG()}
${JSONTEX} Reply with only JSON: {"problems":[{"problem":"Markdown+LaTeX","answer":"final answer, Markdown+LaTeX","answer_values":[numbers or []],"solution":"short worked solution, Markdown+LaTeX"}]}`,{signal:ctl.signal,cache:false,modelTier:"default"});
    r=fixTex(r);const ps=(Array.isArray(r?.problems)?r.problems:[]).filter(p=>p&&p.problem).map(p=>({problem:String(p.problem),answer:String(p.answer||""),values:(Array.isArray(p.answer_values)?p.answer_values:[]).map(Number).filter(isFinite),solution:String(p.solution||"")}));
    if(!ps.length)throw {code:"invalid_json"};
    h.practice=(h.practice||[]).concat(ps);
  }catch(e){if(e?.code!=="cancelled")h.practiceErr=errText(e)}
  running.delete(h.id+":p");saveHistory();rerender(h);
}
async function checkPractice(h,i){
  const p=h.practice[i];const inp=document.querySelector(`[data-pin="${i}"]`);p.mine=inp?.value.trim()||"";
  if(!p.mine){inp?.focus();toast(T("Type your answer first, or press Show answer.","先输入你的答案，或点“显示答案”。"));return}
  let res=null;
  if(p.values.length){const m=await ensureMath();if(m){try{const parts=p.mine.replace(/^[a-zA-Z]\s*=\s*/,"").split(/\s*(?:,|;|\bor\b|或)\s*(?:[a-zA-Z]\s*=\s*)?/).filter(Boolean);
    const mine=parts.map(x=>evalNum(x.replace(/[a-zA-Z/]+\s*$/,"").trim()||x)).sort((a,b)=>a-b);const want=[...p.values].sort((a,b)=>a-b);
    res=mine.length===want.length&&mine.every((v,k)=>close(v,want[k],.006))?"right":"wrong"}catch{res=null}}}
  p.shown=true;
  if(res){p.result=res;if(res==="wrong")toast(T("Not quite. Compare with the answer below.","不太对，和下面的答案对比一下。"))}
  else toast(T("Compare your answer with the one below and mark it.","把你的答案和下面的对比，然后标记对错。"));
  saveHistory();rerender(h);
}
function wirePractice(V,h){
  const on=(id,f)=>{const el=$(id);if(el)el.onclick=f};
  on("pracMore",()=>practice(h));on("pracStop",()=>running.get(h.id+":p")?.ctl.abort());
  V.querySelectorAll("[data-pin]").forEach(inp=>{inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();checkPractice(h,+inp.dataset.pin)}};inp.oninput=()=>{h.practice[+inp.dataset.pin].mine=inp.value}});
  V.querySelectorAll("[data-pcheck]").forEach(b=>b.onclick=()=>checkPractice(h,+b.dataset.pcheck));
  V.querySelectorAll("[data-pshow]").forEach(b=>b.onclick=()=>{h.practice[+b.dataset.pshow].shown=true;saveHistory();rerender(h)});
  V.querySelectorAll("[data-psol]").forEach(b=>b.onclick=()=>{const p=h.practice[+b.dataset.psol];p.solOpen=!p.solOpen;rerender(h)});
  V.querySelectorAll("[data-pright]").forEach(b=>b.onclick=()=>{h.practice[+b.dataset.pright].result="right";saveHistory();rerender(h)});

    if(!p.saved){const id=addMistake({subject:h.subject,topic:h.topic,problem:p.problem,answer:p.answer,solution:p.solution,myAnswer:p.mine||"",source:h.id});p.saved=id;toast(T("Saved to your mistake notebook","已存入错题本"),()=>{removeMistake(id);p.saved=null;saveHistory();rerender(h)})}
    saveHistory();rerender(h)});
}

function wireChat(V,h){
  const fq=$("fq");if(!fq)return;
  fq.value=h.chatDraft||"";
  fq.oninput=()=>{h.chatDraft=fq.value;fq.style.height="auto";fq.style.height=Math.min(160,fq.scrollHeight)+"px"};
  fq.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendFollow(h)}};
  const s=$("fSend");if(s)s.onclick=()=>sendFollow(h);
  const st=$("fStop");if(st)st.onclick=()=>running.get(h.id+":c")?.ctl.abort();

  V.innerHTML=`<div class="rv"><div class="prog"><span>${esc(T(`${q.i+1} of ${q.ids.length}`,`第 ${q.i+1} / ${q.ids.length} 题`))}</span><span class="bar"><i style="width:${q.i/q.ids.length*100}%"></i></span><button class="btn ghost" id="rvExit">End review</button></div>
   <div class="card"><h3>Problem<span class="sp"></span><span class="tag">${esc(subjName(m.subject))}</span></h3>${mdEl(m.problem)}${m.image?`<div class="qimgs"><img src="${m.image}" alt="Problem photo"></div>`:""}</div>

   :`<textarea id="rvWork" placeholder="Work it out here (optional), then reveal the answer."></textarea><div class="row"><button class="btn pri big" id="rvShow">Reveal answer <kbd>Space</kbd></button></div>`}</div>`;
  const on=(id,f)=>{const el=$(id);if(el)el.onclick=f};

function grade(m,ok){

  m.addEventListener("click",async e=>{
    if(e.target===m||e.target.closest(".n"))return close();
    if(e.target.closest(".y")){const r=await d.install.request().catch(()=>"failed");close();
      if(r==="failed"||r==="unavailable"){const n=document.createElement("div");n.textContent=T("Couldn't install. Use Install as app in the artifact's menu.","没装上。可以在工件菜单里选“安装为 app”。");n.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141413;color:#fff;padding:10px 14px;border-radius:10px;z-index:2147483000;font:13px system-ui";document.body.appendChild(n);setTimeout(()=>n.remove(),5000)}}
  });
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"&&m.isConnected){close();document.removeEventListener("keydown",k)}});
  document.head?document.head.appendChild(st2):document.body.appendChild(st2);document.body.appendChild(m);
  m.querySelector(".y").focus();
})();
/*END_INSTALL_PROMPT*/
</script>
