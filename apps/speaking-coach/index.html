<title>Speaking Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one lesson card at a time. Settings row on top, the passage with listen controls, then a speaking panel where Claude checks what you said. */
:root{
  --bg:#f7f5ff; --panel:#ffffff; --fg:#1b1733; --muted:#6f6a8a; --line:#e4e0f5; --chip:#eeebfb;
  --accent:#5b45e0; --accent-fg:#ffffff; --good:#1f9d6b; --warn:#c7531c;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --read:"Literata","Iowan Old Style","Georgia",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131f;--panel:#1e1b2b;--fg:#efecfb;--muted:#9d97b8;--line:#2f2b42;--chip:#29253a;--accent:#8f7dff;--accent-fg:#140f2e;--good:#3cc68e;--warn:#f08a5d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15131f;--panel:#1e1b2b;--fg:#efecfb;--muted:#9d97b8;--line:#2f2b42;--chip:#29253a;--accent:#8f7dff;--accent-fg:#140f2e;--good:#3cc68e;--warn:#f08a5d;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font)}
.drag{height:32px;app-region:drag;-webkit-app-region:drag}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:4px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font:700 22px/1 var(--font);margin:0;letter-spacing:-.01em}
.streak{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{font:600 12.5px/1 var(--font);border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:6px 8px}
.btn{font:600 13px/1 var(--font);border:0;border-radius:999px;padding:10px 16px;cursor:pointer;background:var(--chip);color:var(--fg)}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{font:700 17px/1.25 var(--font);margin:0}
.eyebrow{font:700 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.passage{font:19px/1.6 var(--read);margin:0;-webkit-user-select:text;user-select:text}
.trans{color:var(--muted);font-size:13.5px;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phr{display:flex;flex-wrap:wrap;gap:6px}
.phr span{background:var(--chip);border-radius:8px;padding:5px 8px;font-size:12.5px}
.phr b{font-weight:600}
.said{min-height:52px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font:16px/1.5 var(--read)}
.said:empty::before{content:attr(data-empty);color:var(--muted);font-family:var(--font);font-size:13.5px}
.said .live{color:var(--muted)}
textarea{font:16px/1.5 var(--read);width:100%;min-height:70px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--fg)}
.mic.on{background:var(--warn);color:#fff}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font:700 34px/1 var(--font);font-variant-numeric:tabular-nums}
.fix{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.fix li{font-size:13.5px}
.fix s{color:var(--warn)}
.fix ins{color:var(--good);text-decoration:none;font-weight:600}
.st{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500&display=swap">

<div class="drag"></div>
<div class="wrap">
  <header><h1>Speaking Coach</h1><span class="streak" id="streak"></span></header>
  <div class="opts">
    <select id="lang" aria-label="Language to practice"></select>
    <select id="level" aria-label="Level"><option value="A2">Beginner (A2)</option><option value="B1">Intermediate (B1)</option><option value="B2">Upper intermediate (B2)</option><option value="C1">Advanced (C1)</option></select>
    <select id="topic" aria-label="Topic"><option value="Daily life">Daily life</option><option value="Travel">Travel</option><option value="Work and meetings">Work and meetings</option><option value="Job interview">Job interview</option><option value="Food and cooking">Food and cooking</option><option value="Tech news">Tech news</option><option value="Small talk">Small talk</option><option value="Surprise me">Surprise me</option></select>
    <button class="btn pri" id="new">✦ New lesson</button>
  </div>
  <div id="lesson"></div>
  <p class="st" id="st"></p>
</div>

<script>
/*I18N_RUNTIME*/
/* Chinese UI for Claude AppStore apps. When the viewer's language is Chinese, UI text nodes and
   placeholder/title/aria-label attributes whose text is in DICT are swapped for Chinese, including
   UI added later (menus, toasts, dialogs). User content is never touched: anything inside SKIP. */
(()=>{
  let ZH=/^zh/i.test(navigator.language||"");
  try{const o=localStorage.getItem("appstore.lang");if(o==="en")ZH=false;else if(o==="zh")ZH=true}catch{}
  window.__ZH=ZH; window.__t=(en,zh)=>ZH?zh:en;
  if(!ZH)return;
  const DICT={"Speaking Coach": "口语教练", "Language to practice": "练习语言", "Level": "水平", "Topic": "话题", "English": "英语", "Spanish": "西班牙语", "French": "法语", "German": "德语", "Japanese": "日语", "Korean": "韩语", "Chinese (Mandarin)": "中文（普通话）", "Italian": "意大利语", "Portuguese": "葡萄牙语", "Beginner (A2)": "初级 (A2)", "Intermediate (B1)": "中级 (B1)", "Upper intermediate (B2)": "中高级 (B2)", "Advanced (C1)": "高级 (C1)", "Daily life": "日常生活", "Travel": "旅行", "Work and meetings": "工作与会议", "Job interview": "求职面试", "Food and cooking": "美食与烹饪", "Tech news": "科技新闻", "Small talk": "闲聊", "Surprise me": "随便来一个", "✦ New lesson": "✦ 新课程", "A short lesson, read aloud, then your turn to speak.": "一节短课：先听朗读，再轮到你开口。", "Claude writes a passage at your level, reads it to you, and checks how you repeat it or answer its question.": "Claude 按你的水平写一段短文读给你听，再检查你的跟读或回答。", "Open Speaking Coach in the Claude app to start.": "在 Claude 应用中打开口语教练即可开始。", "Show translation": "显示译文", "▶ Listen": "▶ 听", "Slow": "慢速", "Listening needs the Claude app.": "听力功能需要 Claude 应用。", "Your turn": "轮到你了", "What to say": "要说什么", "Repeat the passage": "跟读这段短文", "Speaking needs dictation in the Claude app or Chrome. You can type what you would say instead.": "口语输入需要 Claude 应用或 Chrome 的听写功能。你也可以把想说的话打出来。", "● Speak": "● 说话", "■ Stop": "■ 停止", "✦ Check": "✦ 检查", "Clear": "清除", "Microphone use was declined. You can type instead.": "麦克风权限被拒绝了，你可以改为打字。", "Dictation isn't available here.": "这里无法使用听写。", "Claude is busy or you hit your usage limit. Try again later.": "Claude 正忙，或你已达到用量上限，请稍后再试。", "Claude isn't allowed for this app.": "此应用未获准使用 Claude。", "Claude isn't available on this account.": "此账号无法使用 Claude。", "Claude declined that one. Try another topic.": "Claude 拒绝了这次请求，换个话题试试。", "Sign in to Claude again.": "请重新登录 Claude。", "Writing your lesson…": "正在写课程…", "Couldn't write a lesson. Try again.": "没能生成课程，请重试。", "Press Speak and say something first.": "先按“说话”说点什么。", "Type what you would say first.": "先打出你想说的话。", "Checking…": "检查中…", "A more natural answer": "更自然的回答", "Couldn't check that. Try again.": "没能检查，请重试。", "Open Speaking Coach in the Claude app to practice with Claude.": "在 Claude 应用中打开口语教练，即可和 Claude 一起练习。", "Install as app": "安装为应用"};
  const PATTERNS=([["(\\d+)-day streak", "连续 $1 天"], ["Answer: (.*)", "回答：$1"]]).map(([re,rep])=>[new RegExp("^"+re+"$"),rep]);
  const SKIP='script,style,textarea,input,code,pre,[contenteditable]:not([contenteditable="false"]),[data-no-i18n]'+(",.passage, .trans, .card h2, .phr, #said, .fix, #fb > p:not(.st)");
  const ATTRS=["placeholder","title","aria-label","data-tip","data-ph","alt"];
  const norm=s=>s.replace(/\s+/g," ").trim();
  function tr(s){
    const k=norm(s); if(!k||!/[A-Za-z]/.test(k)) return null;
    let v=DICT[k];
    if(v==null){for(const [re,rep] of PATTERNS){if(re.test(k)){v=k.replace(re,rep);break}}}
    if(v==null||v===k) return null;
    const lead=s.match(/^\s*/)[0], tail=s.match(/\s*$/)[0];
    return lead+v+tail;
  }
  window.__tr=s=>tr(String(s))??s;
  const skipped=el=>{try{return !!(el&&el.closest&&el.closest(SKIP))}catch{return false}};
  function doText(n){const p=n.parentElement;if(!p||skipped(p))return;const v=tr(n.nodeValue);if(v!=null)n.nodeValue=v}
  function doAttrs(el){if(el.nodeType!==1)return;for(const a of ATTRS){const x=el.getAttribute(a);if(!x)continue;if(a==="data-ph"||a==="alt"){if(skipped(el.parentElement))continue}const v=tr(x);if(v!=null)el.setAttribute(a,v)}}
  function walk(root){
    if(root.nodeType===3){doText(root);return}
    if(root.nodeType!==1&&root.nodeType!==11)return;
    if(root.nodeType===1){doAttrs(root);if(skipped(root))return}
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode(n){
      if(n.nodeType===1){doAttrs(n);return skipped(n)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_SKIP}
      return NodeFilter.FILTER_ACCEPT}});
    let n;while((n=w.nextNode()))doText(n);
  }
  const mo=new MutationObserver(ms=>{for(const m of ms){
    if(m.type==="childList")m.addedNodes.forEach(walk);
    else if(m.type==="characterData")doText(m.target);
    else if(m.type==="attributes")doAttrs(m.target);
  }});
  const start=()=>{document.documentElement.lang="zh-CN";const t=tr(document.title||"");if(t)document.title=t;walk(document.body);
    mo.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:ATTRS})};
  if(document.body)start();else document.addEventListener("DOMContentLoaded",start);
  const _a=window.alert,_c=window.confirm,_p=window.prompt;
  window.alert=m=>_a.call(window,tr(String(m))??m);window.confirm=m=>_c.call(window,tr(String(m))??m);window.prompt=(m,d)=>_p.call(window,tr(String(m))??m,d);
})();
/*END_I18N_RUNTIME*/
</script>
<script>


const $=id=>document.getElementById(id);
const LANGS=[["English","en"],["Spanish","es"],["French","fr"],["German","de"],["Japanese","ja"],["Korean","ko"],["Chinese (Mandarin)","zh"],["Italian","it"],["Portuguese","pt"]];
const store={get(k,d){try{const v=localStorage.getItem("talkback."+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem("talkback."+k,JSON.stringify(v))}catch{}}};
const NATIVE=(()=>{const n=(navigator.language||"en").toLowerCase();return window.__ZH?"Chinese (Simplified)":n.startsWith("zh")?"Chinese":({ja:"Japanese",ko:"Korean",es:"Spanish",fr:"French",de:"German",pt:"Portuguese",it:"Italian"}[n.slice(0,2)]||"English")})();
$("lang").innerHTML=LANGS.map(([n,c])=>`<option value="${c}">${n}</option>`).join("");
$("lang").value=store.get("lang",NATIVE==="English"?"es":"en");
$("level").value=store.get("level","B1");$("topic").value=store.get("topic","Daily life");
for(const id of["lang","level","topic"])$(id).onchange=()=>store.set(id,$(id).value);
const langName=()=>LANGS.find(l=>l[1]===$("lang").value)[0];
let L=store.get("lesson",null), sample=null, tts=null, dict=null, said="", ctl=null;

function streak(){
  const s=store.get("streak",{n:0,last:""});const t=new Date().toISOString().slice(0,10);
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  const n=(s.last===t||s.last===y)?s.n:0;
  $("streak").textContent=n?`${n}-day streak`:"";
  return {s,t,y};
}
function bump(){const {s,t,y}=streak();if(s.last===t)return;store.set("streak",{n:s.last===y?s.n+1:1,last:t});streak();}
const tx=t=>window.__tr?window.__tr(t):t;
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function render(){
  if(!L){
    $("lesson").innerHTML=`<div class="card empty"><b style="color:var(--fg);font-size:16px">A short lesson, read aloud, then your turn to speak.</b><span>Claude writes a passage at your level, reads it to you, and checks how you repeat it or answer its question.</span>${sample?"":`<span>Open Speaking Coach in the Claude app to start.</span>`}</div>`;
    return;
  }
  $("lesson").innerHTML=`<div class="card">
    <div class="eyebrow">${esc(tx(L.langName))} · ${esc(L.level)} · ${esc(tx(L.topic))}</div>
    <h2>${esc(L.title)}</h2>
    <p class="passage">${esc(L.passage)}</p>
    <details><summary class="st" style="cursor:pointer">Show translation</summary><p class="trans">${esc(L.translation)}</p></details>
    <div class="row">${tts?`<button class="btn pri" id="play">▶ Listen</button><button class="btn" id="slow">Slow</button>`:`<span class="st">Listening needs the Claude app.</span>`}</div>
    <div class="phr">${(L.phrases||[]).map(p=>`<span><b>${esc(p.phrase)}</b> · ${esc(p.meaning)}</span>`).join("")}</div>
  </div>
  <div class="card">
    <div class="eyebrow">Your turn</div>
    <div class="row"><select id="task" aria-label="What to say"><option value="shadow">Repeat the passage</option><option value="answer">Answer: ${esc(L.question)}</option></select></div>
    ${dict?`<div class="said" id="said" data-empty="${window.__t("Press Speak and talk. Your words appear here.","按“说话”后开口，你说的话会显示在这里。")}"></div>`:`<textarea id="typed" placeholder="Speaking needs dictation in the Claude app or Chrome. You can type what you would say instead."></textarea>`}
    <div class="row">${dict?`<button class="btn mic" id="mic">● Speak</button>`:""}<button class="btn pri" id="check">✦ Check</button><button class="btn" id="redo" hidden>Clear</button></div>
    <div id="fb"></div>
  </div>`;
  wire();
}
async function speak(text,rate){ if(!tts) return; try{await tts.speak(text,{rate,language:$("lang").value});}catch(e){if(e?.code==="not_granted"){tts=null;render();}} }
function wire(){
  $("play")&& ($("play").onclick=()=>speak(L.passage,1));
  $("slow")&& ($("slow").onclick=()=>speak(L.passage,0.75));
  const mic=$("mic");
  if(mic){
    mic.onclick=()=>{
      if(mic.classList.contains("on")){dict.stop().catch(()=>{});return;}
      said="";$("said").textContent="";
      dict.start({language:L.lang}).catch(e=>{ if(e?.code!=="stopped") $("st").textContent=e?.code==="not_granted"?"Microphone use was declined. You can type instead.":"Dictation isn't available here."; if(e?.code==="not_granted"||e?.code==="unavailable"){dict=null;render();} });
    };
  }
  $("redo").onclick=()=>{said="";if($("said"))$("said").textContent="";if($("typed"))$("typed").value="";$("fb").innerHTML="";$("redo").hidden=true;};
  $("check").onclick=check;
}
function onDict(){
  if(!dict) return;
  dict.onPartial(({text})=>{const el=$("said");if(el){el.innerHTML=esc(said)+`<span class="live">${esc(text)}</span>`;}});
  dict.onFinal(({text})=>{said=(said+" "+text).trim();const el=$("said");if(el)el.textContent=said;});
  dict.onState(({state})=>{const m=$("mic");if(!m)return;const on=state==="listening"||state==="starting";m.classList.toggle("on",on);m.textContent=on?"■ Stop":"● Speak";});
}
const ERR={rate_limited:"Claude is busy or you hit your usage limit. Try again later.",not_granted:"Claude isn't allowed for this app.",sampling_disabled:"Claude isn't available on this account.",refused:"Claude declined that one. Try another topic.",session_expired:"Sign in to Claude again."};
$("new").onclick=async()=>{
  if(!sample) return;
  $("new").disabled=true;$("st").textContent="Writing your lesson…";
  const lang=$("lang").value, ln=langName(), level=$("level").value, topic=$("topic").value;
  try{
    const r=await sample.json(`Write a short speaking lesson in ${ln} for a ${level} learner whose first language is ${NATIVE}. Topic: ${topic==="Surprise me"?"anything everyday and interesting":topic}. The passage is 50-90 words, natural spoken ${ln}, the kind of thing a person would actually say, at ${level} level. Reply with only JSON: {"title": short title in ${ln}, "passage": the passage, "translation": translation into ${NATIVE}, "phrases": [up to 4 {"phrase": useful phrase from the passage, "meaning": meaning in ${NATIVE}}], "question": one open question in ${ln} the learner can answer aloud in 2-4 sentences}.`,{modelTier:"default",cache:false});
    if(!r?.passage) throw {code:"empty_completion"};
    L={lang,langName:ln,level,topic,title:String(r.title||topic),passage:String(r.passage),translation:String(r.translation||""),phrases:(Array.isArray(r.phrases)?r.phrases:[]).slice(0,4).map(p=>({phrase:String(p.phrase||""),meaning:String(p.meaning||"")})),question:String(r.question||"")};
    store.set("lesson",L);said="";render();$("st").textContent="";
    if(tts) speak(L.passage,1);
  }catch(e){$("st").textContent=ERR[e?.code]||"Couldn't write a lesson. Try again.";}
  finally{$("new").disabled=false;}
};
async function check(){
  const attempt=(dict?said:($("typed")?.value||"")).trim();
  if(!attempt){$("st").textContent=dict?"Press Speak and say something first.":"Type what you would say first.";return;}
  const task=$("task").value;
  $("check").disabled=true;$("fb").innerHTML=`<p class="st">Checking…</p>`;
  try{
    const r=await sample.json(task==="shadow"
      ?`A ${L.level} learner of ${L.langName} tried to repeat this passage aloud. Speech recognition turned their speech into text, so ignore punctuation and capitalization, and treat small recognition slips gently.\nPassage: ${L.passage}\nWhat they said: ${attempt}\nScore how close and fluent it is from 0 to 100. Give feedback in ${NATIVE}, 1-2 sentences, warm and specific. List up to 4 corrections where they said something different. Reply with only JSON: {"score": number, "feedback": string, "fixes": [{"said": string, "better": string}], "model": the passage}.`
      :`A ${L.level} learner of ${L.langName} answered this question aloud. Speech recognition turned their speech into text, so ignore punctuation and treat small recognition slips gently.\nQuestion: ${L.question}\nTheir answer: ${attempt}\nScore it from 0 to 100 for clarity and correctness at their level. Give feedback in ${NATIVE}, 1-2 sentences, warm and specific. List up to 4 corrections of grammar or word choice. Then write a better version of their answer in ${L.langName}, same ideas, at ${L.level} level. Reply with only JSON: {"score": number, "feedback": string, "fixes": [{"said": string, "better": string}], "model": string}.`,
      {modelTier:"default",cache:false});
    const sc=Math.max(0,Math.min(100,Math.round(+r?.score||0)));
    $("fb").innerHTML=`<div class="score"><b style="color:${sc>=80?"var(--good)":sc>=55?"var(--accent)":"var(--warn)"}">${sc}</b><span class="st">/ 100</span></div>
      <p style="margin:0">${esc(r?.feedback)}</p>
      ${(r?.fixes||[]).length?`<ul class="fix">${r.fixes.slice(0,4).map(f=>`<li><s>${esc(f.said)}</s> → <ins>${esc(f.better)}</ins></li>`).join("")}</ul>`:""}
      ${task==="answer"&&r?.model?`<div class="eyebrow" style="margin-top:6px">A more natural answer</div><p class="passage" style="font-size:17px">${esc(r.model)}</p>${tts?`<div class="row"><button class="btn" id="playm">▶ Listen</button></div>`:""}`:""}`;
    if($("playm")) $("playm").onclick=()=>speak(String(r.model),0.9);
    $("redo").hidden=false; bump();
  }catch(e){$("fb").innerHTML=`<p class="st">${esc(ERR[e?.code]||"Couldn't check that. Try again.")}</p>`;}
  finally{$("check").disabled=false;}
}

/*DOCK_ART*/

<script>
/*INSTALL_PROMPT*/
/* When this artifact is open in Claude Desktop but not installed as an app yet, invite the person
   to install it. Shows once per session; the install itself is Claude's own dialog, started from
   the person's click (install.request() needs a click). Silent in browsers, on mobile and inside the
   installed app. */
(async()=>{
  if(!window.claude||!claude.use)return;
  try{if(sessionStorage.getItem("appstore.installAsked"))return}catch{}
  const d=await claude.use("desktop").catch(()=>null);
  if(!d||d.fs||!d.install)return;                       // d.fs exists only inside the installed app
  const st=await d.install.state().catch(()=>"unavailable");
  if(st!=="available")return;
  await new Promise(r=>setTimeout(r,900));
  if(document.querySelector(".aspi"))return;
  const zh=window.__ZH??/^zh/i.test(navigator.language||"");
  const T=(en,c)=>zh?c:en;
  const name=(document.title||"").trim()||T("this app","这个 app");
  const icon=typeof DOCK_SVG==="string"?DOCK_SVG:(typeof ICON_SVG==="object"&&ICON_SVG.store)||"";
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const st2=document.createElement("style");
  st2.textContent=`.aspi{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:rgba(20,20,19,.42);padding:16px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.aspi .b{--bg:#FAF9F5;--fg:#141413;--mu:#6B6A64;--pill:#EDE6DA;--ac:#B9532F;--on:#fff;background:var(--bg);color:var(--fg);border-radius:18px;max-width:380px;width:100%;padding:24px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
@media (prefers-color-scheme:dark){.aspi .b{--bg:#262624;--fg:#FAF9F5;--mu:#A6A39A;--pill:#3A3632;--ac:#E08A6A;--on:#1F1E1D}}
.aspi .ic{width:72px;height:72px}.aspi .ic svg{width:72px;height:72px;display:block}
.aspi h3{margin:2px 0 0;font-size:18px;font-weight:700;line-height:1.25}
.aspi p{margin:0;color:var(--mu)}
.aspi .row{display:flex;flex-direction:column;gap:8px;align-self:stretch;margin-top:6px}
.aspi button{font-family:inherit;font-weight:600;font-size:15px;line-height:1;border:0;border-radius:999px;padding:12px 16px;cursor:pointer}
.aspi .y{background:var(--ac);color:var(--on)}.aspi .n{background:var(--pill);color:var(--fg)}`;
  const m=document.createElement("div");m.className="aspi";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("data-no-i18n","");
  m.innerHTML=`<div class="b"><div class="ic">${icon}</div>
    <h3>${esc(T(`Install ${name} as an app?`,`把「${name}」安装为 app？`))}</h3>
    <p>${esc(T("It gets its own window and Dock icon, opens like any other app, and keeps working on your Claude plan.","装好后有自己的窗口和 Dock 图标，像普通 app 一样打开，继续用你的 Claude 套餐。"))}</p>
    <div class="row"><button class="y">${esc(T("Install","安装"))}</button><button class="n">${esc(T("Not now","以后再说"))}</button></div></div>`;
  const close=()=>{m.remove();st2.remove();try{sessionStorage.setItem("appstore.installAsked","1")}catch{}};
  m.addEventListener("click",async e=>{
    if(e.target===m||e.target.closest(".n"))return close();
    if(e.target.closest(".y")){const r=await d.install.request().catch(()=>"failed");close();
      if(r==="failed"||r==="unavailable"){const n=document.createElement("div");n.textContent=T("Couldn't install. Use Install as app in the artifact's menu.","没装上。可以在工件菜单里选“安装为 app”。");n.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141413;color:#fff;padding:10px 14px;border-radius:10px;z-index:2147483000;font:13px system-ui";document.body.appendChild(n);setTimeout(()=>n.remove(),5000)}}
  });
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"&&m.isConnected){close();document.removeEventListener("keydown",k)}});
  document.head?document.head.appendChild(st2):document.body.appendChild(st2);document.body.appendChild(m);
  m.querySelector(".y").focus();
})();
/*END_INSTALL_PROMPT*/
</script>
