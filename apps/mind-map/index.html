<title>Mind Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: maps sidebar on the left, the canvas in the middle (dot grid, floating zoom and find), an inspector on the right with Topic / Map / AI tabs. */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --fg:#17191f; --muted:#6b7280; --line:#e3e5ea; --chip:#eef0f3; --hover:#f1f2f5;
  --accent:#4f5bd5; --accent-fg:#ffffff; --accent-soft:rgba(79,91,213,.12);
  --canvas:#fafafb; --dot:#dcdee4; --danger:#d93f3f; --shadow:0 6px 24px rgba(15,20,40,.10),0 1px 3px rgba(15,20,40,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--panel:#1d2025;--fg:#eceef2;--muted:#9097a3;--line:#2d3138;--chip:#272b32;--hover:#262a31;--accent:#8b95ff;--accent-fg:#10132e;--accent-soft:rgba(139,149,255,.16);--canvas:#191b20;--dot:#2c3037;--danger:#ff6b6b;--shadow:0 8px 28px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171b;--panel:#1d2025;--fg:#eceef2;--muted:#9097a3;--line:#2d3138;--chip:#272b32;--hover:#262a31;--accent:#8b95ff;--accent-fg:#10132e;--accent-soft:rgba(139,149,255,.16);--canvas:#191b20;--dot:#2c3037;--danger:#ff6b6b;--shadow:0 8px 28px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:var(--fg)}
#app{display:flex;height:100vh;height:100dvh;width:100vw;overflow:hidden}
/* sidebar */
#side{width:248px;flex:none;display:flex;flex-direction:column;background:var(--bg);border-right:1px solid var(--line);min-height:0}
.sidehead{display:flex;align-items:center;gap:6px;padding:12px 10px 8px max(12px,env(safe-area-inset-left,0px))}
body.app .sidehead{padding-top:12px;padding-left:80px;app-region:drag;-webkit-app-region:drag}
body.app .sidehead>*{app-region:no-drag;-webkit-app-region:no-drag}
.sidehead h1{font-size:13px;font-weight:650;margin:0;flex:1;letter-spacing:-.01em}
.sidesearch{margin:0 10px 6px max(10px,env(safe-area-inset-left,0px));position:relative}
.sidesearch input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 8px 6px 28px;outline:none}
.sidesearch input:focus{border-color:var(--accent)}
.sidesearch svg{position:absolute;left:8px;top:7px;width:14px;height:14px;color:var(--muted)}
#maplist{flex:1;overflow:auto;padding:2px 6px 8px max(6px,env(safe-area-inset-left,0px))}
.mi{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:default;position:relative}
.mi:hover{background:var(--hover)}
.mi.on{background:var(--accent-soft)}
.mi .mic{width:28px;height:28px;border-radius:7px;background:var(--chip);flex:none;display:grid;place-items:center;color:var(--muted)}
.mi.on .mic{color:var(--accent)}
.mi .mt{flex:1;min-width:0}
.mi .mn{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .ms{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .mx{opacity:0;border:0;background:transparent;border-radius:6px;padding:2px 4px;cursor:pointer;color:var(--muted)}
.mi:hover .mx,.mi.on .mx{opacity:1}
.mi .mx:hover{background:var(--chip)}
.sidefoot{padding:8px 10px max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.sidefoot .hint{font-size:11.5px;color:var(--muted)}
.emptylist{color:var(--muted);padding:16px 10px;font-size:12.5px}
/* buttons */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:520}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.pri:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:default}
.ib{border:0;background:transparent;border-radius:7px;width:30px;height:30px;display:inline-grid;place-items:center;cursor:pointer;color:var(--fg);flex:none}
.ib:hover{background:var(--hover)}
.ib.on{background:var(--accent-soft);color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg,.btn svg{width:17px;height:17px}
/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#bar{display:flex;align-items:center;gap:4px;padding:8px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);min-height:46px}
body.app #bar{app-region:drag;-webkit-app-region:drag}
body.app #bar>*{app-region:no-drag;-webkit-app-region:no-drag}
body.app.noside #bar{padding-left:80px}
#bar .sp{flex:1;min-width:4px;app-region:drag;-webkit-app-region:drag}
#crumbs{display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden}
#mtitle{max-width:min(320px,40vw)!important;border:1px solid transparent;background:transparent;font-weight:650;font-size:14px;padding:4px 6px;border-radius:6px;min-width:60px;max-width:260px;outline:none;text-overflow:ellipsis}
#mtitle:hover{border-color:var(--line)}
#mtitle:focus{border-color:var(--accent);background:var(--panel)}
.crumb{border:0;background:transparent;color:var(--muted);padding:3px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.crumb:hover{background:var(--hover);color:var(--fg)}
.crumb.cur{color:var(--fg);font-weight:600}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
.seg{display:flex;background:var(--chip);border-radius:8px;padding:2px;flex:none}
.seg button{border:0;background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:550;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button svg{width:15px;height:15px}
#savest{font-size:11.5px;color:var(--muted);white-space:nowrap;padding:0 4px}
/* stage */
#stage{flex:1;position:relative;overflow:hidden;background-color:var(--canvas);touch-action:none;outline:none}
#stage.grid{background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
#svg .n{cursor:default}
#svg .tog{cursor:pointer}
#svg .rel-hit{cursor:pointer}
#svg .obj-hit{cursor:pointer}
#stage.panning,#stage.panning #svg .n{cursor:grabbing}
#stage.relmode,#stage.relmode #svg .n{cursor:crosshair}
#editor{position:absolute;z-index:5;border:2px solid var(--accent);border-radius:6px;background:var(--panel);color:var(--fg);resize:none;overflow:hidden;outline:none;padding:2px 4px;line-height:1.3;box-shadow:var(--shadow);white-space:pre-wrap;word-break:break-word}
.float{position:absolute;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:flex;align-items:center;gap:2px;padding:3px}
#zoom{right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px))}
#zoom .zl{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;font-size:12px;border:0;background:transparent;cursor:pointer;border-radius:6px;padding:5px 2px}
#zoom .zl:hover{background:var(--hover)}
#find{top:10px;right:max(12px,env(safe-area-inset-right,0px));padding:4px 4px 4px 8px}
#find input{border:0;background:transparent;outline:none;width:180px;padding:4px 2px}
#findc{font-size:11.5px;color:var(--muted);min-width:44px;text-align:right;padding-right:4px;font-variant-numeric:tabular-nums}
#modehint{left:50%;top:10px;transform:translateX(-50%);padding:6px 8px 6px 12px;font-weight:520;gap:8px}
#present{left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);gap:6px;padding:4px 6px}
#present span{font-size:12px;color:var(--muted);min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
#empty{position:absolute;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none}
#empty .card{pointer-events:auto;text-align:center;max-width:380px;padding:24px}
#empty h2{margin:0 0 6px;font-size:18px}
#empty p{color:var(--muted);margin:0 0 14px}
#empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#drop{position:absolute;inset:10px;z-index:9;border:2px dashed var(--accent);border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;font-weight:600;font-size:15px;color:var(--accent);pointer-events:none}
/* outline view */
#outline{flex:1;overflow:auto;background:var(--canvas);padding:28px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
#outline .doc{max-width:760px;margin:0 auto}
.orow{display:flex;align-items:flex-start;gap:2px;border-radius:6px;position:relative}
.orow:hover{background:var(--hover)}
.orow .tw{width:20px;height:24px;border:0;background:transparent;color:var(--muted);cursor:pointer;flex:none;display:grid;place-items:center;border-radius:5px;padding:0}
.orow .tw svg{width:12px;height:12px;transition:transform .12s}
.orow.closed .tw svg{transform:rotate(-90deg)}
.orow .tw.none{visibility:hidden}
.orow .bul{width:14px;height:24px;flex:none;display:grid;place-items:center}
.orow .bul i{width:6px;height:6px;border-radius:50%;background:var(--muted);display:block}
.orow.closed .bul i{box-shadow:0 0 0 4px var(--chip)}
.orow .ot{flex:1;min-width:0;outline:none;padding:2px 4px;line-height:20px;white-space:pre-wrap;word-break:break-word;font-size:14px}
.orow .ot:empty::before{content:"Topic";color:var(--muted)}
.orow.root .ot{font-size:22px;font-weight:700;line-height:30px}
.orow.root .bul,.orow.root .tw{height:34px}
.orow .on{color:var(--muted);font-size:12.5px;padding:0 4px 4px;white-space:pre-wrap}
.orow .mk{display:inline-flex;gap:2px;padding-top:3px}
.ocol{flex:1;min-width:0}
.orow.done .ot{text-decoration:line-through;color:var(--muted)}
.ocheck{width:16px;height:16px;margin:4px 2px 0 0;accent-color:var(--accent);flex:none}
/* inspector */
#insp{width:300px;flex:none;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.itabs{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center}
.itabs button{border:0;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600}
.itabs button.on{color:var(--fg);background:var(--chip)}
.itabs .sp{flex:1}
.ibody{flex:1;overflow:auto;padding:12px 14px 24px}
.sec{margin-bottom:18px}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:650}
.fld{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;outline:none}
.fld:focus{border-color:var(--accent);background:var(--panel)}
textarea.fld{resize:vertical;min-height:90px;line-height:1.45}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;display:grid;place-items:center;font-size:12px;color:var(--muted);background:var(--panel)}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:550;color:var(--muted)}
.card:hover{background:var(--hover)}
.card.on{border-color:var(--accent);color:var(--fg);box-shadow:0 0 0 1px var(--accent)}
.card svg{width:56px;height:34px}
.thm{height:44px;border-radius:8px;border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;padding:0}
.thm.on{box-shadow:0 0 0 2px var(--accent)}
.rowb{display:flex;flex-wrap:wrap;gap:6px}
.chipb{white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:12px}
.chipb:hover{background:var(--hover)}
.chipb.on{border-color:var(--accent);background:var(--accent-soft)}
.mkgrid{display:flex;flex-wrap:wrap;gap:4px}
.mkb{width:30px;height:28px;border:1px solid transparent;background:transparent;border-radius:6px;cursor:pointer;display:grid;place-items:center;padding:0}
.mkb:hover{background:var(--hover)}
.mkb.on{border-color:var(--accent);background:var(--accent-soft)}
.muted{color:var(--muted)}
.small{font-size:11.5px}
.imgprev{max-width:100%;max-height:120px;border-radius:6px;display:block;margin-bottom:6px;border:1px solid var(--line)}
.lnk{color:var(--accent);word-break:break-all;font-size:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
/* AI */
.aibox{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px}
.aibox textarea{border:0;background:transparent;width:100%;resize:none;outline:none;min-height:70px;line-height:1.45}
.aichips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#aiout{white-space:pre-wrap;line-height:1.5;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);max-height:340px;overflow:auto}
#aist{font-size:12px;color:var(--muted);min-height:18px;margin:6px 0}
.rv{display:flex;gap:6px;align-items:flex-start;padding:4px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.rv input{margin-top:2px;accent-color:var(--accent)}
.rv del{color:var(--muted)}
/* menus / toasts / sheets */
.pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;min-width:200px;max-height:80vh;overflow:auto}
.pop button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:6px 10px;border-radius:6px;cursor:pointer;text-align:left;white-space:nowrap}
.pop button:hover{background:var(--accent);color:var(--accent-fg)}
.pop button kbd,.pop button .r{margin-left:auto;color:var(--muted);font:11.5px var(--font)}
.pop button:hover kbd,.pop button:hover .r{color:inherit;opacity:.85}
.pop button.danger{color:var(--danger)}
.pop button.danger:hover{background:var(--danger);color:#fff}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.pop .ph{font-size:11px;color:var(--muted);padding:4px 10px 2px;text-transform:uppercase;letter-spacing:.05em;font-weight:650}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 10px 8px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);max-width:calc(100vw - 32px);font-weight:520}
#toast button{border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:6px;padding:3px 9px;cursor:pointer;font-weight:650}
#sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.32);display:grid;place-items:center;padding:16px}
#sheet .in{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:18px 20px}
#sheet h2{margin:0 0 10px;font-size:16px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 20px}
.keys div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-size:12.5px}
kbd{font:600 11px var(--font);background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;white-space:nowrap}
/* presentation */
body.presenting #side,body.presenting #insp,body.presenting #bar,body.presenting #zoom{display:none!important}
body.zen #side,body.zen #insp{display:none!important}
/* responsive */
#scrim{display:none}
@media (max-width:820px){
  #insp{position:fixed;right:0;top:0;bottom:0;z-index:30;width:min(320px,92vw);box-shadow:var(--shadow)}
  #side{position:fixed;left:0;top:0;bottom:0;z-index:30;box-shadow:var(--shadow);background:var(--panel)}
  #scrim{display:block;position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.25)}
  .wide{display:none!important}
  #mtitle{max-width:140px}
}
@media (max-width:520px){ .wide2{display:none!important} #find input{width:110px} }
</style>
<div id="app">
  <aside id="side">
    <div class="sidehead"><h1>Maps</h1>
      <button class="ib" id="bImport" title="Import .xmind, .opml, .mm, Markdown or text" data-ic="import"></button>
      <button class="ib" id="bNew" title="New map" data-ic="plus"></button>
    </div>
    <div class="sidesearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="mapq" placeholder="Search maps" autocomplete="off"></div>
    <div id="maplist"></div>
    <div class="sidefoot">
      <div id="inst"></div>
      <div class="hint">Saved on this computer. Drop .xmind, .opml, .mm or .md files anywhere to import.</div>
    </div>
  </aside>
  <div id="scrim" hidden></div>
  <main id="main">
    <div id="bar">
      <button class="ib" id="bSide" title="Show or hide maps (Cmd+\)" data-ic="side"></button>
      <div id="crumbs"><input id="mtitle" spellcheck="false" aria-label="Map name"></div>
      <span id="savest"></span>
      <div class="sp"></div>
      <button class="ib wide2" id="bUndo" title="Undo (Cmd+Z)" data-ic="undo"></button>
      <button class="ib wide2" id="bRedo" title="Redo (Shift+Cmd+Z)" data-ic="redo"></button>
      <div class="sep wide2"></div>
      <button class="ib wide" id="bChild" title="Add subtopic (Tab)" data-ic="child"></button>
      <button class="ib wide" id="bSib" title="Add topic (Enter)" data-ic="sib"></button>
      <button class="ib wide" id="bRel" title="Relationship (Shift+Cmd+L)" data-ic="rel"></button>
      <button class="ib wide" id="bFind" title="Find (Cmd+F)" data-ic="search"></button>
      <div class="sep wide"></div>
      <div class="seg" id="viewseg"><button data-v="map" class="on" title="Map view"><span data-ic="map"></span><span class="wide">Map</span></button><button data-v="outline" title="Outline view (Shift+Cmd+O)"><span data-ic="outline"></span><span class="wide">Outline</span></button></div>
      <button class="ib" id="bPresent" title="Present (Shift+Cmd+P)" data-ic="play"></button>
      <button class="ib" id="bExport" title="Export" data-ic="export"></button>
      <button class="ib" id="bMore" title="More" data-ic="more"></button>
      <button class="ib" id="bInsp" title="Show or hide inspector (Cmd+Option+I)" data-ic="panel"></button>
    </div>
    <div id="stage" class="grid" tabindex="0">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="vp"></g></svg>
      <textarea id="editor" hidden spellcheck="false"></textarea>
      <div id="find" class="float" hidden><input id="findq" placeholder="Find in map" autocomplete="off"><span id="findc"></span><button class="ib" id="findp" title="Previous (Shift+Enter)" data-ic="up"></button><button class="ib" id="findn" title="Next (Enter)" data-ic="down"></button><button class="ib" id="findx" title="Close (Esc)" data-ic="x"></button></div>
      <div id="modehint" class="float" hidden><span id="modetext"></span><button class="btn" id="modex">Cancel</button></div>

 doc:'<circle cx="12" cy="12" r="2.5"/><path d="M14.5 12H20M9.5 12H4M12 9.5V5M12 14.5V19"/>',chev:'<path d="M8 10l4 4 4-4"/>',
 focus:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',image:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>',
 bound:'<rect x="3" y="5" width="18" height="14" rx="4" stroke-dasharray="3 2.5"/><path d="M8 10h8M8 14h5"/>',sum:'<path d="M5 4c3 0 3 2 3 4s0 4 3 4c-3 0-3 2-3 4s0 4-3 4"/><path d="M14 12h6"/>',

const ic=(n,sw=1.8)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||""}</svg>`;

/* ---------- storage: IndexedDB with localStorage fallback ---------- */
const DB={db:null,mem:new Map(),
  async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open("mindmap",1);r.onupgradeneeded=()=>r.result.createObjectStore("maps");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);setTimeout(()=>rej("timeout"),4000);});}catch{this.db=null}},
  tx(mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction("maps",mode);const s=t.objectStore("maps");const r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});},
  async all(){if(this.db){try{const r=await this.tx("readonly",s=>s.getAll());return r||[]}catch{}}
    const out=[];try{for(const id of store.get("ids",[])){const m=store.get("map."+id,null);if(m)out.push(m)}}catch{}return out.length?out:[...this.mem.values()]},
  async put(m){this.mem.set(m.id,m);if(this.db){try{await this.tx("readwrite",s=>s.put(m,m.id));return true}catch{}}

  async del(id){this.mem.delete(id);if(this.db){try{await this.tx("readwrite",s=>s.delete(id))}catch{}}try{localStorage.removeItem("mindmap.map."+id);store.set("ids",store.get("ids",[]).filter(x=>x!==id))}catch{}}
};

/* ---------- model ---------- */
const N=(text,children=[])=>({id:uid(),text:text??"",children});
function newMap(title="Central Topic",root){const now=Date.now();return {id:uid(),title,created:now,updated:now,root:root||N(title),rels:[],layout:"map",theme:"auto",line:"curve",rainbow:true,spacing:1,images:{},v:1};}
let maps=[];            // all maps (full objects; small enough)
let M=null;             // current map
const P=new Map(), BY=new Map(), DEPTH=new Map(); // parent, byId, depth
function reindex(){P.clear();BY.clear();DEPTH.clear();if(!M)return;(function w(n,p,d){BY.set(n.id,n);DEPTH.set(n.id,d);if(p)P.set(n.id,p);for(const c of n.children)w(c,n,d+1)})(M.root,null,0);}
function walk(n,fn,d=0,p=null){if(fn(n,d,p)===false)return;for(const c of n.children)walk(c,fn,d+1,n)}

function isAnc(a,b){let x=b;while(x){if(x.id===a.id)return true;x=P.get(x.id)}return false}
function pathOf(n){const out=[];let x=n;while(x){out.unshift(x);x=P.get(x.id)}return out}
function cloneTree(n,fresh=true){const c=JSON.parse(JSON.stringify(n));if(fresh)walk(c,x=>{x.id=uid()});return c}
function plain(n,depth=0,max=99){let s="";walk(n,(x,d)=>{if(d>max)return false;s+="  ".repeat(d)+(x.text||"")+"\n"});return s}

/* ---------- themes ---------- */

 paper:{name:"Paper",bg:"#fbf8f1",fg:"#2b2620",muted:"#857c6d",root:"#fffdf8",rootFg:"#2b2620",rootStroke:"#2b2620",d1:"underline",d2:"underline",pal:["#c8553d","#e09f3e","#588157","#3a7ca5","#7b5ea7","#b5838d"],dots:"#ece6d8"},

 pastel:{name:"Pastel",bg:"#fffaf5",fg:"#3a3340",muted:"#8a8090",root:"#7c6bd6",rootFg:"#ffffff",d1:"solidsoft",d2:"underline",pal:["#f28b82","#fbbc6a","#f6d860","#9ad59c","#7fd1c7","#8ab4f8","#c3a6f0","#f4a6c8"],dots:"#f0e8df"},

 blueprint:{name:"Blueprint",bg:"#123a6b",fg:"#eaf3ff",muted:"#9fc0e6",root:"#eaf3ff",rootFg:"#123a6b",d1:"outline",d2:"underline",pal:["#eaf3ff"],line:"#bcd8fa",dots:"#1c4a82",dark:true},
};
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  if(t===THEMES.auto){const dark=cssv("--canvas").toLowerCase()!=="#fafafb";return {...t,bg:cssv("--canvas")||"#fafafb",fg:cssv("--fg")||"#17191f",muted:cssv("--muted")||"#6b7280",root:dark?"#eceef2":"#23283a",rootFg:dark?"#15171b":"#ffffff",dots:cssv("--dot"),dark,pal:dark?["#ff6b6b","#ff9b4a","#f2c94c","#4cd08a","#3cc8bb","#5aa9ff","#a28bff","#ff6fbf"]:PAL}}
  return t;}
function hex2rgb(h){h=String(h||"").trim();if(h.startsWith("rgb")){const m=h.match(/[\d.]+/g)||[0,0,0];return m.slice(0,3).map(Number)}h=h.replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const v=parseInt(h.slice(0,6),16);return isNaN(v)?[128,128,128]:[(v>>16)&255,(v>>8)&255,v&255]}
function mix(a,b,t){const x=hex2rgb(a),y=hex2rgb(b);return "#"+x.map((v,i)=>Math.round(v*t+y[i]*(1-t)).toString(16).padStart(2,"0")).join("")}
function lum(c){const [r,g,b]=hex2rgb(c).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b}
const onColor=c=>lum(c)>.45?"#16181d":"#ffffff";

/* ---------- markers (Xmind ids) ---------- */
const MK_GROUPS=[
 ["Priority",["priority-1","priority-2","priority-3","priority-4","priority-5","priority-6"]],
 ["Progress",["task-start","task-quarter","task-half","task-3quar","task-done"]],
 ["Flags",["flag-red","flag-orange","flag-yellow","flag-green","flag-blue","flag-purple"]],
 ["Stars",["star-red","star-orange","star-yellow","star-green","star-blue","star-purple"]],
 ["Faces",["smiley-smile","smiley-laugh","smiley-cry","smiley-surprise","smiley-angry"]],
 ["Symbols",["symbol-question","symbol-exclam","symbol-info","symbol-wrong","symbol-right","symbol-idea","symbol-pin","symbol-heart","symbol-money","symbol-time","symbol-people"]],
];
const MKC={red:"#e5484d",orange:"#f2771a",yellow:"#e8b500",green:"#2f9e62",blue:"#1a7fe0",purple:"#7c5bd6",gray:"#8b8f98"};
const MK_EMOJI={"smiley-smile":"🙂","smiley-laugh":"😄","smiley-cry":"😢","smiley-surprise":"😮","smiley-angry":"😠","symbol-question":"❓","symbol-exclam":"❗","symbol-info":"ℹ️","symbol-wrong":"❌","symbol-right":"✅","symbol-idea":"💡","symbol-pin":"📌","symbol-heart":"❤️","symbol-money":"💰","symbol-time":"⏰","symbol-people":"👥"};
const PRI_COL=["#e5484d","#f2771a","#2f9e62","#1a7fe0","#7c5bd6","#8b8f98","#8b8f98","#8b8f98","#8b8f98"];
function markerSVG(id,x,y,s=16){ // x,y top-left
  const cx=x+s/2,cy=y+s/2,r=s/2;
  let m;
  if((m=/^priority-(\d)/.exec(id)))return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${PRI_COL[(+m[1]-1)%9]}"/><text x="${cx}" y="${cy+0.5}" font-size="${s*.62}" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">${m[1]}</text>`;
  if(id.startsWith("task-")){const f={"task-start":0,"task-oct":.125,"task-quarter":.25,"task-3oct":.375,"task-half":.5,"task-5oct":.625,"task-3quar":.75,"task-7oct":.875,"task-done":1,"task-pause":0}[id]??0;
    if(f>=1)return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#2f9e62"/><path d="M${cx-r*.45} ${cy}l${r*.32} ${r*.32} ${r*.55}-${r*.62}" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    let p=`<circle cx="${cx}" cy="${cy}" r="${r-1}" fill="none" stroke="#1a7fe0" stroke-width="1.6"/>`;
    if(f>0){const a=f*2*Math.PI-Math.PI/2,ex=cx+(r-1)*Math.cos(a),ey=cy+(r-1)*Math.sin(a);p+=`<path d="M${cx} ${cy}V${cy-r+1}A${r-1} ${r-1} 0 ${f>.5?1:0} 1 ${ex.toFixed(2)} ${ey.toFixed(2)}Z" fill="#1a7fe0"/>`}
    return p;}
  if((m=/^(flag|star|c_simbol|people)-(\w+)/.exec(id))){const col=MKC[m[2]]||"#8b8f98";
    if(m[1]==="flag")return `<path d="M${x+3} ${y+s-1}V${y+1.5}" stroke="${col}" stroke-width="1.6" stroke-linecap="round"/><path d="M${x+3.5} ${y+2}h${s-5}l-2.5 3.5 2.5 3.5h-${s-5}z" fill="${col}"/>`;
    if(m[1]==="star"){let d="";for(let i=0;i<10;i++){const rr=i%2?r*.42:r,a=-Math.PI/2+i*Math.PI/5;d+=(i?"L":"M")+(cx+rr*Math.cos(a)).toFixed(2)+" "+(cy+rr*Math.sin(a)).toFixed(2)}return `<path d="${d}Z" fill="${col}"/>`}
    return `<circle cx="${cx}" cy="${cy}" r="${r-1}" fill="${col}"/>`;}
  if(MK_EMOJI[id])return `<text x="${cx}" y="${cy+1}" font-size="${s*.86}" text-anchor="middle" dominant-baseline="central">${MK_EMOJI[id]}</text>`;
  if(id.startsWith("emoji:"))return `<text x="${cx}" y="${cy+1}" font-size="${s*.86}" text-anchor="middle" dominant-baseline="central">${esc(id.slice(6))}</text>`;
  return `<circle cx="${cx}" cy="${cy}" r="${r-2}" fill="none" stroke="#8b8f98" stroke-width="1.5"/><title>${esc(id)}</title>`;
}
const markerTitle=id=>id.replace(/^symbol-|^smiley-/,"").replace(/-/g," ");
function taskState(n){const m=(n.markers||[]).find(x=>x.startsWith("task-"));return m?(m==="task-done"?"done":"todo"):null}

/* ---------- measuring ---------- */
const mctx=document.createElement("canvas").getContext("2d");
const FONT_STACK='-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif';
function fontFor(n,d){let size=d===0?21:d===1?16:14;if(n.size==="l")size+=4;else if(n.size==="s")size-=2;else if(n.size==="xl")size+=9;
  const w=n.bold===false?400:(n.bold||d===0?650:d===1?560:420);return {size,weight:w,italic:!!n.italic,css:`${n.italic?"italic ":""}${w} ${size}px ${FONT_STACK}`,lh:Math.round(size*1.32)}}
const CJK=/[⺀-鿿가-힯豈-﫿＀-￯　-〿]/;
function wrap(text,max,font){mctx.font=font;const out=[];
  for(const para of String(text||"").split("\n")){
    const toks=para.match(/[⺀-鿿가-힯豈-﫿＀-￯　-〿]|[^\s⺀-鿿가-힯豈-﫿＀-￯　-〿]+\s*|\s+/g)||[""];
    let line="";
    for(const t of toks){const test=line+t;if(line&&mctx.measureText(test.trimEnd()).width>max){out.push(line.trimEnd());line=t.trimStart();
        while(mctx.measureText(line).width>max&&line.length>1){let k=line.length;while(k>1&&mctx.measureText(line.slice(0,k)).width>max)k--;out.push(line.slice(0,k));line=line.slice(k)}}
      else line=test}
    out.push(line.trimEnd());}
  let w=0;for(const l of out)w=Math.max(w,mctx.measureText(l).width);return {lines:out,w};}

/* ---------- layout ---------- */
const G=new Map();let SUMG=new WeakMap();          // id -> geometry
let EDGES=[], EXTRA=[], LROOT=null, BBOX={x:0,y:0,w:0,h:0};
let focusId=null;
const LAYOUTS=[["map","Map"],["right","Logic"],["left","Logic left"],["org","Org chart"],["tree","Tree"],["timeline","Timeline"],["fishbone","Fishbone"]];
const kidsOf=n=>n.collapsed?[]:n.children;
function styleOf(n,d,T){if(d===0)return "root";const s={box:"fill",pill:"pill",line:"underline",text:"none",solid:"solid",outline:"outline"}[n.shape];return s||(d===1?T.d1:T.d2)}
function measure(n,d,color,T){
  const f=fontFor(n,d), st=styleOf(n,d,T);
  const maxW=n.w||(d===0?320:250);
  const wr=wrap(n.text||" ",maxW,f.css);
  const mk=(n.markers||[]).length, mkS=Math.round(f.size*1.05), mkW=mk?mk*(mkS+4):0;
  let tasks=null;if(n.children.length){let t=0,dn=0;for(const c of n.children){const s=taskState(c);if(s){t++;if(s==="done")dn++}}if(t)tasks=[dn,t]}
  const trailW=(n.note?18:0)+(n.link?18:0)+(tasks?30:0);
  mctx.font=`500 11px ${FONT_STACK}`;
  const lbl=(n.labels||[]).filter(Boolean);let lblW=0;for(const l of lbl)lblW+=mctx.measureText(l).width+14+4;
  let imW=0,imH=0;if(n.image){const s=Math.min(1,(n.image.w>0?240/n.image.w:1));imW=Math.round((n.image.w||120)*s);imH=Math.round((n.image.h||90)*s)}
  const pad=st==="root"?[20,13]:st==="underline"?[4,5]:st==="none"?[4,4]:st==="pill"?[16,7]:d===1?[13,8]:[10,6];
  if(n.fill&&(st==="underline"||st==="none")){pad[0]=10;pad[1]=6}
  const textW=Math.max(wr.w,(n.text?0:28));
  const cw=Math.max(mkW+textW+(trailW?trailW+4:0),lblW,imW);
  const lineH=Math.max(f.lh,mk?mkS:0);
  const h=pad[1]*2+wr.lines.length*f.lh+(mk&&wr.lines.length===1?Math.max(0,mkS-f.lh):0)+(lbl.length?22:0)+(imH?imH+6:0);
  const g={id:n.id,n,d,st,f,lines:wr.lines,w:Math.ceil(cw+pad[0]*2),h:Math.ceil(h),pad,mk,mkS,mkW,trailW,tasks,lbl,imW,imH,color,x:0,y:0,lineH};
  G.set(n.id,g);return g;
}
function measureAll(R,T){
  const pal=T.pal;
  (function w(n,d,col,i){
    let c=n.color||col;
    if(d===1&&!n.color)c=M.rainbow?pal[i%pal.length]:(T.line||pal[0]);
    if(d===0)c=n.color||T.line||T.root;
    measure(n,d,c,T);
    kidsOf(n).forEach((k,j)=>w(k,d+1,c,j));
  })(R,0,null,0);

    (nd.bounds||[]).forEach((bd,i)=>{if(nd.collapsed)return;const bb=rangeBox(nd,bd.s,bd.e);if(!bb)return;const col=bd.color||(nd===LROOT?G.get(nd.children[bd.s]?.id)?.color:g.color)||g.color;const isS=!exp&&selObj?.t==="bound"&&selObj.pid===nd.id&&selObj.i===i;

/* ---------- app state ---------- */

/* ---------- saving ---------- */
let saveT=0;

async function saveMap(m){m.updated=Date.now();m.title=m.title||m.root.text||"Untitled";const ok=await DB.put(m);if(m===M)$("savest").textContent=ok?"Saved":"Not saved: storage is full";renderList()}
function pruneImages(m){if(!m.images)return;const used=new Set();walk(m.root,n=>{if(n.image?.id)used.add(n.image.id)});for(const k of Object.keys(m.images))if(!used.has(k))delete m.images[k]}

/* ---------- viewport ---------- */
function applyV(){vp.setAttribute("transform",`translate(${V.x.toFixed(2)},${V.y.toFixed(2)}) scale(${V.k.toFixed(4)})`);stage.style.backgroundSize=`${22*V.k}px ${22*V.k}px`;stage.style.backgroundPosition=`${V.x}px ${V.y}px`;$("zLbl").textContent=Math.round(V.k*100)+"%";if(M)VIEWS[M.id]={...V};if(editing)placeEditor()}

/* ---------- selection ---------- */

/* ---------- structure helpers (keep boundary/summary ranges right) ---------- */
function removeChild(p,i){const [c]=p.children.splice(i,1);for(const k of ["bounds","sums"]){if(!p[k])continue;p[k]=p[k].filter(r=>{if(r.s>i)r.s--;if(r.e>=i)r.e--;return r.e>=r.s&&r.e>=0});if(!p[k].length)delete p[k]}return c}

function dropRelsFor(ids){M.rels=(M.rels||[]).filter(r=>!ids.has(r.from)&&!ids.has(r.to))}

/* ---------- commands ---------- */
function freezeSides(){const R=M.root,half=Math.ceil(R.children.length/2);R.children.forEach((k,i)=>{if(!k.side)k.side=i<half?"right":"left"})}
function lighterSide(){let l=0,r=0;for(const k of M.root.children){const h=(G.get(k.id)?.sh||40)+18;if(k.side==="left")l+=h;else r+=h}return l<r?"left":"right"}
function addChild(){if(!M)return;const p=primary()||(focusId&&BY.get(focusId))||M.root;const c=N("");commit(()=>{delete p.collapsed;if(p===M.root&&M.layout==="map"&&LROOT===M.root){freezeSides();c.side=lighterSide()}insertChild(p,c,p.children.length)});setSel(c.id);ensureVisible(c.id);startEdit(c.id,{isNew:true})}

function insertParent(){const n=primary();const p=n&&P.get(n.id);if(!p)return;const i=p.children.indexOf(n);const x=N("");if(n.side)x.side=n.side;commit(()=>{removeChild(p,i);x.children=[n];delete n.side;insertChild(p,x,i)});setSel(x.id);ensureVisible(x.id);startEdit(x.id,{isNew:true})}
function deleteSel(){
  if(selObj){const o=selObj;commit(()=>{if(o.t==="rel")M.rels=M.rels.filter(r=>r.id!==o.id);else{const p=BY.get(o.pid);const k=o.t==="bound"?"bounds":"sums";p[k].splice(o.i,1);if(!p[k].length)delete p[k]}});selObjSet(null);return}
  const tops=topSel().filter(n=>n!==M.root&&n.id!==focusId);if(!tops.length){if(sel.has(M.root.id))toast("The central topic can't be deleted. Rename it instead.");return}
  const first=tops[0],fp=P.get(first.id),fi=fp.children.indexOf(first);
  commit(()=>{const gone=new Set();for(const n of tops){const p=P.get(n.id);walk(n,x=>{gone.add(x.id)});removeChild(p,p.children.indexOf(n))}dropRelsFor(gone)});
  const next=fp.children[fi]||fp.children[fi-1]||fp;setSel(next.id);
}
function moveSibling(dir){const n=primary();const p=n&&P.get(n.id);if(!p)return;const i=p.children.indexOf(n),j=i+dir;if(j<0||j>=p.children.length)return;commit(()=>{p.children.splice(i,1);p.children.splice(j,0,n)});ensureVisible(n.id)}
function toggleCollapse(ids){const ns=(ids||[...sel]).map(i=>BY.get(i)).filter(n=>n&&n.children.length);if(!ns.length)return;const to=!ns[0].collapsed;commit(()=>ns.forEach(n=>{n.collapsed=to||undefined;if(!to)delete n.collapsed}))}

function duplicate(){const tops=topSel().filter(n=>n!==M.root);if(!tops.length)return;let last;commit(()=>{for(const n of tops){const p=P.get(n.id);const c=cloneTree(n);insertChild(p,c,p.children.indexOf(n)+1);last=c}});setSel(last.id);ensureVisible(last.id)}
function setProp(k,v,ids){const ns=(ids||[...sel]).map(i=>BY.get(i)).filter(Boolean);if(!ns.length)return;commit(()=>ns.forEach(n=>{if(v==null||v===""||v===false&&k!=="bold")delete n[k];else n[k]=v}))}
const MK_PREFIX=m=>m.startsWith("priority-")?"priority-":m.startsWith("task-")?"task-":m.startsWith("flag-")?"flag-":m.startsWith("star-")?"star-":m.startsWith("smiley-")?"smiley-":m;
function toggleMarker(m){const ns=[...sel].map(i=>BY.get(i)).filter(Boolean);if(!ns.length)return;const has=ns[0].markers?.includes(m);
  commit(()=>ns.forEach(n=>{let a=(n.markers||[]).filter(x=>MK_PREFIX(x)!==MK_PREFIX(m)||(MK_PREFIX(m)===m&&x!==m));if(!has)a.push(m);a.sort((x,y)=>mkOrder(x)-mkOrder(y));if(a.length)n.markers=a;else delete n.markers}))}
function mkOrder(m){const o=["priority-","task-","flag-","star-","smiley-","symbol-"];const i=o.findIndex(p=>m.startsWith(p));return i<0?9:i}

/* ---------- navigation ---------- */
function navigate(dir){const n=primary();if(!n){setSel(LROOT.id);return}const g=G.get(n.id);if(!g)return;
  const cx=g.x+g.w/2,cy=g.y+g.h/2;let best=null,bs=Infinity;
  // logical moves first for horizontal trees

  if((dir==="left"&&g.dir==="r"||dir==="right"&&g.dir==="l")&&P.get(n.id)&&n.id!==LROOT.id){return go(P.get(n.id).id)}
  {const p=P.get(n.id);if(p&&n.id!==LROOT.id){const sib=p.children,i=sib.indexOf(n);const vert=g.dir!=="d";const step=vert?(dir==="up"?-1:dir==="down"?1:0):(dir==="left"?-1:dir==="right"?1:0);
    if(step){let j=i+step;if(p===LROOT&&M.layout==="map")while(j>=0&&j<sib.length&&(G.get(sib[j].id)?.dir)!==g.dir)j+=step;if(j>=0&&j<sib.length&&G.get(sib[j].id))return go(sib[j].id)}}}
  for(const o of G.values()){if(o===g)continue;const ox=o.x+o.w/2,oy=o.y+o.h/2,dx=ox-cx,dy=oy-cy;let pri,sec;
    if(dir==="right"){if(o.x<g.x+g.w-2)continue;pri=dx;sec=Math.abs(dy)}else if(dir==="left"){if(o.x+o.w>g.x+2)continue;pri=-dx;sec=Math.abs(dy)}
    else if(dir==="down"){if(oy<=cy+2)continue;pri=dy;sec=Math.abs(dx)}else{if(oy>=cy-2)continue;pri=-dy;sec=Math.abs(dx)}
    const s=pri+sec*2.2;if(s<bs){bs=s;best=o}}
  if(best)go(best.id);
  function go(id){setSel(id);ensureVisible(id)}}

/* ---------- inline editing ---------- */
function editTarget(){if(!editing)return null;if(editing.obj){const o=editing.obj;if(o.t==="rel"){const r=M.rels.find(x=>x.id===o.id);const q=r&&relGeom(r);return q?{x:q.mid.x-60,y:q.mid.y-11,w:120,h:22,size:12,weight:500}:null}
  const p=BY.get(o.pid);const s=p?.sums?.[o.i];const q=s&&SUMG.get(s);if(!q)return null;const sg=q.sg;return {x:sg.x,y:sg.y,w:sg.w,h:sg.h,size:14,weight:560}}
  const g=G.get(editing.id);if(!g)return null;return {x:g.x,y:g.y,w:g.w,h:g.h,size:g.f.size,weight:g.f.weight,italic:g.f.italic}}

  const W=Math.max(t.w*k,w+28,90);editor.style.width=W+"px";editor.style.left=(t.x*k+V.x+(t.w*k-W)/2*(editing.obj?1:0)-2)+"px";editor.style.top=(t.y*k+V.y-2)+"px";editor.style.height="auto";editor.style.height=Math.max(t.h*k+4,editor.scrollHeight+2)+"px"}
function startEdit(id,opt={}){if(!M||!BY.get(id))return;if(view!=="map"){return}finishEdit();const n=BY.get(id);editing={id,isNew:!!opt.isNew,orig:n.text};editor.value=opt.text!=null?opt.text:n.text;editor.hidden=false;placeEditor();editor.focus();if(opt.text!=null){const L=editor.value.length;editor.setSelectionRange(L,L)}else editor.select()}
function startEditObj(o){finishEdit();let v="";if(o.t==="rel")v=M.rels.find(x=>x.id===o.id)?.label||"";else if(o.t==="sum")v=BY.get(o.pid)?.sums?.[o.i]?.text||"";else return;editing={obj:o,orig:v};editor.value=v;editor.hidden=false;placeEditor();editor.focus();editor.select()}
function finishEdit(cancel=false){if(!editing)return;const e=editing;editing=null;editor.hidden=true;const v=cancel?e.orig:editor.value.replace(/\s+$/,"");

  const bring=t("Bring your maps",[t("Xmind (.xmind)"),t("MindNode, OmniOutliner (.opml)"),t("FreeMind, Freeplane (.mm)"),t("Markdown and plain outlines"),t("Paste indented text")],{note:"Drop files anywhere on the window, or use the import button in the sidebar. Export goes back to the same formats."});
  const looks=t("Make it yours",[t("Map, Logic, Org chart, Tree"),t("Timeline and Fishbone"),t("Themes and branch colors"),t("Notes, links, labels",[],{labels:["Example"],link:"https://en.wikipedia.org/wiki/Mind_map"}),t("Images, markers, tasks",[t("Done",[],{markers:["task-done"]}),t("To do",[],{markers:["task-start"]})])]);
  const ai=t("Think with Claude",[t("Generate a map from a sentence"),t("Expand any topic"),t("Summarize a branch"),t("Turn the map into an article")],{markers:["symbol-idea"]});
  const views=t("Other ways to see it",[t("Outline view"),t("Focus on one branch"),t("Present branch by branch"),t("Find in notes and topics")]);
  const root=t("Mind Map",[keys,bring,looks,ai,views]);const m=newMap("Mind Map",root);m.named=false;
  bring.bounds=[{id:uid(),s:0,e:2,label:"Zero switching cost"}];ai.sums=[{id:uid(),s:1,e:2,text:"Undo always works"}];
  m.rels=[{id:uid(),from:ai.id,to:views.id,label:"works with"}];return m}
