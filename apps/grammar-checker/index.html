<title>Grammar Checker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script type="application/json" id="claude-artifacts-manifest">{"permissions":["overlay","shortcuts","menu-bar"]}</script>
<style>
/* Layout: top bar (documents, title, goals, score, file actions); editor column with live underlines; right panel with Review / Rewrite / Write tabs; footer counter + check status. Narrow windows move the panel into a drawer. */
:root{
  --bg:#f6f7f9; --paper:#ffffff; --panel:#fbfbfc; --fg:#17191f; --muted:#6b7280; --faint:#9aa1ad; --line:#e4e7ec; --chip:#eef0f4; --hover:#f1f3f6;
  --accent:#4453d6; --accent-fg:#ffffff; --accent-soft:rgba(68,83,214,.1);
  --c-correctness:#e0464e; --c-clarity:#2f7fe6; --c-engagement:#109a7f; --c-delivery:#8b4fd1; --c-style:#d1830f;
  --del:#c23a40; --ins:#0f7f5f; --shadow:0 8px 30px rgba(20,24,40,.14);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --serif:"Iowan Old Style","Charter","Georgia",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--paper:#181a1f;--panel:#1b1e24;--fg:#eceef2;--muted:#9aa1ad;--faint:#6b7280;--line:#2a2e36;--chip:#252930;--hover:#22262d;--accent:#7d89ff;--accent-fg:#0b0e2a;--accent-soft:rgba(125,137,255,.14);--c-correctness:#ff6b72;--c-clarity:#5aa2ff;--c-engagement:#2fc9a6;--c-delivery:#b886ff;--c-style:#f0a43a;--del:#ff7b80;--ins:#43d3a3;--shadow:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--paper:#181a1f;--panel:#1b1e24;--fg:#eceef2;--muted:#9aa1ad;--faint:#6b7280;--line:#2a2e36;--chip:#252930;--hover:#22262d;--accent:#7d89ff;--accent-fg:#0b0e2a;--accent-soft:rgba(125,137,255,.14);--c-correctness:#ff6b72;--c-clarity:#5aa2ff;--c-engagement:#2fc9a6;--c-delivery:#b886ff;--c-style:#f0a43a;--del:#ff7b80;--ins:#43d3a3;--shadow:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:600 12.5px/1 var(--font);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;background:var(--paper);color:var(--fg);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:5px 8px;font-size:12px}
.ico{width:16px;height:16px;flex:none}
input[type=text],input[type=search],textarea.field,select{font:13px/1.3 var(--font);border:1px solid var(--line);background:var(--paper);color:var(--fg);border-radius:8px;padding:7px 9px;outline:none;min-width:0}
input:focus,textarea.field:focus,select:focus{border-color:var(--accent)}
.kbd{font:600 11px/1 var(--font);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 5px;color:var(--muted);background:var(--paper)}

/* Top bar */
.top{display:flex;align-items:center;gap:6px;height:48px;flex:none;border-bottom:1px solid var(--line);background:var(--bg);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
body.app .top{app-region:drag;-webkit-app-region:drag}
body.app.inset .top{padding-left:max(80px,env(safe-area-inset-left,0px))}
.top > *{app-region:no-drag;-webkit-app-region:no-drag}
.top .sp{flex:1;align-self:stretch;app-region:drag;-webkit-app-region:drag;min-width:4px}
#title{font:600 14px/1.2 var(--font);border:1px solid transparent;background:transparent;padding:5px 7px;border-radius:7px;width:220px;max-width:30vw;color:var(--fg)}
#title:hover{border-color:var(--line)}
#title:focus{border-color:var(--accent);background:var(--paper)}
.score{display:inline-flex;align-items:center;gap:7px}
.score b{font-size:13px;min-width:20px;text-align:right}
.ring{width:22px;height:22px}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;min-width:230px;z-index:40}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left;font-size:13px}
.menu button:hover{background:var(--hover)}
.menu button .k{margin-left:auto;color:var(--faint);font-size:11.5px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu .lbl{font-size:11px;color:var(--faint);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.04em}

/* Main */
.main{flex:1;display:flex;min-height:0;position:relative}
.edcol{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper)}
.scroller{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.paper{position:relative;max-width:760px;margin:0 auto;padding:34px max(28px,env(safe-area-inset-right,0px)) 40vh max(28px,env(safe-area-inset-left,0px))}
.stack{position:relative}
.mirror,#ed{font:16.5px/1.75 var(--font);letter-spacing:0;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;padding:0;margin:0}
body.serif .mirror,body.serif #ed{font-family:var(--serif);font-size:17.5px}
.mirror{color:transparent;min-height:60vh;pointer-events:none}
.mirror mark{color:transparent;background:linear-gradient(var(--mc),var(--mc)) 0 100%/100% 2px no-repeat;border-radius:1px;padding-bottom:1px}
.mirror mark.on{background:linear-gradient(var(--mc),var(--mc)) 0 100%/100% 2px no-repeat,color-mix(in srgb,var(--mc) 16%,transparent)}
.mirror mark.correctness{--mc:var(--c-correctness)} .mirror mark.clarity{--mc:var(--c-clarity)} .mirror mark.engagement{--mc:var(--c-engagement)} .mirror mark.delivery{--mc:var(--c-delivery)} .mirror mark.style{--mc:var(--c-style)}
.mirror mark.rw{--mc:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
body.nolines .mirror mark:not(.on):not(.rw){background:none}
#ed{position:absolute;inset:0;width:100%;height:100%;border:0;outline:none;resize:none;overflow:hidden;background:transparent;color:var(--fg);caret-color:var(--accent)}
#ed::placeholder{color:var(--faint)}
.empty-ed{position:absolute;left:0;right:0;top:64px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
.foot{flex:none;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);height:38px;background:var(--paper);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));font-size:12px;color:var(--muted)}
.foot .st{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#counter{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;padding:4px 6px;border-radius:6px}
#counter:hover{background:var(--hover);color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* Side panel */
.side{width:372px;flex:none;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;background:transparent;padding:12px 6px 10px;font:600 12.5px/1.2 var(--font);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .badge{background:var(--chip);color:var(--fg);border-radius:9px;font-size:11px;padding:1px 6px;min-width:18px}
.pane{flex:1;overflow-y:auto;min-height:0;padding:12px 14px 20px}
.sidehead{display:none}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin:-2px -4px 10px}
.cats button{border:0;background:transparent;border-radius:8px;padding:6px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.cats button:hover{background:var(--hover)}
.cats button.on{background:var(--chip);color:var(--fg)}
.cats button i{display:block;width:70%;height:3px;border-radius:2px;background:var(--cc)}
.cats button b{font-size:13px;color:var(--fg)}
.toneBox{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.toneBox h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center}
.toneBox h4 .btn{margin-left:auto}
.tone{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.tone span{width:110px;flex:none}
.tone .bar{flex:1;height:5px;border-radius:3px;background:var(--chip);overflow:hidden}
.tone .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bulk{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-size:12px;color:var(--muted)}
.bulk .btn{margin-left:auto}
.card{border:1px solid var(--line);background:var(--paper);border-radius:10px;margin-bottom:8px;cursor:pointer;position:relative;overflow:hidden}
.card:hover{border-color:color-mix(in srgb,var(--fg) 22%,var(--line))}
.card .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px}
.card .hd .dot{background:var(--cc)}
.card .hd .t{color:var(--muted);font-size:12px;flex:none}
.card .hd .pv{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.on{cursor:default;box-shadow:0 2px 12px rgba(0,0,0,.06);border-color:color-mix(in srgb,var(--cc) 45%,var(--line))}
.card .bd{padding:0 12px 12px;display:none}
.card.on .bd{display:block}
.card.on .hd .pv{display:none}
.diff{font-size:14px;line-height:1.55;margin:2px 0 8px;overflow-wrap:anywhere}
.diff del{color:var(--del);text-decoration:line-through;text-decoration-thickness:1.5px}
.diff ins{text-decoration:none;font-weight:650;color:var(--ins)}
.diff .ctx{color:var(--muted)}
.expl{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cc-correctness{--cc:var(--c-correctness)} .cc-clarity{--cc:var(--c-clarity)} .cc-engagement{--cc:var(--c-engagement)} .cc-delivery{--cc:var(--c-delivery)} .cc-style{--cc:var(--c-style)} .cc-all{--cc:var(--fg)}
.emptyP{text-align:center;color:var(--muted);padding:40px 12px;font-size:13px}
.emptyP svg{width:52px;height:52px;color:var(--faint);margin-bottom:8px}
.emptyP h3{color:var(--fg);font-size:15px;margin:0 0 4px}
.sec{margin:0 0 14px}
.sec h5{margin:0 0 7px;font-size:11.5px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 10px;font-size:12.5px;cursor:pointer}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.target{display:flex;background:var(--chip);border-radius:8px;padding:2px}
.target button{flex:1;border:0;background:transparent;border-radius:6px;padding:6px 4px;font-size:12px;color:var(--muted);cursor:pointer}
.target button.on{background:var(--paper);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.target button:disabled{opacity:.4;cursor:default}
.tgtprev{font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:6px;align-items:center}
.row input{flex:1}
.rcard{border:1px solid var(--line);background:var(--paper);border-radius:10px;margin-bottom:10px;padding:10px 12px}
.rcard .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.rcard .lab .vs{margin-left:auto;display:flex;gap:2px}
.rcard .lab .vs button{border:1px solid var(--line);background:transparent;border-radius:6px;font-size:11px;padding:2px 7px;cursor:pointer;color:var(--muted)}
.rcard .lab .vs button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.rcard .diff{max-height:280px;overflow:auto;white-space:pre-wrap}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.gen{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:14px;line-height:1.55;min-height:60px;max-height:44vh;overflow:auto;margin:8px 0;overflow-wrap:anywhere}
.ask{display:flex;flex-direction:column;gap:6px}
.ask textarea{min-height:64px;resize:vertical;font-size:13.5px}
.note{font-size:12px;color:var(--muted);margin:6px 0}
.err{color:var(--del)}

/* Drawer (documents) */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.32);z-index:50}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(330px,92vw);background:var(--panel);border-right:1px solid var(--line);z-index:51;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-left:env(safe-area-inset-left,0px)}
.drawer header{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
.drawer header h2{font-size:15px;margin:0;flex:1}
.drawer .search{padding:0 14px 8px}
.drawer .search input{width:100%}
.doclist{flex:1;overflow:auto;padding:0 8px 12px}
.doc{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer}
.doc:hover{background:var(--hover)}
.doc.on{background:var(--chip)}
.doc .m{flex:1;min-width:0}
.doc .m b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .m small{color:var(--muted);font-size:11.5px}
.doc .x{opacity:0;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;padding:4px}
.doc:hover .x,.doc .x:focus-visible{opacity:1}
.doc .x:hover{background:var(--line);color:var(--del)}

/* Modal */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,12,20,.36)}
.dlg{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);width:min(640px,100%);max-height:min(760px,calc(100vh - 32px));display:flex;flex-direction:column;border:1px solid var(--line)}
.dlg header{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
.dlg header h2{margin:0;font-size:18px;flex:1}
.dlg .body{overflow:auto;padding:4px 18px 12px}
.dlg footer{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.grp{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.grp:last-child{border-bottom:0}
.grp > b{font-size:13px;padding-top:6px}
.grp .hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;font-size:13px}
.stats div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.stats div b{color:var(--accent)}
.stabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.stabs button{flex:none;border:0;background:transparent;padding:9px 10px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.stabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.list{border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;margin:8px 0}
.list .li{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}
.list .li:last-child{border-bottom:0}
.list .li span{flex:1;min-width:0;overflow-wrap:anywhere}
.list .li button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:5px}
.list .li button:hover{color:var(--del);background:var(--hover)}
.sk{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:13px}
.sk span:nth-child(even){text-align:right}

/* Popover (narrow windows) */
.pop{position:absolute;z-index:30;width:min(340px,calc(100% - 24px));background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px}
.pop .hd{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}
.pop .hd .dot{background:var(--cc)}

.toast{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:10px;padding:9px 12px;font-size:13px;display:flex;gap:12px;align-items:center;z-index:80;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
.drop{position:fixed;inset:8px;border:2px dashed var(--accent);border-radius:16px;background:color-mix(in srgb,var(--accent) 8%,transparent);z-index:90;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--accent);pointer-events:none}
.fab{display:none}
.mirror mark.syn{--mc:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.mirror mark.speak{--mc:var(--c-engagement);background:color-mix(in srgb,var(--c-engagement) 14%,transparent)}
#counter{white-space:nowrap;flex:none}
.foot .ib{flex:none;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:5px 6px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;font-size:12px}
.foot .ib:hover{background:var(--hover);color:var(--fg)}
.foot .ib.on{color:var(--accent);background:var(--accent-soft)}
.foot .ib.on .ico{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#langSel{flex:none;font-size:12px;padding:4px 6px;border-color:transparent;background:transparent;color:var(--muted);max-width:150px;cursor:pointer}
#langSel:hover{background:var(--hover);color:var(--fg)}
.syns{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.syns .chip{font-size:13px}

/* Citations */
.cform{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.cform label{display:block;font-size:11.5px;color:var(--muted);margin:8px 0 3px}
.cform label:first-child{margin-top:0}
.cform input,.cform select,.cform textarea{width:100%}
.cform textarea{min-height:48px;resize:vertical}
.cform .two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.cform .unsure input,.cform .unsure textarea{border-color:var(--c-style);background:color-mix(in srgb,var(--c-style) 8%,var(--paper))}
.cform .unsure label::after{content:" · check this";color:var(--c-style);font-weight:600}
.cprev{font-size:13px;line-height:1.5;margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--chip);overflow-wrap:anywhere}
.cprev small{display:block;color:var(--muted);margin-top:4px}
.citem{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;line-height:1.5}
.citem .ref{overflow-wrap:anywhere;padding-left:1.6em;text-indent:-1.6em}
.citem .acts{margin-top:8px}
.citem.warn{border-color:color-mix(in srgb,var(--c-style) 50%,var(--line))}
.citem .w{font-size:11.5px;color:var(--c-style);margin-top:4px}

/* Quick fix layer */
.quick{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
.quick .qtop{display:flex;align-items:center;gap:8px;height:46px;flex:none;border-bottom:1px solid var(--line);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
body.app .quick .qtop{app-region:drag;-webkit-app-region:drag}
body.app.inset .quick .qtop{padding-left:max(80px,env(safe-area-inset-left,0px))}
.quick .qtop > *{app-region:no-drag;-webkit-app-region:no-drag}

const STOP=new Set("a an the and or but if then so of to in on at by for with from as is are was were be been being it its this that these those i you he she we they me him her us them my your his our their not no do does did have has had will would can could should may might must there here what which who whom when where why how all any each more most some such than too very just also about into over after before up down out off again once only own same other s t don't i'm it's that's der die das und ist ein eine le la les et est un une el los las y es de que en".split(" "));

function score(list,words){

function toneSummary(){

  if(a==="manual"){const q=$("cQ")?.value.trim()||"";cEdit=q?guessInput(q).c:guessInput("").c;cErr="";renderCite();setTimeout(()=>$("cForm")?.querySelector("textarea,input")?.focus(),0);return;}
  if(a==="cancel"){cEdit=null;cErr="";renderCite();return;}
  if(a==="copyone"&&cEdit){const r=formatRef(cEdit,S.citeStyle);copyRich(toHTML(r),bare(r));return;}
  if(a==="save"&&cEdit){
    if(!cEdit.title.trim()&&!cEdit.authors.trim()){toast("Add at least a title.");$("cForm").querySelector('[data-f="title"]')?.focus();return;}
    const c={...cEdit}; const isNew=c.isNew; delete c.isNew; if(c.ai) c.checked=!isNew||c.checked; doc.cites=doc.cites||[];
    const i=doc.cites.findIndex(x=>x.id===c.id); if(i<0) doc.cites.push(c); else doc.cites[i]=c;
    cEdit=null; scheduleSave(); renderCite(); toast(isNew?"Added to your sources.":"Saved."); return;
  }
  if(a==="copyall"){const {head,refs}=bibBlock();copyRich(`<p><b>${esc(head)}</b></p>`+refs.map(r=>`<p style="padding-left:2em;text-indent:-2em">${toHTML(r)}</p>`).join(""),head+"\n\n"+refs.map(bare).join("\n\n"));return;}
  if(a==="dl"){const {head,refs}=bibBlock();save(fname("txt").replace(/\.txt$/," "+head.toLowerCase()+".txt"),head+"\n\n"+refs.map(bare).join("\n\n")+"\n");return;}
  if(a==="bib"){
    const {head,refs}=bibBlock(); const t=doc.text;
    const block=`## ${head}\n\n`+refs.map(toMD).join("\n\n");
    const re=new RegExp(`(^|\\n)#{1,3} (${CSTYLES.map(x=>x[2]).join("|")}|Bibliography)\\s*\\n`); const m=re.exec(t);
    if(m){const st=m.index+(m[1]?1:0);replaceRange(st,t.length,block);toast(`Updated the ${head} section.`,()=>{ed.focus();document.execCommand("undo");});}
    else{const pre=t.trimEnd().length; const sep=pre?"\n\n":""; replaceRange(pre,t.length,sep+block);toast(`Added ${head} at the end.`,()=>{ed.focus();document.execCommand("undo");});}
    $("scroller").scrollTop=$("scroller").scrollHeight; return;
  }
  const card=b.closest("[data-cid]"); const c=card&&(doc.cites||[]).find(x=>x.id===card.dataset.cid); if(!c) return;
  const x=b.dataset.ci;
  if(x==="copy"){const r=formatRef(c,S.citeStyle);copyRich(toHTML(r),bare(r));}
  if(x==="intext"){const p=ed.selectionEnd, before=doc.text[p-1];const s=toMD(formatInText(c,S.citeStyle));const ins=(before&&!/\s|\(/.test(before)?" ":"")+s;replaceRange(p,ed.selectionStart===p?p:ed.selectionEnd,ins);ed.setSelectionRange(p+ins.length,p+ins.length);toast("Citation inserted.",()=>{ed.focus();document.execCommand("undo");});}
  if(x==="edit"){cEdit={...c,isNew:false};c.checked=true;renderCite();$("pCite").scrollTop=0;}
  if(x==="del"){const i=doc.cites.indexOf(c);doc.cites.splice(i,1);scheduleSave();renderCite();toast("Source deleted.",()=>{doc.cites.splice(i,0,c);scheduleSave();renderCite();});}
});

const wrapMd=(x,m)=>{const a=x.match(/^\s*/)[0],b=x.match(/\s*$/)[0],core=x.trim();return core?a+m+core+m+b:x;};

function htmlToText(html,md=false){

      if(/^(script|style|head|title|meta|link|template)$/.test(tag)) continue;

      const hasBlock=n.querySelector&&n.querySelector("p,h1,h2,h3,h4,h5,h6,ul,ol,table,div,li,blockquote,pre");
      if(!BLOCK.test(tag)&&!hasBlock){buf+=inlineText(n);continue;}

}
const CP1252=new TextDecoder("windows-1252");
function rtfToText(r){
  let out="",i=0,skip=false; const stack=[];
  const SKIP=/^(fonttbl|colortbl|stylesheet|info|pict|object|header|footer|headerl|headerr|headerf|footerl|footerr|footerf|listtable|listoverridetable|rsidtbl|generator|xmlnstbl|themedata|colorschememapping|latentstyles|datastore|filetbl|revtbl|fldinst|bkmkstart|bkmkend)$/;
  const SYM={emdash:"—",endash:"–",lquote:"‘",rquote:"’",ldblquote:"“",rdblquote:"”",bullet:"•",par:"\n",line:"\n",sect:"\n",page:"\n",row:"\n",cell:" | ",tab:"\t"};
  while(i<r.length){
    const c=r[i];
    if(c==="{"){stack.push(skip);i++;continue;}
    if(c==="}"){skip=stack.length?stack.pop():false;i++;continue;}
    if(c==="\\"){
      const n=r[i+1];
      if(n==="\\"||n==="{"||n==="}"){if(!skip)out+=n;i+=2;continue;}
      if(n==="*"){skip=true;i+=2;continue;}
      if(n==="'"){if(!skip)out+=CP1252.decode(new Uint8Array([parseInt(r.substr(i+2,2),16)||32]));i+=4;continue;}
      if(n==="~"){if(!skip)out+=" ";i+=2;continue;}
      if(n==="\n"||n==="\r"){if(!skip)out+="\n";i+=2;continue;}
      const m=/^\\([a-zA-Z]+)(-?\d+)? ?/.exec(r.slice(i,i+40));
      if(!m){i+=2;continue;}
      i+=m[0].length; const w=m[1];
      if(SKIP.test(w)){skip=true;continue;}
      if(skip) continue;
      if(w==="u"){let code=+m[2];if(code<0)code+=65536;out+=String.fromCharCode(code);if(r[i]==="\\"&&r[i+1]==="'")i+=4;else if(r[i]&&!"\\{}".includes(r[i]))i+=1;}
      else if(SYM[w]) out+=SYM[w];
      continue;
    }
    if(c==="\r"||c==="\n"){i++;continue;}
    if(!skip) out+=c; i++;
  }
  return out.split("\n").map(l=>l.trim()).join("\n").replace(/\n{3,}/g,"\n\n").trim();
}
async function odtToText(buf){
  const z=await JSZip.loadAsync(buf); const xml=await z.file("content.xml").async("string");
  const d=new DOMParser().parseFromString(xml,"application/xml"); const out=[];
  const T="urn:oasis:names:tc:opendocument:xmlns:text:1.0";
  const txt=n=>{let s="";for(const c of n.childNodes){if(c.nodeType===3)s+=c.nodeValue;else if(c.localName==="s")s+=" ".repeat(+c.getAttributeNS(T,"c")||1);else if(c.localName==="tab")s+="\t";else if(c.localName==="line-break")s+="\n";else if(c.localName!=="note")s+=txt(c);}return s;};
  const walk=(n,depth)=>{for(const c of n.children){if(c.localName==="h")out.push("#".repeat(+c.getAttributeNS(T,"outline-level")||1)+" "+txt(c).trim());else if(c.localName==="p"){const t=txt(c).trim();if(t)out.push(t);}else if(c.localName==="list"){for(const li of c.children){for(const x of li.children){if(x.localName==="p"||x.localName==="h")out.push("  ".repeat(depth)+"- "+txt(x).trim());else if(x.localName==="list")walk({children:[x]},depth+1);}}}else walk(c,depth);}};

}
async function openFile(f){
  if(!f) return;
  const name=f.name;
  const text=await fileToText(f); if(text==null) return;
  if(!$("quick").hidden){$("qIn").value=text;runQuick();return;}
  newDocument(text,name.replace(/\.[^.]+$/,""));
  toast(`Opened “${name}”.`);
  ed.setSelectionRange(0,0); $("scroller").scrollTop=0;
}
async function fileToText(f){
  const name=f.name, ext=(name.split(".").pop()||"").toLowerCase();
  try{
    let text;
    if(ext==="docx"){if(!window.mammoth)throw new Error("lib");const r=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()},{styleMap:["p[style-name='Quote'] => blockquote:fresh","p[style-name='Intense Quote'] => blockquote:fresh","p[style-name='Title'] => h1:fresh","p[style-name='Subtitle'] => h2:fresh"]});text=htmlToText(r.value,true);}
    else if(ext==="odt"){if(!window.JSZip)throw new Error("lib");text=await odtToText(await f.arrayBuffer());}
    else if(ext==="rtf") text=rtfToText(await f.text());
    else if(ext==="html"||ext==="htm") text=htmlToText(await f.text());
    else if(ext==="doc"||ext==="pdf"||ext==="pages"){toast(`.${ext} files can't be opened here. Save it as .docx or .txt first.`);return null;}
    else text=await f.text();
    return text.replace(/\r\n?/g,"\n").replace(/\u00a0/g," ");
  }catch(e){toast(e?.message==="lib"?"The file reader didn't load. Check your connection and reopen the app.":`Couldn't read “${name}”. Is it a valid .${ext} file?`);return null;}
}

ed.addEventListener("paste",e=>{

const xmlEsc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,"");
function runs(s){
  const out=[]; const re=/(\*\*[^*\n]+\*\*|__[^_\n]+__|\*[^*\n]+\*|_[^_\n]+_)/g; let last=0,m;
  const r=(t,b,i)=>`<w:r>${b||i?`<w:rPr>${b?"<w:b/>":""}${i?"<w:i/>":""}</w:rPr>`:""}<w:t xml:space="preserve">${xmlEsc(t)}</w:t></w:r>`;

  if(last<s.length) out.push(r(s.slice(last)));
  return out.join("");
}

}
async function exportAs(kind){

  if(kind==="md") save(fname("md"),doc.text);

function exportReport(){
  if(!window.jspdf){toast("The PDF maker didn't load. Check your connection and reopen the app.");return;}
  const st=stats(doc.text), sc=score(cached,st.words), counts={}; for(const s of cached) counts[s.cat]=(counts[s.cat]||0)+1;
  const pdf=new jspdf.jsPDF({unit:"pt",format:"letter"}); let y=64; const L=60;
  const line=(t,size=11,bold=false,gap=6)=>{pdf.setFont("helvetica",bold?"bold":"normal");pdf.setFontSize(size);for(const l of pdf.splitTextToSize(t.replace(/[^\x00-\xff–—‘’“”…]/g,"?"),492)){if(y>740){pdf.addPage();y=64;}pdf.text(l,L,y);y+=size*1.35;}y+=gap;};
  line("Writing performance report",20,true,4);
  line(`${docTitle()} · ${new Date().toLocaleString()}`,10,false,14);
  line(`Overall score: ${sc==null?"n/a":sc+" / 100"}`,14,true,10);
  line("Word count",13,true,2);
  line(`Characters ${st.chars}   Words ${st.words}   Sentences ${st.sentences}   Paragraphs ${st.paragraphs}`);
  line(`Reading time ${fmtT(st.read)}   Speaking time ${fmtT(st.speak)}`,11,false,12);
  line("Readability",13,true,2);
  line(`Word length ${st.wordLen.toFixed(1)}   Sentence length ${st.sentLen.toFixed(1)}   Flesch reading ease ${st.fre}   Grade level ${st.grade.toFixed(1)}`,11,false,12);
  line("Vocabulary",13,true,2);
  line(`Unique words ${Math.round(st.uniq*100)}%   Rare or long words ${Math.round(st.rare*100)}%`,11,false,12);
  const tones=toneSummary(); if(tones.length){line("Tone",13,true,2);line(tones.map(t=>`${t.name} ${Math.round(t.score*100)}%`).join("   "),11,false,12);}
  line("Open suggestions",13,true,2);
  line(Object.keys(CATS).map(c=>`${CATS[c]} ${counts[c]||0}`).join("   "),11,false,8);
  for(const s of cached.slice(0,80)) line(`- [${CATS[s.cat]}] ${s.title}: "${s.original.slice(0,80)}" -> "${s.replacement.slice(0,80)}"`,9.5,false,1);
  save(fname("pdf").replace(/\.pdf$/," report.pdf"),pdf.output("arraybuffer"));
}

  if(a==="new") newDocument();
  else if(a==="open") $("file").click();
  else if(a==="sample") {if(doc.text.trim())newDocument(SAMPLE,"Sample email");else{ed.focus();ed.select();document.execCommand("insertText",false,SAMPLE);if(!doc.title){doc.title="Sample email";$("title").value=doc.title;}}scheduleCheck(100);}
  else if(["docx","md","txt","report"].includes(a)) exportAs(a);
  else if(a==="copy") copyText(doc.text);
  else if(a==="quick") {const x=ed.selectionStart,y=ed.selectionEnd;openQuick(y>x?doc.text.slice(x,y):undefined);}
  else if(a==="everywhere") openEverywhere();
  else if(a==="goals") openGoals();
  else if(a==="settings") openSettings("general");
  else if(a==="keys") openKeys();
}

  if(mod&&e.shiftKey&&e.code==="KeyK"){e.preventDefault();const a=ed.selectionStart,b=ed.selectionEnd;openQuick(b>a?doc.text.slice(a,b):undefined);return;}

  if(mod&&e.shiftKey&&(e.code==="KeyD")){e.preventDefault();$("drawer").hidden?openDrawer():closeDrawer();return;}
  if(mod&&e.shiftKey&&(e.code==="KeyI")){e.preventDefault();openPerf();return;}

// snippets: trigger + Tab
ed.addEventListener("keydown",e=>{
  if(e.key!=="Tab"||e.shiftKey||e.metaKey||e.ctrlKey||e.altKey||!snippets.length) return;

let dictation=null, tts=null, dictNoLang=false;
function dictBcp(){const b=langOf(doc.goals.variant).bcp;return b&&!dictNoLang?b:"";}
function toggleDict(){
  if(!dictation) return;
  if(dictation.active()){dictation.stop().catch(()=>{});return;}
  const p=ed.selectionEnd; dictAt={start:p,end:p,dead:false};
  const lang=dictBcp();
  dictation.start(lang?{language:lang}:undefined).catch(e=>{
    const c=e?.code;
    if(c==="not_granted"){toast("Microphone use was declined. You can turn dictation on in this app's Permissions menu.");dictation=null;applyMedia();}
    else if(c==="unavailable"){if(lang){dictNoLang=true;toast(`Dictation isn't available in ${L10(langOf(doc.goals.variant).label)}. Press Dictate again to use your default language.`);}else{toast("Dictation isn't available here.");dictation=null;applyMedia();}}

  });
}
function insertDictated(text){
  text=(text||"").trim(); if(!text) return;
  let p=dictAt&&!dictAt.dead?dictAt.start:ed.selectionEnd;
  const before=doc.text.slice(0,p), after=doc.text[p];
  const startOfSentence=!before.trim()||/[.!?]\s*$/.test(before)||/\n\s*$/.test(before);
  if(startOfSentence&&/^\p{Ll}/u.test(text)) text=text[0].toUpperCase()+text.slice(1);
  const ins=(before&&!/\s$/.test(before)&&!/^[,.;:!?)]/.test(text)?" ":"")+text+(after&&!/\s/.test(after)&&!/^[,.;:!?)]/.test(after)?" ":"");
  replaceRange(p,p,ins);
  const np=p+ins.length-(after&&!/\s/.test(after)?1:0); dictAt={start:np,end:np,dead:false}; ed.setSelectionRange(np,np);
}
function setupDictation(){
  if(!dictation) return;
  dictation.onPartial(({text})=>{if(text)$("status").textContent="Listening: "+text;});
  dictation.onFinal(({text})=>{insertDictated(text);status();});
  dictation.onState(({state,reason})=>{
    const on=state!=="idle"; $("micBtn").classList.toggle("on",on); $("micLab").textContent=on?(state==="finishing"?"Finishing…":"Stop"):"Dictate";
    if(on&&state==="listening"){$("status").textContent="Listening… speak now. Press Stop when you're done.";$("stDot").style.background="var(--c-correctness)";}
    if(!on){status();if(reason==="not_granted"){dictation=null;applyMedia();}else if(reason==="time_limit")toast("Dictation stopped after 60 minutes. Press Dictate to continue.");else if(reason==="upstream_error")toast("Dictation stopped: the microphone or speech service failed.");}
  });
}
/* ---------- read aloud ---------- */
let reading=false, readLines=[];
function toggleRead(){
  if(!tts) return;
  if(reading){tts.stop().catch(()=>{});return;}
  const t=doc.text; let a=ed.selectionStart,b=ed.selectionEnd;
  if(b<=a){a=t.lastIndexOf("\n",a-1)+1; if(a>=t.trimEnd().length) a=0; b=t.length;}
  readLines=[]; let pos=a;
  for(const para of t.slice(a,b).split("\n")){
    const ps=pos; pos+=para.length+1;
    if(!/[\p{L}\p{N}]/u.test(para)) continue;
    let s=0; while(s<para.length){let e=Math.min(para.length,s+1800);if(e<para.length){const cut=Math.max(para.lastIndexOf(". ",e),para.lastIndexOf("? ",e),para.lastIndexOf("! ",e));if(cut>s+200)e=cut+2;}const seg=para.slice(s,e);if(seg.trim())readLines.push({start:ps+s,end:ps+e,text:seg.replace(/^#{1,6}\s+|^\s*[-*]\s+|^>\s?/,"")});s=e;}
    if(readLines.length>=100) break;
  }
  if(!readLines.length){toast("There's no text to read. Put the cursor where reading should start.");return;}
  const lang=langOf(doc.goals.variant).bcp;
  tts.speak(readLines.slice(0,100).map((l,i)=>({text:l.text,id:String(i)})),lang?{language:lang}:{}).catch(e=>{
    const c=e?.code;
    if(c==="not_granted"||c==="unavailable"){tts=null;applyMedia();toast("Reading aloud isn't available here.");}
    else if(c==="rate_limited") toast("You've used reading aloud a lot just now. Try again later.");
    else if(c==="busy") toast("The microphone is in use. Stop dictation first.");
    else if(c==="no_gesture") toast("Press Read aloud again to start.");
  });
}
function setupTTS(){
  if(!tts) return;
  tts.onLine(({id})=>{const l=readLines[+id];speakR=l&&doc.text.slice(l.start,l.end).includes(l.text.slice(0,24))?{start:l.start,end:l.end,dead:false}:null;renderMirror();const m=mirror.querySelector('mark[data-id="speak"]');if(m){const sr=$("scroller").getBoundingClientRect(),mr=m.getBoundingClientRect();if(mr.top<sr.top+30||mr.bottom>sr.bottom-30)$("scroller").scrollBy({top:mr.top-sr.top-sr.height/3,behavior:"smooth"});}});
  tts.onState(({state,reason})=>{
    reading=state!=="idle"; $("ttsBtn").classList.toggle("on",reading); $("ttsLab").textContent=reading?"Stop reading":"Read aloud";
    if(!reading){speakR=null;renderMirror();if(reason==="not_granted"||reason==="unavailable"){tts=null;applyMedia();}else if(reason==="rate_limited")toast("You've used reading aloud a lot just now. Try again later.");}

  const float=store.get("float",false)&&perms.overlay==="granted";
  $("deskMenu").innerHTML=`<hr>${float?`<button data-d="normal">Normal window</button><button data-d="hide">Copy all and hide<span class="k">${keyLabel(S.hotkey)} shows it</span></button>`:`<button data-d="float">Float on top</button>`}`;
}
const PSTATE={granted:["On","ok"],prompt:["Not set up yet",""],denied:["Turned off","bad"],unavailable:["Not available","bad"]};
async function openEverywhere(){
  if(!$("quick").hidden) $("quick").hidden=true;
  const app=!!desktop?.tray;
  let st="unavailable"; if(!app&&desktop?.install) st=await desktop.install.state().catch(()=>"unavailable");
  if(app){try{perms=await desktop.permissions.state();}catch{}}
  const row=(k,l,d)=>{const [t,c]=PSTATE[perms[k]||"unavailable"];return `<div class="permrow"><span><b>${l}</b><br><span class="note" style="margin:0">${d}</span></span><b class="${c}">${t}</b></div>`;};
  const need=app&&(perms.shortcuts==="prompt"||perms["menu-bar"]==="prompt"), denied=app&&(perms.shortcuts==="denied"||perms["menu-bar"]==="denied"||perms.overlay==="denied");
  $("dlg").innerHTML=`<header><h2>Use in any app</h2><button class="btn ghost sm" data-x>✕</button></header><div class="body">
  <p class="note" style="margin-top:0">Fix text from your email, chat, browser or any other app without switching documents.</p>
  <ol class="steps"><li>Select text in any app and press <span class="kbd">${MOD}C</span>.</li><li>Press <span class="kbd">${keyLabel(S.hotkey)}</span>${app?" or pick Quick fix from the menu bar icon":" (installed app)"}. The Quick fix window opens.</li><li>Press <span class="kbd">${MOD}V</span>. Your text is fixed right away. Pick Clearer, Shorter, Formal, Paraphrase or Translate if you want more.</li><li>Press <span class="kbd">${MOD}↵</span> to copy the result${app?" and hide the window":""}, then <span class="kbd">${MOD}V</span> in your app.</li></ol>
  ${app?`<div class="sec" style="margin-top:14px"><h5>Permissions</h5>${row("shortcuts","Global shortcut","Opens Quick fix from any app.")}${row("menu-bar","Menu bar icon","Quick fix and your documents one click away.")}${row("overlay","Float on top (optional)","Keeps the window above other apps. The window reloads once when you switch.")}</div>
  <div class="grp"><b>Shortcut</b><div><select id="hkSel">${HOTKEYS.map(h=>`<option value="${h}"${S.hotkey===h?" selected":""}>${keyLabel(h)}</option>`).join("")}</select><div class="hint">If a shortcut does nothing, another app may already use it. Pick another.</div></div></div>`
  :st==="available"?`<p class="note">This needs the installed app: it can listen for a shortcut and sit in your menu bar. Install it, then open this dialog again from the app.</p>`
  :`<p class="note">The shortcut and menu bar icon work in the installed app. Open this page in the Claude desktop app and choose Install as app. Here you can still use the Quick fix panel: paste, fix, copy.</p>`}
  </div><footer>${app?`${denied?'<button class="btn" data-e="manage">Open permissions</button>':""}<button class="btn" data-e="float">${store.get("float",false)&&perms.overlay==="granted"?"Stop floating":"Float on top"}</button>${need?'<button class="btn pri" data-e="on">Turn on</button>':'<button class="btn pri" data-e="try">Try Quick fix</button>'}`:`<button class="btn" data-e="try">Open Quick fix panel</button>${st==="available"?'<button class="btn pri" data-e="install">Install as app</button>':'<button class="btn pri" data-x>Done</button>'}`}</footer>`;
  showModal();
  $("dlg").onchange=async e=>{if(e.target.id==="hkSel"){S.hotkey=e.target.value;store.set("hotkey",S.hotkey);await setupDesk();if(regKey===S.hotkey)toast(`Quick fix is now ${keyLabel(S.hotkey)}.`);openEverywhere();}};
  $("dlg").onclick=async e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.hasAttribute("data-x")){hideModal();return;}
    const a=b.dataset.e;
    if(a==="install"){const r=await desktop.install.request().catch(()=>"failed");if(r==="installed")hideModal();else if(r==="failed"||r==="unavailable")toast("Couldn't install the app here.");return;}
    if(a==="try"){hideModal();openQuick();return;}
    if(a==="manage"){await desktop.permissions.manage().catch(()=>{});try{perms=await desktop.permissions.state();}catch{}await setupDesk();openEverywhere();return;}
    if(a==="on"){try{perms=await desktop.permissions.request(["shortcuts","menu-bar"]);}catch{toast("Click Turn on again while the window is in front.");}await setupDesk();openEverywhere();if(regKey)toast(`Ready. Press ${keyLabel(S.hotkey)} in any app.`);return;}
    if(a==="float"){if(store.get("float",false)&&perms.overlay==="granted"){store.set("float",false);applyWindow();setupDesk();hideModal();return;}try{perms=await desktop.permissions.request(["overlay"]);}catch{}if(perms.overlay==="granted"){store.set("float",true);applyWindow();setupDesk();hideModal();}else{toast("Floating needs the overlay permission.");openEverywhere();}return;}
  };
}
$("deskMenu").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-d]"); if(!b) return; $("fileMenu").hidden=true;
  if(b.dataset.d==="install"){desktop.install.request().catch(()=>{});return;}
  if(b.dataset.d==="float"){try{perms=await desktop.permissions.request(["overlay"]);}catch{}if(perms.overlay==="granted"){store.set("float",true);applyWindow();}else toast("Floating needs the overlay permission.");setupDesk();}
  if(b.dataset.d==="normal"){store.set("float",false);applyWindow();setupDesk();}
  if(b.dataset.d==="hide"){await copyText(doc.text);desktop.window.hide().catch(()=>{});}
});

/* ---------- boot ---------- */
(function boot(){
  const cur=store.get("current",null);
  if(!(cur&&loadDoc(cur))&&!(index[0]&&loadDoc(index[0].id))){doc=newDocObj();openDocObj(doc);}
  setTab("review"); status();
})();
window.addEventListener("resize",()=>{if(!narrow())closeSide();hidePop();});
window.addEventListener("beforeunload",()=>saveDoc());
document.addEventListener("visibilitychange",()=>{if(document.hidden)saveDoc();});
(async()=>{
  const use=window.claude?.use?n=>window.claude.use(n).catch(()=>null):async()=>null;
  [sample,downloads,desktop,tts,dictation]=await Promise.all([use("sample"),use("downloads"),use("desktop"),use("tts"),use("dictation")]);
  setupTTS(); setupDictation(); applyMedia();
  applyAI(); applyDL(); render();
  if(sample&&aiOK) scheduleCheck(400);
  if(!desktop) return;
  if(!desktop.tray){
    const st=await desktop.install.state().catch(()=>"unavailable");
    if(st==="available") $("deskMenu").innerHTML=`<hr><button data-d="install">Install as app<span class="k">Fix text in any app</span></button>`;
    return;
  }
  document.body.classList.add("app");
  dockIconArt().then(u=>desktop.app.dock.setIcon(u)).catch(()=>{});
  try{perms=await desktop.permissions.state();}catch{}
  applyWindow(); setupDesk();
})();
</script>
<script>
/*INSTALL_PROMPT*/
/* When this artifact is open in Claude Desktop but not installed as an app yet, invite the person
   to install it. Shows once per session; the install itself is Claude's own dialog, started from
   the person's click (install.request() needs a click). Silent in browsers, on mobile and inside the
   installed app. */
(async()=>{
  if(!window.claude||!claude.use)return;
  try{if(sessionStorage.getItem("appstore.installAsked"))return}catch{}
  const d=await claude.use("desktop").catch(()=>null);
  if(!d||d.fs||!d.install)return;                       // d.fs exists only inside the installed app
  const st=await d.install.state().catch(()=>"unavailable");
  if(st!=="available")return;
  await new Promise(r=>setTimeout(r,900));
  if(document.querySelector(".aspi"))return;
  const zh=window.__ZH??/^zh/i.test(navigator.language||"");
  const T=(en,c)=>zh?c:en;
  const name=(document.title||"").trim()||T("this app","这个 app");
  const icon=typeof DOCK_SVG==="string"?DOCK_SVG:(typeof ICON_SVG==="object"&&ICON_SVG.store)||"";
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const st2=document.createElement("style");
  st2.textContent=`.aspi{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:rgba(20,20,19,.42);padding:16px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.aspi .b{--bg:#FAF9F5;--fg:#141413;--mu:#6B6A64;--pill:#EDE6DA;--ac:#B9532F;--on:#fff;background:var(--bg);color:var(--fg);border-radius:18px;max-width:380px;width:100%;padding:24px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
@media (prefers-color-scheme:dark){.aspi .b{--bg:#262624;--fg:#FAF9F5;--mu:#A6A39A;--pill:#3A3632;--ac:#E08A6A;--on:#1F1E1D}}
.aspi .ic{width:72px;height:72px}.aspi .ic svg{width:72px;height:72px;display:block}
.aspi h3{margin:2px 0 0;font-size:18px;font-weight:700;line-height:1.25}
.aspi p{margin:0;color:var(--mu)}
.aspi .row{display:flex;flex-direction:column;gap:8px;align-self:stretch;margin-top:6px}
.aspi button{font-family:inherit;font-weight:600;font-size:15px;line-height:1;border:0;border-radius:999px;padding:12px 16px;cursor:pointer}
.aspi .y{background:var(--ac);color:var(--on)}.aspi .n{background:var(--pill);color:var(--fg)}`;
  const m=document.createElement("div");m.className="aspi";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("data-no-i18n","");
  m.innerHTML=`<div class="b"><div class="ic">${icon}</div>
    <h3>${esc(T(`Install ${name} as an app?`,`把「${name}」安装为 app？`))}</h3>
    <p>${esc(T("It gets its own window and Dock icon, opens like any other app, and keeps working on your Claude plan.","装好后有自己的窗口和 Dock 图标，像普通 app 一样打开，继续用你的 Claude 套餐。"))}</p>
    <div class="row"><button class="y">${esc(T("Install","安装"))}</button><button class="n">${esc(T("Not now","以后再说"))}</button></div></div>`;
  const close=()=>{m.remove();st2.remove();try{sessionStorage.setItem("appstore.installAsked","1")}catch{}};
  m.addEventListener("click",async e=>{
    if(e.target===m||e.target.closest(".n"))return close();
    if(e.target.closest(".y")){const r=await d.install.request().catch(()=>"failed");close();
      if(r==="failed"||r==="unavailable"){const n=document.createElement("div");n.textContent=T("Couldn't install. Use Install as app in the artifact's menu.","没装上。可以在工件菜单里选“安装为 app”。");n.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141413;color:#fff;padding:10px 14px;border-radius:10px;z-index:2147483000;font:13px system-ui";document.body.appendChild(n);setTimeout(()=>n.remove(),5000)}}
  });
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"&&m.isConnected){close();document.removeEventListener("keydown",k)}});
  document.head?document.head.appendChild(st2):document.body.appendChild(st2);document.body.appendChild(m);
  m.querySelector(".y").focus();
})();
/*END_INSTALL_PROMPT*/
</script>
