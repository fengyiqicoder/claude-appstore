<title>Grammar Checker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script type="application/json" id="claude-artifacts-manifest">{"permissions":["overlay","shortcuts"]}</script>
<style>
/* Layout: top bar (documents, title, goals, score, file actions); editor column with live underlines; right panel with Review / Rewrite / Write tabs; footer counter + check status. Narrow windows move the panel into a drawer. */
:root{
  --bg:#f6f7f9; --paper:#ffffff; --panel:#fbfbfc; --fg:#17191f; --muted:#6b7280; --faint:#9aa1ad; --line:#e4e7ec; --chip:#eef0f4; --hover:#f1f3f6;
  --accent:#4453d6; --accent-fg:#ffffff; --accent-soft:rgba(68,83,214,.1);
  --c-correctness:#e0464e; --c-clarity:#2f7fe6; --c-engagement:#109a7f; --c-delivery:#8b4fd1; --c-style:#d1830f;
  --del:#c23a40; --ins:#0f7f5f; --shadow:0 8px 30px rgba(20,24,40,.14);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --serif:"Iowan Old Style","Charter","Georgia",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--paper:#181a1f;--panel:#1b1e24;--fg:#eceef2;--muted:#9aa1ad;--faint:#6b7280;--line:#2a2e36;--chip:#252930;--hover:#22262d;--accent:#7d89ff;--accent-fg:#0b0e2a;--accent-soft:rgba(125,137,255,.14);--c-correctness:#ff6b72;--c-clarity:#5aa2ff;--c-engagement:#2fc9a6;--c-delivery:#b886ff;--c-style:#f0a43a;--del:#ff7b80;--ins:#43d3a3;--shadow:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--paper:#181a1f;--panel:#1b1e24;--fg:#eceef2;--muted:#9aa1ad;--faint:#6b7280;--line:#2a2e36;--chip:#252930;--hover:#22262d;--accent:#7d89ff;--accent-fg:#0b0e2a;--accent-soft:rgba(125,137,255,.14);--c-correctness:#ff6b72;--c-clarity:#5aa2ff;--c-engagement:#2fc9a6;--c-delivery:#b886ff;--c-style:#f0a43a;--del:#ff7b80;--ins:#43d3a3;--shadow:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:600 12.5px/1 var(--font);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;background:var(--paper);color:var(--fg);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:5px 8px;font-size:12px}
.ico{width:16px;height:16px;flex:none}
input[type=text],input[type=search],textarea.field,select{font:13px/1.3 var(--font);border:1px solid var(--line);background:var(--paper);color:var(--fg);border-radius:8px;padding:7px 9px;outline:none;min-width:0}
input:focus,textarea.field:focus,select:focus{border-color:var(--accent)}
.kbd{font:600 11px/1 var(--font);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 5px;color:var(--muted);background:var(--paper)}

/* Top bar */
.top{display:flex;align-items:center;gap:6px;height:48px;flex:none;border-bottom:1px solid var(--line);background:var(--bg);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
body.app .top{app-region:drag;-webkit-app-region:drag}
body.app.inset .top{padding-left:max(80px,env(safe-area-inset-left,0px))}
.top > *{app-region:no-drag;-webkit-app-region:no-drag}
.top .sp{flex:1;align-self:stretch;app-region:drag;-webkit-app-region:drag;min-width:4px}
#title{font:600 14px/1.2 var(--font);border:1px solid transparent;background:transparent;padding:5px 7px;border-radius:7px;width:220px;max-width:30vw;color:var(--fg)}
#title:hover{border-color:var(--line)}
#title:focus{border-color:var(--accent);background:var(--paper)}
.score{display:inline-flex;align-items:center;gap:7px}
.score b{font-size:13px;min-width:20px;text-align:right}
.ring{width:22px;height:22px}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;min-width:230px;z-index:40}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left;font-size:13px}
.menu button:hover{background:var(--hover)}
.menu button .k{margin-left:auto;color:var(--faint);font-size:11.5px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu .lbl{font-size:11px;color:var(--faint);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.04em}

/* Main */
.main{flex:1;display:flex;min-height:0;position:relative}
.edcol{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper)}
.scroller{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.paper{position:relative;max-width:760px;margin:0 auto;padding:34px max(28px,env(safe-area-inset-right,0px)) 40vh max(28px,env(safe-area-inset-left,0px))}
.stack{position:relative}
.mirror,#ed{font:16.5px/1.75 var(--font);letter-spacing:0;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;padding:0;margin:0}
body.serif .mirror,body.serif #ed{font-family:var(--serif);font-size:17.5px}
.mirror{color:transparent;min-height:60vh;pointer-events:none}
.mirror mark{color:transparent;background:linear-gradient(var(--mc),var(--mc)) 0 100%/100% 2px no-repeat;border-radius:1px;padding-bottom:1px}
.mirror mark.on{background:linear-gradient(var(--mc),var(--mc)) 0 100%/100% 2px no-repeat,color-mix(in srgb,var(--mc) 16%,transparent)}
.mirror mark.correctness{--mc:var(--c-correctness)} .mirror mark.clarity{--mc:var(--c-clarity)} .mirror mark.engagement{--mc:var(--c-engagement)} .mirror mark.delivery{--mc:var(--c-delivery)} .mirror mark.style{--mc:var(--c-style)}
.mirror mark.rw{--mc:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
body.nolines .mirror mark:not(.on):not(.rw){background:none}
#ed{position:absolute;inset:0;width:100%;height:100%;border:0;outline:none;resize:none;overflow:hidden;background:transparent;color:var(--fg);caret-color:var(--accent)}
#ed::placeholder{color:var(--faint)}
.empty-ed{position:absolute;left:0;right:0;top:64px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
.foot{flex:none;display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);height:38px;background:var(--paper);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));font-size:12px;color:var(--muted)}
.foot .st{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#counter{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;padding:4px 6px;border-radius:6px}
#counter:hover{background:var(--hover);color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* Side panel */
.side{width:372px;flex:none;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;background:transparent;padding:12px 6px 10px;font:600 12.5px/1.2 var(--font);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .badge{background:var(--chip);color:var(--fg);border-radius:9px;font-size:11px;padding:1px 6px;min-width:18px}
.pane{flex:1;overflow-y:auto;min-height:0;padding:12px 14px 20px}
.sidehead{display:none}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin:-2px -4px 10px}
.cats button{border:0;background:transparent;border-radius:8px;padding:6px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.cats button:hover{background:var(--hover)}
.cats button.on{background:var(--chip);color:var(--fg)}
.cats button i{display:block;width:70%;height:3px;border-radius:2px;background:var(--cc)}
.cats button b{font-size:13px;color:var(--fg)}
.toneBox{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.toneBox h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center}
.toneBox h4 .btn{margin-left:auto}
.tone{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.tone span{width:110px;flex:none}
.tone .bar{flex:1;height:5px;border-radius:3px;background:var(--chip);overflow:hidden}
.tone .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bulk{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-size:12px;color:var(--muted)}
.bulk .btn{margin-left:auto}
.card{border:1px solid var(--line);background:var(--paper);border-radius:10px;margin-bottom:8px;cursor:pointer;position:relative;overflow:hidden}
.card:hover{border-color:color-mix(in srgb,var(--fg) 22%,var(--line))}
.card .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px}
.card .hd .dot{background:var(--cc)}
.card .hd .t{color:var(--muted);font-size:12px;flex:none}
.card .hd .pv{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.on{cursor:default;box-shadow:0 2px 12px rgba(0,0,0,.06);border-color:color-mix(in srgb,var(--cc) 45%,var(--line))}
.card .bd{padding:0 12px 12px;display:none}
.card.on .bd{display:block}
.card.on .hd .pv{display:none}
.diff{font-size:14px;line-height:1.55;margin:2px 0 8px;overflow-wrap:anywhere}
.diff del{color:var(--del);text-decoration:line-through;text-decoration-thickness:1.5px}
.diff ins{text-decoration:none;font-weight:650;color:var(--ins)}
.diff .ctx{color:var(--muted)}
.expl{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cc-correctness{--cc:var(--c-correctness)} .cc-clarity{--cc:var(--c-clarity)} .cc-engagement{--cc:var(--c-engagement)} .cc-delivery{--cc:var(--c-delivery)} .cc-style{--cc:var(--c-style)} .cc-all{--cc:var(--fg)}
.emptyP{text-align:center;color:var(--muted);padding:40px 12px;font-size:13px}
.emptyP svg{width:52px;height:52px;color:var(--faint);margin-bottom:8px}
.emptyP h3{color:var(--fg);font-size:15px;margin:0 0 4px}
.sec{margin:0 0 14px}
.sec h5{margin:0 0 7px;font-size:11.5px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 10px;font-size:12.5px;cursor:pointer}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.target{display:flex;background:var(--chip);border-radius:8px;padding:2px}
.target button{flex:1;border:0;background:transparent;border-radius:6px;padding:6px 4px;font-size:12px;color:var(--muted);cursor:pointer}
.target button.on{background:var(--paper);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.target button:disabled{opacity:.4;cursor:default}
.tgtprev{font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:6px;align-items:center}
.row input{flex:1}
.rcard{border:1px solid var(--line);background:var(--paper);border-radius:10px;margin-bottom:10px;padding:10px 12px}
.rcard .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.rcard .lab .vs{margin-left:auto;display:flex;gap:2px}
.rcard .lab .vs button{border:1px solid var(--line);background:transparent;border-radius:6px;font-size:11px;padding:2px 7px;cursor:pointer;color:var(--muted)}
.rcard .lab .vs button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.rcard .diff{max-height:280px;overflow:auto;white-space:pre-wrap}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.gen{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:14px;line-height:1.55;min-height:60px;max-height:44vh;overflow:auto;margin:8px 0;overflow-wrap:anywhere}
.ask{display:flex;flex-direction:column;gap:6px}
.ask textarea{min-height:64px;resize:vertical;font-size:13.5px}
.note{font-size:12px;color:var(--muted);margin:6px 0}
.err{color:var(--del)}

/* Drawer (documents) */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.32);z-index:50}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(330px,92vw);background:var(--panel);border-right:1px solid var(--line);z-index:51;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-left:env(safe-area-inset-left,0px)}
.drawer header{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
.drawer header h2{font-size:15px;margin:0;flex:1}
.drawer .search{padding:0 14px 8px}
.drawer .search input{width:100%}
.doclist{flex:1;overflow:auto;padding:0 8px 12px}
.doc{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer}
.doc:hover{background:var(--hover)}
.doc.on{background:var(--chip)}
.doc .m{flex:1;min-width:0}
.doc .m b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .m small{color:var(--muted);font-size:11.5px}
.doc .x{opacity:0;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;padding:4px}
.doc:hover .x,.doc .x:focus-visible{opacity:1}
.doc .x:hover{background:var(--line);color:var(--del)}

/* Modal */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,12,20,.36)}
.dlg{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);width:min(640px,100%);max-height:min(760px,calc(100vh - 32px));display:flex;flex-direction:column;border:1px solid var(--line)}
.dlg header{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
.dlg header h2{margin:0;font-size:18px;flex:1}
.dlg .body{overflow:auto;padding:4px 18px 12px}
.dlg footer{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.grp{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.grp:last-child{border-bottom:0}
.grp > b{font-size:13px;padding-top:6px}
.grp .hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;font-size:13px}
.stats div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.stats div b{color:var(--accent)}
.stabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.stabs button{flex:none;border:0;background:transparent;padding:9px 10px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.stabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.list{border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;margin:8px 0}
.list .li{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}
.list .li:last-child{border-bottom:0}
.list .li span{flex:1;min-width:0;overflow-wrap:anywhere}
.list .li button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:5px}
.list .li button:hover{color:var(--del);background:var(--hover)}
.sk{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:13px}
.sk span:nth-child(even){text-align:right}

/* Popover (narrow windows) */
.pop{position:absolute;z-index:30;width:min(340px,calc(100% - 24px));background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px}
.pop .hd{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}
.pop .hd .dot{background:var(--cc)}

.toast{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:10px;padding:9px 12px;font-size:13px;display:flex;gap:12px;align-items:center;z-index:80;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
.drop{position:fixed;inset:8px;border:2px dashed var(--accent);border-radius:16px;background:color-mix(in srgb,var(--accent) 8%,transparent);z-index:90;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--accent);pointer-events:none}
.fab{display:none}

@media (max-width:980px){
  .side{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);z-index:55;box-shadow:var(--shadow);transform:translateX(105%);transition:transform .18s ease;padding-right:env(safe-area-inset-right,0px)}
  body.sideopen .side{transform:none}
  .sidehead{display:flex;align-items:center;justify-content:flex-end;padding:6px 8px 0}
  .fab{display:inline-flex}
  #title{width:150px}
}
@media (max-width:620px){
  .hide-s{display:none!important}
  .paper{padding-top:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mirror,#ed{font-size:16px}
  #title{width:auto;flex:1;max-width:none;min-width:60px}
  .top .sp{flex:0}
  .grp{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr}
}
</style>

<div class="top">
  <button class="btn ghost" id="docsBtn" title="Documents (⌘⇧D)" aria-label="Documents"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 4h11M2.5 8h11M2.5 12h7"/></svg></button>
  <input id="title" type="text" placeholder="Untitled document" aria-label="Document title" spellcheck="false">
  <span class="sp"></span>
  <button class="btn hide-s" id="goalsBtn" title="Set goals"><svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="2.5"/></svg>Goals</button>
  <button class="btn" id="scoreBtn" title="Performance: score, readability, word count"><span class="score"><svg class="ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="var(--chip)" stroke-width="3"/><circle id="ringArc" cx="12" cy="12" r="9.5" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 60" transform="rotate(-90 12 12)"/></svg><b id="scoreNum">–</b><span class="hide-s">Overall score</span></span></button>
  <div class="menuwrap">
    <button class="btn ghost" id="fileBtn" title="Open, export, settings" aria-label="File menu" aria-haspopup="menu"><svg class="ico" viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg></button>
    <div class="menu" id="fileMenu" role="menu" hidden>
      <button data-a="new">New document<span class="k">⌥⌘N</span></button>
      <button data-a="open">Open file…<span class="k">⌘O</span></button>
      <button data-a="sample">Try sample text</button>
      <hr><div class="lbl">Download</div>
      <button data-a="docx" class="needdl">Word document (.docx)<span class="k">⌘S</span></button>
      <button data-a="md" class="needdl">Markdown (.md)</button>
      <button data-a="txt" class="needdl">Plain text (.txt)</button>
      <button data-a="report" class="needdl">Performance report (.pdf)</button>
      <button data-a="copy">Copy all text</button>
      <hr>

/* ---------- edits keep every range exact ---------- */
function shiftRange(r,s,oe,nl,nt){
  // returns false when the edit touches this range
  const delta=nl-(oe-s);
  if(r.end<s) return true;
  if(r.start>oe){r.start+=delta;r.end+=delta;return true;}
  if(r.end===s && oe>=s && r.start<s){const c=nt[s];if(c===undefined||!/[\p{L}\p{N}'’_-]/u.test(c))return true;return false;}
  if(r.start===oe && r.end>oe){const c=nt[s+nl-1];if(c===undefined||!/[\p{L}\p{N}'’_-]/u.test(c)){r.start+=delta;r.end+=delta;return true;}return false;}
  if(r.start===r.end&&r.start===s){r.start+=nl;r.end+=nl;return true;}
  return false;
}
function onEdit(){
  const nt=ed.value, ot=lastText;
  if(nt===ot) return;
  let s=0; const mx=Math.min(nt.length,ot.length);
  while(s<mx&&nt[s]===ot[s]) s++;
  let e=0; while(e<mx-s&&nt[nt.length-1-e]===ot[ot.length-1-e]) e++;
  const oe=ot.length-e, nl=nt.length-e-s;
  doc.sugg=doc.sugg.filter(r=>shiftRange(r,s,oe,nl,nt));
  doc.checked=doc.checked.filter(r=>shiftRange(r,s,oe,nl,nt));
  for(const u of inflight) if(!u.dead&&!shiftRange(u,s,oe,nl,nt)) u.dead=true;
  for(const c of rwCards) if(!c.dead&&!shiftRange(c,s,oe,nl,nt)) c.dead=true;
  for(const g of [genAnchor,genSel]) if(g&&!g.dead&&!shiftRange(g,s,oe,nl,nt)) g.dead=true;
  lastText=nt; doc.text=nt;
  runLocal(); render(); scheduleSave(); scheduleCheck();
  if(rwCards.some(c=>c.dead&&!c.deadShown)) renderRewrite();
}
ed.addEventListener("input",onEdit);

/* Replace a range through the editor so ⌘Z undoes it */
function replaceRange(start,end,text){

  if(!ok||ed.value.slice(start,start+text.length)!==text){ed.setRangeText(text,start,end,"end");onEdit();}
}

/* ---------- local checks (instant, offline) ---------- */
const WORDY=[["in order to","to"],["due to the fact that","because"],["owing to the fact that","because"],["at this point in time","now"],["at the present time","now"],["a large number of","many"],["a majority of","most"],["is able to","can"],["are able to","can"],["in the event that","if"],["for the purpose of","for"],["prior to","before"],["with regard to","about"],["with respect to","about"],["in spite of the fact that","although"],["in the near future","soon"],["on a daily basis","daily"],["each and every","every"],["first and foremost","first"],["the reason why is that","because"],["until such time as","until"],["in close proximity to","near"],["has the ability to","can"],["make a decision","decide"],["give consideration to","consider"],["it is important to note that ",""],["basic fundamentals","fundamentals"],["end result","result"],["past history","history"],["completely eliminate","eliminate"]];
const VERY={good:"excellent",bad:"terrible",big:"huge",small:"tiny",happy:"delighted",sad:"miserable",important:"crucial",tired:"exhausted",hard:"difficult",fast:"rapid",quick:"rapid",easy:"effortless",old:"ancient",pretty:"beautiful",smart:"brilliant",scared:"terrified",angry:"furious",cold:"freezing",hot:"scorching",hungry:"starving",clear:"obvious",interesting:"fascinating",large:"enormous",loud:"deafening",often:"frequently",sure:"certain",different:"distinct",difficult:"arduous",careful:"meticulous",nice:"lovely",strong:"powerful",many:"countless"};
const US_UK=[["color","colour"],["favorite","favourite"],["honor","honour"],["labor","labour"],["neighbor","neighbour"],["behavior","behaviour"],["humor","humour"],["flavor","flavour"],["rumor","rumour"],["harbor","harbour"],["center","centre"],["theater","theatre"],["fiber","fibre"],["liter","litre"],["defense","defence"],["offense","offence"],["catalog","catalogue"],["dialog","dialogue"],["gray","grey"],["traveled","travelled"],["traveling","travelling"],["canceled","cancelled"],["canceling","cancelling"],["modeling","modelling"],["labeled","labelled"],["jewelry","jewellery"],["aluminum","aluminium"],["mold","mould"],["plow","plough"],["cozy","cosy"],["program","programme"]];
const IZE="organiz|realiz|recogniz|apologiz|summariz|prioritiz|minimiz|maximiz|optimiz|emphasiz|categoriz|customiz|finaliz|normaliz|standardiz|utiliz|analyz|paralyz|criticiz|memoriz|visualiz|authoriz";
function matchCase(src,rep){if(!rep)return rep;if(src===src.toUpperCase()&&src.length>1)return rep.toUpperCase();if(src[0]===src[0].toUpperCase()&&src[0]!==src[0].toLowerCase())return rep[0].toUpperCase()+rep.slice(1);return rep;}
const inDict=w=>{const l=w.toLowerCase();return dict.some(d=>d.toLowerCase()===l);};
function runLocal(){
  const t=doc.text, out=[];
  const add=(start,end,replacement,cat,title,expl,kind)=>out.push({id:"L"+start+"-"+end+"-"+kind,start,end,original:t.slice(start,end),replacement,cat,title,expl,src:"local"});
  let m;
  const re1=/\b([\p{L}']+)(\s+)\1\b/giu;
  while((m=re1.exec(t))){if(/\n/.test(m[2])) continue; if(/^(had|that|is|very|bye|so|no)$/i.test(m[1])) continue; add(m.index,m.index+m[0].length,m[1],"correctness","Remove the repeated word",`"${m[1]}" appears twice in a row.`,"rep");}
  const re2=/(\S)( {2,})(?=\S)/g;
  while((m=re2.exec(t))) add(m.index+1,m.index+1+m[2].length," ","correctness","Remove the extra space","There is more than one space between these words.","sp");
  const EN=doc.goals.variant!=="Any language";
  const re3=/([\p{L}\p{N})"”’])( +)([,.;:!?])(?!\.)/gu;
  while(EN&&(m=re3.exec(t))){const st=m.index+m[1].length;add(st,st+m[2].length+1,m[3],"correctness","Remove the space before punctuation","Punctuation attaches to the word before it.","sb");}
  const re4=/([\p{Ll}]),(?=[\p{L}])/gu;
  while((m=re4.exec(t))){const st=m.index+1;add(st,st+1,", ","correctness","Add a space after the comma","A comma is followed by a space.","sa");}
  const re5=/(^|[^.]\w[.!?]["”’)]?\s+)(\p{Ll})/gmu;
  while(EN&&(m=re5.exec(t))){const pre=t.slice(Math.max(0,m.index-8),m.index+m[1].length);if(/\b(e\.g|i\.e|etc|vs|approx|cf|no|p|pp|ca|mr|mrs|ms|dr|st|jr|sr|inc|ltd|co|fig|al|a\.m|p\.m|u\.s|op|ed|vol)\.["”’)]?\s+$/i.test(pre)||/\.\.\.\s*$/.test(pre))continue;if(/^\s*$/.test(m[1]))continue;const st=m.index+m[1].length;const w=(/^[\p{L}]+/u.exec(t.slice(st))||[""])[0];if(/^(iPhone|iPad|iOS|macOS|eBay|npm)$/.test(w))continue;add(st,st+1,m[2].toUpperCase(),"correctness","Capitalize the first word","Sentences start with a capital letter.","cap");}
  const re6=/(^|[^\p{L}'’])(i)(?=['’]?(?:m|d|ll|ve)?(?![\p{L}]))/gmu;
  while(EN&&(m=re6.exec(t))){const st=m.index+m[1].length;if(t[st-1]==="."||t[st+1]==="."||t[st-1]==="("||t[st+1]===")"||t[st-1]==="/"||t[st-1]==="-"||t[st+1]==="-")continue;add(st,st+1,"I","correctness","Capitalize “I”","The pronoun “I” is always capitalized.","i");}
  const re7=/\b([Aa])\s+(?!(?:one|once|uni|use|usu|usa|user|uti|euro|eu|ewe|u\b|u\.))([aeio]\w*|un\w*|hour\w*|honest\w*|honou?r\w*|heir\w*)/g;
  while(EN&&(m=re7.exec(t))){add(m.index,m.index+1,m[1]==="A"?"An":"an","correctness","Use “an”",`Use “an” before a vowel sound (“${m[2]}”).`,"an");}
  const re8=/\b([Aa]n)\s+(?!(?:h(?:our|onest|onou?r|eir|erb)|[aeiou]|x-|mba|fbi|html|sql|faq|llm|mri|nda|seo|sms|ux\b|[A-Z]{2,}))([b-df-hj-np-tv-z]\w*)/g;
  while(EN&&(m=re8.exec(t))){if(/^[A-Z]{2,}/.test(m[2]))continue;add(m.index,m.index+m[1].length,m[1]==="An"?"A":"a","correctness","Use “a”",`Use “a” before a consonant sound (“${m[2]}”).`,"a");}
  const lower=t.toLowerCase();
  if(EN) for(const [ph,rep] of WORDY){let i=0;while((i=lower.indexOf(ph,i))>=0){const b=lower[i-1],a=lower[i+ph.length];if((!b||!/\w/.test(b))&&(!a||!/\w/.test(a)||ph.endsWith(" "))){add(i,i+ph.length,matchCase(t.slice(i,i+ph.length),rep),"clarity",rep?"Remove wordiness":"Remove the phrase",rep?`“${rep}” says the same thing in fewer words.`:"This phrase adds length without meaning.","w"+ph);}i+=ph.length;}}
  const re9=/\b(very|really|extremely)\s+([a-z]+)\b/gi;
  while(EN&&(m=re9.exec(t))){const r=VERY[m[2].toLowerCase()];if(r)add(m.index,m.index+m[0].length,matchCase(m[0],r),"engagement","Choose a stronger word",`“${r}” is more vivid than “${m[0].toLowerCase()}”.`,"v");}
  const re10=/\b(I just wanted to|I was just wondering if|Just checking in|I'm no expert, but|Sorry to bother you, but|I think that maybe)\b/gi;
  while(EN&&(m=re10.exec(t))){const rep={"i just wanted to":"I want to","i was just wondering if":"Could","just checking in":"Following up","i'm no expert, but":"","sorry to bother you, but":"","i think that maybe":"Perhaps"}[m[0].toLowerCase()];add(m.index,m.index+m[0].length,rep,"delivery","Sound more confident","Hedging language can make you sound unsure.","h");}
  const v=doc.goals.variant;
  if(v!=="Any language"){
    const toUK=v!=="American";
    for(const [us,uk] of US_UK){if(toUK&&(us==="program"||us==="dialog"))continue;const from=toUK?us:uk,to=toUK?uk:us;const r=new RegExp(`\\b${from}(s|ed|ing|ful|ite|ites)?\\b`,"gi");while((m=r.exec(t))){if(inDict(m[0]))continue;add(m.index,m.index+m[0].length,matchCase(m[0],to+(m[1]||"")),"correctness",`Use ${v} spelling`,`“${to+(m[1]||"")}” is the ${v} English spelling.`,"var");}}
    if(v==="American"){const r2=new RegExp(`\\b(${IZE.replace(/z/g,"s")})(e|es|ed|ing|ation|ations)\\b`,"gi");while((m=r2.exec(t))){if(inDict(m[0]))continue;const rep=m[1].replace(/s$/,"z")+m[2];add(m.index,m.index+m[0].length,matchCase(m[0],rep),"correctness","Use American spelling",`American English uses “${rep.toLowerCase()}”.`,"ize");}}
  }
  for(const rule of styleRules){if(!rule.find)continue;const r=new RegExp(`(?<![\\p{L}\\p{N}])${rule.find.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}(?![\\p{L}\\p{N}])`,rule.cs?"gu":"giu");while((m=r.exec(t))){if(rule.replace&&m[0]===rule.replace)continue;add(m.index,m.index+m[0].length,rule.replace==null?"":(rule.cs?rule.replace:matchCase(m[0],rule.replace)),"style",rule.replace?`Use “${rule.replace}”`:`Avoid “${rule.find}”`,rule.note||"Your style guide prefers this.","st"+rule.find);if(m[0].length===0)r.lastIndex++;}}
  const seen=new Set(); local=out.filter(x=>{const k=x.start+":"+x.end;if(seen.has(k))return false;seen.add(k);return true;});
}

/* ---------- merged suggestion list ---------- */
const dkey=s=>(s.cat+"|"+s.original+"|"+s.replacement).toLowerCase();
function allSugg(){
  const dis=new Set(doc.dismissed||[]);
  const keep=s=>!dis.has(dkey(s))&&!dis.has("all|"+s.original.toLowerCase())&&!(s.cat==="correctness"&&/^[\p{L}'’-]+$/u.test(s.original)&&inDict(s.original)&&s.replacement.toLowerCase()!==s.original.toLowerCase())&&doc.text.slice(s.start,s.end)===s.original;
  const ai=doc.sugg.filter(keep);
  const res=ai.slice();
  for(const l of local){if(!keep(l))continue;if(ai.some(a=>a.start<l.end&&l.start<a.end))continue;res.push(l);}
  res.sort((a,b)=>a.start-b.start||a.end-b.end);
  return res;
}

/* ---------- AI checking ---------- */
function units(){
  const t=doc.text, out=[]; let pos=0;
  for(const line of t.split("\n")){
    const st=pos; pos+=line.length+1;
    if(!line.trim()||!/[\p{L}]{2}/u.test(line)) continue;
    if(line.length<=3500){out.push({start:st,end:st+line.length,text:line});continue;}
    let a=0; while(a<line.length){let b=Math.min(line.length,a+3000);if(b<line.length){const cut=line.lastIndexOf(". ",b);if(cut>a+500)b=cut+2;}out.push({start:st+a,end:st+b,text:line.slice(a,b)});a=b;}
  }
  return out;
}
const ukey=u=>u.start+":"+u.text;
function dirtyUnits(){
  const ck=new Set(doc.checked.map(ukey)), fl=new Set(inflight.filter(u=>!u.dead).map(ukey));
  return units().filter(u=>!ck.has(ukey(u))&&!fl.has(ukey(u)));
}
let checkT=0;
function scheduleCheck(ms=1400){clearTimeout(checkT);if(!S.auto||!sample||!aiOK)return;checkT=setTimeout(()=>pump(false),ms);}
let running=0, lastErr="";
function goalsText(){const g=doc.goals;return `Domain: ${g.domain}. Audience: ${g.audience}. Formality: ${g.formality}.${g.intent?` Intent: ${g.intent}.`:""} ${g.variant==="Any language"?"Check the text in whatever language it is written in.":`If the text is English, use ${g.variant} English spelling and conventions; if it is another language, check it in that language.`}${g.voice?` The writer's voice: ${g.voice}.`:""}`;}
function rulesText(){let s="";if(dict.length)s+=`\nPersonal dictionary (these words are correct, never flag them): ${dict.slice(0,400).join(", ")}`;const sr=styleRules.filter(r=>r.find);if(sr.length)s+=`\nHouse style guide:\n${sr.slice(0,60).map(r=>`- ${r.replace?`write "${r.replace}" instead of "${r.find}"`:`avoid "${r.find}"`}${r.note?` (${r.note})`:""}`).join("\n")}`;return s;}
function checkPrompt(batch){
  return `You are an expert copy editor doing a premium writing check (correctness, clarity, engagement, delivery). Review each numbered paragraph and report every real issue.
Writing goals: ${goalsText()}${rulesText()}

Categories:
- correctness: spelling, grammar, agreement, verb tense, punctuation, capitalization, wrong or confused words (their/there, affect/effect), missing words.
- clarity: wordy phrases, redundancy, passive voice that hurts clarity, hard-to-read or run-on sentences. For a sentence that needs restructuring, give a full-sentence rewrite: "original" is the whole sentence.
- engagement: bland, overused or repeated words; suggest a more precise or vivid word.
- delivery: tone and formality that miss the goals, hedging, overly blunt or overly casual wording, non-inclusive language.

Rules:
- "original" must be copied EXACTLY (same characters and case) from that paragraph and be as short as possible while unambiguous (a word or phrase; a whole sentence only for rewrites).
- "before" is the 1-4 words that come directly before "original" in the paragraph (empty if at the start). It helps locate repeated text.
- "replacement" is the corrected text that replaces "original" exactly (use "" to delete).
- Don't flag correct text, names, URLs, code or Markdown markers (#, -, *, >). Don't flag the same text twice. No more than 20 items per paragraph.
- "title" is 2-6 words like "Correct the spelling", "Rewrite for clarity", "Change the verb form". "explanation" is one short sentence for the writer.
- "tone" lists up to 3 tones the whole set of paragraphs conveys (e.g. Confident, Friendly, Formal, Optimistic, Neutral, Worried, Direct, Appreciative, Curious, Urgent, Defensive, Informal), each with a score from 0 to 1.

Return only JSON in this exact shape:
{"tone":[{"name":"Confident","score":0.7}],"items":[{"p":1,"original":"...","before":"...","replacement":"...","category":"correctness","title":"...","explanation":"..."}]}

Paragraphs:
${batch.map((u,i)=>`[[${i+1}]] ${u.text}`).join("\n\n")}`;
}
function locate(u,it,used){
  const o=it.original; if(!o) return -1;
  const T=u.text; const occ=[]; let i=-1;
  while((i=T.indexOf(o,i+1))>=0) occ.push(i);
  if(!occ.length){const lo=T.toLowerCase();let j=-1;while((j=lo.indexOf(o.toLowerCase(),j+1))>=0)occ.push(j);if(!occ.length)return -1;}
  const b=(it.before||"").trim();
  if(b&&occ.length>1){const hit=occ.find(k=>T.slice(0,k).trimEnd().endsWith(b));if(hit!=null&&!used.has(hit))return hit;}
  return occ.find(k=>!used.has(k))??occ[0];
}
async function pump(manual){
  if(!sample||!aiOK) return;
  if(manual) failed.clear();
  while(running<2){
    const d=dirtyUnits().filter(u=>!failed.has(ukey(u)));
    if(!d.length) break;
    const batch=[]; let n=0;
    for(const u of d){if(batch.length&&(n+u.text.length>5000||batch.length>=14))break;batch.push(u);n+=u.text.length;}
    sendBatch(batch);
  }
  status();
}
async function sendBatch(batch){
  const my=batch.map(u=>({...u,dead:false}));
  inflight.push(...my); running++; status();
  const docId=doc.id;
  try{
    const res=await sample.json(checkPrompt(batch),{modelTier:S.depth==="thorough"?"default":"quick"});
    if(doc.id!==docId) return;
    const items=Array.isArray(res?.items)?res.items:[];
    const tone=Array.isArray(res?.tone)?res.tone.filter(x=>x&&x.name).slice(0,3).map(x=>({name:String(x.name).slice(0,24),score:Math.max(0,Math.min(1,+x.score||0.5))})):[];
    my.forEach((u,idx)=>{
      if(u.dead||doc.text.slice(u.start,u.end)!==u.text) return;
      doc.sugg=doc.sugg.filter(s=>!(s.start>=u.start&&s.end<=u.end));
      doc.checked=doc.checked.filter(c=>!(c.start<u.end&&u.start<c.end));
      const used=new Set();
      for(const it of items){
        if(+it.p!==idx+1||typeof it.original!=="string"||typeof it.replacement!=="string") continue;
        if(it.original===it.replacement) continue;
        const k=locate(u,it,used); if(k<0) continue; used.add(k);
        const cat=CATS[it.category]&&it.category!=="style"?it.category:"clarity";
        const start=u.start+k, orig=u.text.slice(k,k+it.original.length);
        doc.sugg.push({id:uid(),start,end:start+orig.length,original:orig,replacement:it.replacement,cat,title:String(it.title||CATS[cat]).slice(0,60),expl:String(it.explanation||"").slice(0,300),src:"ai"});
      }
      doc.checked.push({start:u.start,end:u.end,text:u.text,tone,len:u.text.length});
    });
    lastErr="";
    render(); scheduleSave();
  }catch(e){
    my.forEach(u=>failed.add(ukey(u)));
    const c=e?.code;
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){aiOK=false;applyAI();}
    lastErr=ERR[c]||"Couldn't check some paragraphs. Press Check now to try again.";
  }finally{
    inflight=inflight.filter(u=>!my.includes(u)); running--;
    if(!lastErr) pump(false); status();
  }
}
const ERR={rate_limited:"Claude is busy or you hit your usage limit. Try again later.",not_granted:"Claude isn't allowed for this app, so only the built-in checks run.",sampling_disabled:"Claude isn't available on this account, so only the built-in checks run.",refused:"Claude declined to check part of this text.",session_expired:"Sign in to Claude again, then press Check now.",prompt_too_large:"That part is too long to send. Split it into smaller paragraphs.",invalid_json:"Claude's answer was garbled. Press Check now to try again.",upstream_error:"Claude had a hiccup. Press Check now to try again."};

/* ---------- score, tone, stats ---------- */
function countWords(t){const m=t.match(/[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu);return m?m.length:0;}
function syllables(w){w=w.toLowerCase().replace(/[^a-z]/g,"");if(!w)return 0;if(w.length<=3)return 1;w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,"").replace(/^y/,"");const m=w.match(/[aeiouy]{1,2}/g);return Math.max(1,m?m.length:1);}
function stats(t){
  const words=t.match(/[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu)||[];
  const sents=(t.replace(/\n+/g," . ").match(/[^.!?。！？]*[\p{L}\p{N}][^.!?。！？]*[.!?。！？]*/gu)||[]).filter(s=>/[\p{L}\p{N}]/u.test(s));
  const paras=t.split(/\n/).filter(x=>x.trim()).length;
  const syl=words.reduce((a,w)=>a+syllables(w),0);
  const W=words.length||1, Sn=sents.length||1;
  const fre=206.835-1.015*(W/Sn)-84.6*(syl/W);
  const grade=0.39*(W/Sn)+11.8*(syl/W)-15.59;
  const uniq=new Set(words.map(w=>w.toLowerCase())).size;
  const long=words.filter(w=>w.length>=9).length;
  const cjk=(t.match(/[぀-ヿ㐀-鿿가-힯]/g)||[]).length;
  const wc=words.length+cjk;
  return {chars:t.length,noSpace:t.replace(/\s/g,"").length,words:wc,sentences:sents.length,paragraphs:paras,read:wc/238*60,speak:wc/183*60,wordLen:words.length?words.reduce((a,w)=>a+w.length,0)/words.length:0,sentLen:W/Sn,fre:Math.round(Math.max(0,Math.min(100,fre))),grade:Math.max(0,grade),uniq:words.length?uniq/words.length:0,rare:words.length?long/words.length:0,sentList:sents};
}
const fmtT=s=>s<60?`${Math.max(1,Math.round(s))} sec`:`${Math.floor(s/60)} min ${Math.round(s%60)} sec`;
function score(list,words){
  if(words<3) return null;
  const sum=list.reduce((a,s)=>a+(WEIGHT[s.cat]||1),0);
  const per=sum/(Math.max(words,40)/100);
  return Math.max(1,Math.min(100,Math.round(100*Math.exp(-per/28))));
}
function toneSummary(){
  const map={}; let tot=0;
  for(const c of doc.checked){for(const t of c.tone||[]){map[t.name]=(map[t.name]||0)+t.score*c.len;}tot+=c.len;}
  if(!tot) return [];
  return Object.entries(map).map(([name,v])=>({name,score:v/tot})).sort((a,b)=>b.score-a.score).slice(0,4);
}

/* ---------- rendering ---------- */
let cached=[];
function render(){
  cached=allSugg();
  if(activeId&&!cached.some(s=>s.id===activeId)) activeId=null;
  renderMirror(); renderReviewSoon(); renderFoot();
  $("emptyEd").hidden=!!doc.text;
  const sc=score(cached,countWords(doc.text));
  $("scoreNum").textContent=sc==null?"–":sc;
  $("ringArc").setAttribute("stroke-dasharray",`${(sc||0)/100*59.7} 60`);
  $("nBadge").textContent=cached.length; $("fabN").textContent=cached.length;
  hidePopIfStale();
}
function renderMirror(){
  const t=doc.text; let html="", pos=0;
  const marks=[];
  for(const s of cached){if(s.start>=pos&&s.end>s.start){marks.push(s);pos=s.end;}}
  for(const c of rwCards){if(!c.dead&&c.state!=="applied"&&c.hl)marks.push({start:c.start,end:c.end,rw:true,id:"rw"+c.id});}
  marks.sort((a,b)=>a.start-b.start);
  pos=0;
  for(const s of marks){if(s.start<pos)continue;html+=esc(t.slice(pos,s.start));html+=`<mark class="${s.rw?"rw":s.cat}${s.id===activeId?" on":""}" data-id="${s.id}">${esc(t.slice(s.start,s.end))}</mark>`;pos=s.end;}
  html+=esc(t.slice(pos))+"​\n";
  mirror.innerHTML=html;
}
function wordDiff(a,b){
  const ta=a.match(/\s+|[\p{L}\p{N}'’_-]+|[^\s\p{L}\p{N}]/gu)||[], tb=b.match(/\s+|[\p{L}\p{N}'’_-]+|[^\s\p{L}\p{N}]/gu)||[];
  if(ta.length*tb.length>250000) return `<del>${esc(a)}</del> <ins>${esc(b)}</ins>`;
  const n=ta.length,m=tb.length,dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=ta[i]===tb[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,out="",D="",I="";
  const flush=()=>{if(D)out+=`<del>${esc(D)}</del>`;if(I)out+=`<ins>${esc(I)}</ins>`;D=I="";};
  while(i<n||j<m){if(i<n&&j<m&&ta[i]===tb[j]){flush();out+=esc(ta[i]);i++;j++;}else if(j<m&&(i>=n||dp[i][j+1]>=dp[i+1][j])){I+=tb[j++];}else{D+=ta[i++];}}
  flush(); return out;
}
function suggDiff(s){
  const t=doc.text;
  const before=t.slice(Math.max(0,s.start-28),s.start), after=t.slice(s.end,s.end+28);
  const pre=(s.start>28?"…":"")+before.replace(/^\S*\s/,s.start>28?"":"$&");
  const core=s.original.length<60&&s.replacement.length<60&&!/\s/.test(s.original.trim())?(`<del>${esc(s.original)}</del>${s.replacement?`<ins>${esc(s.replacement)}</ins>`:""}`):wordDiff(s.original,s.replacement);
  return `<span class="ctx">${esc(pre.split("\n").pop())}</span>${core}<span class="ctx">${esc(after.split("\n")[0])}${after.length>=28?"…":""}</span>`;
}
function preview(s){if(!/[\p{L}\p{N}]/u.test(s.original+s.replacement))return esc(s.title);return s.replacement?`<del style="color:var(--muted)">${esc(s.original.slice(0,24))}</del> → <b>${esc(s.replacement.slice(0,40))}</b>`:`Remove “${esc(s.original.slice(0,30))}”`;}
function cardHTML(s,inPop){
  const single=/^[\p{L}'’-]+$/u.test(s.original)&&s.cat==="correctness";
  return `<div class="${inPop?"":"hd"}">${inPop?"":`<span class="dot"></span><span class="t">${CATS[s.cat]}</span><span class="pv">${preview(s)}</span>`}</div>
  <div class="${inPop?"":"bd"}"><div style="font-weight:600;font-size:13px;margin-bottom:4px">${esc(s.title)}</div>
  <div class="diff">${suggDiff(s)}</div>${s.expl?`<p class="expl">${esc(s.expl)}</p>`:""}
  <div class="acts"><button class="btn pri sm" data-acc="${s.id}">${s.replacement?"Accept":"Remove"}</button><button class="btn sm" data-dis="${s.id}">Dismiss</button>
  ${single?`<button class="btn ghost sm" data-dict="${s.id}" title="Add “${esc(s.original)}” to your personal dictionary">Add to dictionary</button>`:`<button class="btn ghost sm" data-ign="${s.id}" title="Ignore this text everywhere in this document">Ignore all</button>`}</div></div>`;
}
function renderReview(){
  const p=$("pReview");
  const counts={all:cached.length}; for(const c in CATS) counts[c]=0; for(const s of cached) counts[s.cat]++;
  if(S.cat!=="all"&&!counts[S.cat]) S.cat="all";
  const list=S.cat==="all"?cached:cached.filter(s=>s.cat===S.cat);
  const tones=toneSummary();
  const pending=dirtyUnits().length+inflight.filter(u=>!u.dead).length;
  let h=`<div class="cats">${["all","correctness","clarity","engagement","delivery"].map(c=>`<button class="cc-${c}${S.cat===c?" on":""}" data-cat="${c}" title="${c==="all"?"All suggestions":CATS[c]}"><i style="background:${c==="all"?"var(--fg)":`var(--c-${c})`}"></i><b>${counts[c]}</b>${c==="all"?"All":CATS[c]}</button>`).join("")}</div>`;
  if(counts.style) h+=`<div class="note"><span class="dot" style="background:var(--c-style)"></span> ${counts.style} style guide ${counts.style===1?"issue":"issues"} <button class="btn ghost sm" data-cat="style">Show</button></div>`;
  if(tones.length) h+=`<div class="toneBox"><h4>Tone detected${sample&&aiOK?'<button class="btn ghost sm" data-a="adjust">Adjust tone</button>':""}</h4>${tones.map(t=>`<div class="tone"><span>${esc(t.name)}</span><div class="bar"><i style="width:${Math.round(t.score*100)}%"></i></div></div>`).join("")}</div>`;
  if(list.length){
    h+=`<div class="bulk">${list.length} ${S.cat==="all"?"":CATS[S.cat].toLowerCase()+" "}suggestion${list.length>1?"s":""}<button class="btn sm" data-a="acceptAll">Accept all ${list.length}</button></div>`;
    h+=list.map(s=>`<div class="card cc-${s.cat}${s.id===activeId?" on":""}" data-id="${s.id}" tabindex="0">${cardHTML(s)}</div>`).join("");
  }else if(!doc.text.trim()){
    h+=`<div class="emptyP"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 38l4-12L32 8l8 8-18 18z"/><path d="M28 12l8 8"/></svg><h3>Start writing to see suggestions</h3>Type, paste or open a document. Suggestions appear here as underlines are found.</div>`;
  }else if(pending&&sample&&aiOK){
    h+=`<div class="emptyP"><span class="spin" style="width:22px;height:22px"></span><h3 style="margin-top:10px">Checking your writing…</h3>${pending} paragraph${pending>1?"s":""} left</div>`;
  }else{
    h+=`<div class="emptyP"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><circle cx="24" cy="24" r="18"/><path d="M16 24l6 6 11-12"/></svg><h3>${S.cat==="all"?"No suggestions":"Nothing in "+CATS[S.cat]}</h3>${sample&&aiOK?"Your text looks good against your goals.":"Built-in checks found nothing. Open in the Claude app for the full check."}</div>`;
  }
  p.innerHTML=h;
}
function renderFoot(){
  const t=doc.text, st=stats(t);
  const a=ed.selectionStart,b=ed.selectionEnd;
  const sel=b>a?countWords(t.slice(a,b)):0;
  const lab={words:`${st.words} words`,chars:`${st.chars} characters`,noSpace:`${st.noSpace} characters without spaces`,read:`${fmtT(st.read)} reading time`,speak:`${fmtT(st.speak)} speaking time`,sentences:`${st.sentences} sentences`,paragraphs:`${st.paragraphs} paragraphs`}[S.counter];
  $("counter").textContent=sel?`${sel} of ${st.words} words`:lab;
}
function status(){
  const pend=dirtyUnits().length, fl=inflight.filter(u=>!u.dead).length;
  let txt, col="var(--faint)";
  if(!sample||!aiOK){txt=aiOK?"Built-in checks only. Open in the Claude app for full grammar, clarity and tone checks.":"Built-in checks only.";}
  else if(lastErr){txt=lastErr;col="var(--c-correctness)";}
  else if(fl){txt=`Checking ${fl+pend} paragraph${fl+pend>1?"s":""}…`;col="var(--accent)";}
  else if(pend){txt=S.auto?"Waiting for you to pause…":`${pend} paragraph${pend>1?"s":""} not checked yet`;}
  else if(doc.text.trim()){txt="All text checked";col="var(--c-engagement)";}
  else txt="Ready";
  $("status").textContent=txt; $("stDot").style.background=col;
  $("checkBtn").hidden=!sample||!aiOK;
  $("checkBtn").disabled=!!fl&&!pend;
  if(S.tab==="review") renderReviewSoon();
}
let rrT=0; function renderReviewSoon(){if(rrT)return;rrT=setTimeout(()=>{rrT=0;renderReview();},16);}

/* ---------- interacting with suggestions ---------- */
function byId(id){return cached.find(s=>s.id===id);}
function setActive(id,{scrollText=true,scrollCard=true,pop=false}={}){
  activeId=id; renderMirror(); renderReview();
  if(!id){hidePop();return;}
  if(scrollText){const m=mirror.querySelector(`mark[data-id="${CSS.escape(id)}"]`);if(m){const sr=$("scroller").getBoundingClientRect(),mr=m.getBoundingClientRect();if(mr.top<sr.top+40||mr.bottom>sr.bottom-40)$("scroller").scrollBy({top:mr.top-sr.top-sr.height/3,behavior:"smooth"});}}
  if(scrollCard){const c=$("pReview").querySelector(`.card[data-id="${CSS.escape(id)}"]`);c?.scrollIntoView({block:"nearest",behavior:"smooth"});}
  if(pop&&narrow()) showPop(id); else hidePop();
}
// applying a suggestion keeps its paragraph marked as checked, so accepting doesn't trigger a new AI call
function applySugg(s){
  const rec=doc.checked.find(c=>c.start<=s.start&&s.end<=c.end&&doc.text.slice(c.start,c.end)===c.text);
  replaceRange(s.start,s.end,s.replacement);
  if(rec){const d=s.replacement.length-(s.end-s.start);const nr={...rec,end:rec.end+d};nr.text=doc.text.slice(nr.start,nr.end);nr.len=nr.text.length;doc.checked=doc.checked.filter(c=>c!==rec&&!(c.start<nr.end&&nr.start<c.end));doc.checked.push(nr);}
}
function accept(id,{next=true}={}){
  const s=byId(id); if(!s) return false;
  if(doc.text.slice(s.start,s.end)!==s.original){render();return false;}
  const list=cached, i=list.indexOf(s);
  applySugg(s);
  ed.setSelectionRange(s.start+s.replacement.length,s.start+s.replacement.length);
  if(next){const nx=allSugg().find(x=>x.start>=s.start+s.replacement.length)||allSugg()[0];if(nx&&i>=0)setActive(nx.id,{scrollText:false,pop:!$("pop").hidden});else{activeId=null;hidePop();render();}}
  return true;
}
function dismiss(id,mode="one"){
  const s=byId(id); if(!s) return;
  doc.dismissed=doc.dismissed||[];
  doc.dismissed.push(mode==="all"?"all|"+s.original.toLowerCase():dkey(s));
  if(s.src==="ai") doc.sugg=doc.sugg.filter(x=>x.id!==id);
  const nx=allSugg().find(x=>x.start>s.start&&x.id!==id);
  activeId=nx?nx.id:null; render(); scheduleSave(); if(!$("pop").hidden){nx&&narrow()?showPop(nx.id):hidePop();}
  toast(mode==="all"?`Ignoring “${s.original.slice(0,30)}” in this document.`:"Suggestion dismissed.",()=>{doc.dismissed.pop();if(s.src==="ai")doc.sugg.push(s);render();scheduleSave();});
}
function addToDict(id){
  const s=byId(id); if(!s) return;
  if(!inDict(s.original)){dict.push(s.original);store.set("dict",dict);}
  doc.sugg=doc.sugg.filter(x=>!(x.cat==="correctness"&&x.original.toLowerCase()===s.original.toLowerCase()));
  runLocal(); render(); scheduleSave();
  toast(`Added “${s.original}” to your dictionary.`,()=>{dict=dict.filter(w=>w!==s.original);store.set("dict",dict);render();});
}
function acceptAll(){
  const list=(S.cat==="all"?cached:cached.filter(s=>s.cat===S.cat)).slice().sort((a,b)=>b.start-a.start);
  let n=0, last=Infinity;
  for(const s of list){if(s.end>last)continue;if(doc.text.slice(s.start,s.end)!==s.original)continue;applySugg(s);last=s.start;n++;}
  activeId=null; render();
  if(n) toast(`Accepted ${n} suggestion${n>1?"s":""}.`,()=>{ed.focus();for(let i=0;i<n;i++)document.execCommand("undo");});
}
$("pReview").addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(b?.dataset.acc){accept(b.dataset.acc);return;}
  if(b?.dataset.dis){dismiss(b.dataset.dis);return;}
  if(b?.dataset.ign){dismiss(b.dataset.ign,"all");return;}
  if(b?.dataset.dict){addToDict(b.dataset.dict);return;}
  if(b?.dataset.cat){S.cat=b.dataset.cat;activeId=null;renderReview();renderMirror();return;}
  if(b?.dataset.a==="acceptAll"){acceptAll();return;}
  if(b?.dataset.a==="adjust"){openRewrite("all");return;}
  const c=e.target.closest(".card"); if(c&&c.dataset.id!==activeId) setActive(c.dataset.id,{scrollCard:false});
});
$("pReview").addEventListener("keydown",e=>{const c=e.target.closest(".card");if(!c)return;if(e.key==="Enter"&&e.target===c){e.preventDefault();if(c.dataset.id===activeId)accept(c.dataset.id);else setActive(c.dataset.id,{scrollCard:false});}else if((e.key==="Delete"||e.key==="Backspace")&&e.target===c){e.preventDefault();dismiss(c.dataset.id);}});
function caretSugg(){const p=ed.selectionStart;if(ed.selectionEnd!==p)return null;return cached.find(s=>s.start<=p&&p<=s.end&&s.end>s.start)||null;}
ed.addEventListener("click",()=>{const s=caretSugg();if(s&&s.id!==activeId)setActive(s.id,{scrollText:false,pop:true});else if(s&&narrow()&&$("pop").hidden)showPop(s.id);else if(!s){hidePop();if(activeId){activeId=null;renderMirror();renderReview();}}renderFoot();});

const QUICK=[["shorter","Shorter","Make it shorter and more concise. Cut filler and repetition but keep every key fact."],["clearer","Clearer","Make it clearer and easier to read: simpler structure, precise words, active voice."],["formal","More formal","Make it more formal and professional. No slang or contractions."],["friendly","Friendlier","Make it warmer and friendlier while staying professional."],["confident","More confident","Make it sound more confident and direct. Remove hedging and unnecessary apologies."],["persuasive","More persuasive","Make it more persuasive and compelling, with a clear call to action where it fits."],["simple","Simpler","Rewrite it in plain language that a 12-year-old can follow."],["expand","Expand","Expand it with a little more detail and smoother transitions. Do not invent facts, names or numbers."],["fix","Fix grammar only","Fix only spelling, grammar and punctuation. Change nothing else."]];

function chunks(start,end){
  const t=doc.text, out=[]; let a=start;

  return out;
}
function rwPrompt(instr,orig,n){

${n>1?`Write ${n} distinct versions. Return only JSON: {"versions":["...","...","..."]}`:"Output only the rewritten text, with no preface, quotes or notes."}

${orig}`;
}
const ctls=new Set(); function ctlAll(){for(const c of ctls)c.abort();ctls.clear();}
async function runCard(c){
  c.state="loading"; c.stream=""; renderRewrite();
  const ac=new AbortController(); c.ctl=ac; ctls.add(ac);
  try{
    if(c.n>1){
      const r=await sample.json(rwPrompt(c.instr,c.orig,c.n),{signal:ac.signal,modelTier:"default",...(c.fresh?{cache:false}:{})});
      const vs=(Array.isArray(r?.versions)?r.versions:[]).filter(v=>typeof v==="string"&&v.trim());
      if(!vs.length) throw {code:"invalid_json"};
      c.variants=vs.slice(0,3);
    }else{
      const r=await sample(rwPrompt(c.instr,c.orig,1),{signal:ac.signal,modelTier:c.orig.length>1200?"default":"quick",...(c.fresh?{cache:false}:{}),onText:({text})=>{c.stream=text;const el=document.querySelector(`[data-rc="${c.id}"] .diff`);if(el)el.textContent=text;}});

    if(e?.code==="cancelled"){c.state="gone";}
    else {c.state="error";c.err=ERR[e?.code]||"Couldn't rewrite this. Try again.";if(["not_granted","sampling_disabled"].includes(e?.code)){aiOK=false;applyAI();}}
  }finally{ctls.delete(ac);renderRewrite();}
}
function startRewrite(label,instr,n){
  if(!sample) return;
  const t=getTarget(rwTarget); if(!doc.text.slice(t.start,t.end).trim()){toast("Put the cursor in a paragraph or select text first.");return;}
  const parts=chunks(t.start,t.end);
  rwCards.forEach(c=>{if(c.state!=="loading")c.state="gone";});
  rwCards=rwCards.filter(c=>c.state!=="gone");
  parts.forEach((pt,i)=>{const orig=doc.text.slice(pt.start,pt.end);const c={id:uid(),start:pt.start,end:pt.end,orig,label,instr,n:parts.length===1&&orig.length<=1500?n:1,part:parts.length>1?`${i+1} of ${parts.length}`:"",dead:false,state:"loading",hl:true};rwCards.push(c);});
  renderMirror(); renderRewrite();
  setTimeout(()=>$("pRewrite").querySelector(".rcard")?.scrollIntoView({block:"nearest",behavior:"smooth"}),30);
  // run sequentially-ish: two at a time
  const queue=rwCards.filter(c=>c.state==="loading"&&!c.started);
  let active=0; const next=()=>{while(active<2&&queue.length){const c=queue.shift();c.started=true;active++;runCard(c).finally(()=>{active--;renderMirror();next();});}};
  next();
}
function applyCard(c){

  const v=c.variants[c.sel]; replaceRange(c.start,c.end,v); c.state="applied"; c.hl=false;
  ed.setSelectionRange(c.start,c.start+v.length);
  return true;
}

ed.addEventListener("paste",e=>{
  const html=e.clipboardData?.getData("text/html"), plain=e.clipboardData?.getData("text/plain");
  if(html&&/<(h[1-6]|li|p)\b/i.test(html)){const t=htmlToText(html);if(t.trim()&&(!plain||t.replace(/\s|[#\-\d.]/g,"").length>=plain.replace(/\s/g,"").length*0.9)){e.preventDefault();document.execCommand("insertText",false,t);}}
  setTimeout(()=>scheduleCheck(250),0);
});

/* ---------- export ---------- */
const xmlEsc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,"");
function runs(s){
  const out=[]; const re=/(\*\*[^*\n]+\*\*|__[^_\n]+__|\*[^*\n]+\*|_[^_\n]+_)/g; let last=0,m;
  const r=(t,b,i)=>`<w:r>${b||i?`<w:rPr>${b?"<w:b/>":""}${i?"<w:i/>":""}</w:rPr>`:""}<w:t xml:space="preserve">${xmlEsc(t)}</w:t></w:r>`;
  while((m=re.exec(s))){if(m.index>last)out.push(r(s.slice(last,m.index)));const tk=m[0];if(/^(\*\*|__)/.test(tk))out.push(r(tk.slice(2,-2),true));else out.push(r(tk.slice(1,-1),false,true));last=m.index+tk.length;}
  if(last<s.length) out.push(r(s.slice(last)));
  return out.join("");
}
async function buildDocx(text){
  const z=new JSZip();
  z.file("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`);
  z.file("_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`);
  z.file("docProps/core.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${xmlEsc(docTitle())}</dc:title><dcterms:modified xsi:type="dcterms:W3CDTF">${new Date().toISOString().slice(0,19)}Z</dcterms:modified></cp:coreProperties>`);
  z.file("word/_rels/document.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/></Relationships>`);
  const st=(id,name,ppr,rpr,based="Normal")=>`<w:style w:type="paragraph" w:styleId="${id}"><w:name w:val="${name}"/><w:basedOn w:val="${based}"/><w:next w:val="Normal"/><w:qFormat/><w:pPr>${ppr}</w:pPr><w:rPr>${rpr}</w:rPr></w:style>`;
  z.file("word/styles.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="en-US"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="160" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>${st("Heading1","heading 1",'<w:keepNext/><w:spacing w:before="360" w:after="120"/><w:outlineLvl w:val="0"/>','<w:b/><w:sz w:val="36"/>')}${st("Heading2","heading 2",'<w:keepNext/><w:spacing w:before="240" w:after="100"/><w:outlineLvl w:val="1"/>','<w:b/><w:sz w:val="30"/>')}${st("Heading3","heading 3",'<w:keepNext/><w:spacing w:before="200" w:after="80"/><w:outlineLvl w:val="2"/>','<w:b/><w:sz w:val="26"/>')}${st("ListParagraph","List Paragraph",'<w:spacing w:after="60"/><w:ind w:left="720" w:hanging="360"/><w:contextualSpacing/>',"")}${st("Quote","Quote",'<w:ind w:left="720"/>','<w:i/>')}</w:styles>`);
  const paras=[], nums=[]; let olNum=0, prevOl=false;
  const lvlXml=(fmt,i)=>`<w:lvl w:ilvl="${i}"><w:start w:val="1"/><w:numFmt w:val="${fmt}"/><w:lvlText w:val="${fmt==="bullet"?["•","◦","▪"][i%3]:`%${i+1}.`}"/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="${720+i*360}" w:hanging="360"/></w:pPr>${fmt==="bullet"?'<w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/></w:rPr>':""}</w:lvl>`;
  const li=(lvl,numId,body)=>`<w:p><w:pPr><w:pStyle w:val="ListParagraph"/><w:numPr><w:ilvl w:val="${Math.min(lvl,8)}"/><w:numId w:val="${numId}"/></w:numPr></w:pPr>${body}</w:p>`;
  for(const raw of text.split("\n")){
    if(!raw.trim()) continue;
    let m; const isOl=/^\s*\d+[.)]\s+/.test(raw);
    if(isOl&&!prevOl){olNum=3+nums.length;nums.push(olNum);} prevOl=isOl;
    if((m=/^(#{1,6})\s+(.*)$/.exec(raw))) paras.push(`<w:p><w:pPr><w:pStyle w:val="Heading${Math.min(3,m[1].length)}"/></w:pPr>${runs(m[2])}</w:p>`);
    else if((m=/^(\s*)([-*•])\s+(.*)$/.exec(raw))) {const lvl=Math.floor(m[1].replace(/\t/g,"  ").length/2);paras.push(li(lvl,1,runs(m[3])));}
    else if((m=/^(\s*)(\d+[.)])\s+(.*)$/.exec(raw))) {const lvl=Math.floor(m[1].length/2);paras.push(li(lvl,olNum,runs(m[3])));}
    else if((m=/^>\s?(.*)$/.exec(raw))) paras.push(`<w:p><w:pPr><w:pStyle w:val="Quote"/></w:pPr>${runs(m[1])}</w:p>`);
    else paras.push(`<w:p>${runs(raw.replace(/\t/g,"    "))}</w:p>`);
  }
  z.file("word/numbering.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:abstractNum w:abstractNumId="0"><w:multiLevelType w:val="hybridMultilevel"/>${[0,1,2,3,4,5,6,7,8].map(i=>lvlXml("bullet",i)).join("")}</w:abstractNum><w:abstractNum w:abstractNumId="1"><w:multiLevelType w:val="hybridMultilevel"/>${[0,1,2,3,4,5,6,7,8].map(i=>lvlXml("decimal",i)).join("")}</w:abstractNum><w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>${nums.map(n=>`<w:num w:numId="${n}"><w:abstractNumId w:val="1"/><w:lvlOverride w:ilvl="0"><w:startOverride w:val="1"/></w:lvlOverride></w:num>`).join("")}</w:numbering>`);
  z.file("word/document.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${paras.join("")||"<w:p/>"}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>`);
  return z.generateAsync({type:"uint8array",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
const fname=ext=>(docTitle().replace(/[\\/:*?"<>|\n]+/g," ").trim().slice(0,80)||"Untitled document")+"."+ext;
async function save(filename,data){
  if(!downloads){toast("Downloads aren't available here. Use Copy all text instead.");return;}
  try{await downloads.save({filename,data});toast(`Saved ${filename}.`);}
  catch(e){if(e?.code==="declined")return;if(["unavailable","not_granted","capability_disabled","host_unavailable"].includes(e?.code)){toast("Saving files isn't available in this view.");}else toast("Couldn't save the file. Try again.");}
}
async function exportAs(kind){
  saveDoc();
  if(kind==="docx"){if(!window.JSZip){toast("The Word exporter didn't load. Check your connection and reopen the app.");return;}save(fname("docx"),await buildDocx(doc.text));}
  if(kind==="md") save(fname("md"),doc.text);
  if(kind==="txt") save(fname("txt"),doc.text.replace(/^#{1,6}\s+/gm,"").replace(/\*\*([^*\n]+)\*\*/g,"$1"));
  if(kind==="report") exportReport();
}
function exportReport(){
  if(!window.jspdf){toast("The PDF maker didn't load. Check your connection and reopen the app.");return;}
  const st=stats(doc.text), sc=score(cached,st.words), counts={}; for(const s of cached) counts[s.cat]=(counts[s.cat]||0)+1;
  const pdf=new jspdf.jsPDF({unit:"pt",format:"letter"}); let y=64; const L=60;
  const line=(t,size=11,bold=false,gap=6)=>{pdf.setFont("helvetica",bold?"bold":"normal");pdf.setFontSize(size);for(const l of pdf.splitTextToSize(t.replace(/[^\x00-\xff–—‘’“”…]/g,"?"),492)){if(y>740){pdf.addPage();y=64;}pdf.text(l,L,y);y+=size*1.35;}y+=gap;};
  line("Writing performance report",20,true,4);
  line(`${docTitle()} · ${new Date().toLocaleString()}`,10,false,14);
  line(`Overall score: ${sc==null?"n/a":sc+" / 100"}`,14,true,10);
  line("Word count",13,true,2);
  line(`Characters ${st.chars}   Words ${st.words}   Sentences ${st.sentences}   Paragraphs ${st.paragraphs}`);
  line(`Reading time ${fmtT(st.read)}   Speaking time ${fmtT(st.speak)}`,11,false,12);
  line("Readability",13,true,2);
  line(`Word length ${st.wordLen.toFixed(1)}   Sentence length ${st.sentLen.toFixed(1)}   Flesch reading ease ${st.fre}   Grade level ${st.grade.toFixed(1)}`,11,false,12);
  line("Vocabulary",13,true,2);
  line(`Unique words ${Math.round(st.uniq*100)}%   Rare or long words ${Math.round(st.rare*100)}%`,11,false,12);
  const tones=toneSummary(); if(tones.length){line("Tone",13,true,2);line(tones.map(t=>`${t.name} ${Math.round(t.score*100)}%`).join("   "),11,false,12);}
  line("Open suggestions",13,true,2);
  line(Object.keys(CATS).map(c=>`${CATS[c]} ${counts[c]||0}`).join("   "),11,false,8);
  for(const s of cached.slice(0,80)) line(`- [${CATS[s.cat]}] ${s.title}: "${s.original.slice(0,80)}" -> "${s.replacement.slice(0,80)}"`,9.5,false,1);
  save(fname("pdf").replace(/\.pdf$/," report.pdf"),pdf.output("arraybuffer"));
}
async function copyText(t){if(!t)return;try{await navigator.clipboard.writeText(t);toast("Copied.");}catch{const ta=document.createElement("textarea");ta.value=t;document.body.append(ta);ta.select();let ok=false;try{ok=document.execCommand("copy");}catch{}ta.remove();toast(ok?"Copied.":"Couldn't copy. Select the text and press ⌘C.");}}

/* ---------- menus ---------- */
function doAction(a){
  $("fileMenu").hidden=true;
  if(a==="new") newDocument();
  else if(a==="open") $("file").click();
  else if(a==="sample") {if(doc.text.trim())newDocument(SAMPLE,"Sample email");else{ed.focus();ed.select();document.execCommand("insertText",false,SAMPLE);if(!doc.title){doc.title="Sample email";$("title").value=doc.title;}}scheduleCheck(100);}
  else if(["docx","md","txt","report"].includes(a)) exportAs(a);
  else if(a==="copy") copyText(doc.text);
  else if(a==="goals") openGoals();
  else if(a==="settings") openSettings("general");
  else if(a==="keys") openKeys();
}
$("fileBtn").onclick=e=>{e.stopPropagation();$("fileMenu").hidden=!$("fileMenu").hidden;};
$("fileMenu").addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(b)doAction(b.dataset.a);});
$("emptyEd").addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(b)doAction(b.dataset.a);});
document.addEventListener("click",e=>{if(!e.target.closest(".menuwrap"))$("fileMenu").hidden=true;});
$("checkBtn").onclick=()=>{lastErr="";pump(true);};
const CNT=["words","chars","noSpace","read","speak","sentences","paragraphs"];
$("counter").onclick=()=>{S.counter=CNT[(CNT.indexOf(S.counter)+1)%CNT.length];store.set("counter",S.counter);renderFoot();};

/* ---------- toast ---------- */
let toastT=0;
function toast(msg,undo){const t=$("toast");t.innerHTML=`<span>${esc(msg)}</span>${undo?"<button>Undo</button>":""}`;t.hidden=false;if(undo)t.querySelector("button").onclick=()=>{t.hidden=true;undo();};clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,undo?6000:2600);}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  const mod=e.metaKey||e.ctrlKey, k=e.key;
  if(k==="Escape"){if(!$("modal").hidden){hideModal();return;}if(!$("fileMenu").hidden){$("fileMenu").hidden=true;return;}if(!$("drawer").hidden){closeDrawer();return;}if(!$("pop").hidden){hidePop();return;}if(document.body.classList.contains("sideopen")){closeSide();return;}if(activeId){activeId=null;renderMirror();renderReview();}return;}
  if(!$("modal").hidden) return;
  if(mod&&k==="Enter"&&document.activeElement?.id!=="genIn"){e.preventDefault();lastErr="";pump(true);return;}
  if(mod&&!e.shiftKey&&!e.altKey&&k.toLowerCase()==="k"){e.preventDefault();openRewrite("auto");return;}
  if(mod&&!e.shiftKey&&k.toLowerCase()==="j"){e.preventDefault();setTab("write");openSide();setTimeout(()=>$("genIn")?.focus(),0);return;}
  if(mod&&!e.shiftKey&&k.toLowerCase()==="o"){e.preventDefault();$("file").click();return;}
  if(mod&&!e.shiftKey&&k.toLowerCase()==="s"){e.preventDefault();exportAs("docx");return;}
  if(mod&&e.altKey&&(k.toLowerCase()==="n"||e.code==="KeyN")){e.preventDefault();newDocument();return;}
  if(mod&&e.shiftKey&&(e.code==="KeyD")){e.preventDefault();$("drawer").hidden?openDrawer():closeDrawer();return;}
  if(mod&&e.shiftKey&&(e.code==="KeyI")){e.preventDefault();openPerf();return;}
  if(mod&&k===","){e.preventDefault();openSettings("general");return;}
  if(mod&&k==="/"){e.preventDefault();openKeys();return;}
  if(k==="F8"){e.preventDefault();const L=S.cat==="all"?cached:cached.filter(s=>s.cat===S.cat);if(!L.length)return;let i=L.findIndex(s=>s.id===activeId);i=e.shiftKey?(i<=0?L.length-1:i-1):(i+1)%L.length;setActive(L[i].id,{pop:true});setTab("review");return;}
  if(e.altKey&&k==="Enter"&&activeId){e.preventDefault();if(e.shiftKey)dismiss(activeId);else accept(activeId);return;}
});
// snippets: trigger + Tab
ed.addEventListener("keydown",e=>{
  if(e.key!=="Tab"||e.shiftKey||e.metaKey||e.ctrlKey||e.altKey||!snippets.length) return;
  const p=ed.selectionStart; if(p!==ed.selectionEnd) return;
  const before=doc.text.slice(Math.max(0,p-40),p);
  const sn=snippets.slice().sort((a,b)=>b.trigger.length-a.trigger.length).find(s=>before.endsWith(s.trigger)&&(before.length===s.trigger.length||/\s/.test(before[before.length-s.trigger.length-1])));
  if(!sn) return;
  e.preventDefault(); replaceRange(p-sn.trigger.length,p,sn.text);
});

/* ---------- AI availability, downloads ---------- */
function applyAI(){
  const on=!!sample&&aiOK;
  document.querySelectorAll(".needai").forEach(el=>el.hidden=!on);
  if(!on&&S.tab!=="review") setTab("review");
  ed.spellcheck=!on; // fall back to the system spell checker when Claude isn't available
  status();
}
function applyDL(){document.querySelectorAll(".needdl").forEach(el=>el.hidden=!downloads);}

/* ---------- desktop ---------- */
let perms={};
function dockIcon(){
  const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,"#5b6af0");g.addColorStop(1,"#2f3aa8");
  x.fillStyle=g;x.beginPath();x.roundRect(8,8,240,240,54);x.fill();
  x.fillStyle="#fff";x.beginPath();x.roundRect(52,62,152,22,11);x.fill();x.beginPath();x.roundRect(52,108,118,22,11);x.fill();
  x.strokeStyle="#ff7a80";x.lineWidth=7;x.lineCap="round";x.beginPath();x.moveTo(52,148);for(let i=0;i<=118;i+=12){x.lineTo(52+i,148+(i/12%2?6:0));}x.stroke();
  x.strokeStyle="#7ef0c9";x.lineWidth=16;x.lineJoin="round";x.beginPath();x.moveTo(122,186);x.lineTo(148,210);x.lineTo(200,156);x.stroke();
  return c.toDataURL("image/png");
}
async function summon(){await desktop.window.show().catch(()=>{});ed.focus();}
function applyWindow(){
  const float=store.get("float",false)&&perms.overlay==="granted";
  document.body.classList.toggle("inset",!float);
  desktop.window.setOptions(float
    ?{frame:false,alwaysOnTop:true,dragHeight:0,width:460,height:640,minWidth:360,minHeight:420,roundedCorners:true,hasShadow:true}
    :{titleBarStyle:"hiddenInset",dragHeight:48,width:1180,height:800,minWidth:380,minHeight:460}).catch(()=>{});
}
let sc=false;
function setupDesk(){
  if(perms.shortcuts==="granted"&&!sc){sc=true;desktop.globalShortcut.register("Alt+Shift+G",summon).catch(()=>{sc=false;});}
  const float=store.get("float",false)&&perms.overlay==="granted";
  $("deskMenu").innerHTML=`<hr>${float?`<button data-d="normal">Normal window</button><button data-d="hide">Copy all and hide<span class="k">${ALT}${SHIFT}G shows it again</span></button>`:`<button data-d="float">Float on top<span class="k">${ALT}${SHIFT}G</span></button>`}`;
}
$("deskMenu").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-d]"); if(!b) return; $("fileMenu").hidden=true;
  if(b.dataset.d==="install"){desktop.install.request().catch(()=>{});return;}
  if(b.dataset.d==="float"){try{perms=await desktop.permissions.request(["overlay","shortcuts"]);}catch{}if(perms.overlay==="granted"){store.set("float",true);applyWindow();}else toast("Floating needs the overlay permission.");setupDesk();}
  if(b.dataset.d==="normal"){store.set("float",false);applyWindow();setupDesk();}
  if(b.dataset.d==="hide"){await copyText(doc.text);desktop.window.hide().catch(()=>{});}
});

/* ---------- boot ---------- */
(function boot(){
  const cur=store.get("current",null);
  if(!(cur&&loadDoc(cur))&&!(index[0]&&loadDoc(index[0].id))){doc=newDocObj();openDocObj(doc);}
  setTab("review"); status();
})();
window.addEventListener("resize",()=>{if(!narrow())closeSide();hidePop();});
window.addEventListener("beforeunload",()=>saveDoc());
document.addEventListener("visibilitychange",()=>{if(document.hidden)saveDoc();});
(async()=>{
  const use=window.claude?.use?n=>window.claude.use(n).catch(()=>null):async()=>null;
  [sample,downloads,desktop]=await Promise.all([use("sample"),use("downloads"),use("desktop")]);
  applyAI(); applyDL(); render();
  if(sample&&aiOK) scheduleCheck(400);
  if(!desktop) return;
  if(!desktop.tray){
    const st=await desktop.install.state().catch(()=>"unavailable");
    if(st==="available") $("deskMenu").innerHTML=`<hr><button data-d="install">Install as app<span class="k">Float + ${ALT}${SHIFT}G</span></button>`;
    return;
  }
  document.body.classList.add("app");
  desktop.app.dock.setIcon(dockIcon()).catch(()=>{});
  try{perms=await desktop.permissions.state();}catch{}
  applyWindow(); setupDesk();
})();
