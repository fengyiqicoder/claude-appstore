<title>World Clock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script type="application/json" id="claude-artifacts-manifest">{"permissions":["menu-bar"]}</script>
<style>
/* Layout: a stacked list of city rows, each with a 24-hour day/night band; one shared time slider at the bottom shifts every row to plan a meeting. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --fg:#14181f; --muted:#6b7380; --line:#e2e5ea;
  --day:#ffd88a; --dusk:#f4a77a; --night:#2b3550; --now:#0f6fff; --accent:#0f6fff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--panel:#1b1e24;--fg:#eef1f5;--muted:#8d95a1;--line:#2b3038;--day:#d9a94a;--dusk:#b9714a;--night:#0b1020;--now:#5b9dff;--accent:#5b9dff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--panel:#1b1e24;--fg:#eef1f5;--muted:#8d95a1;--line:#2b3038;--day:#d9a94a;--dusk:#b9714a;--night:#0b1020;--now:#5b9dff;--accent:#5b9dff;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--font)}
.drag{height:30px;app-region:drag;-webkit-app-region:drag}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:4px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:700 22px/1 var(--num);margin:0}
.add{position:relative}
.add input{font:inherit;width:200px;max-width:52vw;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.sugg{position:absolute;right:0;top:calc(100% + 4px);width:260px;max-width:80vw;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);overflow:hidden;z-index:5}
.sugg button{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;background:transparent;color:var(--fg);font:inherit;text-align:left;padding:8px 12px;cursor:pointer}
.sugg button:hover,.sugg button:focus{background:var(--bg)}
.sugg small{color:var(--muted)}
.list{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.city{min-width:0}
.city b{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.city span{color:var(--muted);font-size:12px}
.pin{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px;font-size:12px;line-height:1}
.pin.on{color:var(--accent)}
.clock{text-align:right}
.clock b{font:600 26px/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clock span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.band{grid-column:1/-1;position:relative;height:10px;border-radius:5px;overflow:hidden}
.band i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--now);border-radius:1px}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0}
.del:hover{color:#d33}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.plan .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.plan b{font-weight:600}
.plan button{font:600 12px/1 var(--font);border:0;background:var(--bg);color:var(--fg);border-radius:999px;padding:6px 10px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.ask{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ask form{display:flex;gap:8px}
.ask input{flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.ask button{font:600 12.5px/1 var(--font);border:0;border-radius:8px;padding:0 12px;background:var(--accent);color:#fff;cursor:pointer}
.ask p{margin:0;font-size:13px;color:var(--fg);white-space:pre-wrap}
.ask p:empty{display:none}
.foot{font-size:12px;color:var(--muted);text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.install{font:600 12.5px/1 var(--font);border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div class="drag"></div>
<div class="wrap">
  <header><h1>World Clock</h1>
    <div class="add"><input id="q" type="search" placeholder="Add a city" autocomplete="off" aria-label="Add a city"><div class="sugg" id="sugg" hidden></div></div>
  </header>
  <div class="list" id="list"></div>
  <div class="ask" id="ask" hidden>
    <form id="askf"><input id="aq" placeholder="Ask: best time for a 30-min call with London and Tokyo?" aria-label="Ask about times"><button type="submit">✦ Ask</button></form>
    <p id="aa" aria-live="polite"></p>
  </div>
  <div class="plan">
    <div class="top"><b id="planlbl">Now</b><button id="now" hidden>Back to now</button></div>
    <input id="shift" type="range" min="-720" max="720" step="15" value="0" aria-label="Shift time to plan a meeting">
    <span style="color:var(--muted);font-size:12px">Drag to see what time it will be everywhere. Good for picking a meeting slot.</span>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script>


const $=id=>document.getElementById(id);
const CITIES=[["Honolulu","Pacific/Honolulu"],["Anchorage","America/Anchorage"],["San Francisco","America/Los_Angeles"],["Los Angeles","America/Los_Angeles"],["Seattle","America/Los_Angeles"],["Vancouver","America/Vancouver"],["Denver","America/Denver"],["Phoenix","America/Phoenix"],["Chicago","America/Chicago"],["Austin","America/Chicago"],["Mexico City","America/Mexico_City"],["New York","America/New_York"],["Toronto","America/Toronto"],["Miami","America/New_York"],["Bogotá","America/Bogota"],["Lima","America/Lima"],["Santiago","America/Santiago"],["Buenos Aires","America/Argentina/Buenos_Aires"],["São Paulo","America/Sao_Paulo"],["Reykjavík","Atlantic/Reykjavik"],["Lisbon","Europe/Lisbon"],["London","Europe/London"],["Dublin","Europe/Dublin"],["Paris","Europe/Paris"],["Amsterdam","Europe/Amsterdam"],["Berlin","Europe/Berlin"],["Madrid","Europe/Madrid"],["Rome","Europe/Rome"],["Zurich","Europe/Zurich"],["Stockholm","Europe/Stockholm"],["Warsaw","Europe/Warsaw"],["Athens","Europe/Athens"],["Istanbul","Europe/Istanbul"],["Kyiv","Europe/Kyiv"],["Moscow","Europe/Moscow"],["Cairo","Africa/Cairo"],["Lagos","Africa/Lagos"],["Nairobi","Africa/Nairobi"],["Johannesburg","Africa/Johannesburg"],["Tel Aviv","Asia/Jerusalem"],["Dubai","Asia/Dubai"],["Riyadh","Asia/Riyadh"],["Tehran","Asia/Tehran"],["Karachi","Asia/Karachi"],["Mumbai","Asia/Kolkata"],["Delhi","Asia/Kolkata"],["Kolkata","Asia/Kolkata"],["Bangalore","Asia/Kolkata"],["Kathmandu","Asia/Kathmandu"],["Dhaka","Asia/Dhaka"],["Bangkok","Asia/Bangkok"],["Jakarta","Asia/Jakarta"],["Ho Chi Minh City","Asia/Ho_Chi_Minh"],["Singapore","Asia/Singapore"],["Kuala Lumpur","Asia/Kuala_Lumpur"],["Manila","Asia/Manila"],["Hong Kong","Asia/Hong_Kong"],["Taipei","Asia/Taipei"],["Shanghai","Asia/Shanghai"],["Beijing","Asia/Shanghai"],["Shenzhen","Asia/Shanghai"],["Seoul","Asia/Seoul"],["Tokyo","Asia/Tokyo"],["Perth","Australia/Perth"],["Adelaide","Australia/Adelaide"],["Brisbane","Australia/Brisbane"],["Sydney","Australia/Sydney"],["Melbourne","Australia/Melbourne"],["Auckland","Pacific/Auckland"]];
const localTz=Intl.DateTimeFormat().resolvedOptions().timeZone;
const T=window.__t, ZH=window.__ZH;
const CITY_ZH={"Here":"这里","Honolulu":"檀香山","Anchorage":"安克雷奇","San Francisco":"旧金山","Los Angeles":"洛杉矶","Seattle":"西雅图","Vancouver":"温哥华","Denver":"丹佛","Phoenix":"凤凰城","Chicago":"芝加哥","Austin":"奥斯汀","Mexico City":"墨西哥城","New York":"纽约","Toronto":"多伦多","Miami":"迈阿密","Bogotá":"波哥大","Lima":"利马","Santiago":"圣地亚哥","Buenos Aires":"布宜诺斯艾利斯","São Paulo":"圣保罗","Reykjavík":"雷克雅未克","Lisbon":"里斯本","London":"伦敦","Dublin":"都柏林","Paris":"巴黎","Amsterdam":"阿姆斯特丹","Berlin":"柏林","Madrid":"马德里","Rome":"罗马","Zurich":"苏黎世","Stockholm":"斯德哥尔摩","Warsaw":"华沙","Athens":"雅典","Istanbul":"伊斯坦布尔","Kyiv":"基辅","Moscow":"莫斯科","Cairo":"开罗","Lagos":"拉各斯","Nairobi":"内罗毕","Johannesburg":"约翰内斯堡","Tel Aviv":"特拉维夫","Dubai":"迪拜","Riyadh":"利雅得","Tehran":"德黑兰","Karachi":"卡拉奇","Mumbai":"孟买","Delhi":"德里","Kolkata":"加尔各答","Bangalore":"班加罗尔","Kathmandu":"加德满都","Dhaka":"达卡","Bangkok":"曼谷","Jakarta":"雅加达","Ho Chi Minh City":"胡志明市","Singapore":"新加坡","Kuala Lumpur":"吉隆坡","Manila":"马尼拉","Hong Kong":"香港","Taipei":"台北","Shanghai":"上海","Beijing":"北京","Shenzhen":"深圳","Seoul":"首尔","Tokyo":"东京","Perth":"珀斯","Adelaide":"阿德莱德","Brisbane":"布里斯班","Sydney":"悉尼","Melbourne":"墨尔本","Auckland":"奥克兰"};

const store={get(k,d){try{const v=localStorage.getItem("zones."+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem("zones."+k,JSON.stringify(v))}catch{}}};
const validTz=tz=>{try{new Intl.DateTimeFormat("en",{timeZone:tz});return typeof tz==="string"}catch{return false}};
const loadList=()=>{let l=store.get("list",null);if(!Array.isArray(l))return null;l=l.filter(c=>c&&typeof c.name==="string"&&validTz(c.tz)).map(c=>({name:c.name,tz:c.name==="Here"?localTz:c.tz}));if(!l.length||l[0].name!=="Here")l.unshift({name:"Here",tz:localTz});return l.filter((c,i)=>i===0||!(c.name==="Here"));};
let list=loadList()||[{name:"Here",tz:localTz},["New York","America/New_York"],["London","Europe/London"],["Tokyo","Asia/Tokyo"]].map(x=>Array.isArray(x)?{name:x[0],tz:x[1]}:x).filter((c,i,a)=>i===0||c.tz!==localTz);
let pinned=store.get("pin",list[1]?.tz?list[1].name:list[0].name);
let shift=0, desktop=null, perms={};
const save=()=>{store.set("list",list);store.set("pin",pinned)};
function parts(tz,d){
  const f=new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"numeric",minute:"2-digit",hour12:false,weekday:"short",month:"short",day:"numeric",year:"numeric"});
  const o={};for(const p of f.formatToParts(d))o[p.type]=p.value;
  const h=+o.hour%24,m=+o.minute;
  const z=ZH?Object.fromEntries(new Intl.DateTimeFormat("zh-CN",{timeZone:tz,weekday:"short",month:"numeric",day:"numeric"}).formatToParts(d).map(p=>[p.type,p.value])):null;
  return {h,m,label:`${String(h).padStart(2,"0")}:${o.minute}`,wd:z?z.weekday:o.weekday,md:z?`${z.month}月${z.day}日`:`${o.month} ${o.day}`,ymd:`${o.year}-${o.month}-${o.day}`};
}
function tzOff(tz,d){const f=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric"});const o={};for(const p of f.formatToParts(d))o[p.type]=+p.value;return (Date.UTC(o.year,o.month-1,o.day,o.hour,o.minute)-Math.floor(d/6e4)*6e4)/6e4}

function rel(tz,d){
  const off=offsetMin(tz,d);if(tz===localTz) return T("Local time","本地时间");if(off===0) return T("Same time as you","与你时间相同");
  const am=Math.abs(off), s=(off>0?"+":"−")+Math.floor(am/60)+(am%60?":"+String(am%60).padStart(2,"0"):"")+"h";

function band(){
  // 24h strip: night, dawn, day, dusk, night (fixed hours, good enough for planning)
  return "linear-gradient(90deg,var(--night) 0%,var(--night) 25%,var(--dusk) 29%,var(--day) 33%,var(--day) 75%,var(--dusk) 79%,var(--night) 83%,var(--night) 100%)";
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
  const d=new Date(Date.now()+shift*6e4);
  $("list").innerHTML=list.map((c,i)=>{const p=parts(c.tz,d);return `<div class="row">
    <div class="city"><b><button class="pin ${c.name===pinned?"on":""}" data-pin="${i}" title="${T("Show in menu bar","在菜单栏显示")}" aria-label="${T(`Show ${esc(c.name)} in menu bar`,`在菜单栏显示${esc(cn(c.name))}`)}">${c.name===pinned?"●":"○"}</button>${esc(cn(c.name))}</b><span>${esc(rel(c.tz,d))} · ${esc(p.wd)} ${esc(p.md)}${i?` · <button class="del" data-del="${i}">Remove</button>`:""}</span></div>
    <div class="clock"><b>${p.label}</b></div>
    <div class="band" style="background:${band()}"><i style="left:calc(${((p.h*60+p.m)/1440*100).toFixed(2)}% - 1px)"></i></div></div>`}).join("");
  const off=shift;{const H=Math.floor(Math.abs(off)/60),M=Math.abs(off)%60;$("planlbl").textContent=off===0?T("Now","现在"):ZH?`${H?H+" 小时":""}${M?(H?" ":"")+M+" 分钟":""}${off<0?"前":"后"}`:`${off>0?"In ":""}${H?H+"h":""}${M?(H?" ":"")+M+"m":""}${off<0?" ago":""}`;}
  $("now").hidden=off===0;
  setTray();
}
function setTray(){
  if(!desktop?.tray||perms["menu-bar"]!=="granted") return;
  const d=new Date(), p=list.find(c=>c.name===pinned)||list[0];
  const abbr=p.name==="Here"?"":p.name.replace(/[^A-Za-zÀ-ÿ ]/g,"").split(" ").map(w=>w[0]).join("").slice(0,3).toUpperCase()||p.name.slice(0,3).toUpperCase();
  const nm=cn(p.name), short=nm.length<=6?nm:abbr;
  desktop.tray.set({title:`${short} ${parts(p.tz,d).label}`.trim(),toolTip:list.map(c=>`${cn(c.name)} ${parts(c.tz,d).label}`).join(" · ").slice(0,100),
    menu:[...list.map(c=>({label:`${cn(c.name)}   ${parts(c.tz,d).label}  ${parts(c.tz,d).wd}`,type:"checkbox",checked:c.name===p.name,click:()=>{pinned=c.name;save();render();}})),{type:"separator"},{label:T("Open World Clock","打开世界时钟"),click:()=>desktop.window.show().catch(()=>{})}]}).catch(()=>{});
}
// add city
const allTz=(Intl.supportedValuesOf?Intl.supportedValuesOf("timeZone"):[]);
function suggestions(q){
  q=q.trim().toLowerCase();if(!q) return [];
  const a=CITIES.filter(([n])=>n.toLowerCase().includes(q)||(ZH&&CITY_ZH[n]?.includes(q))).map(([n,tz])=>({name:n,tz}));
  const b=allTz.filter(tz=>tz.toLowerCase().replace(/_/g," ").includes(q)&&!a.some(x=>x.tz===tz)).map(tz=>({name:tz.split("/").pop().replace(/_/g," "),tz}));
  return [...a,...b].slice(0,7);
}
$("q").addEventListener("input",()=>{const s=suggestions($("q").value);$("sugg").hidden=!s.length;$("sugg").innerHTML=s.map((x,i)=>`<button data-add="${i}"><span>${esc(cn(x.name))}</span><small>${esc(parts(x.tz,new Date()).label)}</small></button>`).join("");$("sugg")._s=s;});
$("q").addEventListener("keydown",e=>{if(e.isComposing||e.keyCode===229)return;if(e.key==="Enter"){const s=$("sugg")._s;if(s?.length)addCity(s[0]);}if(e.key==="Escape"){$("sugg").hidden=true;}});

// AI: answer time questions and move the slider
let sample=null;
let askCtl=null;
const askBtn=()=>$("askf").querySelector("button");
$("askf").addEventListener("submit",async e=>{
  e.preventDefault();
  if(askCtl){askCtl.abort();return;}
  const q=$("aq").value.trim(); if(!q){$("aq").focus();return;}
  const ctl=askCtl=new AbortController();askBtn().textContent=T("Stop","停止");
  const now=new Date();
  const ctx=list.map(c=>{const p=parts(c.tz,now);return `${c.name} (${c.tz}): now ${p.wd} ${p.md} ${p.label}, UTC offset ${tzOff(c.tz,now)/60}h`}).join("\n");
  $("aa").removeAttribute("data-no-i18n");$("aa").textContent="Thinking…";
  try{
    const r=await sample.json(`You help someone plan across time zones. Their cities, with current local times:\n${ctx}\nThe first city is where they are. Assume working hours are 9:00-18:00 local unless they say otherwise. Answer their question in 1-3 short sentences in the language they used${ZH?" (Simplified Chinese if unclear)":""}, naming the local time in each relevant city. If a specific moment is the answer, also give shiftMinutes: minutes from now to that moment (between -720 and 720, multiple of 15); otherwise use null. If they mention a city not in the list, answer anyway and add it to addCities as {name, tz} with an IANA zone${ZH?" (name in Simplified Chinese)":""}. Reply with only JSON: {"answer": string, "shiftMinutes": number|null, "addCities": []}.\n\nQuestion: ${q.slice(0,500)}`,{modelTier:"default",cache:false,signal:ctl.signal});
    for(const c of (Array.isArray(r?.addCities)?r.addCities:[])){try{new Intl.DateTimeFormat("en",{timeZone:c.tz});if(c.name&&!list.some(x=>x.tz===c.tz&&x.name===c.name))list.push({name:String(c.name).slice(0,40),tz:c.tz});}catch{}}
    save();
    const sh=Number(r?.shiftMinutes);
    if(Number.isFinite(sh)&&r?.shiftMinutes!==null){shift=Math.max(-720,Math.min(720,Math.round(sh/15)*15));$("shift").value=shift;}
    render();
    $("aa").toggleAttribute("data-no-i18n",!!r?.answer);$("aa").textContent=String(r?.answer||"").slice(0,600)||"No answer.";
  }catch(err){
    $("aa").removeAttribute("data-no-i18n");if(err?.code==="cancelled"){$("aa").textContent="Stopped.";return;}$("aa").textContent={rate_limited:"Claude is busy or you hit your usage limit. Try later.",not_granted:"Claude isn't allowed for this app.",refused:"Claude declined this one."}[err?.code]||"Couldn't answer that. Try again.";
    if(err?.code==="not_granted"||err?.code==="sampling_disabled") $("ask").hidden=true;
  }finally{if(askCtl===ctl){askCtl=null;askBtn().textContent=T("✦ Ask","✦ 提问");}}
});
(async()=>{sample=window.claude?.use?await window.claude.use("sample").catch(()=>null):null;$("ask").hidden=!sample;})();

const DOCK_SVG="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\"><defs><linearGradient id=\"world-clock-bg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#22337E\"/><stop offset=\"1\" stop-color=\"#0A1238\"/><\/linearGradient><radialGradient id=\"world-clock-sh\" cx=\".28\" cy=\".05\" r=\".9\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\"0.22\"/><stop offset=\".6\" stop-color=\"#fff\" stop-opacity=\"0\"/><\/radialGradient><filter id=\"world-clock-ds\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"150%\"><feDropShadow dx=\"0\" dy=\"22\" stdDeviation=\"26\" flood-color=\"#000\" flood-opacity=\".28\"/><\/filter><filter id=\"world-clock-ds2\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"150%\"><feDropShadow dx=\"0\" dy=\"10\" stdDeviation=\"12\" flood-color=\"#000\" flood-opacity=\".22\"/><\/filter><linearGradient id=\"world-clock-day\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FFB45C\"/><stop offset=\".5\" stop-color=\"#5CB8FF\"/><\/linearGradient><\/defs><rect width=\"1024\" height=\"1024\" rx=\"230\" fill=\"url(#world-clock-bg)\"/><rect width=\"1024\" height=\"1024\" rx=\"230\" fill=\"url(#world-clock-sh)\"/><defs><clipPath id=\"world-clock-face\"><circle cx=\"512\" cy=\"512\" r=\"320\"/><\/clipPath><\/defs><g filter=\"url(#world-clock-ds)\"><circle cx=\"512\" cy=\"512\" r=\"320\" fill=\"#fff\"/><\/g><g clip-path=\"url(#world-clock-face)\"><rect x=\"0\" y=\"0\" width=\"1024\" height=\"1024\" fill=\"url(#world-clock-day)\"/><path d=\"M150 1000L1000 150V1024H150z\" fill=\"#14205A\"/><circle cx=\"390\" cy=\"380\" r=\"70\" fill=\"#FFF6C9\"/><circle cx=\"660\" cy=\"690\" r=\"10\" fill=\"#fff\"/><circle cx=\"730\" cy=\"600\" r=\"7\" fill=\"#fff\"/><circle cx=\"600\" cy=\"780\" r=\"6\" fill=\"#fff\"/><path d=\"M720 700a70 70 0 1 1-80-90 55 55 0 1 0 80 90z\" fill=\"#FFE27A\"/><\/g><circle cx=\"512\" cy=\"512\" r=\"320\" fill=\"none\" stroke=\"#fff\" stroke-width=\"22\"/><path d=\"M512 512V330M512 512l120 70\" stroke=\"#fff\" stroke-width=\"30\" stroke-linecap=\"round\"/><circle cx=\"512\" cy=\"512\" r=\"30\" fill=\"#fff\"/><rect x=\"3\" y=\"3\" width=\"1018\" height=\"1018\" rx=\"228\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".14\" stroke-width=\"6\"/><\/svg>";
function dockIconArt(){return new Promise(res=>{const img=new Image();img.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");x.shadowColor="rgba(0,0,0,.3)";x.shadowBlur=20;x.shadowOffsetY=8;x.drawImage(img,50,44,412,412);res(c.toDataURL("image/png"))}catch{res(dockIcon())}};img.onerror=()=>res(dockIcon());img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(DOCK_SVG)})}
/*END_DOCK_ART*/
function dockIcon(){
  const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,"#2b3a6b");g.addColorStop(1,"#0f1a33");
  x.fillStyle=g;x.beginPath();x.roundRect(8,8,240,240,54);x.fill();
  x.save();x.beginPath();x.arc(128,128,82,0,Math.PI*2);x.clip();
  const s=x.createLinearGradient(46,0,210,0);s.addColorStop(0,"#ffd88a");s.addColorStop(.5,"#f4a77a");s.addColorStop(.5,"#3d4f86");s.addColorStop(1,"#3d4f86");
  x.fillStyle=s;x.fillRect(40,40,176,176);x.restore();
  x.strokeStyle="#fff";x.lineWidth=10;x.beginPath();x.arc(128,128,82,0,Math.PI*2);x.stroke();
  x.lineCap="round";x.lineWidth=12;x.beginPath();x.moveTo(128,128);x.lineTo(128,74);x.moveTo(128,128);x.lineTo(166,146);x.stroke();
  x.fillStyle="#fff";x.beginPath();x.arc(128,128,9,0,Math.PI*2);x.fill();
  return c.toDataURL("image/png");
}
async function ensurePerms(){
  if(!desktop?.tray||perms["menu-bar"]==="granted") return;
  try{perms=await desktop.permissions.request(["menu-bar"]);}catch{}
  render();foot();
}
function foot(){
  if(!desktop?.tray) return;
  $("foot").replaceChildren();
  if(perms["menu-bar"]==="granted"){$("foot").textContent="The dot picks the city shown in your menu bar.";}
  else{const b=document.createElement("button");b.className="install";b.textContent="Show time in menu bar";b.onclick=ensurePerms;$("foot").replaceChildren(b);}
}
(async()=>{
  desktop=window.claude?.use?await window.claude.use("desktop").catch(()=>null):null;
  if(!desktop){$("foot").textContent="Open this in Claude for Mac or Windows to install it and keep a city's time in your menu bar.";return;}
  if(!desktop.tray){
    const st=await desktop.install.state().catch(()=>"unavailable");
    if(st==="available"){const b=document.createElement("button");b.className="install";b.textContent="Install as app";b.onclick=()=>desktop.install.request().catch(()=>{});$("foot").replaceChildren(b);}
    else $("foot").textContent=st==="installed"?"Installed. Open World Clock from your Applications or Start menu.":"Open this in Claude for Mac or Windows to install it and keep a city's time in your menu bar.";
    return;
  }
  dockIconArt().then(u=>desktop.app.dock.setIcon(u)).catch(()=>{});
  desktop.window.setOptions({titleBarStyle:"hiddenInset",dragHeight:30,width:460,height:620,minWidth:340,minHeight:420}).catch(()=>{});
  try{perms=await desktop.permissions.state();}catch{}
  render();foot();
})();
</script>
<script>
/*INSTALL_PROMPT*/
/* When this artifact is open in Claude Desktop but not installed as an app yet, invite the person
   to install it. Shows once per session; the install itself is Claude's own dialog, started from
   the person's click (install.request() needs a click). Silent in browsers, on mobile and inside the
   installed app. */
(async()=>{
  if(!window.claude||!claude.use)return;
  try{if(sessionStorage.getItem("appstore.installAsked"))return}catch{}
  const d=await claude.use("desktop").catch(()=>null);
  if(!d||d.fs||!d.install)return;                       // d.fs exists only inside the installed app
  const st=await d.install.state().catch(()=>"unavailable");
  if(st!=="available")return;
  await new Promise(r=>setTimeout(r,900));
  if(document.querySelector(".aspi"))return;
  const zh=window.__ZH??/^zh/i.test(navigator.language||"");
  const T=(en,c)=>zh?c:en;
  const name=(document.title||"").trim()||T("this app","这个 app");
  const icon=typeof DOCK_SVG==="string"?DOCK_SVG:(typeof ICON_SVG==="object"&&ICON_SVG.store)||"";
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const st2=document.createElement("style");
  st2.textContent=`.aspi{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:rgba(20,20,19,.42);padding:16px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.aspi .b{--bg:#FAF9F5;--fg:#141413;--mu:#6B6A64;--pill:#EDE6DA;--ac:#B9532F;--on:#fff;background:var(--bg);color:var(--fg);border-radius:18px;max-width:380px;width:100%;padding:24px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
@media (prefers-color-scheme:dark){.aspi .b{--bg:#262624;--fg:#FAF9F5;--mu:#A6A39A;--pill:#3A3632;--ac:#E08A6A;--on:#1F1E1D}}
.aspi .ic{width:72px;height:72px}.aspi .ic svg{width:72px;height:72px;display:block}
.aspi h3{margin:2px 0 0;font-size:18px;font-weight:700;line-height:1.25}
.aspi p{margin:0;color:var(--mu)}
.aspi .row{display:flex;flex-direction:column;gap:8px;align-self:stretch;margin-top:6px}
.aspi button{font-family:inherit;font-weight:600;font-size:15px;line-height:1;border:0;border-radius:999px;padding:12px 16px;cursor:pointer}
.aspi .y{background:var(--ac);color:var(--on)}.aspi .n{background:var(--pill);color:var(--fg)}`;
  const m=document.createElement("div");m.className="aspi";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("data-no-i18n","");
  m.innerHTML=`<div class="b"><div class="ic">${icon}</div>
    <h3>${esc(T(`Install ${name} as an app?`,`把「${name}」安装为 app？`))}</h3>
    <p>${esc(T("It gets its own window and Dock icon, opens like any other app, and keeps working on your Claude plan.","装好后有自己的窗口和 Dock 图标，像普通 app 一样打开，继续用你的 Claude 套餐。"))}</p>
    <div class="row"><button class="y">${esc(T("Install","安装"))}</button><button class="n">${esc(T("Not now","以后再说"))}</button></div></div>`;
  const close=()=>{m.remove();st2.remove();try{sessionStorage.setItem("appstore.installAsked","1")}catch{}};
  m.addEventListener("click",async e=>{
    if(e.target===m||e.target.closest(".n"))return close();
    if(e.target.closest(".y")){const r=await d.install.request().catch(()=>"failed");close();
      if(r==="failed"||r==="unavailable"){const n=document.createElement("div");n.textContent=T("Couldn't install. Use Install as app in the artifact's menu.","没装上。可以在工件菜单里选“安装为 app”。");n.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141413;color:#fff;padding:10px 14px;border-radius:10px;z-index:2147483000;font:13px system-ui";document.body.appendChild(n);setTimeout(()=>n.remove(),5000)}}
  });
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"&&m.isConnected){close();document.removeEventListener("keydown",k)}});
  document.head?document.head.appendChild(st2):document.body.appendChild(st2);document.body.appendChild(m);
  m.querySelector(".y").focus();
})();
/*END_INSTALL_PROMPT*/
</script>
