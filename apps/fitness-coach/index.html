<title>Fitness Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script type="application/json" id="claude-artifacts-manifest">{"permissions":["notifications"]}</script>
<style>
/* Layout: sidebar of sections (Today, Plan, Workout, Progress, Exercises, Food log, Meal plan, Body, Data) on the left,
   the current section on the right with a slim top bar. A rest timer pill floats at the bottom while resting. */
:root{
  --bg:#f4f4f2; --panel:#ffffff; --fg:#18191b; --muted:#6c6f75; --faint:#9a9da3; --line:#e2e2df; --chip:#eeeeeb; --hover:#f0f0ed;
  --accent:#e2552b; --accent-fg:#ffffff; --accent-soft:rgba(226,85,43,.12);
  --ok:#2f9e5b; --ok-soft:rgba(47,158,91,.13); --warn:#c47f12; --warn-soft:rgba(196,127,18,.14); --danger:#d23c3c;
  --p:#3d7be0; --c:#d99a1e; --f:#a35fd1;
  --shadow:0 10px 32px rgba(20,20,20,.14),0 1px 3px rgba(20,20,20,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151617;--panel:#1d1e20;--fg:#ececea;--muted:#9a9ca1;--faint:#6f7277;--line:#2e3033;--chip:#28292c;--hover:#26272a;--accent:#ff7a4d;--accent-fg:#2a0d03;--accent-soft:rgba(255,122,77,.16);--ok:#4cc17e;--ok-soft:rgba(76,193,126,.15);--warn:#e8a73d;--warn-soft:rgba(232,167,61,.15);--danger:#ff6b6b;--p:#6a9cf0;--c:#e9b54a;--f:#c18ae6;--shadow:0 12px 36px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151617;--panel:#1d1e20;--fg:#ececea;--muted:#9a9ca1;--faint:#6f7277;--line:#2e3033;--chip:#28292c;--hover:#26272a;--accent:#ff7a4d;--accent-fg:#2a0d03;--accent-soft:rgba(255,122,77,.16);--ok:#4cc17e;--ok-soft:rgba(76,193,126,.15);--warn:#e8a73d;--warn-soft:rgba(232,167,61,.15);--danger:#ff6b6b;--p:#6a9cf0;--c:#e9b54a;--f:#c18ae6;--shadow:0 12px 36px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--fg)}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app{display:flex;height:100vh;height:100dvh;width:100vw;overflow:hidden}
/* sidebar */
#side{width:212px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg);min-height:0}
.brand{display:flex;align-items:center;gap:8px;padding:14px 12px 10px max(14px,env(safe-area-inset-left,0px));font-weight:700;font-size:14px;letter-spacing:-.01em}
body.app .brand{padding-top:40px;app-region:drag;-webkit-app-region:drag}
.logo{width:24px;height:24px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff}
.logo .ic{width:15px;height:15px;stroke:#fff}
#nav{display:flex;flex-direction:column;gap:1px;padding:4px 8px 8px max(8px,env(safe-area-inset-left,0px));overflow:auto;flex:1}
#nav button{display:flex;align-items:center;gap:9px;border:0;background:transparent;border-radius:8px;padding:7px 9px;cursor:pointer;text-align:left;color:var(--fg);font-weight:520}
#nav button:hover{background:var(--hover)}
#nav button.on{background:var(--accent-soft);color:var(--accent)}
#nav button .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav kbd{font:11px var(--font);color:var(--faint);border:0;background:none}
#nav .live{font-size:11px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.sidefoot{padding:10px 12px max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#bar{display:flex;align-items:center;gap:6px;min-height:48px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
body.app #bar{app-region:drag;-webkit-app-region:drag}
body.app #bar>*,body.app #bar #acts>*{app-region:no-drag;-webkit-app-region:no-drag}
body.app #bar .sp{app-region:drag;-webkit-app-region:drag}
#vt{font-size:15px;font-weight:700;margin:0;white-space:nowrap;letter-spacing:-.01em}
#bar .sp{flex:1;min-width:6px;align-self:stretch}
#acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#view{flex:1;overflow:auto;outline:none;padding:18px max(16px,env(safe-area-inset-right,0px)) 90px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1080px;margin:0 auto}
/* controls */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:560;min-height:30px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.pri:hover{filter:brightness(1.06);background:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:3px 8px;min-height:26px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn kbd,.k{font:11px var(--font);opacity:.7;border:0;background:none;padding:0}
.ib{border:0;background:transparent;border-radius:7px;width:30px;height:30px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);flex:none;padding:0}
.ib:hover{background:var(--hover);color:var(--fg)}
.ib:disabled{opacity:.35;cursor:default}
.ai{color:var(--accent)}
input.in,select.in,textarea.in{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 9px;outline:none;min-height:32px;max-width:100%}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;width:100%;line-height:1.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:560}
label.f>span{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;cursor:pointer;font-weight:540;font-size:12.5px;color:var(--fg)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.sp{flex:1}
h2{font-size:14px;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
h3{font-size:13px;margin:0 0 6px;font-weight:650}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.empty{color:var(--muted);text-align:center;padding:28px 16px;font-size:13px}
.empty .big{font-size:15px;font-weight:650;color:var(--fg);margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;letter-spacing:.02em;white-space:nowrap}
.badge.pr{background:var(--warn-soft);color:var(--warn)}
.badge.est{background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.mute{background:var(--chip);color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.li:hover{background:var(--hover)}
.li .t{flex:1;min-width:0}
.li .n{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:flex;gap:18px;flex-wrap:wrap}
.kv div b{display:block;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kv div span{font-size:11.5px;color:var(--muted)}
.bar2{height:7px;border-radius:9px;background:var(--chip);overflow:hidden}
.bar2>i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.note{font-size:12px;color:var(--muted);background:var(--chip);border-radius:9px;padding:8px 10px}
.sec{margin-top:18px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
/* logger */
.wohead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.wohead input.title{font-size:17px;font-weight:700;border:1px solid transparent;background:transparent;border-radius:7px;padding:3px 6px;outline:none;min-width:0;flex:1 1 220px}
.wohead input.title:hover{border-color:var(--line)}
.wohead input.title:focus{border-color:var(--accent);background:var(--panel)}
.elapsed{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.exb{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px;margin-bottom:12px}
.exh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.exn{border:0;background:transparent;padding:0;font-weight:700;font-size:14px;color:var(--accent);cursor:pointer;text-align:left}
.mus{font-size:11.5px;color:var(--muted)}
.sugg{font-size:12px;margin:6px 0 2px;color:var(--fg);background:var(--ok-soft);border-radius:7px;padding:5px 8px}
.sugg b{color:var(--ok)}
.exnote{width:100%;border:0;border-bottom:1px dashed transparent;background:transparent;padding:4px 0;outline:none;font-size:12.5px;color:var(--muted)}
.exnote:focus{border-bottom-color:var(--line);color:var(--fg)}
.sets{display:flex;flex-direction:column;margin-top:4px}
.srow{display:grid;grid-template-columns:34px minmax(60px,1fr) 74px 58px 50px 34px;gap:6px;align-items:center;padding:3px 4px;border-radius:7px}
.srow.hd{font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;padding-bottom:0}
.srow.k-time,.srow.k-cardio{grid-template-columns:34px minmax(60px,1fr) 74px 74px 34px}
.srow.done{background:var(--ok-soft)}
.srow input{width:100%;border:1px solid transparent;background:var(--chip);border-radius:6px;padding:5px 6px;text-align:center;font-variant-numeric:tabular-nums;outline:none;min-height:28px}
.srow input:focus{border-color:var(--accent);background:var(--panel)}
.srow.done input{background:transparent}
.srow input::placeholder{color:var(--faint)}
.stype{border:0;background:transparent;font-weight:700;cursor:pointer;border-radius:6px;padding:4px 0;font-variant-numeric:tabular-nums}
.stype:hover{background:var(--hover)}
.stype.t-w{color:var(--warn)}.stype.t-d{color:var(--p)}.stype.t-f{color:var(--danger)}
.prev{border:0;background:transparent;color:var(--faint);font-size:12px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 2px;border-radius:6px}
.prev:hover{color:var(--fg);background:var(--hover)}
.chk{width:30px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;color:var(--faint);padding:0}
.chk:hover{border-color:var(--ok);color:var(--ok)}
.srow.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.srow .prb{grid-column:2/-1;margin-top:-2px}
.exfoot{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.restsel{font-size:12px;border:0;background:transparent;color:var(--accent);cursor:pointer;padding:2px;border-radius:6px}
/* rest pill */
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);border-radius:14px;padding:8px 10px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);min-width:300px;max-width:calc(100vw - 32px)}
#rest .rt{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;min-width:56px}
#rest .rl{font-size:11.5px;opacity:.75;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rest button{border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:8px;padding:5px 8px;font-weight:700;cursor:pointer;font-size:12px}
#rest .pg{position:absolute;left:10px;right:10px;bottom:3px;height:3px;border-radius:3px;background:rgba(127,127,127,.3);overflow:hidden}
#rest .pg i{display:block;height:100%;background:var(--accent)}
#rest.over .rt{color:var(--accent)}
/* calendar */
.calhd{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.cal .dh{font-size:11px;font-weight:700;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg)}
.cal .dc{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .dc.out{background:var(--bg)}
.cal .dc.today .dn{background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:0 5px}
.cal .dc.drop{background:var(--accent-soft)}
.dn{font-size:11px;font-weight:700;color:var(--muted);align-self:flex-start}
.sch{border:0;border-radius:6px;padding:3px 6px;font-size:11.5px;font-weight:600;text-align:left;cursor:pointer;background:var(--accent-soft);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;border-left:3px solid var(--accent)}
.sch.done{background:var(--ok-soft);border-left-color:var(--ok)}
.sch.miss{background:var(--chip);border-left-color:var(--faint);color:var(--muted)}
.sch.log{background:var(--chip);border-left-color:var(--ok)}
.sch.deload{border-left-style:dashed}
.addday{border:0;background:transparent;color:var(--faint);font-size:11px;cursor:pointer;margin-top:auto;align-self:flex-start;padding:0 3px;opacity:0}
.dc:hover .addday,.addday:focus{opacity:1}
.agenda .ag{display:flex;gap:12px;padding:8px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.agenda .ag .d{width:96px;flex:none;font-size:12px;color:var(--muted);font-weight:600}
.agenda .ag.today .d{color:var(--accent)}
.agenda .ag .xs{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
/* tables */
.tsc{overflow-x:auto}.tsc table.t{min-width:520px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);text-align:left;font-weight:700;padding:4px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
table.t tr:last-child td{border-bottom:0}
.cellin{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 5px;outline:none;font-variant-numeric:tabular-nums;min-width:0}
.cellin:hover{border-color:var(--line)}
.cellin:focus{border-color:var(--accent);background:var(--panel)}
.cellin.r{text-align:right}
/* food */
.daynav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.daynav .dt{font-weight:700;font-size:15px;min-width:150px;text-align:center}
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.macro .lb{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.macro .vv{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.macro.p .bar2>i{background:var(--p)}.macro.c .bar2>i{background:var(--c)}.macro.f .bar2>i{background:var(--f)}
.macro.over .bar2>i{background:var(--danger)}
.addbar{display:flex;gap:6px;align-items:center;position:relative;flex-wrap:wrap}
.addbar .q{flex:1 1 240px;min-width:0}
.dd{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:30;max-height:320px;overflow:auto;padding:4px}
.dd .o{display:flex;gap:8px;align-items:center;padding:7px 9px;border-radius:7px;cursor:pointer}
.dd .o.on,.dd .o:hover{background:var(--accent-soft)}
.dd .o .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd .o .s{font-size:11.5px;color:var(--muted);white-space:nowrap}
.dd .gh{font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:6px 9px 2px}
.meal{margin-top:14px}
.meal .mh{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.meal .mh h3{margin:0}
.foodtbl td:first-child{width:22px}
.foodtbl .nm{min-width:120px}
.drop-hint{border:2px dashed var(--accent);background:var(--accent-soft);position:fixed;inset:8px;border-radius:16px;z-index:60;display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--accent);pointer-events:none}
/* meal plan */
.wk{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.wk .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.wk .ch{font-size:12px;font-weight:700;padding:2px 2px 0}
.wk .ch span{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.mc{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 8px;cursor:pointer;text-align:left;width:100%}
.mc:hover{border-color:var(--accent)}
.mc .ml{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700}
.mc .mn{font-weight:600;font-size:12.5px;line-height:1.3;margin:2px 0}
.mc .mk{font-size:11.5px;color:var(--muted)}
.mc.logged{border-color:var(--ok)}
.shop .aisle{margin-bottom:12px}
.shop label{display:flex;gap:8px;align-items:center;padding:4px 2px;cursor:pointer}
.shop label.got span{text-decoration:line-through;color:var(--faint)}
/* charts */
.chart{display:block;overflow:visible}
.chart text{font:10.5px var(--font);fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln2{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-dasharray:4 4}
.chart .dot{fill:var(--accent)}
.chart .bar{fill:var(--accent)}
.chart .bar.lo{fill:var(--accent-soft)}
.chart .tgt{stroke:var(--fg);stroke-width:1;stroke-dasharray:3 3;opacity:.5}
.chart .hit{fill:transparent;cursor:crosshair}
.chartwrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:11.5px;padding:4px 7px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-115%);z-index:5}
.hbar{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:12px;margin:3px 0}
.hbar .bar2{height:9px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,10,10,.38);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow:auto}
.md{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:520px;display:flex;flex-direction:column;max-height:88vh;border:1px solid var(--line)}
.md.wide{max-width:820px}
.md .mhd{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.md .mhd h2{margin:0;flex:1;font-size:15px}
.md .mbd{padding:4px 16px 12px;overflow:auto;min-height:0}

.menu{position:fixed;z-index:90;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:180px}

.menu button:hover,.menu button.on{background:var(--accent-soft)}
.menu button.danger{color:var(--danger)}
.pick .li.on{background:var(--accent-soft)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(76px,env(safe-area-inset-bottom,0px));z-index:95;background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 10px 8px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);max-width:calc(100vw - 32px);font-weight:540}
#toast button{border:0;background:rgba(127,127,127,.28);color:inherit;border-radius:7px;padding:4px 9px;font-weight:700;cursor:pointer}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 1s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.photo{max-width:100%;max-height:220px;border-radius:10px;display:block;margin:0 auto 10px;object-fit:contain}
.banner{background:var(--warn-soft);color:var(--fg);padding:8px 16px;font-size:12.5px;border-bottom:1px solid var(--line)}

.dz.on{border-color:var(--accent);background:var(--accent-soft)}
.kbdl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kbdl kbd{align-self:start;font:600 11.5px var(--font);background:var(--chip);border-radius:5px;padding:2px 6px;justify-self:start;white-space:nowrap}
.sess-ex{display:grid;grid-template-columns:minmax(0,1fr) 54px 70px 50px 64px 28px;gap:6px;align-items:center;margin-bottom:6px}
.sess-ex .sg{grid-column:1/-1;font-size:11.5px;color:var(--ok);margin-top:-3px}
.pickbtn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 8px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:30px}
@media (max-width:760px){
  #app{flex-direction:column}

  body.app #side{padding-left:72px}

  #nav button{flex-direction:column;gap:2px;padding:5px 8px;font-size:11px;flex:none}
  #nav kbd{display:none}
  .sidefoot{display:none}
  .macros{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards{grid-template-columns:1fr}
  .wk{grid-template-columns:1fr;overflow:visible}
  #view{padding-top:14px}
  .hbar{grid-template-columns:90px 1fr 30px}
}
@media (max-width:480px){
  .srow{grid-template-columns:28px minmax(44px,1fr) 62px 48px 40px 30px;gap:4px}

  #bar #acts .hide-s{display:none}
  .sess-ex{grid-template-columns:minmax(0,1fr) 44px 58px 44px 28px}
  .sess-ex .rs{display:none}
  .daynav .dt{min-width:0}
  #rest{min-width:0;left:16px;right:16px;transform:none}
}

const allEx=()=>[...LIB,...S.custom.filter(c=>!LIBMAP.has(normName(c.name)))];
function guessMuscle(n){n=String(n).toLowerCase();const R=[[/bench|chest|fly|push ?up|pec/,"chest"],[/squat|leg press|lunge|leg ext|step up/,"quads"],[/romanian|rdl|leg curl|hamstring|good morning/,"hamstrings"],[/deadlift|back ext|hyperext/,"lower back"],[/hip thrust|glute|abduct|kickback/,"glutes"],[/pull ?up|chin ?up|pulldown|lat /,"lats"],[/row|shrug|pull apart/,"upper back"],[/curl/,"biceps"],[/tricep|pushdown|skull|dip|extension/,"triceps"],[/press|raise|delt|shoulder|face pull/,"shoulders"],[/calf/,"calves"],[/crunch|plank|ab |abs|sit ?up|leg raise|twist/,"abs"],[/run|cycl|bike|row(ing)? machine|walk|swim|elliptical|stair|cardio|jog/,"cardio"]];for(const [re,m] of R)if(re.test(n))return m;return "other"}
function guessKind(n){n=String(n).toLowerCase();if(/plank|hold|hang\b|wall sit/.test(n))return "t";if(/run|cycl|bike|walk|swim|elliptical|stair|jog|rowing|treadmill/.test(n))return "c";return "w"}

/* ---------- history helpers ---------- */
let _rec=null,_ver=0;
function invalidate(){_rec=null;_ver++}
function sortWorkouts(){S.workouts.sort((a,b)=>b.start-a.start)}
const isWork=s=>s.t!=="w";
function records(){ // per exercise bests across history
  if(_rec)return _rec;const m=new Map();
  for(const w of S.workouts)for(const e of w.ex){const k=normName(e.n);let r=m.get(k);if(!r){r={name:e.n,maxW:0,maxE:0,maxV:0,maxR:0,count:0,last:0};m.set(k,r)}r.count++;if(w.start>r.last)r.last=w.start;
    for(const s of e.sets){if(!isWork(s))continue;const wv=s.w||0,rv=s.r||0;if(wv>r.maxW)r.maxW=wv;const e1=e1rm(wv,rv);if(e1>r.maxE)r.maxE=e1;if(wv*rv>r.maxV)r.maxV=wv*rv;if(rv>r.maxR)r.maxR=rv}}
  _rec=m;return m}
function sessionsOf(name,exceptId){const k=normName(name),out=[];for(const w of S.workouts){if(w.id===exceptId)continue;const e=w.ex.find(x=>normName(x.n)===k);if(e)out.push({w,e})}return out} // newest first
function lastOf(name,exceptId){const k=normName(name);for(const w of S.workouts){if(w.id===exceptId)continue;const e=w.ex.find(x=>normName(x.n)===k);if(e)return {w,e}}return null}
function setText(s,kind){if(kind==="t")return s.s!=null?fmtClock(s.s):"";if(kind==="c")return [s.d!=null?`${fD(s.d)} ${dUnit()}`:"",s.s!=null?fmtClock(s.s):""].filter(Boolean).join(" · ");
  if(s.r==null&&s.w==null)return "";return `${s.w!=null&&s.w!==0?fW(s.w)+" "+wUnit()+" × ":""}${s.r??"–"}${s.rpe!=null?" @"+s.rpe:""}`}
function workoutVolume(w){let v=0;for(const e of w.ex)for(const s of e.sets)if(isWork(s))v+=(s.w||0)*(s.r||0);return v}
function workoutSets(w){let n=0;for(const e of w.ex)for(const s of e.sets)if(isWork(s))n++;return n}
function parseRange(r){const m=String(r||"").match(/(\d+)\s*(?:[-–~to]+\s*(\d+))?/);if(!m)return null;const lo=+m[1],hi=m[2]?+m[2]:lo;return {lo:Math.min(lo,hi),hi:Math.max(lo,hi)}}
function incFor(info){const lower=["quads","hamstrings","glutes","lower back"].includes(info.primary);if(U()==="lb")return lower&&info.equip==="barbell"?10:5;if(info.equip==="dumbbell"||info.equip==="kettlebell")return 2;return lower&&(info.equip==="barbell"||info.equip==="machine")?5:2.5}
const roundTo=(v,step)=>Math.round(v/step)*step;
/* progressive overload suggestion (double progression with RPE check, deload after two misses) */
function suggest(name,reps,rpe,exceptId){
  const info=exInfo(name);if(info.kind!=="w")return null;const rg=parseRange(reps);const ss=sessionsOf(name,exceptId).slice(0,3);
  if(!ss.length)return {w:null,r:rg?rg.lo:null,why:L("No history yet. Pick a weight you could lift for "+(rg?rg.hi+2:10)+" reps.","还没有记录。选一个你能做 "+(rg?rg.hi+2:10)+" 次的重量。")};
  const work=x=>x.e.sets.filter(isWork).filter(s=>s.r);const last=work(ss[0]);if(!last.length)return null;
  const top=Math.max(...last.map(s=>s.w||0));const topSets=last.filter(s=>(s.w||0)===top);const minR=Math.min(...topSets.map(s=>s.r));const rpes=topSets.map(s=>s.rpe).filter(x=>x!=null);const avgRpe=rpes.length?rpes.reduce((a,b)=>a+b,0)/rpes.length:null;
  const lastTxt=`${fW(top)} ${wUnit()} × ${topSets.map(s=>s.r).join(", ")}${avgRpe!=null?" @"+round(avgRpe,1):""}`;
  if(!top)return {w:null,r:rg?Math.min(rg.hi,minR+1):minR+1,why:L("Last: ","上次：")+topSets.map(s=>s.r).join(", ")+L(" reps. Add a rep."," 次。加一次。")};
  const inc=incFor(info), step=U()==="lb"?(info.equip==="dumbbell"?5:2.5):(info.equip==="dumbbell"?1:1.25);
  const lo=rg?rg.lo:minR,hi=rg?rg.hi:minR;const target=rpe||8;
  if(minR>=hi&&(avgRpe==null||avgRpe<=target+0.5)){const nw=fromD(roundTo(toD(top)+inc,step));return {w:nw,r:lo,why:L(`Last: ${lastTxt}. You hit ${hi} reps on every set, so add ${inc} ${wUnit()}.`,`上次：${lastTxt}。每组都做满 ${hi} 次，加 ${inc} ${wUnit()}。`)}}
  if(minR<lo){const prev=ss[1]?work(ss[1]):[];const prevTop=prev.length?Math.max(...prev.map(s=>s.w||0)):0;const prevMin=prev.length?Math.min(...prev.filter(s=>(s.w||0)===prevTop).map(s=>s.r)):99;
    if(prevTop===top&&prevMin<lo){const nw=fromD(roundTo(toD(top)*0.9,step));return {w:nw,r:lo,why:L(`Missed ${lo} reps twice at ${fW(top)} ${wUnit()}. Drop about 10% and build back up.`,`在 ${fW(top)} ${wUnit()} 连续两次没做到 ${lo} 次，减重约 10% 再往上加。`)}}
    return {w:top,r:lo,why:L(`Last: ${lastTxt}. Stay at this weight and aim for ${lo} reps.`,`上次：${lastTxt}。保持重量，目标 ${lo} 次。`)}}
  return {w:top,r:Math.min(hi,minR+1),why:L(`Last: ${lastTxt}. Same weight, one more rep.`,`上次：${lastTxt}。重量不变，多做一次。`)}}
function sugText(sg){if(!sg||sg.w==null)return "";return `${sg.w!=null?fW(sg.w)+" "+wUnit()+" × ":""}${sg.r??""}`}

const CH=new Map();
function chartBox(kind,args){const id="ch"+uid();CH.set(id,{kind,args});return `<div class="chartwrap" id="${id}" data-chart="[]" style="min-height:${(args[1]?.h||170)}px"></div>`}
function lineChart(series,opt={}){if(series.flatMap(s=>s.pts).length<1)return `<div class="empty small">${esc(L("Not enough data yet.","数据还不够。"))}</div>`;return chartBox("line",[series,opt])}
function barChart(items,opt={}){if(!items.length)return `<div class="empty small">${esc(L("Not enough data yet.","数据还不够。"))}</div>`;return chartBox("bar",[items,opt])}
function drawCharts(){for(const [id,spec] of CH){const el=document.getElementById(id);if(!el){CH.delete(id);continue}const W=Math.max(240,Math.round(el.clientWidth||600));const r=spec.kind==="line"?svgLine(W,...spec.args):svgBar(W,...spec.args);el.innerHTML=r.svg;el.dataset.chart=r.data}}
addEventListener("resize",()=>{clearTimeout(drawCharts.t);drawCharts.t=setTimeout(drawCharts,120)});
function svgLine(W,series,{h=180,yfmt=v=>fmtN(v),xfmt=t=>fmtDate(t,{month:"short",day:"numeric"}),target=null}={}){
  const pts=series.flatMap(s=>s.pts);const H=h,ml=46,mr=12,mt=10,mb=24;let x0=Math.min(...pts.map(p=>p[0])),x1=Math.max(...pts.map(p=>p[0]));if(x0===x1){x0-=864e5;x1+=864e5}
  let ys=pts.map(p=>p[1]);if(target!=null)ys.push(target);let y0=Math.min(...ys),y1=Math.max(...ys);const padY=(y1-y0)*0.12||Math.max(1,Math.abs(y1)*0.05);y0-=padY;y1+=padY;
  const X=v=>ml+(v-x0)/(x1-x0)*(W-ml-mr),Y=v=>mt+(1-(v-y0)/(y1-y0))*(H-mt-mb);
  const ticks=4;let g="";for(let i=0;i<=ticks;i++){const v=y0+(y1-y0)*i/ticks;g+=`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${ml-6}" y="${Y(v)+3.5}" text-anchor="end">${esc(yfmt(v))}</text>`}
  const nx=W<420?2:3;for(let i=0;i<=nx;i++){const v=x0+(x1-x0)*i/nx;g+=`<text x="${X(v)}" y="${H-6}" text-anchor="${i===0?"start":i===nx?"end":"middle"}">${esc(xfmt(v))}</text>`}
  if(target!=null)g+=`<line class="tgt" x1="${ml}" x2="${W-mr}" y1="${Y(target)}" y2="${Y(target)}"/>`;
  for(const s of series){const p=s.pts.slice().sort((a,b)=>a[0]-b[0]);if(!p.length)continue;g+=`<path class="${s.cls||"ln"}" d="${p.map((q,i)=>(i?"L":"M")+X(q[0]).toFixed(1)+" "+Y(q[1]).toFixed(1)).join("")}"/>`;if(s.dots!==false&&p.length<=60)g+=p.map(q=>`<circle class="dot" r="${s.cls?2:2.6}" cx="${X(q[0])}" cy="${Y(q[1])}" ${s.cls?'opacity=".5"':""}/>`).join("")}
  const main=series[0].pts.slice().sort((a,b)=>a[0]-b[0]);
  return {svg:`<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series[0].label||"chart")}">${g}</svg>`,data:JSON.stringify(main.map(q=>[X(q[0])/W,Y(q[1])/H,xfmt(q[0]),yfmt(q[1])]))}}
function svgBar(W,items,{h=170,yfmt=v=>fmtN(v),target=null,label=""}={}){
  const H=h,ml=46,mr=8,mt=10,mb=24;const y1=Math.max(...items.map(i=>i.v),target||0)*1.1||1;const bw=(W-ml-mr)/items.length;const Y=v=>mt+(1-v/y1)*(H-mt-mb);let g="";
  for(let i=0;i<=4;i++){const v=y1*i/4;g+=`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${ml-6}" y="${Y(v)+3.5}" text-anchor="end">${esc(yfmt(v))}</text>`}
  const every=Math.ceil(items.length/Math.max(2,Math.floor((W-ml)/48)));
  items.forEach((it,i)=>{const x=ml+i*bw+bw*0.18,w=bw*0.64;g+=`<rect class="bar ${it.lo?"lo":""}" x="${x}" y="${Y(it.v)}" width="${w}" height="${Math.max(0,H-mb-Y(it.v))}" rx="3"/>`;if(i%every===0)g+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc(it.x)}</text>`});
  if(target)g+=`<line class="tgt" x1="${ml}" x2="${W-mr}" y1="${Y(target)}" y2="${Y(target)}"/>`;
  return {svg:`<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg>`,data:JSON.stringify(items.map((it,i)=>[(ml+i*bw+bw/2)/W,Y(it.v)/H,it.x,yfmt(it.v)]))}}
document.addEventListener("mousemove",e=>{const w=e.target.closest?.(".chartwrap");$$(".chartwrap .tip").forEach(t=>{if(t.parentElement!==w)t.remove()});if(!w)return;let d;try{d=JSON.parse(w.dataset.chart)}catch{return}if(!d.length)return;const r=w.getBoundingClientRect();const fx=(e.clientX-r.left)/r.width;let best=d[0];for(const q of d)if(Math.abs(q[0]-fx)<Math.abs(best[0]-fx))best=q;let t=w.querySelector(".tip");if(!t){t=document.createElement("div");t.className="tip";w.appendChild(t)}t.textContent=`${best[2]}: ${best[3]}`;t.style.left=best[0]*r.width+"px";t.style.top=best[1]*r.height+"px"});
function bodySpark(){const pts=S.body.filter(b=>b.date>=addDays(today(),-60)).map(b=>[pYmd(b.date).getTime(),toD(b.w)]);if(pts.length<2)return S.body.length?"":`<p class="small muted">${esc(L("Log your weight a few times a week to see the trend.","每周记录几次体重，就能看到趋势。"))}</p>`;return lineChart([{pts,label:"weight"}],{h:120,yfmt:v=>fmtN(v,1)})}

function templatePlan(f){const al=allowedEq(f);const n=f.days;const sp=SPLITS[n]||SPLITS[3];const maxEx=f.minutes<=30?4:f.minutes<=45?5:f.minutes<=60?6:7;

function expandPlan(tpl,f,keepFrom){const order=f.weekdays.slice().sort((a,b)=>((a+6)%7)-((b+6)%7));const sessions=[];const start=f.start;const st=pYmd(start);const monday=addDays(start,-((st.getDay()+6)%7));

function rowOf(el){const r=el.closest(".srow[data-ei]");if(!r)return null;const ex=S.active.ex[+r.dataset.ei];return {r,ex,s:ex.sets[+r.dataset.si],ei:+r.dataset.ei,si:+r.dataset.si}}

function parseQuick(q){const m=q.match(/^(.*?)[\s,]+(\d+(?:[.,]\d+)?)\s*(?:kcal|cal|千卡|大卡|卡)?((?:\s+\d+(?:[.,]\d+)?\s*[pcf蛋碳脂])*)\s*$/i);if(!m||!m[1].trim())return null;const o={name:m[1].trim(),kcal:num(m[2]),p:0,c:0,f:0};
  for(const t of (m[3]||"").matchAll(/(\d+(?:[.,]\d+)?)\s*([pcf蛋碳脂])/gi)){const k={p:"p",c:"c",f:"f","蛋":"p","碳":"c","脂":"f"}[t[2].toLowerCase()];o[k]=num(t[1])}if(!(m[3]||"").trim()&&o.kcal){}return o}
function foodOptions(q){const nq=normName(q);if(!nq)return [];const seen=new Set(),out=[];
  for(const sm of S.meals)if(normName(sm.name).includes(nq))out.push({g:L("Saved meals","常用套餐"),saved:sm,name:sm.name,kcal:sm.items.reduce((a,x)=>a+(x.kcal||0),0)});
  const mine=[];for(const d of Object.keys(S.food).sort().reverse())for(const x of S.food[d]){const k=normName(x.name);if(seen.has(k))continue;if(k.includes(nq)){seen.add(k);mine.push({g:L("Your foods","你的食物"),item:x,name:x.name,kcal:x.kcal,amt:x.amt})}if(mine.length>=8)break}
  out.push(...mine);for(const f of FOODS){const nm=window.__ZH?f.zh:f.name;if((normName(f.name).includes(nq)||normName(f.zh).includes(nq))&&!seen.has(normName(nm)))out.push({g:L("Common foods","常见食物"),item:{name:nm,amt:f.amt,kcal:f.kcal,p:f.p,c:f.c,f:f.f},name:nm,kcal:f.kcal,amt:f.amt})}
  const qp=parseQuick(q);if(qp&&qp.kcal)out.unshift({g:L("Quick add","快速添加"),quick:qp,name:qp.name,kcal:qp.kcal});
  if(sample)out.push({g:L("Ask Claude","询问 Claude"),ai:true,name:L(`Estimate “${q}” with Claude`,`用 Claude 估算“${q}”`)});
  return out.slice(0,24)}
let ddSel=0,ddItems=[];
after.food=()=>{const q=$("#fQ"),dd=$("#fDD");$("#fMeal").onchange=e=>{ui.meal=e.target.value};$("#foodDate").onchange=e=>{if(e.target.value){ui.foodDate=e.target.value;render()}};
  const draw=()=>{ddItems=foodOptions(q.value);if(!ddItems.length){dd.hidden=true;return}ddSel=clamp(ddSel,0,ddItems.length-1);let g="";dd.innerHTML=ddItems.map((o,i)=>{const h=o.g!==g?`<div class="gh">${esc(o.g)}</div>`:"";g=o.g;return h+`<div class="o ${i===ddSel?"on":""}" data-i="${i}">${o.ai?ic("spark","ai"):""}<span class="t">${esc(o.name)}</span><span class="s">${o.amt?esc(o.amt)+" · ":""}${o.kcal!=null?fmtN(o.kcal)+" kcal":""}</span></div>`}).join("");dd.hidden=false;dd.querySelector(".on")?.scrollIntoView({block:"nearest"})};
  q.oninput=()=>{ddSel=0;draw()};q.onfocus=()=>{if(q.value)draw()};q.onblur=()=>setTimeout(()=>{dd.hidden=true},150);
  q.onkeydown=e=>{if(e.isComposing)return;if(e.key==="ArrowDown"&&!dd.hidden){e.preventDefault();ddSel=Math.min(ddItems.length-1,ddSel+1);draw()}else if(e.key==="ArrowUp"&&!dd.hidden){e.preventDefault();ddSel=Math.max(0,ddSel-1);draw()}else if(e.key==="Enter"){e.preventDefault();foodChoose(ddItems.length&&!dd.hidden?ddItems[ddSel]:null)}else if(e.key==="Escape"){dd.hidden=true;e.stopPropagation()}};
  dd.onmousedown=e=>{const o=e.target.closest("[data-i]");if(o){e.preventDefault();foodChoose(ddItems[+o.dataset.i])}};

const UNIT_N={g:["g",1],gram:["g",1],grams:["g",1],kg:["g",1000],ml:["ml",1],l:["ml",1000],oz:["g",28.35],lb:["g",453.6],"克":["g",1],"毫升":["ml",1],pc:["pc",1],pcs:["pc",1],piece:["pc",1],pieces:["pc",1],"个":["pc",1],whole:["pc",1],tbsp:["tbsp",1],tsp:["tsp",1],cup:["cup",1],cups:["cup",1]};
function shopItems(){const mp=S.mealPlan;const mult=mp.prefs?.servings||1;const map=new Map();
  for(const d of mp.days)for(const m of d.meals)for(const i of m.ingredients){const u0=(i.unit||"").toLowerCase();const [u,f]=UNIT_N[u0]||[u0,1];let nm=normName(i.item);if(nm.length>3&&nm.endsWith("s")&&!nm.endsWith("ss"))nm=nm.slice(0,-1);const k=nm+"|"+u;const e=map.get(k)||{k,item:i.item,unit:u,qty:0,anyQty:false,aisle:i.aisle||"Other",n:0};if(i.qty!=null){e.qty+=i.qty*f*mult;e.anyQty=true}e.n++;map.set(k,e)}
  return [...map.values()]}
const fmtQty=(q,u)=>{if(u==="g"&&q>=1000)return `${round(q/1000,2)} kg`;if(u==="ml"&&q>=1000)return `${round(q/1000,2)} l`;return `${u==="pc"?Math.ceil(q):round(q,u==="g"||u==="ml"?0:1)}${u&&u!=="pc"?" "+u:u==="pc"?" ×":""}`};

function helpModal(){const rows=[["1 – 9",L("Switch section (also ⌘1 – ⌘9)","切换栏目（也可用 ⌘1 – ⌘9）")],["N",L("Start an empty workout","开始空白训练")],["⌘E  /",L("Add exercise to the workout","给训练添加动作")],["Enter",L("Next field; on the last field, complete the set and start rest","下一格；在最后一格时完成该组并开始休息")],["⌘Enter",L("Complete or un-complete the set","完成或取消完成该组")],["⇧Enter",L("Add a set below","在下方添加一组")],["↑ ↓",L("Same field in the previous / next set","上一组/下一组的同一格")],["⌥↑ ⌥↓",L("Change weight, reps or RPE by one step","按一个步长调整重量、次数或 RPE")],["⌘⌫",L("Delete the set","删除该组")],["⌘⇧Enter",L("Finish workout","完成训练")],["A  /",L("Food log: focus the add box","饮食记录：聚焦添加框")],["← →  T",L("Food log: previous / next day, today","饮食记录：前一天/后一天/今天")],["P",L("Food log: photo of a meal","饮食记录：拍照估算")],["W",L("Body weight: focus the weight box","体重：聚焦体重输入框")],["⌘Z  ⌘⇧Z",L("Undo / redo","撤销/重做")],["Esc",L("Close a dialog","关闭对话框")]];
  openModal({title:L("Keyboard shortcuts","键盘快捷键"),body:`<div class="kbdl">${rows.map(([k,v])=>`<kbd>${esc(k)}</kbd><span>${esc(v)}</span>`).join("")}</div>`})}

function dockIconArt(){return new Promise(res=>{const img=new Image();img.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");x.shadowColor="rgba(0,0,0,.3)";x.shadowBlur=20;x.shadowOffsetY=8;x.drawImage(img,50,44,412,412);res(c.toDataURL("image/png"))}catch{res(dockIcon())}};img.onerror=()=>res(dockIcon());img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(DOCK_SVG)})}
/*END_DOCK_ART*/
function dockIcon(){const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");const g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,"#ff8a52");g.addColorStop(1,"#d9431e");x.fillStyle=g;x.beginPath();x.roundRect(8,8,240,240,56);x.fill();
  x.fillStyle="#fff";const r=(a,b,w,h,rr)=>{x.beginPath();x.roundRect(a,b,w,h,rr);x.fill()};r(54,92,22,72,8);r(80,78,24,100,8);r(152,78,24,100,8);r(180,92,22,72,8);r(100,120,56,16,6);
  x.fillStyle="rgba(255,255,255,.35)";x.beginPath();x.arc(128,206,8,0,7);x.fill();return c.toDataURL("image/png")}
(async()=>{load();sortWorkouts();render();
  const use=window.claude?.use?n=>window.claude.use(n).catch(()=>null):async()=>null;

  if(sample){try{const lim=await sample.limits();imgCaps=lim?.images||null}catch{imgCaps=null}}
  render();
  if(desktop?.tray){document.body.classList.add("app");try{dockIconArt().then(u=>desktop.app.dock.setIcon(u))}catch{}desktop.window.setOptions({titleBarStyle:"hiddenInset",dragHeight:8,width:1240,height:840,minWidth:400,minHeight:520}).catch(()=>{});
    try{notifPerm=await desktop.permissions.state("notifications")}catch{}render()}
})();

<script>
/*INSTALL_PROMPT*/
/* When this artifact is open in Claude Desktop but not installed as an app yet, invite the person
   to install it. Shows once per session; the install itself is Claude's own dialog, started from
   the person's click (install.request() needs a click). Silent in browsers, on mobile and inside the
   installed app. */
(async()=>{
  if(!window.claude||!claude.use)return;
  try{if(sessionStorage.getItem("appstore.installAsked"))return}catch{}
  const d=await claude.use("desktop").catch(()=>null);
  if(!d||d.fs||!d.install)return;                       // d.fs exists only inside the installed app
  const st=await d.install.state().catch(()=>"unavailable");
  if(st!=="available")return;
  await new Promise(r=>setTimeout(r,900));
  if(document.querySelector(".aspi"))return;
  const zh=window.__ZH??/^zh/i.test(navigator.language||"");
  const T=(en,c)=>zh?c:en;
  const name=(document.title||"").trim()||T("this app","这个 app");
  const icon=typeof DOCK_SVG==="string"?DOCK_SVG:(typeof ICON_SVG==="object"&&ICON_SVG.store)||"";
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const st2=document.createElement("style");
  st2.textContent=`.aspi{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:rgba(20,20,19,.42);padding:16px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.aspi .b{--bg:#FAF9F5;--fg:#141413;--mu:#6B6A64;--pill:#EDE6DA;--ac:#B9532F;--on:#fff;background:var(--bg);color:var(--fg);border-radius:18px;max-width:380px;width:100%;padding:24px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
@media (prefers-color-scheme:dark){.aspi .b{--bg:#262624;--fg:#FAF9F5;--mu:#A6A39A;--pill:#3A3632;--ac:#E08A6A;--on:#1F1E1D}}
.aspi .ic{width:72px;height:72px}.aspi .ic svg{width:72px;height:72px;display:block}
.aspi h3{margin:2px 0 0;font-size:18px;font-weight:700;line-height:1.25}
.aspi p{margin:0;color:var(--mu)}
.aspi .row{display:flex;flex-direction:column;gap:8px;align-self:stretch;margin-top:6px}
.aspi button{font-family:inherit;font-weight:600;font-size:15px;line-height:1;border:0;border-radius:999px;padding:12px 16px;cursor:pointer}
.aspi .y{background:var(--ac);color:var(--on)}.aspi .n{background:var(--pill);color:var(--fg)}`;
  const m=document.createElement("div");m.className="aspi";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("data-no-i18n","");
  m.innerHTML=`<div class="b"><div class="ic">${icon}</div>
    <h3>${esc(T(`Install ${name} as an app?`,`把「${name}」安装为 app？`))}</h3>
    <p>${esc(T("It gets its own window and Dock icon, opens like any other app, and keeps working on your Claude plan.","装好后有自己的窗口和 Dock 图标，像普通 app 一样打开，继续用你的 Claude 套餐。"))}</p>
    <div class="row"><button class="y">${esc(T("Install","安装"))}</button><button class="n">${esc(T("Not now","以后再说"))}</button></div></div>`;
  const close=()=>{m.remove();st2.remove();try{sessionStorage.setItem("appstore.installAsked","1")}catch{}};
  m.addEventListener("click",async e=>{
    if(e.target===m||e.target.closest(".n"))return close();
    if(e.target.closest(".y")){const r=await d.install.request().catch(()=>"failed");close();
      if(r==="failed"||r==="unavailable"){const n=document.createElement("div");n.textContent=T("Couldn't install. Use Install as app in the artifact's menu.","没装上。可以在工件菜单里选“安装为 app”。");n.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141413;color:#fff;padding:10px 14px;border-radius:10px;z-index:2147483000;font:13px system-ui";document.body.appendChild(n);setTimeout(()=>n.remove(),5000)}}
  });
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"&&m.isConnected){close();document.removeEventListener("keydown",k)}});
  document.head?document.head.appendChild(st2):document.body.appendChild(st2);document.body.appendChild(m);
  m.querySelector(".y").focus();
})();
/*END_INSTALL_PROMPT*/
</script>
