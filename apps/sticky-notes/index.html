<title>Sticky Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script type="application/json" id="claude-artifacts-manifest">{"permissions":["overlay","shortcuts"]}</script>
<style>
/* Layout: a sticky note. A thin grab strip with four colored page dots on top, the writing area fills the rest. */
:root{
  --y:#fff4b8; --p:#ffd9e1; --g:#d8f5d0; --b:#d6e8ff;
  --yi:#e8c93a; --pi:#ef7f98; --gi:#5fbf55; --bi:#5b95e8;
  --paper:var(--y); --ink:#2b2615; --muted:rgba(43,38,21,.55); --strip:rgba(0,0,0,.05);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --hand:"Patrick Hand","Marker Felt","Segoe Print","Bradley Hand",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--y:#3d3820;--p:#43282f;--g:#243a25;--b:#1f2f45;--ink:#f3eedb;--muted:rgba(243,238,219,.55);--strip:rgba(255,255,255,.06);color-scheme:dark}}
:root[data-theme="dark"]{--y:#3d3820;--p:#43282f;--g:#243a25;--b:#1f2f45;--ink:#f3eedb;--muted:rgba(243,238,219,.55);--strip:rgba(255,255,255,.06);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.4 var(--font);display:flex;flex-direction:column;transition:background .2s}
.strip{display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--strip)}
body.app .strip{app-region:drag;-webkit-app-region:drag}
body.inset .strip{padding-left:max(78px,env(safe-area-inset-left,0px))}
.dots{display:flex;gap:6px;app-region:no-drag;-webkit-app-region:no-drag}
.dots button{width:14px;height:14px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12)}
.dots button.on{box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12),0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
.sp{flex:1}
.tool{app-region:no-drag;-webkit-app-region:no-drag;border:0;background:transparent;color:var(--muted);font:600 12px/1 var(--font);padding:4px 6px;border-radius:6px;cursor:pointer}
.tool:hover{color:var(--ink);background:var(--strip)}
textarea{flex:1;width:100%;border:0;resize:none;background:transparent;color:var(--ink);font:20px/1.45 var(--hand);padding-block:10px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));outline:none}
textarea::placeholder{color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);padding-block:4px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ai{position:relative;app-region:no-drag;-webkit-app-region:no-drag}
.ai .tool{color:var(--ink)}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--strip);box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:10px;padding:4px;display:flex;flex-direction:column;min-width:190px;z-index:5;filter:brightness(1.03)}
.menu button{border:0;background:transparent;color:var(--ink);font:13px/1.2 var(--font);text-align:left;padding:8px 10px;border-radius:7px;cursor:pointer}
.menu button:hover,.menu button:focus{background:var(--strip)}
.busy textarea{opacity:.75}
.foot button{border:0;background:var(--strip);color:var(--ink);font:600 11.5px/1 var(--font);padding:6px 10px;border-radius:999px;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">

<div class="strip">
  <div class="dots" id="dots"></div>
  <span class="sp"></span>
  <div class="ai" id="ai" hidden><button class="tool" id="aibtn" aria-haspopup="true" title="Ask Claude to rework this note">✦ AI</button>
    <div class="menu" id="menu" hidden>
      <button data-ai="list">Turn into a checklist</button>
      <button data-ai="clean">Clean up the writing</button>
      <button data-ai="sum">Summarize</button>
      <button data-ai="next">Suggest next steps</button>
      <button data-ai="tr">Translate</button>
    </div></div>
  <button class="tool" id="copy" title="Copy this note">Copy</button>
  <button class="tool" id="hide" title="Hide (Option+Shift+J brings it back)" hidden>Hide</button>
</div>
<textarea id="t" spellcheck="false" placeholder="Jot something down…" aria-label="Note"></textarea>
<div class="foot"><span id="info"></span><span id="act"></span></div>

<script>

(()=>{
  let ZH=/^zh/i.test(navigator.language||"");

  window.__ZH=ZH; window.__t=(en,zh)=>ZH?zh:en;
  if(!ZH)return;
  const DICT={"Sticky Notes": "便签", "Ask Claude to rework this note": "让 Claude 改写这张便签", "Turn into a checklist": "转成清单", "Clean up the writing": "润色文字", "Summarize": "总结", "Suggest next steps": "建议下一步", "Translate": "翻译", "Copy": "复制", "Copied": "已复制", "Selected": "已选中", "Copy this note": "复制这张便签", "Hide": "隐藏", "Hide (Option+Shift+J brings it back)": "隐藏（按 Option+Shift+J 唤回）", "Jot something down…": "随手记点什么…", "Note": "便签", "Saved on this computer": "已保存在本机", "Write something first.": "先写点内容。", "Thinking…": "思考中…", "Done": "完成", "Undo": "撤销", "Claude is busy or you hit your usage limit. Try again later.": "Claude 正忙，或你已达到用量上限，请稍后再试。", "Claude isn't allowed for this app.": "此应用未获准使用 Claude。", "Claude isn't available on this account.": "此账号无法使用 Claude。", "Claude declined this note.": "Claude 拒绝处理这张便签。", "Sign in to Claude again.": "请重新登录 Claude。", "Something went wrong. Try again.": "出了点问题，请重试。", "Float on top": "置顶悬浮", "Normal window": "普通窗口", "Keep the note above other windows and summon it with Option+Shift+J": "让便签浮在其他窗口之上，并可用 Option+Shift+J 唤出", "Install from Claude Desktop to float it": "从 Claude 桌面版安装后可置顶悬浮", "Install as app": "安装为应用", "Installed": "已安装", "Stop": "停止", "Stopped. Your note wasn't changed.": "已停止，便签没有改动。", "Claude's answer was cut off, so your note wasn't changed. Try a shorter note.": "Claude 的回答被截断了，便签没有改动。可以换一张短一点的便签再试。", "Claude returned nothing. Your note wasn't changed.": "Claude 没有返回内容，便签没有改动。", "This note is too long for Claude.": "这张便签太长，Claude 处理不了。", "This note is too long for Claude to rewrite. Keep it under 12,000 characters.": "这张便签太长，Claude 改写不了。请控制在 12,000 字以内。"};
  const PATTERNS=([["(\\d+) words?", "$1 个字"], ["Note (\\d+)", "便签 $1"]]).map(([re,rep])=>[new RegExp("^"+re+"$"),rep]);
  const SKIP='script,style,textarea,input,code,pre,[contenteditable]:not([contenteditable="false"]),[data-no-i18n]'+("");
  const ATTRS=["placeholder","title","aria-label","data-tip","data-ph","alt"];
  const norm=s=>s.replace(/\s+/g," ").trim();
  function tr(s){
    const k=norm(s); if(!k||!/[A-Za-z]/.test(k)) return null;
    let v=DICT[k];
    if(v==null){for(const [re,rep] of PATTERNS){if(re.test(k)){v=k.replace(re,rep);break}}}

  }
  window.__tr=s=>tr(String(s))??s;
  const skipped=el=>{try{return !!(el&&el.closest&&el.closest(SKIP))}catch{return false}};

    if(root.nodeType!==1&&root.nodeType!==11)return;
    if(root.nodeType===1){doAttrs(root);if(skipped(root))return}

      if(n.nodeType===1){doAttrs(n);return skipped(n)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_SKIP}

  }
  const mo=new MutationObserver(ms=>{for(const m of ms){
    if(m.type==="childList")m.addedNodes.forEach(walk);

    mo.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:ATTRS})};

  const _a=window.alert,_c=window.confirm,_p=window.prompt;
  window.alert=m=>_a.call(window,tr(String(m))??m);window.confirm=m=>_c.call(window,tr(String(m))??m);window.prompt=(m,d)=>_p.call(window,tr(String(m))??m,d);

/*END_I18N_RUNTIME*/

<script>


const $=id=>document.getElementById(id);
const COLORS=["y","p","g","b"];
const store={get(k,d){try{const v=localStorage.getItem("jot."+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem("jot."+k,JSON.stringify(v))}catch{}}};
const clean=v=>{const a=Array.isArray(v)?v:[];return COLORS.map((_,i)=>typeof a[i]==="string"?a[i]:"");};
let notes=clean(store.get("notes",null)), cur=store.get("cur",0), desktop=null, perms={};
if(!(Number.isInteger(cur)&&cur>=0&&cur<COLORS.length)) cur=0;
/* Save only the notes this tab changed, merged into what is stored, so two open copies don't overwrite each other. */
const dirty=new Set();
function save(){if(!dirty.size)return;const s=clean(store.get("notes",null));dirty.forEach(i=>{s[i]=notes[i]});dirty.clear();store.set("notes",s);}
function touch(i){dirty.add(i);}
window.addEventListener("storage",e=>{
  if(e.key!=="jot.notes"||e.newValue==null)return;
  let inc;try{inc=clean(JSON.parse(e.newValue))}catch{return}
  inc.forEach((v,i)=>{if(!dirty.has(i))notes[i]=v});
  if(!dirty.has(cur)&&$("t").value!==notes[cur]){const t=$("t"),a=t.selectionStart,z=t.selectionEnd;t.value=notes[cur];if(document.activeElement===t)try{t.setSelectionRange(a,z)}catch{}info();}
});
function paint(){
  document.documentElement.style.setProperty("--paper",`var(--${COLORS[cur]})`);
  $("dots").innerHTML=COLORS.map((c,i)=>`<button style="background:var(--${c}i)" class="${i===cur?"on":""}" data-i="${i}" aria-label="Note ${i+1}"></button>`).join("");
  if($("t").value!==notes[cur]) $("t").value=notes[cur];
  info();
}
function info(){const s=notes[cur]||"";const cjk=(s.match(/[\u3040-\u30ff\u3400-\u9fff\uf900-\ufaff\uac00-\ud7af]/g)||[]).length;const w=cjk+(s.replace(/[\u3040-\u30ff\u3400-\u9fff\uf900-\ufaff\uac00-\ud7af]/g," ").trim().match(/\S+/g)||[]).length;$("info").textContent=w?`${w} word${w===1?"":"s"}`:"Saved on this computer";}
let tm=0;
$("t").addEventListener("input",e=>{notes[cur]=e.target.value;touch(cur);info();clearTimeout(tm);tm=setTimeout(save,250);});
$("dots").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(!b)return;save();cur=+b.dataset.i;store.set("cur",cur);paint();$("t").focus();});
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(notes[cur]);$("copy").textContent="Copied";}catch{$("t").select();$("copy").textContent="Selected";}setTimeout(()=>$("copy").textContent="Copy",1200);};
// AI
let sample=null, ctl=null, undo=null;
const LANG=window.__ZH?"Chinese (Simplified)":(navigator.language||"en").startsWith("zh")?"Chinese":"English";
const PROMPTS={
  list:"Rewrite this note as a clean checklist. One item per line starting with \"- [ ] \". Keep every task, merge duplicates, keep the note's language. Output only the checklist.",
  clean:"Fix spelling, grammar and flow in this note. Keep its meaning, language, tone and line breaks. Output only the revised note.",
  sum:"Summarize this note in at most 3 short bullet points starting with \"- \". Keep the note's language. Output only the bullets.",
  next:"Read this note and append 3 concrete next steps as \"- [ ] \" lines under a line \"Next steps:\". Keep the note's language. Output the original note unchanged, then a blank line, then the next steps.",
  tr:`Translate this note. If it is mostly in ${LANG}, translate it into ${LANG==="English"?"Chinese":"English"}; otherwise translate it into ${LANG}. Keep line breaks and checklist markers. Output only the translation.`
};
const ERR={rate_limited:"Claude is busy or you hit your usage limit. Try again later.",not_granted:"Claude isn't allowed for this app.",sampling_disabled:"Claude isn't available on this account.",refused:"Claude declined this note.",session_expired:"Sign in to Claude again."};
function say(t){$("info").textContent=t;}
const MAXLEN={sum:100000};
function stopAI(){if(ctl){ctl.abort();}}
async function runAI(kind){
  $("menu").hidden=true;
  const src=notes[cur].trim();
  if(!src){say("Write something first.");return;}
  if(src.length>(MAXLEN[kind]||12000)){say(kind==="sum"?"This note is too long for Claude.":"This note is too long for Claude to rewrite. Keep it under 12,000 characters.");return;}
  ctl?.abort();const my=ctl=new AbortController();
  const job={i:cur,text:notes[cur]};
  save();
  document.body.classList.add("busy");say("Thinking…");
  const prevAct=[...$("act").childNodes].filter(n=>!(n.classList&&n.classList.contains("stopai")));
  const stop=document.createElement("button");stop.className="stopai";stop.textContent="Stop";stop.onclick=stopAI;$("act").replaceChildren(stop);
  const restore=()=>{if(cur===job.i&&!dirty.has(job.i))$("t").value=notes[job.i];};
  /* typing while Claude writes would mix with its draft, so the note is read-only until it finishes */
  $("t").readOnly=true;
  try{
    const {text,truncated}=await sample(PROMPTS[kind]+"\n\nNote:\n"+src,{signal:my.signal,cache:false,modelTier:"quick",onText:({text})=>{if(ctl===my&&cur===job.i){$("t").value=text;}}});
    if(ctl!==my)return;
    const out=(text||"").trim();
    if(!out||truncated){restore();say(truncated?"Claude's answer was cut off, so your note wasn't changed. Try a shorter note.":"Claude returned nothing. Your note wasn't changed.");$("act").replaceChildren(...prevAct);return;}
    undo=job;
    notes[job.i]=out;touch(job.i);save();paint();
    const u=document.createElement("button");u.textContent="Undo";u.onclick=()=>{if(!undo)return;notes[undo.i]=undo.text;touch(undo.i);save();undo=null;paint();u.remove();if(desktop?.tray)setup();};
    $("act").replaceChildren(u);say("Done");
  }catch(e){
    if(ctl!==my)return;
    restore();
    if(e?.code==="not_granted"||e?.code==="sampling_disabled") $("ai").hidden=true;
    say(e?.code==="cancelled"?"Stopped. Your note wasn't changed.":(ERR[e?.code]||"Something went wrong. Try again."));
    $("act").replaceChildren(...prevAct);
  }finally{if(ctl===my){ctl=null;document.body.classList.remove("busy");$("t").readOnly=false;if(!$("act").childNodes.length&&desktop?.tray)setup();}}
}
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape"||e.isComposing)return;
  if(!$("menu").hidden){$("menu").hidden=true;$("aibtn").focus();e.preventDefault();}
  else if(ctl){stopAI();e.preventDefault();}
});
$("aibtn").onclick=e=>{e.stopPropagation();$("menu").hidden=!$("menu").hidden;};
$("menu").addEventListener("click",e=>{const b=e.target.closest("[data-ai]");if(b)runAI(b.dataset.ai);});
document.addEventListener("click",e=>{if(!e.target.closest("#ai"))$("menu").hidden=true;});
(async()=>{sample=window.claude?.use?await window.claude.use("sample").catch(()=>null):null;if(sample)$("ai").hidden=false;})();

window.addEventListener("beforeunload",save);
window.addEventListener("pagehide",save);
paint();

/*DOCK_ART*/
const DOCK_SVG="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\"><defs><linearGradient id=\"sticky-notes-bg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#34343C\"/><stop offset=\"1\" stop-color=\"#16161A\"/><\/linearGradient><radialGradient id=\"sticky-notes-sh\" cx=\".28\" cy=\".05\" r=\".9\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\"0.22\"/><stop offset=\".6\" stop-color=\"#fff\" stop-opacity=\"0\"/><\/radialGradient><filter id=\"sticky-notes-ds\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"150%\"><feDropShadow dx=\"0\" dy=\"22\" stdDeviation=\"26\" flood-color=\"#000\" flood-opacity=\".28\"/><\/filter><filter id=\"sticky-notes-ds2\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"150%\"><feDropShadow dx=\"0\" dy=\"10\" stdDeviation=\"12\" flood-color=\"#000\" flood-opacity=\".22\"/><\/filter><\/defs><rect width=\"1024\" height=\"1024\" rx=\"230\" fill=\"url(#sticky-notes-bg)\"/><rect width=\"1024\" height=\"1024\" rx=\"230\" fill=\"url(#sticky-notes-sh)\"/><rect x=\"300\" y=\"200\" width=\"460\" height=\"460\" rx=\"28\" fill=\"#7FE3C4\" transform=\"rotate(12 530 430)\" filter=\"url(#sticky-notes-ds2)\"/><rect x=\"270\" y=\"240\" width=\"460\" height=\"460\" rx=\"28\" fill=\"#FF8FB1\" transform=\"rotate(-8 500 470)\" filter=\"url(#sticky-notes-ds2)\"/><g filter=\"url(#sticky-notes-ds)\" transform=\"rotate(3 512 560)\"><path d=\"M262 330h500v360l-110 110H262z\" fill=\"#FFD84D\"/><path d=\"M762 690H682a30 30 0 0 0-30 30v80z\" fill=\"#E8B92A\"/><rect x=\"316\" y=\"410\" width=\"52\" height=\"52\" rx=\"12\" fill=\"none\" stroke=\"#8A6A00\" stroke-width=\"12\"/><path d=\"M326 436l16 16 30-36\" fill=\"none\" stroke=\"#8A6A00\" stroke-width=\"12\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"398\" y=\"424\" width=\"250\" height=\"24\" rx=\"12\" fill=\"#B58D00\" opacity=\".55\"/><rect x=\"316\" y=\"510\" width=\"52\" height=\"52\" rx=\"12\" fill=\"none\" stroke=\"#8A6A00\" stroke-width=\"12\"/><rect x=\"398\" y=\"524\" width=\"210\" height=\"24\" rx=\"12\" fill=\"#8A6A00\"/><rect x=\"316\" y=\"610\" width=\"52\" height=\"52\" rx=\"12\" fill=\"none\" stroke=\"#8A6A00\" stroke-width=\"12\"/><rect x=\"398\" y=\"624\" width=\"170\" height=\"24\" rx=\"12\" fill=\"#8A6A00\"/><\/g><rect x=\"3\" y=\"3\" width=\"1018\" height=\"1018\" rx=\"228\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".14\" stroke-width=\"6\"/><\/svg>";
function dockIconArt(){return new Promise(res=>{const img=new Image();img.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");x.shadowColor="rgba(0,0,0,.3)";x.shadowBlur=20;x.shadowOffsetY=8;x.drawImage(img,50,44,412,412);res(c.toDataURL("image/png"))}catch{res(dockIcon())}};img.onerror=()=>res(dockIcon());img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(DOCK_SVG)})}
/*END_DOCK_ART*/
function dockIcon(){
  const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
  x.fillStyle="#ffe46b";x.beginPath();x.roundRect(8,8,240,240,54);x.fill();
  x.fillStyle="#f2cf3a";x.beginPath();x.moveTo(248,170);x.lineTo(248,194);x.quadraticCurveTo(248,248,194,248);x.lineTo(170,248);x.closePath();x.fill();
  x.strokeStyle="#5b4a12";x.lineCap="round";x.lineWidth=13;
  [[62,90,190],[62,130,176],[62,170,140]].forEach(([a,y,b])=>{x.beginPath();x.moveTo(a,y);x.lineTo(b,y);x.stroke();});
  return c.toDataURL("image/png");
}
async function toggleVisible(){
  if(document.visibilityState==="visible"&&document.hasFocus()) desktop.window.hide().catch(()=>{});
  else {await desktop.window.show().catch(()=>{});$("t").focus();}
}
async function makeFloating(){
  try{perms=await desktop.permissions.request(["overlay","shortcuts"]);}catch{}
  if(perms.overlay==="granted"){store.set("float",true);save();applyWindow();}
  setup();
}
function applyWindow(){
  const float=store.get("float",false)&&perms.overlay==="granted";
  document.body.classList.toggle("inset",!float);
  const opts=float
    ?{frame:false,alwaysOnTop:true,dragHeight:0,width:300,height:340,minWidth:220,minHeight:200,roundedCorners:true,hasShadow:true}
    :{titleBarStyle:"hiddenInset",dragHeight:8,width:320,height:380,minWidth:240,minHeight:220};
  desktop.window.setOptions(opts).catch(()=>{});
  $("hide").hidden=!float;
}
let sc=false;
function setup(){
  const act=$("act");act.replaceChildren();
  if(perms.shortcuts==="granted"&&!sc){sc=true;desktop.globalShortcut.register("Alt+Shift+J",toggleVisible).catch(()=>{sc=false});}
  if(!(store.get("float",false)&&perms.overlay==="granted")){
    const b=document.createElement("button");b.textContent="Float on top";b.title="Keep the note above other windows and summon it with Option+Shift+J";b.onclick=makeFloating;act.append(b);
  }else{
    const b=document.createElement("button");b.textContent="Normal window";b.onclick=()=>{store.set("float",false);save();applyWindow();setup();};act.append(b);
  }
}
$("hide").onclick=()=>desktop?.window.hide().catch(()=>{});
(async()=>{
  desktop=window.claude?.use?await window.claude.use("desktop").catch(()=>null):null;
  const act=$("act");
  if(!desktop){act.textContent="Install from Claude Desktop to float it";return;}
  if(!desktop.tray){
    const st=await desktop.install.state().catch(()=>"unavailable");
    if(st==="available"){const b=document.createElement("button");b.textContent="Install as app";b.onclick=()=>desktop.install.request().catch(()=>{});act.replaceChildren(b);}
    else act.textContent=st==="installed"?"Installed":"Install from Claude Desktop to float it";
    return;
  }
  document.body.classList.add("app");
  dockIconArt().then(u=>desktop.app.dock.setIcon(u)).catch(()=>{});
  try{perms=await desktop.permissions.state();}catch{}
  applyWindow();setup();
})();
</script>
<script>
/*INSTALL_PROMPT*/
/* When this artifact is open in Claude Desktop but not installed as an app yet, invite the person
   to install it. Shows once per session; the install itself is Claude's own dialog, started from
   the person's click (install.request() needs a click). Silent in browsers, on mobile and inside the
   installed app. */
(async()=>{
  if(!window.claude||!claude.use)return;
  try{if(sessionStorage.getItem("appstore.installAsked"))return}catch{}
  const d=await claude.use("desktop").catch(()=>null);
  if(!d||d.fs||!d.install)return;                       // d.fs exists only inside the installed app
  const st=await d.install.state().catch(()=>"unavailable");
  if(st!=="available")return;
  await new Promise(r=>setTimeout(r,900));
  if(document.querySelector(".aspi"))return;
  const zh=window.__ZH??/^zh/i.test(navigator.language||"");
  const T=(en,c)=>zh?c:en;
  const name=(document.title||"").trim()||T("this app","这个 app");
  const icon=typeof DOCK_SVG==="string"?DOCK_SVG:(typeof ICON_SVG==="object"&&ICON_SVG.store)||"";
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const st2=document.createElement("style");
  st2.textContent=`.aspi{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:rgba(20,20,19,.42);padding:16px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.aspi .b{--bg:#FAF9F5;--fg:#141413;--mu:#6B6A64;--pill:#EDE6DA;--ac:#B9532F;--on:#fff;background:var(--bg);color:var(--fg);border-radius:18px;max-width:380px;width:100%;padding:24px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
@media (prefers-color-scheme:dark){.aspi .b{--bg:#262624;--fg:#FAF9F5;--mu:#A6A39A;--pill:#3A3632;--ac:#E08A6A;--on:#1F1E1D}}
.aspi .ic{width:72px;height:72px}.aspi .ic svg{width:72px;height:72px;display:block}
.aspi h3{margin:2px 0 0;font-size:18px;font-weight:700;line-height:1.25}
.aspi p{margin:0;color:var(--mu)}
.aspi .row{display:flex;flex-direction:column;gap:8px;align-self:stretch;margin-top:6px}
.aspi button{font-family:inherit;font-weight:600;font-size:15px;line-height:1;border:0;border-radius:999px;padding:12px 16px;cursor:pointer}
.aspi .y{background:var(--ac);color:var(--on)}.aspi .n{background:var(--pill);color:var(--fg)}`;
  const m=document.createElement("div");m.className="aspi";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("data-no-i18n","");
  m.innerHTML=`<div class="b"><div class="ic">${icon}</div>
    <h3>${esc(T(`Install ${name} as an app?`,`把「${name}」安装为 app？`))}</h3>
    <p>${esc(T("It gets its own window and Dock icon, opens like any other app, and keeps working on your Claude plan.","装好后有自己的窗口和 Dock 图标，像普通 app 一样打开，继续用你的 Claude 套餐。"))}</p>
    <div class="row"><button class="y">${esc(T("Install","安装"))}</button><button class="n">${esc(T("Not now","以后再说"))}</button></div></div>`;
  const close=()=>{m.remove();st2.remove();try{sessionStorage.setItem("appstore.installAsked","1")}catch{}};
  m.addEventListener("click",async e=>{
    if(e.target===m||e.target.closest(".n"))return close();
    if(e.target.closest(".y")){const r=await d.install.request().catch(()=>"failed");close();
      if(r==="failed"||r==="unavailable"){const n=document.createElement("div");n.textContent=T("Couldn't install. Use Install as app in the artifact's menu.","没装上。可以在工件菜单里选“安装为 app”。");n.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141413;color:#fff;padding:10px 14px;border-radius:10px;z-index:2147483000;font:13px system-ui";document.body.appendChild(n);setTimeout(()=>n.remove(),5000)}}
  });
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"&&m.isConnected){close();document.removeEventListener("keydown",k)}});
  document.head?document.head.appendChild(st2):document.body.appendChild(st2);document.body.appendChild(m);
  m.querySelector(".y").focus();
})();
/*END_INSTALL_PROMPT*/
</script>
