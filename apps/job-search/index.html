<title>Job Search Kit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a top bar with three areas (Resumes, Jobs, Interview).
   Resumes: version list | form editor | live page preview (what you see is exactly what exports).
   Jobs: a status board or list; a job opens in a side panel with details, match, cover letter, interview.
   Interview: setup + history on the left, one question at a time on the right. */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --fg:#16181d; --muted:#6a707c; --line:#e2e4e9; --chip:#eef0f3; --hover:#f0f1f4;
  --accent:#2f62d8; --accent-fg:#ffffff; --accent-soft:rgba(47,98,216,.11);
  --canvas:#e9ebef; --danger:#d23c3c; --danger-soft:rgba(210,60,60,.1); --ok:#1d9459; --ok-soft:rgba(29,148,89,.12); --warn:#b7770c; --warn-soft:rgba(183,119,12,.13);
  --del:rgba(210,60,60,.16); --ins:rgba(29,148,89,.18);
  --shadow:0 8px 28px rgba(15,20,40,.12),0 1px 3px rgba(15,20,40,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--panel:#1d2025;--fg:#eceef2;--muted:#9299a5;--line:#2e3239;--chip:#282c33;--hover:#262a31;--accent:#7ea2ff;--accent-fg:#0d1530;--accent-soft:rgba(126,162,255,.15);--canvas:#111316;--danger:#ff6b6b;--danger-soft:rgba(255,107,107,.13);--ok:#4cc98f;--ok-soft:rgba(76,201,143,.14);--warn:#f0b04a;--warn-soft:rgba(240,176,74,.14);--del:rgba(255,107,107,.22);--ins:rgba(76,201,143,.24);--shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171b;--panel:#1d2025;--fg:#eceef2;--muted:#9299a5;--line:#2e3239;--chip:#282c33;--hover:#262a31;--accent:#7ea2ff;--accent-fg:#0d1530;--accent-soft:rgba(126,162,255,.15);--canvas:#111316;--danger:#ff6b6b;--danger-soft:rgba(255,107,107,.13);--ok:#4cc98f;--ok-soft:rgba(76,201,143,.14);--warn:#f0b04a;--warn-soft:rgba(240,176,74,.14);--del:rgba(255,107,107,.22);--ins:rgba(76,201,143,.24);--shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100vw;overflow:hidden}
/* top bar */
#top{display:flex;align-items:center;gap:8px;min-height:46px;padding-block:7px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg);flex:none}
body.app #top{app-region:drag;-webkit-app-region:drag;padding-left:max(80px,env(safe-area-inset-left,0px))}
#top>*{app-region:no-drag;-webkit-app-region:no-drag}
#top .sp{flex:1;min-width:8px;app-region:drag;-webkit-app-region:drag;align-self:stretch}
.brand{font-weight:700;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.brand i{width:20px;height:20px;border-radius:6px;background:var(--accent);display:inline-grid;place-items:center;color:var(--accent-fg);font-style:normal;font-size:11px}
.seg{display:flex;background:var(--chip);border-radius:8px;padding:2px;flex:none}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;padding:5px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.sm button{font-size:11.5px;padding:4px 8px}
#topActions{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.btn{font-weight:600;font-size:12.5px;line-height:1;border:1px solid var(--line);border-radius:7px;padding:7px 11px;cursor:pointer;background:var(--panel);color:var(--fg);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 8px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.ib{width:30px;height:30px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;display:inline-grid;place-items:center;font-size:15px;flex:none}
.ib:hover{background:var(--hover);color:var(--fg)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}
.ib svg,.btn svg{width:16px;height:16px;flex:none}
.muted{color:var(--muted)}
.small{font-size:11.5px}
.view{flex:1;min-height:0;display:flex}
/* ---------- resumes ---------- */
#rlist{width:220px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.lhead{display:flex;align-items:center;gap:6px;padding:10px 10px 6px 12px}
.lhead h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0;flex:1}
.litems{flex:1;overflow:auto;padding:2px 6px 10px}
.li{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 8px;cursor:pointer;margin-bottom:1px}
.li:hover{background:var(--hover)}
.li.on{background:var(--accent-soft)}
.li b{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tag{display:inline-block;font-size:10px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 4px;margin-right:4px}
.lfoot{padding:8px 10px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
#editor{width:430px;flex:none;overflow:auto;padding:14px 14px 80px;border-right:1px solid var(--line);background:var(--bg)}
#previewPane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--canvas)}
.ptool{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.ptool .lbl{font-size:11px;color:var(--muted)}
.ptool select{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 6px;font-size:12px;font-weight:600}
.swatches{display:flex;gap:4px;align-items:center}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:0 0 0 1px var(--line)}
.sw.on{border-color:var(--fg)}
#pages{flex:1;overflow:auto;padding:22px 18px 60px;display:flex;flex-direction:column;align-items:center;gap:18px}
.page{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.04);flex:none;position:relative}
.page svg{display:block;width:100%;height:100%}
.pnum{position:absolute;right:-2px;bottom:-18px;font-size:10.5px;color:var(--muted)}
.pinfo{font-size:11px;color:var(--muted);margin-left:auto}
/* editor cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:10px}
.card>.ch{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 12px}
.card>.ch .tt{flex:1;min-width:0;border:0;background:transparent;font-weight:700;font-size:13px;padding:3px 4px;border-radius:5px}
.card>.ch .tt:hover,.card>.ch .tt:focus{background:var(--hover);outline:none}
.card>.cb{padding:0 12px 12px}
.card.off>.cb{display:none}
.card.hid .tt{color:var(--muted);text-decoration:line-through}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;min-width:0}
.fld>span{font-size:11px;color:var(--muted);font-weight:600}
.fi{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 8px;font-size:13px;outline:none}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.fi{resize:vertical;min-height:58px;line-height:1.45}
textarea.bul{min-height:76px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.entry{border:1px solid var(--line);border-radius:9px;padding:9px 9px 2px;margin-bottom:8px;background:var(--bg)}
.entry .eh{display:flex;align-items:center;gap:4px;margin:-3px -3px 6px 0}
.entry .eh b{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addrow{display:flex;gap:6px;flex-wrap:wrap}
.rname{width:100%;font-size:17px;font-weight:700;border:0;background:transparent;padding:4px 6px;border-radius:6px;margin:0 0 8px;outline:none}
.rname:hover,.rname:focus{background:var(--panel)}
.hintbar{font-size:11.5px;color:var(--muted);margin:0 2px 10px}
/* check panel */
.check{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px;margin:0 0 10px}
.ck{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:12.5px}
.ck i{font-style:normal;width:16px;flex:none;text-align:center}
.ck.ok i{color:var(--ok)}.ck.warn i{color:var(--warn)}.ck.bad i{color:var(--danger)}
/* ---------- jobs ---------- */
#vJobs{flex-direction:column}
.jbar{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap;flex:none}
.search{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 9px;font-size:12.5px;width:220px;max-width:100%;outline:none}
.search:focus{border-color:var(--accent)}
#board{flex:1;min-height:0;display:flex;gap:10px;overflow:auto;padding:2px 14px 16px}
.col{width:244px;flex:none;display:flex;flex-direction:column;background:var(--chip);border-radius:11px;min-height:0;max-height:100%}
.col.dragover{box-shadow:inset 0 0 0 2px var(--accent)}
.colh{display:flex;align-items:center;gap:6px;padding:9px 10px 6px;font-weight:700;font-size:12px}
.colh .n{color:var(--muted);font-weight:600}
.colh .dot{width:8px;height:8px;border-radius:50%}
.cards{flex:1;overflow:auto;padding:2px 7px 8px;display:flex;flex-direction:column;gap:6px;min-height:40px}
.jc{touch-action:none;user-select:none;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;text-align:left;width:100%;display:block}
.jc:hover{border-color:var(--accent)}
.jc.dragging{opacity:.4}
.jc b{display:block;font-size:12.5px;line-height:1.3}
.jc .co{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.jc .meta{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:10.5px;color:var(--muted)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 5px;background:var(--chip);color:var(--muted)}
.badge.hi{background:var(--ok-soft);color:var(--ok)}.badge.mid{background:var(--warn-soft);color:var(--warn)}.badge.lo{background:var(--danger-soft);color:var(--danger)}
.colempty{font-size:11.5px;color:var(--muted);padding:8px 4px;text-align:center}
#jtable{flex:1;overflow:auto;padding:0 14px 16px}
table.jt{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12.5px}
.jt th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
.jt td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.jt tr:last-child td{border-bottom:0}
.jt tbody tr{cursor:pointer}
.jt tbody tr:hover td{background:var(--hover)}
.stsel{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 4px;font-size:12px}
.empty{margin:auto;text-align:center;max-width:380px;padding:30px 20px;color:var(--muted)}
.empty h3{color:var(--fg);font-size:16px;margin:10px 0 6px}
.empty p{margin:0 0 14px}
.empty .big{font-size:34px}
/* drawer */
#drawer{position:fixed;top:var(--toph,47px);right:0;bottom:0;width:min(600px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:50;display:flex;flex-direction:column}
#scrim{position:fixed;inset:var(--toph,47px) 0 0 0;background:rgba(10,12,18,.18);z-index:49}
.dh{display:flex;align-items:flex-start;gap:8px;padding:12px 12px 0 16px}
.dh .tin{flex:1;min-width:0}
.dh input{border:0;background:transparent;width:100%;outline:none;padding:2px 4px;border-radius:5px}
.dh input:hover,.dh input:focus{background:var(--hover)}
.dh .t1{font-size:18px;font-weight:700}
.dh .t2{font-size:13px;color:var(--muted)}
.dtabs{display:flex;gap:2px;padding:8px 14px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.dtabs button{border:0;background:transparent;padding:7px 10px;font-weight:600;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.dtabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.db{flex:1;overflow:auto;padding:14px 16px 40px}
.sect{margin-bottom:16px}
.sect h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 7px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.score{display:flex;gap:14px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
body.jopen #vJobs{margin-right:600px}
@media (max-width:1000px){body.jopen #vJobs{display:none}#drawer{width:100vw;border-left:0;box-shadow:none}}
.ring{width:66px;height:66px;flex:none}
.ring text{font:700 17px var(--font);fill:var(--fg)}
.kw{display:flex;flex-wrap:wrap;gap:5px}
.kchip{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;background:var(--panel);cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.kchip.yes{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.kchip.no{border-color:transparent;background:var(--danger-soft);color:var(--danger)}
.kchip small{font-size:10px;opacity:.75}
.chg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.chg.acc{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.chg.rej{opacity:.55}
.chg .where{font-size:11px;color:var(--muted);margin-bottom:4px}
.chg .diff{font-size:13px;line-height:1.5;white-space:pre-wrap}
.diff del{background:var(--del);text-decoration:line-through;border-radius:3px}
.diff ins{background:var(--ins);text-decoration:none;border-radius:3px}
.chg .why{font-size:11.5px;color:var(--muted);margin-top:5px}
.chg .acts{display:flex;gap:6px;margin-top:8px}
.letter{width:100%;min-height:380px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font:14px/1.6 var(--font);background:var(--panel);resize:vertical;outline:none}
.letter:focus{border-color:var(--accent)}
.status{font-size:12px;color:var(--muted);min-height:18px}
.status.err{color:var(--danger)}
.note{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
/* ---------- interview ---------- */
#vInterview{min-height:0}
#iside{width:300px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:14px}
#imain{flex:1;min-width:0;overflow:auto;padding:22px 26px 60px}
.iwrap{max-width:720px;margin:0 auto}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.qmeta{font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:6px}
.qtext{font-size:18px;font-weight:600;line-height:1.4;margin:0 0 6px}
.qwhy{font-size:12px;color:var(--muted)}
.ans{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:14px/1.55 var(--font);background:var(--panel);resize:vertical;outline:none}
.ans:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.live{color:var(--muted)}
.fb{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:12px}
.fb h5{margin:10px 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fb ul{margin:0;padding-left:18px}
.fb li{margin:2px 0}
.bar10{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;flex:1;max-width:220px}
.bar10 i{display:block;height:100%;background:var(--accent);border-radius:99px}
.mic.on{background:var(--danger);color:#fff;border-color:transparent}
.hist{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.hist:hover{border-color:var(--accent)}
.hist b{display:block;font-size:12.5px}
.hist span{font-size:11px;color:var(--muted)}
.lbl2{display:flex;align-items:center;gap:7px;font-size:12.5px;margin:8px 0;cursor:pointer}
/* modal, menu, toast */
#modal{position:fixed;inset:0;background:rgba(10,12,18,.32);z-index:80;display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;border:1px solid var(--line)}
.mbox.wide{width:min(760px,100%)}
.mh{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.mh h3{margin:0;font-size:15px;flex:1}
.mb{padding:4px 16px 12px;overflow:auto}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px 14px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.mf .sp{flex:1}
.drop{border:1.5px dashed var(--line);border-radius:11px;padding:16px;text-align:center;color:var(--muted);margin-bottom:10px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
#menu{position:fixed;z-index:90;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:200px;max-width:calc(100vw - 16px)}
#menu button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;gap:10px;align-items:center}
#menu button:hover,#menu button:focus{background:var(--hover);outline:none}
#menu button .k{margin-left:auto;color:var(--muted);font-size:11px}
#menu button.danger{color:var(--danger)}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d2027;color:#fff;border-radius:10px;padding:9px 12px 9px 14px;font-size:12.5px;z-index:100;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
#toast button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:6px;padding:4px 9px;font-weight:600;cursor:pointer}
.banner{background:var(--warn-soft);color:var(--warn);font-size:12px;padding:6px 14px;flex:none}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.mobtabs{display:none}
/* responsive */
@media (max-width:1180px){#rlist{width:190px}#editor{width:380px}}
@media (max-width:1000px){
  #rlist{display:none}
  body.showlist #rlist{display:flex;position:fixed;left:0;top:var(--toph,47px);bottom:0;z-index:40;box-shadow:var(--shadow)}
}
@media (max-width:820px){
  #vResumes{flex-direction:column}
  .mobtabs{display:flex;padding:8px 12px 0;flex:none}
  #editor{width:auto;flex:1;border-right:0}
  #previewPane{flex:1}
  body:not(.mprev) #previewPane{display:none}
  body.mprev #editor{display:none}
  #iside{width:auto;border-right:0;border-bottom:1px solid var(--line);flex:none;max-height:none}
  #vInterview{flex-direction:column;overflow:auto}
  #imain{overflow:visible;padding:16px}
  #vInterview.insession #iside{display:none}
}
@media (max-width:640px){#topActions .btn:not(.pri){display:none}.brand{display:none}}

<script>
"use strict";
/* ================= basics ================= */

function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return T("just now","刚刚");if(s<3600)return ZH()?`${Math.floor(s/60)} 分钟前`:`${Math.floor(s/60)} min ago`;if(s<86400)return ZH()?`${Math.floor(s/3600)} 小时前`:`${Math.floor(s/3600)} h ago`;return fmtDate(new Date(ts).toISOString().slice(0,10));}
const slug=s=>(String(s||"").replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim().slice(0,80))||"Resume";

/* ================= storage ================= */
let STORE_OK=true;
const LS={get(k,d){try{const v=localStorage.getItem("jobkit."+k);return v==null?d:JSON.parse(v);}catch{STORE_OK=false;return d;}},
  set(k,v){try{localStorage.setItem("jobkit."+k,JSON.stringify(v));return true;}catch{STORE_OK=false;return false;}}};
const DB={resumes:[],jobs:[],sessions:[],ui:{}};
function loadDB(){
  const d=LS.get("db",null);
  if(d&&typeof d==="object"){DB.resumes=Array.isArray(d.resumes)?d.resumes:[];DB.jobs=Array.isArray(d.jobs)?d.jobs:[];DB.sessions=Array.isArray(d.sessions)?d.sessions:[];DB.ui=d.ui||{};}
  DB.resumes.forEach(normResume);DB.jobs.forEach(normJob);
  try{localStorage.setItem("jobkit.__t","1");localStorage.removeItem("jobkit.__t");}catch{STORE_OK=false;}
}
let saveT=0;
function save(now){clearTimeout(saveT);const f=()=>{if(!LS.set("db",DB)&&!$("storeBanner").dataset.shown){$("storeBanner").hidden=false;$("storeBanner").dataset.shown="1";}};if(now)f();else saveT=setTimeout(f,250);}
window.addEventListener("beforeunload",()=>save(true));

/* ================= resume model ================= */
const SECTION_TYPES={
  summary:{kind:"text",en:"Summary",zh:"个人简介"},
  work:{kind:"entries",en:"Experience",zh:"工作经历"},
  education:{kind:"entries",en:"Education",zh:"教育背景"},
  skills:{kind:"list",en:"Skills",zh:"技能"},
  projects:{kind:"entries",en:"Projects",zh:"项目经历"},
  certificates:{kind:"entries",en:"Certifications",zh:"证书"},
  awards:{kind:"entries",en:"Awards",zh:"获奖"},
  volunteer:{kind:"entries",en:"Volunteering",zh:"志愿经历"},
  publications:{kind:"entries",en:"Publications",zh:"发表"},
  languages:{kind:"list",en:"Languages",zh:"语言"},
  custom:{kind:"entries",en:"Additional",zh:"其他"},
  customList:{kind:"list",en:"Additional",zh:"其他"},
  customText:{kind:"text",en:"Additional",zh:"其他"}
};
const FIELD_LABELS={
  work:["Job title","Company","Dates","Location"],
  education:["School","Degree and field","Dates","Location"],
  projects:["Project","Role or tools","Dates","Link or location"],
  certificates:["Certification","Issuer","Date",""],
  awards:["Award","Given by","Date",""],
  volunteer:["Role","Organization","Dates","Location"],
  publications:["Title","Publisher","Date","Link"],
  custom:["Title","Organization","Dates","Location"]
};
function newSection(type,title){const st=SECTION_TYPES[type]||SECTION_TYPES.custom;const s={id:uid(),type,kind:st.kind,title:title||T(st.en,st.zh)};if(st.kind==="text")s.text="";else s.items=[];return s;}
function newItem(kind){return kind==="list"?{id:uid(),label:"",text:""}:{id:uid(),title:"",subtitle:"",date:"",location:"",bullets:[]};}
function blankResume(name){
  const r={id:uid(),name:name||T("My resume","我的简历"),created:Date.now(),updated:Date.now(),template:"modern",design:{accent:"",size:0,margins:"normal",page:defaultPage(),spacing:"normal"},
    basics:{name:"",headline:"",email:"",phone:"",location:"",links:""},sections:[newSection("summary"),newSection("work"),newSection("education"),newSection("skills")]};
  r.sections[1].items.push(newItem("entries"));r.sections[2].items.push(newItem("entries"));r.sections[3].items.push(newItem("list"));
  return r;
}
function defaultPage(){const l=(navigator.language||"en-US");return /^en-(US|CA)$/i.test(l)||/^es-(MX|US)$/i.test(l)?"letter":"a4";}
function normResume(r){
  r.id=r.id||uid();r.name=r.name||"Resume";r.created=r.created||Date.now();r.updated=r.updated||Date.now();
  r.template=TEMPLATES[r.template]?r.template:"modern";
  r.design=Object.assign({accent:"",size:0,margins:"normal",page:defaultPage(),spacing:"normal"},r.design||{});
  r.basics=Object.assign({name:"",headline:"",email:"",phone:"",location:"",links:""},r.basics||{});
  if(Array.isArray(r.basics.links))r.basics.links=r.basics.links.join("\n");
  r.sections=(Array.isArray(r.sections)?r.sections:[]).map(s=>{
    const st=SECTION_TYPES[s.type]?s.type:(s.kind==="list"?"customList":s.kind==="text"?"customText":"custom");
    const kind=SECTION_TYPES[st].kind;
    const o={id:s.id||uid(),type:st,kind,title:s.title??T(SECTION_TYPES[st].en,SECTION_TYPES[st].zh),hidden:!!s.hidden};
    if(kind==="text")o.text=String(s.text??(Array.isArray(s.items)?s.items.map(i=>i.text||i.title||"").join("\n"):""));
    else o.items=(Array.isArray(s.items)?s.items:[]).map(it=>kind==="list"?{id:it.id||uid(),label:String(it.label??""),text:String(it.text??(Array.isArray(it.keywords)?it.keywords.join(", "):""))}
      :{id:it.id||uid(),title:String(it.title??""),subtitle:String(it.subtitle??""),date:String(it.date??""),location:String(it.location??""),bullets:(Array.isArray(it.bullets)?it.bullets:String(it.bullets||"").split("\n")).map(String)});
    return o;});
  return r;
}
const cleanBullet=b=>String(b||"").replace(/^\s*(?:[•●▪▫◦‣∙·\-–—*]|\d+[.)])\s+/,"").replace(/^\s*[•●▪◦‣∙·]\s*/,"").trim();
const bulletsOf=it=>(it.bullets||[]).map(cleanBullet).filter(Boolean);
function cur(){return DB.resumes.find(r=>r.id===DB.ui.resumeId)||DB.resumes[0]||null;}
function resumeText(r){
  // plain text used for keyword matching and for Claude
  const b=r.basics,out=[];
  out.push(b.name,b.headline,[b.location,b.phone,b.email,...String(b.links||"").split("\n")].filter(Boolean).join(" | "));
  for(const s of r.sections){if(s.hidden)continue;out.push("",s.title.toUpperCase());
    if(s.kind==="text")out.push(s.text);
    else if(s.kind==="list")s.items.forEach(i=>out.push(i.label?`${i.label}: ${i.text}`:i.text));
    else s.items.forEach(i=>{out.push([i.title,i.subtitle,i.location,i.date].filter(Boolean).join(" | "));bulletsOf(i).forEach(x=>out.push("• "+x));});}
  return out.filter(x=>x!=null).join("\n").replace(/\n{3,}/g,"\n\n").trim();
}

/* ================= jobs model ================= */
const STATUSES=[["saved","Saved","已收藏","#8a94a6"],["applying","Applying","准备投递","#c28a13"],["applied","Applied","已投递","#2f62d8"],["interviewing","Interviewing","面试中","#8a4fd8"],["offer","Offer","Offer","#1d9459"],["rejected","Closed","已结束","#c0504d"]];
const stLabel=k=>{const s=STATUSES.find(x=>x[0]===k)||STATUSES[0];return T(s[1],s[2]);};
function normJob(j){j.id=j.id||uid();j.status=STATUSES.some(s=>s[0]===j.status)?j.status:"saved";for(const k of["title","company","location","salary","url","jd","notes","letter","letterPrev","saved","applied","followup","interview","resumeId","source"])j[k]=j[k]==null?"":String(j[k]);j.created=j.created||Date.now();j.updated=j.updated||Date.now();j.order=j.order??j.created;if(!j.saved)j.saved=new Date(j.created).toISOString().slice(0,10);return j;}
function newJob(o){return normJob(Object.assign({id:uid(),status:"saved",saved:today(),created:Date.now()},o||{}));}

/* ================= undo history (per resume) ================= */
const HIST=new Map(); // id -> {u:[],r:[],key,t}
function hist(id){if(!HIST.has(id))HIST.set(id,{u:[],r:[],key:"",t:0});return HIST.get(id);}
function snap(key){ // call before a change; coalesces typing in one field
  const r=cur();if(!r)return;const h=hist(r.id),now=Date.now();
  if(key&&key===h.key&&now-h.t<1500){h.t=now;return;}
  h.u.push(JSON.stringify(r));if(h.u.length>200)h.u.shift();h.r=[];h.key=key||"";h.t=now;updUndo();
}
function touched(){const r=cur();if(r)r.updated=Date.now();save();schedulePreview();}
function undoRedo(redo){
  const r=cur();if(!r)return false;const h=hist(r.id);const from=redo?h.r:h.u,to=redo?h.u:h.r;if(!from.length)return false;
  to.push(JSON.stringify(r));const prev=JSON.parse(from.pop());h.key="";
  const i=DB.resumes.findIndex(x=>x.id===r.id);DB.resumes[i]=normResume(prev);
  const f=focusInfo();renderEditor();restoreFocus(f);renderList();schedulePreview(true);save();updUndo();
  toast(redo?T("Redone","已重做"):T("Undone","已撤销"));return true;
}
function updUndo(){const r=cur();const h=r?hist(r.id):{u:[],r:[]};const u=$("bUndo"),re=$("bRedo");if(u)u.disabled=!h.u.length;if(re)re.disabled=!h.r.length;}
function focusInfo(){const a=document.activeElement;if(!a||!a.dataset||!a.dataset.bind)return null;return{b:a.dataset.bind,s:a.selectionStart,e:a.selectionEnd};}
function restoreFocus(f){if(!f)return;const el=document.querySelector(`[data-bind="${CSS.escape(f.b)}"]`);if(!el)return;el.focus();try{const n=el.value.length;el.setSelectionRange(Math.min(f.s,n),Math.min(f.e,n));}catch{}}

/* ================= toast / modal / menu ================= */
let toastT=0;
function toast(msg,action,ms){const t=$("toast");clearTimeout(toastT);t.replaceChildren();const s=document.createElement("span");s.textContent=msg;t.append(s);
  if(action){const b=document.createElement("button");b.textContent=action.label;b.onclick=()=>{t.hidden=true;action.run();};t.append(b);}
  t.hidden=false;toastT=setTimeout(()=>t.hidden=true,ms||(action?6000:2200));}
let modalClose=null;
function openModal(html,{wide,onClose}={}){const m=$("modal");m.innerHTML=`<div class="mbox${wide?" wide":""}" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;modalClose=onClose||null;
  setTimeout(()=>{const f=m.querySelector("[autofocus]")||m.querySelector("textarea,input:not([type=file]),select,button.pri");f?.focus();},20);return m.firstElementChild;}
function closeModal(){const m=$("modal");if(m.hidden)return;m.hidden=true;m.innerHTML="";const c=modalClose;modalClose=null;c?.();}
function ask(title,body,okLabel,danger){return new Promise(res=>{openModal(`<div class="mh"><h3>${esc(title)}</h3></div><div class="mb"><p style="margin:0">${esc(body)}</p></div><div class="mf"><button class="btn" data-act="mCancel">Cancel</button><button class="btn pri${danger?" danger":""}" data-act="mOk" ${danger?'style="background:var(--danger);color:#fff"':""}>${esc(okLabel)}</button></div>`,{onClose:()=>res(false)});

const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
function parseRange(s){

    m=x.match(/^(\d{4})[./年-](\d{1,2})/);if(m)return`${m[1]}-${m[2].padStart(2,"0")}`;m=x.match(/^(\d{1,2})\/(\d{4})$/);if(m)return`${m[2]}-${m[1].padStart(2,"0")}`;m=x.match(/^(\d{4})$/);if(m)return m[1];return x;};

  const b=r.basics,links=String(b.links||"").split("\n").map(s=>s.trim()).filter(Boolean);
  const o={$schema:"https://raw.githubusercontent.com/jsonresume/resume-schema/v1.0.0/schema.json",basics:{name:b.name,label:b.headline,email:b.email,phone:b.phone,url:links[0]?linkOf(links[0]):"",summary:"",location:{address:b.location},profiles:links.slice(1).map(l=>({network:(shortUrl(l).split(/[./]/)[0]||""),url:linkOf(l)}))}};

    else if(s.type==="publications")o.publications=ents.map(i=>({name:i.title,publisher:i.subtitle,releaseDate:parseRange(i.date).startDate||i.date,url:linkOf(i.location)||undefined,summary:bulletsOf(i).join(" ")}));

function fromJsonResume(j){

  if(has(j.education))add("education",j.education.map(e=>({id:uid(),title:e.institution||"",subtitle:[e.studyType,e.area].filter(Boolean).join(", "),date:rangeStr(e.startDate,e.endDate,!!e.endDate),location:e.location||"",bullets:[...(e.score?[`GPA: ${e.score}`]:[]),...(e.courses||[])]})));
  if(has(j.skills)){const s=newSection("skills");s.items=j.skills.map(k=>({id:uid(),label:k.name||"",text:(k.keywords||[]).join(", ")||k.level||""}));r.sections.push(s);}
  if(has(j.projects))add("projects",j.projects.map(p=>({id:uid(),title:p.name||"",subtitle:(p.roles||[]).join(", ")||p.entity||"",date:rangeStr(p.startDate,p.endDate,!!p.endDate),location:p.url?shortUrl(p.url):"",bullets:[...(p.description?[p.description]:[]),...(p.highlights||[])]})));
  if(has(j.volunteer))add("volunteer",j.volunteer.map(w=>({id:uid(),title:w.position||"",subtitle:w.organization||"",date:rangeStr(w.startDate,w.endDate),location:"",bullets:[...(w.summary?[w.summary]:[]),...(w.highlights||[])]})));
  if(has(j.certificates))add("certificates",j.certificates.map(c=>({id:uid(),title:c.name||"",subtitle:c.issuer||"",date:fmtIso(c.date),location:"",bullets:[]})));
  if(has(j.awards))add("awards",j.awards.map(c=>({id:uid(),title:c.title||"",subtitle:c.awarder||"",date:fmtIso(c.date),location:"",bullets:c.summary?[c.summary]:[]})));
  if(has(j.publications))add("publications",j.publications.map(c=>({id:uid(),title:c.name||"",subtitle:c.publisher||"",date:fmtIso(c.releaseDate),location:c.url?shortUrl(c.url):"",bullets:c.summary?[c.summary]:[]})));
  if(has(j.languages)){const s=newSection("languages");s.items=j.languages.map(l=>({id:uid(),label:l.language||"",text:l.fluency||""}));r.sections.push(s);}

  return normResume(r);

/* ================= resume check (local, instant) ================= */
const WEAK=/\b(responsible for|duties included|helped with|worked on|in charge of|tasked with|assisted (with|in))\b/i;
const VERBS="accelerated achieved analyzed architected automated boosted built championed coached created cut debugged decreased defined delivered designed developed directed drove eliminated enabled engineered established expanded generated grew guided implemented improved increased initiated launched led managed mentored migrated modernized negotiated optimized orchestrated organized overhauled owned partnered pioneered planned produced proposed rebuilt redesigned reduced refactored resolved restructured revamped saved scaled secured shipped simplified spearheaded streamlined supervised taught tested trained transformed tripled unified won wrote doubled closed sold coordinated authored published presented researched conducted facilitated oversaw prioritized consolidated standardized".split(" ");
function checkResume(r){
  const out=[],b=r.basics;let score=100;const add=(lvl,msg,pen)=>{out.push([lvl,msg]);score-=pen;};
  if(!b.name.trim())add("bad",T("Add your full name.","补上你的姓名。"),15);
  if(!b.email.trim())add("bad",T("Add an email address so recruiters can reach you.","加上邮箱，方便招聘方联系你。"),12);
  else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(b.email.trim()))add("bad",T("The email address looks mistyped.","邮箱格式看起来不对。"),8);
  if(!b.phone.trim())add("warn",T("Add a phone number.","加上电话号码。"),4);
  if(!b.location.trim())add("warn",T("Add your city. Many recruiters filter by location.","加上所在城市，很多招聘方会按地点筛选。"),3);
  const sum=r.sections.find(s=>s.type==="summary"&&!s.hidden);
  if(!sum||!sum.text.trim())add("warn",T("Add a 2–3 sentence summary at the top.","在顶部加 2–3 句个人简介。"),4);
  else{const w=sum.text.trim().split(/\s+/).length;if(w>90&&!/[一-鿿]/.test(sum.text))add("warn",T("Your summary is long. Aim for under 60 words.","简介偏长，建议控制在 60 词以内。"),3);}
  const work=r.sections.filter(s=>(s.type==="work")&&!s.hidden);
  if(!work.length||!work.some(s=>s.items.some(i=>i.title||i.subtitle)))add("bad",T("Add your work experience.","补上工作经历。"),15);
  let bl=[],noDate=0,few=0;
  for(const s of r.sections)if(s.kind==="entries"&&!s.hidden)for(const it of s.items){const bs=bulletsOf(it);bl.push(...bs);if((it.title||it.subtitle)&&!it.date.trim()&&s.type!=="projects")noDate++;if(s.type==="work"&&(it.title||it.subtitle)&&bs.length<2)few++;}
  if(noDate)add("warn",ZH()?`${noDate} 个条目缺少日期。`:`${noDate} entr${noDate>1?"ies are":"y is"} missing dates.`,Math.min(8,noDate*3));
  if(few)add("warn",ZH()?`${few} 段工作经历少于 2 条要点。`:`${few} job${few>1?"s have":" has"} fewer than 2 bullets.`,Math.min(8,few*3));
  if(bl.length){
    const quant=bl.filter(x=>/\d|%|\$|€|£|¥/.test(x)).length,pq=quant/bl.length;
    if(pq<.35)add("warn",ZH()?`只有 ${quant}/${bl.length} 条要点有数字。用数字说明成果（%、金额、时间、规模）。`:`Only ${quant} of ${bl.length} bullets have numbers. Show results with numbers (%, $, time, scale).`,Math.round((.35-pq)*30));
    else out.push(["ok",ZH()?`${quant}/${bl.length} 条要点用数字说明了成果。`:`${quant} of ${bl.length} bullets show measurable results.`]);
    const weak=bl.filter(x=>WEAK.test(x)).length;if(weak)add("warn",ZH()?`${weak} 条要点用了“负责……”这类弱表达，改成动作 + 结果。`:`${weak} bullet${weak>1?"s use":" uses"} weak phrasing like "responsible for". Lead with what you did and what changed.`,Math.min(10,weak*3));
    const en=bl.filter(x=>/^[A-Za-z]/.test(x));if(en.length){const strong=en.filter(x=>VERBS.includes(x.split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g,""))).length;if(strong/en.length<.5)add("warn",ZH()?`只有 ${strong}/${en.length} 条英文要点以有力动词开头（Led、Built、Cut…）。`:`Only ${strong} of ${en.length} bullets start with a strong action verb (Led, Built, Cut…).`,6);}
    const pron=bl.filter(x=>/\b(I|my|me|we)\b/.test(x)).length;if(pron)add("warn",ZH()?`${pron} 条要点用了 I/my，简历里一般省略。`:`${pron} bullet${pron>1?"s use":" uses"} "I" or "my". Resumes usually drop them.`,3);
    const long=bl.filter(x=>x.length>230).length;if(long)add("warn",ZH()?`${long} 条要点太长，控制在两行以内。`:`${long} bullet${long>1?"s are":" is"} over two lines. Tighten them.`,Math.min(6,long*2));
  }
  if(lastLayout&&lastLayout.pages.length>2)add("warn",ZH()?`简历有 ${lastLayout.pages.length} 页，多数岗位以 1–2 页为宜。`:`Your resume runs ${lastLayout.pages.length} pages. Most roles expect 1–2.`,6);
  if(!r.sections.some(s=>s.type==="skills"&&!s.hidden&&s.items.some(i=>i.text.trim())))add("warn",T("Add a skills section. ATS keyword searches look there first.","加一个技能板块，ATS 关键词检索会先看这里。"),5);
  out.push(["ok",T("Single-column layout with real text: reads cleanly in applicant tracking systems.","单栏排版、文字可选中：ATS 系统能准确读取。")]);
  return{score:Math.max(0,Math.min(100,Math.round(score))),items:out.sort((a,b)=>({bad:0,warn:1,ok:2}[a[0]]-{bad:0,warn:1,ok:2}[b[0]]))};
}
function renderCheck(){
  const box=$("checkBox"),r=cur();if(!box||!r)return;if(!DB.ui.showCheck){box.hidden=true;return;}

async function readFileText(f){
  const n=f.name.toLowerCase();
  if(n.endsWith(".docx")){await loadScript(LIB.mammoth);const buf=await f.arrayBuffer();const res=await window.mammoth.convertToHtml({arrayBuffer:buf});return htmlToLines(res.value);}
  if(n.endsWith(".pdf")){return pdfText(await f.arrayBuffer());}
  if(n.endsWith(".doc"))throw new Error(T("Old .doc files can't be read. Save it as .docx or PDF first.","无法读取旧版 .doc 文件，请先另存为 .docx 或 PDF。"));
  return await f.text();
}
function htmlToLines(html){
  const d=document.createElement("div");d.innerHTML=html;const out=[];
  const walk=el=>{for(const n of el.children){const tg=n.tagName;if(tg==="UL"||tg==="OL"){for(const li of n.children){const sub=[...li.querySelectorAll("ul,ol")];sub.forEach(s=>s.remove());out.push("• "+li.textContent.trim());sub.forEach(s=>{walk({children:[s]});});}}
    else if(tg==="TABLE"){for(const tr of n.querySelectorAll("tr"))out.push([...tr.children].map(c=>c.textContent.trim()).filter(Boolean).join(" | "));}
    else{const t=n.textContent.replace(/[ \u00a0\r\n]+/g," ").replace(/ *\t+ */g,"\t").trim();if(t)out.push(t);}}};
  walk(d);return out.join("\n");
}
async function pdfText(buf){
  if(!window.pdfjsLib){await loadScript(LIB.pdf);await loadScript(LIB.pdfw).catch(()=>{});}
  const lib=window.pdfjsLib;if(!lib)throw new Error("nolib");
  const doc=await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false,disableFontFace:true,useSystemFonts:false}).promise;const out=[];
  for(let p=1;p<=doc.numPages;p++){
    const pg=await doc.getPage(p);const tc=await pg.getTextContent();
    const items=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width,h:Math.abs(i.transform[3])||10,eol:i.hasEOL}));
    items.sort((a,b)=>Math.abs(b.y-a.y)>Math.min(a.h,b.h)*.45?b.y-a.y:a.x-b.x);
    let line=[],ly=null;const flush=()=>{if(!line.length)return;line.sort((a,b)=>a.x-b.x);let s="",lx=null;for(const it of line){if(lx!=null){const gap=it.x-lx;if(gap>it.h*2.2)s+="   ";else if(gap>it.h*.18&&!/\s$/.test(s)&&!/^\s/.test(it.s))s+=" ";}s+=it.s;lx=it.x+it.w;}out.push(s.replace(/\s+$/,""));line=[];};
    for(const it of items){if(!it.s.trim()&&!line.length)continue;if(ly!=null&&Math.abs(it.y-ly)>it.h*.45)flush();line.push(it);ly=it.y;}
    flush();out.push("");
  }
  return out.join("\n").replace(/\n{3,}/g,"\n\n");
}

/* offline parser: good enough for a typical one-column resume */
const HEAD_MAP=[[/^(professional |work |relevant |employment |career )?(experience|employment|work history|history)( history)?$|^工作(经历|经验)|^实习(经历|经验)|^职业经历/i,"work"],[/^(education|academic background|education & training)$|^教育(背景|经历)/i,"education"],[/^(technical |core |key )?(skills|competencies|expertise|technologies|tools|skills & tools|skills and tools)$|^(专业)?技能|^个人技能/i,"skills"],[/^(selected |personal |key )?projects$|^项目(经历|经验)/i,"projects"],[/^(professional )?(summary|profile|about( me)?|objective|career objective|overview)$|^个人(简介|总结|优势)|^自我评价/i,"summary"],[/^(certifications?|certificates|licenses( & certifications)?|licenses and certifications)$|^(资格)?证书/i,"certificates"],[/^(awards|honors|honours|awards & honors|achievements)$|^(获奖|荣誉)/i,"awards"],[/^(volunteer(ing)?|volunteer experience|community)$|^志愿/i,"volunteer"],[/^publications?$|^(论文|发表)/i,"publications"],[/^languages?$|^语言(能力)?/i,"languages"],[/^(interests|hobbies|additional information|activities|leadership)$|^(兴趣|爱好|其他)/i,"custom"]];
const DATE_RE=/((?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s*\d{4}|\d{1,2}\/\d{4}|\d{4}[./年-]\d{1,2}月?|\d{4})\s*(?:–|—|-|to|至|~)\s*((?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s*\d{4}|\d{1,2}\/\d{4}|\d{4}[./年-]\d{1,2}月?|\d{4}|present|current|now|today|至今|现在)|\b((?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+\d{4}|(?:19|20)\d{2})\b/i;
const LOC_RE=/^(remote|hybrid|on-?site|远程)$|^[A-Z][a-zA-Z .'-]+,\s*[A-Z]{2}$|^[A-Z][a-zA-Z .'-]+,\s*[A-Z][a-zA-Z .'-]+$|^[\u4e00-\u9fff]{2,3}市?$/i;
function heuristicParse(text,name){
  const lines=text.replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+$/,"")).filter(l=>l.trim());
  const r=blankResume(name||T("Imported resume","导入的简历"));r.sections=[];const b=r.basics;
  let cur=null,item=null,head=[];
  const secType=l=>{const c=l.trim().replace(/[:：]$/,"").trim();if(c.length>40)return null;for(const[re,t]of HEAD_MAP)if(re.test(c))return t;return null;};
  for(const raw of lines){
    const l=raw.trim(),t=secType(l);
    if(t){cur=newSection(t,l.replace(/[:：]$/,"").replace(/^[A-Z\s&]+$/,m=>m.split(/\s+/).map(w=>w&&w[0]+w.slice(1).toLowerCase()).join(" ")));r.sections.push(cur);item=null;continue;}
    if(!cur){head.push(l);continue;}
    const isB=/^\s*([•●▪◦‣∙·*\-–]|\d+[.)])\s+/.test(raw)||/^[•●▪◦‣∙·]/.test(l);
    if(cur.kind==="text"){cur.text=(cur.text?cur.text+" ":"")+l;continue;}
    if(cur.kind==="list"){const m=l.replace(/^[•●▪◦‣∙·*\-–]\s*/,"").match(/^([^:：]{1,40})[:：]\s*(.+)$/);cur.items.push(m?{id:uid(),label:m[1].trim(),text:m[2].trim()}:{id:uid(),label:"",text:l.replace(/^[•●▪◦‣∙·*\-–]\s*/,"")});continue;}
    if(isB){if(!item){item=newItem("entries");cur.items.push(item);}item.bullets.push(cleanBullet(l));continue;}
    // a header-ish line
    const dm=l.match(DATE_RE);let rest=l,date="";if(dm){date=dm[0].trim();rest=(l.slice(0,dm.index)+"   "+l.slice(dm.index+dm[0].length)).trim();}
    const parts=rest.split(/\s+[|·•]\s+|\s{3,}|\t/).map(s=>s.trim().replace(/^[|,·•–—-]\s*|\s*[|,·•–—-]$/g,"").trim()).filter(Boolean);
    const locIdx=parts.findIndex((x,k)=>k>0&&LOC_RE.test(x));let loc="";if(locIdx>0){loc=parts.splice(locIdx,1)[0];}
    if(!item||item.bullets.length){
      if(item&&item.bullets.length&&!parts.length&&date&&!item.date){item.date=date;continue;}
      item=newItem("entries");cur.items.push(item);
      item.title=parts[0]||"";if(parts[1])item.subtitle=parts[1];if(parts[2])item.location=parts.slice(2).join(", ");item.date=date;if(loc)item.location=loc;
    }else{
      if(!item.subtitle&&parts[0])item.subtitle=parts[0];else if(parts[0]&&!item.location)item.location=parts[0];else if(parts[0])item.bullets.push(rest);
      if(parts[1]&&!item.location)item.location=parts[1];if(date&&!item.date)item.date=date;if(loc&&!item.location)item.location=loc;
    }
  }
  // work entries: "Company | Title" vs "Title | Company" is ambiguous; keep as read
  const contact=[];
  for(const l of head){
    const em=l.match(/[^\s@|,;]+@[^\s@|,;]+\.[a-z]{2,}/i);if(em&&!b.email)b.email=em[0];
    const ph=l.match(/(\+?\(?\d[\d\s().-]{7,}\d)/);if(ph&&!b.phone)b.phone=ph[0].trim();
    (l.match(/((https?:\/\/)?(www\.)?(linkedin\.com|github\.com|[\w-]+\.(com|io|dev|me|net|org|design|app|cn))\/?[^\s|,;]*)/gi)||[]).filter(u=>!u.includes("@")&&!(b.email&&b.email.includes(u))).forEach(u=>contact.push(shortUrl(u)));
  }
  b.links=[...new Set(contact)].join("\n");
  const plain=head.filter(l=>!/@|\d{3}.*\d{3}|https?:|linkedin|github/i.test(l));
  b.name=(plain[0]||head[0]||"").split(/\s+[|·•]\s+/)[0].trim();
  if(plain[1]&&plain[1].length<70&&!/,\s*[A-Z]{2}\b/.test(plain[1]))b.headline=plain[1];
  for(const l of head){for(const part of l.split(/\s*[|·•]\s*/)){const p=part.trim();if(!b.location&&/^[A-Z][a-zA-Z .'-]+,\s*[A-Z]{2}(\s+\d{5})?$|^[A-Z][a-zA-Z .'-]+,\s*[A-Z][a-zA-Z .'-]+$|^[一-鿿]{2,4}(市)?$/.test(p)&&p!==b.name&&p!==b.headline)b.location=p;}}
  if(!r.sections.length){const s=newSection("summary");s.text=lines.slice(head.length?1:0).join("\n");r.sections.push(s);}
  return normResume(r);
}

/* ================= backup ================= */
function backupAll(){const data={app:"job-search-kit",version:1,exported:new Date().toISOString(),resumes:DB.resumes,jobs:DB.jobs,sessions:DB.sessions};return saveFile(`Job Search Kit backup ${today()}.json`,JSON.stringify(data,null,1),"application/json");}
async function restoreBackup(j){
  if(!j||j.app!=="job-search-kit"){toast(T("That isn't a Job Search Kit backup.","这不是 Job Search Kit 的备份文件。"));return;}
  const ok=await ask(T("Restore backup?","恢复备份？"),ZH()?`将加入 ${j.resumes?.length||0} 份简历、${j.jobs?.length||0} 个职位和 ${j.sessions?.length||0} 次模拟面试。已有的同一条目会被备份中的版本替换。`:`This adds ${j.resumes?.length||0} resumes, ${j.jobs?.length||0} jobs and ${j.sessions?.length||0} interview sessions. Items that already exist are replaced by the backup's version.`,T("Restore","恢复"));
  if(!ok)return;
  const merge=(arr,inc,norm)=>{for(const x of inc||[]){const i=arr.findIndex(y=>y.id===x.id);const v=norm?norm(x):x;if(i>=0)arr[i]=v;else arr.push(v);}};
  merge(DB.resumes,j.resumes,normResume);merge(DB.jobs,j.jobs,normJob);merge(DB.sessions,j.sessions);
  if(!cur()&&DB.resumes[0])DB.ui.resumeId=DB.resumes[0].id;save(true);renderAll();toast(T("Backup restored","备份已恢复"));
}

/* ================= jobs CSV ================= */
function parseCsv(text){
  const rows=[];let row=[],f="",q=false;text=text.replace(/^﻿/,"");
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===","||c==="\t"&&!text.includes(",")){row.push(f);f="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f="";}
    else f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()));
}
const CSV_MAP={title:/^(job )?(title|position|role|job)( title)?$|职位|岗位/i,company:/company|employer|organi[sz]ation|公司/i,status:/status|stage|状态/i,location:/location|city|地点|城市/i,salary:/salary|compensation|pay|薪资/i,url:/url|link|posting|链接/i,saved:/date (saved|added|created)|saved|added|created|收藏/i,applied:/(date )?applied|投递/i,followup:/follow.?up|跟进/i,interview:/interview( date)?|面试/i,notes:/notes?|comments?|备注/i,jd:/description|job description|jd|职位描述/i};
function mapStatus(s){s=String(s||"").toLowerCase();if(/offer|accept|negotiat|录用/.test(s))return"offer";if(/interview|screen|面试/.test(s))return"interviewing";if(/^applied|submitted|已投/.test(s))return"applied";if(/applying|prepar|准备/.test(s))return"applying";if(/reject|declin|closed|archiv|withdr|ghost|拒|结束/.test(s))return"rejected";if(/apply|applied/.test(s))return"applied";return"saved";}
function normDate(s){s=String(s||"").trim();if(!s)return"";const d=new Date(s);if(!isNaN(d))return d.toISOString().slice(0,10);return s;}
async function importCsv(f){
  try{
    const rows=parseCsv(await f.text());if(rows.length<2){toast(T("That CSV has no rows.","这个 CSV 没有数据。"));return;}
    const hdr=rows[0].map(h=>h.trim());const idx={};
    for(const[k,re]of Object.entries(CSV_MAP)){const i=hdr.findIndex((h,j)=>re.test(h)&&!Object.values(idx).includes(j));if(i>=0)idx[k]=i;}
    if(idx.title==null&&idx.company==null){toast(T("Couldn't find Company or Title columns in that CSV.","CSV 中找不到公司或职位列。"));return;}
    const before=DB.jobs.length;
    for(const r of rows.slice(1)){const g=k=>idx[k]!=null?(r[idx[k]]||"").trim():"";if(!g("title")&&!g("company"))continue;
      DB.jobs.push(newJob({title:g("title"),company:g("company"),status:mapStatus(g("status")),location:g("location"),salary:g("salary"),url:g("url"),saved:normDate(g("saved"))||today(),applied:normDate(g("applied")),followup:normDate(g("followup")),interview:normDate(g("interview")),notes:g("notes"),jd:g("jd"),source:"csv"}));}
    const n=DB.jobs.length-before;save();setView("jobs");renderJobs();
    toast(ZH()?`已导入 ${n} 个职位`:`Imported ${n} job${n===1?"":"s"}`,{label:T("Undo","撤销"),run:()=>{DB.jobs.splice(before,n);save();renderJobs();}});
  }catch(e){console.error(e);toast(T("Couldn't read that CSV.","无法读取这个 CSV。"));}
}
function jobsCsv(){
  const cols=[["Company","company"],["Title","title"],["Status","status"],["Location","location"],["Salary","salary"],["URL","url"],["Date saved","saved"],["Date applied","applied"],["Follow-up","followup"],["Interview","interview"],["Match","match"],["Notes","notes"]];
  const q=v=>{v=String(v??"");return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const lines=[cols.map(c=>c[0]).join(",")];
  for(const j of DB.jobs)lines.push(cols.map(([,k])=>q(k==="status"?STATUSES.find(s=>s[0]===j.status)[1]:k==="match"?(jobScore(j)??""):j[k])).join(","));
  return "﻿"+lines.join("\r\n")+"\r\n";
}
/* ================= jobs view ================= */
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function hasTerm(text,term){
  const t=String(term||"").toLowerCase().trim();if(!t)return false;
  if(/[　-鿿가-힯]/.test(t))return text.includes(t);
  const base=t.replace(/(es|s)$/,"").length>=4?t.replace(/(es|s)$/,""):t;
  return new RegExp(`(^|[^a-z0-9+#])${escRe(base)}(s|es|ing|ed|d)?(?=$|[^a-z0-9+#])`,"i").test(text);
}
function kwPresent(text,k){return [k.term,...(k.alts||[])].some(a=>hasTerm(text,a));}
const W={high:3,medium:2,low:1};
function scoreFor(r,keywords){if(!r||!keywords?.length)return null;const txt=resumeText(r).toLowerCase();let got=0,all=0,n=0;for(const k of keywords){const w=W[k.importance]||2;all+=w;if(kwPresent(txt,k)){got+=w;n++;}}return{pct:Math.round(got/all*100),n,total:keywords.length};}
function jobResume(j){return DB.resumes.find(r=>r.id===(j.match?.resumeId||j.resumeId))||cur();}
function jobScore(j){const s=j.match?.keywords?scoreFor(jobResume(j),j.match.keywords):null;return s?s.pct:null;}
const badgeCls=p=>p>=75?"hi":p>=50?"mid":"lo";
function jobsFiltered(){const q=(DB.ui.jq||"").toLowerCase().trim();return DB.jobs.filter(j=>!q||[j.title,j.company,j.location,j.notes].join(" ").toLowerCase().includes(q));}

/* pointer-based drag between columns (works with mouse, trackpad and touch) */
let jdrag=null;
document.addEventListener("pointerdown",e=>{const c=e.target.closest("#board .jc");if(!c||e.button!==0)return;jdrag={id:c.dataset.id,el:c,x:e.clientX,y:e.clientY,on:false,ghost:null};});
document.addEventListener("pointermove",e=>{if(!jdrag)return;
  if(!jdrag.on){if(Math.hypot(e.clientX-jdrag.x,e.clientY-jdrag.y)<6)return;jdrag.on=true;const r=jdrag.el.getBoundingClientRect();const g=jdrag.el.cloneNode(true);g.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;pointer-events:none;z-index:95;box-shadow:var(--shadow);transform:rotate(1.5deg);opacity:.95`;document.body.append(g);jdrag.ghost=g;jdrag.dx=e.clientX-r.left;jdrag.dy=e.clientY-r.top;jdrag.el.classList.add("dragging");}
  jdrag.ghost.style.left=(e.clientX-jdrag.dx)+"px";jdrag.ghost.style.top=(e.clientY-jdrag.dy)+"px";
  const col=document.elementFromPoint(e.clientX,e.clientY)?.closest(".col");document.querySelectorAll(".col.dragover").forEach(c=>c!==col&&c.classList.remove("dragover"));col?.classList.add("dragover");

});
document.addEventListener("pointerup",e=>{const d=jdrag;jdrag=null;if(!d||!d.on)return;
  d.ghost.remove();d.el.classList.remove("dragging");document.querySelectorAll(".col.dragover").forEach(c=>c.classList.remove("dragover"));
  d.el.dataset.justDragged="1";setTimeout(()=>{if(d.el)delete d.el.dataset.justDragged;},50);
  const col=document.elementFromPoint(e.clientX,e.clientY)?.closest(".col");if(!col)return;const j=DB.jobs.find(x=>x.id===d.id);if(!j)return;

let jsort={k:"updated",d:-1};
function renderTable(list){
  const cols=[["title","Role","职位"],["company","Company","公司"],["status","Status","状态"],["match","Match","匹配度"],["applied","Applied","投递日期"],["location","Location","地点"]];
  const val=(j,k)=>k==="match"?(jobScore(j)??-1):k==="status"?STATUSES.findIndex(s=>s[0]===j.status):String(j[k]||"").toLowerCase();
  const rows=[...list].sort((a,b)=>{const x=val(a,jsort.k),y=val(b,jsort.k);return(x>y?1:x<y?-1:0)*jsort.d;});

    ${rows.map(j=>{const sc=jobScore(j);return `<tr data-act="openJob" data-id="${j.id}"><td data-no-i18n><b>${esc(j.title||"—")}</b></td><td data-no-i18n>${esc(j.company)}</td><td><select class="stsel" data-jstatus="${j.id}" aria-label="Status">${STATUSES.map(s=>`<option value="${s[0]}"${s[0]===j.status?" selected":""}>${esc(T(s[1],s[2]))}</option>`).join("")}</select></td><td>${sc!=null?`<span class="badge ${badgeCls(sc)}">${sc}%</span>`:'<span class="muted">—</span>'}</td><td class="hide-s">${esc(fmtDate(j.applied))}</td><td class="hide-s" data-no-i18n>${esc(j.location)}</td></tr>`;}).join("")||`<tr><td colspan="6" class="muted">${esc(T("No jobs match your search.","没有符合搜索的职位。"))}</td></tr>`}</tbody></table>`;

function idResume(r){

function applyChanges(r,changes){

    if(c.type==="add"){e.add(c.after);ok++;continue;}
    if((e.get?.()||"")!==c.before){skip++;continue;}
    if(c.type==="remove")e.del();else e.set(c.after);ok++;}
  r.sections.forEach(s=>s.items&&s.items.forEach(it=>{if(it.bullets)it.bullets=it.bullets.filter(b=>b.trim());}));
  return{ok,skip};

Lead with a strong action verb, show scope and measurable results, cut filler like "responsible for", stay under ~28 words each. Never invent numbers, tools or facts: where a number would help but is unknown, keep it qualitative. Keep the original language. Skip bullets that are already strong.

BULLETS:

  if(e.key==="Escape"){if(!$("menu").hidden){closeMenu();e.preventDefault();return;}if(!$("modal").hidden){closeModal();e.preventDefault();return;}if(!$("drawer").hidden){closeDrawer();e.preventDefault();return;}if(document.body.classList.contains("showlist")){document.body.classList.remove("showlist");return;}if(dictOn){stopDict();return;}if(tts?.active?.()){tts.stop().catch(()=>{});return;}return;}
  if(e.isComposing)return;
  if(mod&&!e.altKey&&["1","2","3"].includes(e.key)){e.preventDefault();closeModal();setView(["resumes","jobs","interview"][+e.key-1]);return;}
  if(!$("modal").hidden)return;
  if(mod&&k==="z"&&DB.ui.view==="resumes"&&$("drawer").hidden){if(e.target.closest?.("#editor")||!e.target.closest?.("input,textarea")){e.preventDefault();undoRedo(e.shiftKey);}return;}
  if(mod&&k==="y"&&!isMac&&DB.ui.view==="resumes"){e.preventDefault();undoRedo(true);return;}
  if(mod&&k==="n"&&!e.shiftKey){e.preventDefault();if(DB.ui.view==="jobs")addJobDlg();else if(DB.ui.view==="interview")$("ivJob")?.focus();else newResumeAct();return;}
  if(mod&&k==="e"&&DB.ui.view==="resumes"){e.preventDefault();exportResume("pdf");return;}
  if(mod&&k==="o"){e.preventDefault();if(DB.ui.view==="jobs")$("fileCsv").click();else importDlg();return;}
  if(mod&&k==="s"){e.preventDefault();save(true);toast(T("Saved on this computer. Use Export to get a file.","已保存在这台电脑上。需要文件请用“导出”。"));return;}
  if(mod&&e.key==="Enter"&&!$("drawer").hidden&&DB.ui.jtab==="match"){e.preventDefault();const j=curJob();if(j)analyze(j);}
});

const DOCK_SVG="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\"><defs><linearGradient id=\"job-search-bg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#4C8DFF\"/><stop offset=\"1\" stop-color=\"#173FA8\"/><\/linearGradient><radialGradient id=\"job-search-sh\" cx=\".28\" cy=\".05\" r=\".9\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\"0.22\"/><stop offset=\".6\" stop-color=\"#fff\" stop-opacity=\"0\"/><\/radialGradient><filter id=\"job-search-ds\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"150%\"><feDropShadow dx=\"0\" dy=\"22\" stdDeviation=\"26\" flood-color=\"#000\" flood-opacity=\".28\"/><\/filter><filter id=\"job-search-ds2\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"150%\"><feDropShadow dx=\"0\" dy=\"10\" stdDeviation=\"12\" flood-color=\"#000\" flood-opacity=\".22\"/><\/filter><\/defs><rect width=\"1024\" height=\"1024\" rx=\"230\" fill=\"url(#job-search-bg)\"/><rect width=\"1024\" height=\"1024\" rx=\"230\" fill=\"url(#job-search-sh)\"/><g filter=\"url(#job-search-ds)\" transform=\"rotate(-6 470 500)\"><rect x=\"250\" y=\"170\" width=\"460\" height=\"640\" rx=\"36\" fill=\"#fff\"/><rect x=\"250\" y=\"170\" width=\"460\" height=\"150\" rx=\"36\" fill=\"#1E3A8A\"/><rect x=\"250\" y=\"270\" width=\"460\" height=\"50\" fill=\"#1E3A8A\"/><circle cx=\"340\" cy=\"245\" r=\"48\" fill=\"#9FC3FF\"/><rect x=\"410\" y=\"214\" width=\"230\" height=\"30\" rx=\"15\" fill=\"#fff\"/><rect x=\"410\" y=\"262\" width=\"160\" height=\"20\" rx=\"10\" fill=\"#9FC3FF\"/><rect x=\"296\" y=\"370\" width=\"150\" height=\"24\" rx=\"12\" fill=\"#2F64F5\"/><rect x=\"296\" y=\"420\" width=\"368\" height=\"20\" rx=\"10\" fill=\"#D3DBEA\"/><rect x=\"296\" y=\"462\" width=\"320\" height=\"20\" rx=\"10\" fill=\"#D3DBEA\"/><rect x=\"296\" y=\"530\" width=\"150\" height=\"24\" rx=\"12\" fill=\"#2F64F5\"/><rect x=\"296\" y=\"580\" width=\"368\" height=\"20\" rx=\"10\" fill=\"#D3DBEA\"/><rect x=\"296\" y=\"622\" width=\"280\" height=\"20\" rx=\"10\" fill=\"#D3DBEA\"/><rect x=\"296\" y=\"664\" width=\"330\" height=\"20\" rx=\"10\" fill=\"#D3DBEA\"/><\/g><g filter=\"url(#job-search-ds2)\"><circle cx=\"730\" cy=\"730\" r=\"130\" fill=\"#22C55E\"/><path d=\"M668 732l44 44 88-96\" fill=\"none\" stroke=\"#fff\" stroke-width=\"40\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/g><rect x=\"3\" y=\"3\" width=\"1018\" height=\"1018\" rx=\"228\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".14\" stroke-width=\"6\"/><\/svg>";
function dockIconArt(){return new Promise(res=>{const img=new Image();img.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");x.shadowColor="rgba(0,0,0,.3)";x.shadowBlur=20;x.shadowOffsetY=8;x.drawImage(img,50,44,412,412);res(c.toDataURL("image/png"))}catch{res(dockIcon())}};img.onerror=()=>res(dockIcon());img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(DOCK_SVG)})}
/*END_DOCK_ART*/
function dockIcon(){
  const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,"#4a7cf0");g.addColorStop(1,"#1f45b5");
  x.fillStyle=g;x.beginPath();x.roundRect(8,8,240,240,54);x.fill();
  x.fillStyle="#fff";x.beginPath();x.roundRect(70,50,116,152,12);x.fill();
  x.fillStyle="#1f45b5";x.fillRect(88,74,58,10);x.fillStyle="#c7d3f3";[100,118,136,154].forEach((y,i)=>x.fillRect(88,y,i%2?64:80,7));
  x.fillStyle="#22b573";x.beginPath();x.arc(178,178,34,0,Math.PI*2);x.fill();
  x.strokeStyle="#fff";x.lineWidth=9;x.lineCap="round";x.lineJoin="round";x.beginPath();x.moveTo(163,179);x.lineTo(174,190);x.lineTo(194,167);x.stroke();
  return c.toDataURL("image/png");
}

if(!STORE_OK){$("storeBanner").hidden=false;$("storeBanner").dataset.shown="1";}
if(!DB.ui.resumeId&&DB.resumes[0])DB.ui.resumeId=DB.resumes[0].id;

renderAll();
(async()=>{
  const use=window.claude?.use?n=>window.claude.use(n).catch(()=>null):async()=>null;
  [sample,tts,dict,downloads,desktop]=await Promise.all([use("sample"),use("tts"),use("dictation"),use("downloads"),use("desktop")]);
  wireDict();
  // light up AI controls now that we know
  if(DB.ui.view==="interview")renderInterview();if(!$("drawer").hidden)renderDrawer();
  if(desktop?.tray){
    document.body.classList.add("app");
    try{dockIconArt().then(u=>desktop.app.dock.setIcon(u));}catch{}
    desktop.window.setOptions({titleBarStyle:"hiddenInset",dragHeight:8,width:1320,height:860,minWidth:400,minHeight:520}).catch(()=>{});
  }
})();

<script>
/*INSTALL_PROMPT*/
/* When this artifact is open in Claude Desktop but not installed as an app yet, invite the person
   to install it. Shows once per session; the install itself is Claude's own dialog, started from
   the person's click (install.request() needs a click). Silent in browsers, on mobile and inside the
   installed app. */
(async()=>{
  if(!window.claude||!claude.use)return;
  try{if(sessionStorage.getItem("appstore.installAsked"))return}catch{}
  const d=await claude.use("desktop").catch(()=>null);
  if(!d||d.fs||!d.install)return;                       // d.fs exists only inside the installed app
  const st=await d.install.state().catch(()=>"unavailable");
  if(st!=="available")return;
  await new Promise(r=>setTimeout(r,900));
  if(document.querySelector(".aspi"))return;
  const zh=window.__ZH??/^zh/i.test(navigator.language||"");
  const T=(en,c)=>zh?c:en;
  const name=(document.title||"").trim()||T("this app","这个 app");
  const icon=typeof DOCK_SVG==="string"?DOCK_SVG:(typeof ICON_SVG==="object"&&ICON_SVG.store)||"";
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const st2=document.createElement("style");
  st2.textContent=`.aspi{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:rgba(20,20,19,.42);padding:16px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.aspi .b{--bg:#FAF9F5;--fg:#141413;--mu:#6B6A64;--pill:#EDE6DA;--ac:#B9532F;--on:#fff;background:var(--bg);color:var(--fg);border-radius:18px;max-width:380px;width:100%;padding:24px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
@media (prefers-color-scheme:dark){.aspi .b{--bg:#262624;--fg:#FAF9F5;--mu:#A6A39A;--pill:#3A3632;--ac:#E08A6A;--on:#1F1E1D}}
.aspi .ic{width:72px;height:72px}.aspi .ic svg{width:72px;height:72px;display:block}
.aspi h3{margin:2px 0 0;font-size:18px;font-weight:700;line-height:1.25}
.aspi p{margin:0;color:var(--mu)}
.aspi .row{display:flex;flex-direction:column;gap:8px;align-self:stretch;margin-top:6px}
.aspi button{font-family:inherit;font-weight:600;font-size:15px;line-height:1;border:0;border-radius:999px;padding:12px 16px;cursor:pointer}
.aspi .y{background:var(--ac);color:var(--on)}.aspi .n{background:var(--pill);color:var(--fg)}`;
  const m=document.createElement("div");m.className="aspi";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("data-no-i18n","");
  m.innerHTML=`<div class="b"><div class="ic">${icon}</div>
    <h3>${esc(T(`Install ${name} as an app?`,`把「${name}」安装为 app？`))}</h3>
    <p>${esc(T("It gets its own window and Dock icon, opens like any other app, and keeps working on your Claude plan.","装好后有自己的窗口和 Dock 图标，像普通 app 一样打开，继续用你的 Claude 套餐。"))}</p>
    <div class="row"><button class="y">${esc(T("Install","安装"))}</button><button class="n">${esc(T("Not now","以后再说"))}</button></div></div>`;
  const close=()=>{m.remove();st2.remove();try{sessionStorage.setItem("appstore.installAsked","1")}catch{}};
  m.addEventListener("click",async e=>{
    if(e.target===m||e.target.closest(".n"))return close();
    if(e.target.closest(".y")){const r=await d.install.request().catch(()=>"failed");close();
      if(r==="failed"||r==="unavailable"){const n=document.createElement("div");n.textContent=T("Couldn't install. Use Install as app in the artifact's menu.","没装上。可以在工件菜单里选“安装为 app”。");n.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141413;color:#fff;padding:10px 14px;border-radius:10px;z-index:2147483000;font:13px system-ui";document.body.appendChild(n);setTimeout(()=>n.remove(),5000)}}
  });
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"&&m.isConnected){close();document.removeEventListener("keydown",k)}});
  document.head?document.head.appendChild(st2):document.body.appendChild(st2);document.body.appendChild(m);
  m.querySelector(".y").focus();
})();
/*END_INSTALL_PROMPT*/
</script>
