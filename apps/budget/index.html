<title>Budget</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sidebar (views + accounts + import/backup) | main (top bar, banner, view) | optional Ask Claude drawer.
   Budget view = category table + inspector. Everything is stored in IndexedDB on this computer. */
:root{
  --bg:#f6f6f5;--side:#efefed;--panel:#ffffff;--fg:#1c1c1e;--muted:#6c6c72;--faint:#9a9aa0;--line:#e4e4e1;--line2:#ececea;--chip:#ececea;--hover:#f1f1ef;
  --accent:#1d8a5c;--accent-fg:#ffffff;--sel:#e5f2eb;
  --pos:#18794e;--pos-bg:#dcf1e5;--neg:#cc3426;--neg-bg:#fbe2de;--warn:#9a6200;--warn-bg:#fcefd2;--zero:#8b8b91;--zero-bg:#ececea;
  --shadow:0 12px 40px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --c1:#2f8f6b;--c2:#3b6fd4;--c3:#d08a1e;--c4:#b8476b;--c5:#7a5cc9;--c6:#2a9bb3;--c7:#9a9a3a;--c8:#8a8a90;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c1e;--side:#212225;--panel:#25262a;--fg:#ececee;--muted:#a0a0a7;--faint:#76767c;--line:#35363b;--line2:#2e2f33;--chip:#303136;--hover:#2c2d31;--accent:#3cbf86;--accent-fg:#06200f;--sel:#1f3a2e;--pos:#56d39a;--pos-bg:#183427;--neg:#ff6f61;--neg-bg:#41201c;--warn:#f1b54a;--warn-bg:#3a2d14;--zero:#8c8c93;--zero-bg:#303136;--shadow:0 12px 40px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1c1e;--side:#212225;--panel:#25262a;--fg:#ececee;--muted:#a0a0a7;--faint:#76767c;--line:#35363b;--line2:#2e2f33;--chip:#303136;--hover:#2c2d31;--accent:#3cbf86;--accent-fg:#06200f;--sel:#1f3a2e;--pos:#56d39a;--pos-bg:#183427;--neg:#ff6f61;--neg-bg:#41201c;--warn:#f1b54a;--warn-bg:#3a2d14;--zero:#8c8c93;--zero-bg:#303136;--shadow:0 12px 40px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13.5px/1.4 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
kbd{font:11px var(--font);color:var(--faint);margin-left:auto}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr) auto;height:100vh;height:100dvh}
/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;align-items:center;gap:8px;padding:14px 14px 8px;font-weight:700;font-size:15px;min-height:44px}
body.app .brand{padding-top:34px;app-region:drag;-webkit-app-region:drag}
.brand .logo{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font-size:13px}
.nav{display:flex;flex-direction:column;gap:1px;padding:4px 8px}
.nv,.acr{display:flex;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:7px;color:var(--fg);width:100%;min-height:30px}
.nv:hover,.acr:hover{background:var(--hover)}
.nv.on,.acr.on{background:var(--sel);color:var(--fg);font-weight:600}
.nv .ic{width:18px;text-align:center;color:var(--muted)}
.nv .cnt{margin-left:auto;background:var(--accent);color:var(--accent-fg);border-radius:9px;font-size:11px;padding:0 6px;font-weight:700}
.acl{flex:1;overflow:auto;padding:6px 8px;min-height:60px}
.acg{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.acr{font-size:13px}
.acr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acr .num{font-size:12.5px;color:var(--muted)}
.acr .num.neg{color:var(--neg)}
.acr.closed{opacity:.55}
.sbtn{border:0;background:transparent;color:var(--muted);text-align:left;padding:6px 8px;border-radius:7px;width:100%;font-weight:500}
.sbtn:hover{background:var(--hover);color:var(--fg)}
.sbtn.ai{color:var(--accent);font-weight:600}
.sfoot{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:2px}
.bk{font-size:11.5px;color:var(--muted);padding:6px 8px 2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bk.warn{color:var(--warn)}
.link{border:0;background:none;color:var(--accent);padding:0;font-weight:600;font-size:inherit}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.top{display:flex;align-items:center;gap:8px;min-height:52px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
body.app .top{app-region:drag;-webkit-app-region:drag;padding-top:10px}
body.app .top>*,body.app .top button,body.app .top input,body.app .top select,body.app .top .rta{app-region:no-drag;-webkit-app-region:no-drag}
body.app .top .sp{app-region:drag;-webkit-app-region:drag}
.top .sp{flex:1;min-width:8px;align-self:stretch}
.topl{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.ttl{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.sub{font-size:12px;color:var(--muted)}
.ib{border:0;background:transparent;border-radius:7px;min-width:30px;height:30px;display:inline-grid;place-items:center;color:var(--muted);font-size:15px;padding:0 6px}
.ib:hover{background:var(--hover);color:var(--fg)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:7px;padding:5px 11px;font-weight:600;font-size:12.5px;white-space:nowrap;min-height:30px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.danger{color:var(--neg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ai{color:var(--accent)}
.mnav{display:flex;align-items:center;gap:2px}
.mnav .ttl{min-width:150px;text-align:center}
.rta{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:9px;padding:4px 14px;min-width:150px;background:var(--zero-bg);border:0;line-height:1.15}
.rta b{font-size:17px;font-variant-numeric:tabular-nums}
.rta span{font-size:11px;font-weight:600}
.rta.pos{background:var(--pos-bg);color:var(--pos)}
.rta.neg{background:var(--neg-bg);color:var(--neg)}
.only-narrow{display:none}
#banner:empty{display:none}
.ban{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:12.5px;border-bottom:1px solid var(--line);background:var(--warn-bg);color:var(--fg);flex-wrap:wrap}
.ban.info{background:var(--sel)}
.ban.bad{background:var(--neg-bg)}
.ban .sp{flex:1}
.view{flex:1;overflow:auto;min-height:0;position:relative}
/* budget */
.bud{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:100%}
.btool{display:flex;align-items:center;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:3}
table{border-collapse:collapse;width:100%}
.bt th{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);position:sticky;top:46px;background:var(--bg);z-index:2}
.bt th.num{text-align:right}
.bt td{padding:0 10px;height:36px;border-bottom:1px solid var(--line2)}
.bt tr.grp td{background:var(--chip);font-weight:700;height:32px;font-size:12.5px}
.bt tr.grp td.num{color:var(--muted);font-weight:600}
.bt tr.cat:hover td{background:var(--hover)}
.bt tr.cat.on td{background:var(--sel)}
.bt .cn{display:flex;align-items:center;gap:6px;min-width:0}
.bt .cn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default}
.bt .cn .gbar{height:3px;border-radius:2px;background:var(--line);margin-top:3px;overflow:hidden}
.bt .cn .gbar i{display:block;height:100%;background:var(--pos)}
.bt .cn .gbar.warn i{background:var(--warn)}
.bt .cn .gbar.neg i{background:var(--neg)}
.tw{width:22px;border:0;background:transparent;color:var(--muted);padding:0;font-size:11px}
.cmore{opacity:0;border:0;background:transparent;color:var(--muted);border-radius:5px;padding:0 5px;height:22px}
tr:hover .cmore,tr.on .cmore,.cmore:focus{opacity:1}
.asg{width:110px;text-align:right;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;font-variant-numeric:tabular-nums}
.asg:hover{border-color:var(--line)}
.asg:focus{border-color:var(--accent);background:var(--panel);outline:none}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-weight:600;font-variant-numeric:tabular-nums;border:0;background:var(--zero-bg);color:var(--zero);min-width:64px;text-align:right}
.pill.pos{background:var(--pos-bg);color:var(--pos)}
.pill.neg{background:var(--neg-bg);color:var(--neg)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.credit{background:var(--warn-bg);color:var(--warn);outline:1px dashed var(--warn)}
.insp{border-left:1px solid var(--line);background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.insp h3{margin:0;font-size:15px}
.insp h4{margin:6px 0 2px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0}
.kv span:first-child{color:var(--muted)}
.qa{display:flex;flex-direction:column;gap:4px}
.qa button{display:flex;justify-content:space-between;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 9px;font-size:12.5px}
.qa button:hover{border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.goalbox{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.prog{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.prog i{display:block;height:100%;background:var(--pos)}
/* register */
.reg th{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:46px;background:var(--bg);z-index:2;white-space:nowrap}
.reg th.num{text-align:right}
.reg td{padding:0 8px;height:34px;border-bottom:1px solid var(--line2);max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reg tr.r:hover td{background:var(--hover)}
.reg tr.r.sel td{background:var(--sel)}
.reg tr.r.rev td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.reg td.ck,.reg th.ck{width:30px;max-width:30px;padding:0 4px 0 10px;overflow:visible}
.reg td.cl,.reg th.cl{width:34px;max-width:34px;text-align:center;overflow:visible}
.reg .dt{width:96px}.reg .ac{width:130px}.reg .py{width:22%}.reg .ct{width:20%}.reg .mm{width:auto}.reg .am{width:104px}
.reg .unc{color:var(--warn);font-weight:600}
.reg .muted{color:var(--muted)}
.reg .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:0 5px;border-radius:4px;background:var(--sel);color:var(--accent);margin-left:5px;vertical-align:1px}
.reg .tag.ai{background:var(--sel)}
.clr{border:0;background:transparent;width:22px;height:22px;border-radius:50%;padding:0;color:var(--faint);font-size:13px}
.clr.c{color:var(--pos)}
.clr.r{color:var(--accent)}
.reg tr.ed td{background:var(--panel);height:auto;padding:4px 4px;overflow:visible;max-width:none;vertical-align:top}
.reg tr.ed input,.reg tr.ed select{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--panel);min-width:0}
.reg tr.ed input:focus,.reg tr.ed select:focus{border-color:var(--accent);outline:none}
.reg tr.edb td{background:var(--panel);padding:2px 8px 8px;height:auto;text-align:right;overflow:visible;max-width:none}
.bulk{display:flex;align-items:center;gap:8px;padding:6px 16px;background:var(--sel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:46px;z-index:4}
.srch{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 9px;min-width:0;width:220px}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:12px;padding:4px 9px;border-radius:6px;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.more{display:block;margin:12px auto 24px}
/* empty states */
.empty{max-width:560px;margin:48px auto;padding:0 16px;text-align:center;color:var(--muted)}
.empty h2{color:var(--fg);font-size:22px;margin:8px 0}
.empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.empty .note{font-size:12px;margin-top:18px}
.welcome{max-width:720px;margin:32px auto;padding:0 16px}
.welcome h1{font-size:26px;margin:0 0 6px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:18px 0}
.wcard{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.wcard:hover{border-color:var(--accent)}
.wcard b{font-size:14px}
.wcard span{color:var(--muted);font-size:12.5px}
.fine{font-size:12px;color:var(--muted);line-height:1.5}
/* reports */
.rep{padding:16px;display:flex;flex-direction:column;gap:14px;max-width:1200px}
.repbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.stat b{font-size:19px;font-variant-numeric:tabular-nums}
.rgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.lrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line2);font-size:13px}
.lrow .sw{width:10px;height:10px;border-radius:3px}
.lrow .bar{grid-column:2/4;height:5px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:-2px}
.lrow .bar i{display:block;height:100%}
.lrow button{border:0;background:none;padding:0;text-align:left;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.tbl{width:100%;font-size:12.5px}
.tbl th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line2)}
.tbl th.num,.tbl td.num{text-align:right}
.tblwrap{overflow:auto}
/* recurring */
.rec{padding:16px;display:flex;flex-direction:column;gap:14px;max-width:1100px}
.rlist{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ritem{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2)}
.ritem:last-child{border-bottom:0}
.ritem .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .meta{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--chip);color:var(--muted);margin-left:4px}
.badge.up{background:var(--neg-bg);color:var(--neg)}
.badge.ok{background:var(--pos-bg);color:var(--pos)}
.badge.cx{background:var(--warn-bg);color:var(--warn)}
.ract{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
/* chat */
.chat{width:380px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;padding-right:env(safe-area-inset-right,0px)}
.chead{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);min-height:52px}
body.app .chead{app-region:drag;-webkit-app-region:drag}
body.app .chead>*{app-region:no-drag;-webkit-app-region:no-drag}
.chead b{flex:1}
.clog{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:100%;line-height:1.5;font-size:13.5px;-webkit-user-select:text;user-select:text}
.msg.me{align-self:flex-end;background:var(--sel);border-radius:12px 12px 3px 12px;padding:7px 11px;white-space:pre-wrap;max-width:88%}
.msg.ai p{margin:0 0 8px}.msg.ai ul,.msg.ai ol{margin:0 0 8px;padding-left:20px}.msg.ai table{font-size:12.5px;margin:4px 0 8px}.msg.ai td,.msg.ai th{border-bottom:1px solid var(--line2);padding:3px 6px;text-align:left}
.msg.ai .st{font-size:12px;color:var(--muted)}
.msg.err{color:var(--neg);font-size:12.5px}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 10px;font-size:12.5px}
.sugg button:hover{border-color:var(--accent)}
.cin{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px}
.cin textarea{resize:none;border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:60px;max-height:160px;background:var(--bg);outline:none}
.cin textarea:focus{border-color:var(--accent)}
.cin .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
/* dialog / menu / toast */
.dlgw{position:fixed;inset:0;background:rgba(0,0,0,.32);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;min-height:0}
.dlg.wide{width:min(980px,100%)}
.dlg .dh{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.dlg .dh h2{margin:0;font-size:16px;flex:1}
.dlg .db{padding:4px 16px 12px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:10px}
.dlg .df{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px 14px;border-top:1px solid var(--line2);flex-wrap:wrap;align-items:center}
.dlg .df .sp{flex:1}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--panel);color:var(--fg);font-weight:400;font-size:13.5px;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chk{display:flex;align-items:center;gap:7px;font-size:13px}
.dropz{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.dropz.on{border-color:var(--accent);background:var(--sel)}

<script>
"use strict";
/* ================= helpers ================= */

const T=(en,zh)=>window.__ZH?zh:en;
const LOC=(()=>{try{return navigator.language||"en-US"}catch{return "en-US"}})();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const p2=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const today=()=>iso(new Date());
const curMk=()=>today().slice(0,7);
const addM=(mk,n)=>{let[y,m]=mk.split("-").map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return `${y}-${p2(m)}`};
const mDiff=(a,b)=>{const[ay,am]=a.split("-").map(Number),[by,bm]=b.split("-").map(Number);return (by*12+bm)-(ay*12+am)};
const addD=(ds,n)=>{const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};
const dDiff=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const mLabel=(mk,short)=>{const[y,m]=mk.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString(LOC,{month:short?"short":"long",year:"numeric"})};
const mShort=mk=>{const[y,m]=mk.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString(LOC,{month:"short"})};
const dLabel=ds=>{if(!ds)return "";const d=new Date(ds+"T12:00:00");const same=ds.slice(0,4)===today().slice(0,4);return d.toLocaleDateString(LOC,same?{month:"short",day:"numeric"}:{year:"numeric",month:"short",day:"numeric"})};
const sum=a=>a.reduce((x,y)=>x+y,0);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const CURS=["USD","EUR","GBP","CNY","JPY","CAD","AUD","CHF","HKD","TWD","SGD","KRW","INR","MXN","BRL","SEK","NOK","DKK","NZD","PLN","ZAR","THB","IDR","MYR","PHP","VND","TRY","AED","ILS","CZK","HUF","RUB","SAR","CLP","COP","ARS","EGP","NGN","PKR","BDT"];
function guessCur(){const l=LOC.toLowerCase();if(l.startsWith("zh-tw"))return "TWD";if(l.startsWith("zh-hk"))return "HKD";if(l.startsWith("zh"))return "CNY";const m={"en-gb":"GBP","en-ca":"CAD","en-au":"AUD","en-nz":"NZD","en-in":"INR","en-sg":"SGD","ja":"JPY","ko":"KRW","de-ch":"CHF","pt-br":"BRL","es-mx":"MXN","sv":"SEK","nb":"NOK","da":"DKK","pl":"PLN","tr":"TRY","ru":"RUB","th":"THB","id":"IDR","vi":"VND"};for(const k in m)if(l.startsWith(k))return m[k];if(/^(de|fr|es|it|nl|pt|fi|el|sk|sl|et|lv|lt|ga|mt)/.test(l))return "EUR";return "USD"}
const NF={};
function nf(cur){const k=cur||"USD";if(!NF[k]){try{NF[k]=new Intl.NumberFormat(LOC,{style:"currency",currency:k})}catch{NF[k]=new Intl.NumberFormat(LOC,{style:"currency",currency:"USD"})}}return NF[k]}
const base=()=>S?.settings?.currency||"USD";
const fm=(m,cur)=>nf(cur||base()).format((m||0)/1000).replace(/^-(.*)$/,"−$1");
const fmK=(m,cur)=>{const v=Math.abs(m)/1000;if(v<10000)return fm(Math.round(m/1000)*1000,cur).replace(/[.,]00(?=\D*$)/,"");try{return new Intl.NumberFormat(LOC,{style:"currency",currency:cur||base(),notation:"compact",maximumFractionDigits:1}).format(m/1000)}catch{return fm(m,cur)}};
const plain=m=>(m/1000).toFixed(2);
const mu=v=>Math.round(v*1000);

/* number parsing that understands 1,234.56 / 1.234,56 / (12.00) / −12 / $12 / ¥12 / 12- */
function parseNum(s,decComma){
  if(typeof s==="number")return s;
  s=String(s??"").trim();if(!s)return NaN;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(/\s*(cr)$/i.test(s))s=s.replace(/\s*cr$/i,"");
  if(/\s*(dr)$/i.test(s)){neg=!neg;s=s.replace(/\s*dr$/i,"")}
  s=s.replace(/[\s  ']/g,"");
  if(/^[-−–]/.test(s)||/[-−–]$/.test(s))neg=!neg;
  s=s.replace(/[^\d.,]/g,"");
  if(!/\d/.test(s))return NaN;
  const lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");
  if(decComma===true){s=s.replace(/\./g,"").replace(",",".")}
  else if(decComma===false){s=s.replace(/,/g,"")}
  else if(lc>ld){const after=s.length-lc-1;if(after===3&&ld===-1&&(s.match(/,/g)||[]).length>=1&&!/^0,/.test(s))s=s.replace(/,/g,"");else s=s.replace(/\./g,"").replace(",",".")}
  else s=s.replace(/,/g,"");
  const v=parseFloat(s);if(!isFinite(v))return NaN;return neg?-v:v;
}
/* tiny calculator for amount fields: 12.50+3, 100/4, (20+5)*2 */
function evalAmt(str){
  const s=String(str??"").trim();if(!s)return 0;
  if(!/[+*/]/.test(s.replace(/^[-−]/,""))&&!/\d\s*[-−]\s*\d/.test(s)){return parseNum(s)}
  const toks=s.replace(/−/g,"-").match(/\d[\d.,]*|[-+*/()]/g);if(!toks)return NaN;
  let i=0;const peek=()=>toks[i],next=()=>toks[i++];
  const prim=()=>{const t=next();if(t==="(") {const v=expr();next();return v}if(t==="-")return -prim();if(t==="+")return prim();return parseNum(t)};
  const term=()=>{let v=prim();while(peek()==="*"||peek()==="/"){const o=next(),r=prim();v=o==="*"?v*r:v/r}return v};
  const expr=()=>{let v=term();while(peek()==="+"||peek()==="-"){const o=next(),r=term();v=o==="+"?v+r:v-r}return v};
  try{const v=expr();return i===toks.length&&isFinite(v)?v:NaN}catch{return NaN}
}
const normPayee=p=>String(p||"").toLowerCase().replace(/\b(pos|debit card purchase|card purchase|purchase|recurring|payment to|ach|withdrawal|deposit|online|visa|mc|checkcard|sq \*|tst\*|sp \*|pp\*|paypal \*)\b/g," ").replace(/[#*]\s*\w*\d\w*/g," ").replace(/\d{3,}/g," ").replace(/[^\p{L}\p{N}& ]+/gu," ").replace(/\s+/g," ").trim();

/* ================= storage (IndexedDB, then localStorage, then memory) ================= */
const DB={db:null,mode:"mem",
  async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open("claude-budget",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);setTimeout(()=>rej(new Error("timeout")),4000)});this.mode="idb"}catch{this.db=null;try{localStorage.setItem("budget.probe","1");localStorage.removeItem("budget.probe");this.mode="ls"}catch{this.mode="mem"}}},
  async get(k){if(this.db){try{return await new Promise((res,rej)=>{const q=this.db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch{}}try{const v=localStorage.getItem("budget."+k);return v?JSON.parse(v):undefined}catch{return undefined}},
  async set(k,v){if(this.db){try{await new Promise((res,rej)=>{const tx=this.db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)});return true}catch{}}try{localStorage.setItem("budget."+k,JSON.stringify(v));return true}catch{return false}}
};
const pref={get(k,d){try{const v=localStorage.getItem("budget.pref."+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem("budget.pref."+k,JSON.stringify(v))}catch{}}};

/* ================= state ================= */
/* amounts are integer milliunits (1.00 = 1000), negative = money out. Dates YYYY-MM-DD. */
let S=null,ver=0,past=[],future=[],saveTimer=0,saveFailed=false;
const RTA="rta";
function blank(){return {v:1,settings:{currency:guessCur()},accounts:[],groups:[],cats:[],txns:[],budget:{},rules:[],maps:{},recur:{},lastBackup:null,dirty:0}}
function fixup(s){const b=blank();for(const k in b)if(s[k]==null)s[k]=b[k];for(const k in b.settings)if(s.settings[k]==null)s.settings[k]=b.settings[k];for(const t of s.txns){if(t.amt==null)t.amt=0;if(!t.clr)t.clr="u"}return s}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{const ok=await DB.set("state",S);if(!ok&&!saveFailed){saveFailed=true;renderBanner()}else if(ok&&saveFailed){saveFailed=false;renderBanner()}},250)}
function snapshot(){return JSON.stringify(S)}
function commit(fn,opts={}){
  const snap=snapshot();
  const r=fn();

/* ================= budget engine (YNAB rules) =================

  for(const t of S.txns){

    if(t.xfer){const b=A[t.xfer];if(b&&b.on){if(isCC(a)&&t.amt>0)bump(pay,mk,a.id,toBase(t.amt,a));if(isCC(a)&&t.amt<0)bump(pay,mk,a.id,toBase(t.amt,a));continue}}

}

function decodeText(buf){const u=new Uint8Array(buf);if(u[0]===0xFF&&u[1]===0xFE)return new TextDecoder("utf-16le").decode(u);if(u[0]===0xFE&&u[1]===0xFF)return new TextDecoder("utf-16be").decode(u);try{return new TextDecoder("utf-8",{fatal:true}).decode(u).replace(/^﻿/,"")}catch{try{return new TextDecoder("gb18030").decode(u)}catch{return new TextDecoder("windows-1252").decode(u)}}}
function parseCSV(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/).slice(0,12).join("\n");
  const cand=[",",";","\t","|"];let delim=",",best=-1;
  for(const d of cand){const counts=first.split("\n").filter(Boolean).map(l=>l.split(d).length-1);const mx=Math.max(0,...counts);const score=mx*counts.filter(c=>c===mx).length;if(score>best){best=score;delim=d}}
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"'&&f.trim()==="")q=true,f="";
    else if(c===delim){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x!==""));
}
function headerIndex(rows){const kw=/date|datum|fecha|posted|buchungstag|日期|时间|amount|betrag|montant|金额|payee|description|merchant|name|摘要|交易对方|empf|debit|credit|inflow|outflow|收\/支|memo|narrative|details|verwendungszweck/i;
  for(let i=0;i<Math.min(rows.length,40);i++){const r=rows[i];const hits=r.filter(c=>c&&c.length<40&&kw.test(c)).length;if(hits>=2&&r.filter(Boolean).length>=3)return i}return 0}
/* date parsing with format detection over a whole column */
const DFMT=["auto","YMD","MDY","DMY"];
function splitDate(s){s=String(s||"").trim();let m;
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})/)))return [m[1],m[2],m[3],"YMD"];
  if((m=s.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/)))return [m[1],m[2],m[3],"YMD"];
  if((m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/)))return [m[3],m[1],m[2],"AMB"];
  if((m=s.match(/^(\d{1,2})[-\s]([A-Za-z]{3,})[-\s,]*(\d{2,4})/))){const mo=monIdx(m[2]);if(mo)return [m[3],String(mo),m[1],"YMD"]}
  if((m=s.match(/^([A-Za-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})/))){const mo=monIdx(m[1]);if(mo)return [m[3],String(mo),m[2],"YMD"]}
  return null}
function monIdx(n){const i=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"].indexOf(n.slice(0,3).toLowerCase());return i>=0?i+1:0}
function guessDateFmt(vals){let mdy=0,dmy=0;for(const v of vals){const p=splitDate(v);if(!p||p[3]!=="AMB")continue;const a=+p[1],b=+p[2];if(a>12)dmy++;if(b>12)mdy++}if(dmy>mdy)return "DMY";if(mdy>0)return "MDY";const l=LOC.toLowerCase();return l.startsWith("en-us")||l==="en"?"MDY":(l.startsWith("zh")||l.startsWith("ja")||l.startsWith("ko"))?"MDY":"DMY"}
function toISO(s,fmt){const p=splitDate(s);if(!p)return null;let[y,a,b,k]=p;let mo,d;if(k==="YMD"){mo=+a;d=+b}else if(fmt==="DMY"){d=+a;mo=+b}else{mo=+a;d=+b}y=+y;if(y<100)y+=y<70?2000:1900;if(mo<1||mo>12||d<1||d>31)return null;return `${y}-${p2(mo)}-${p2(d)}`}

async function handleFiles(files){

    try{

      const text=decodeText(buf);

/* classify CSV rows: YNAB register/plan, Mint, Monarch, Copilot, or a bank file that needs mapping */
function importRows(rows,name){
  if(!rows.length){toast(T("That file is empty.","文件是空的。"));return}
  const hi=headerIndex(rows);const H=rows[hi].map(h=>h.toLowerCase().replace(/^﻿/,"").trim());const body=rows.slice(hi+1);
  const has=(...k)=>k.every(x=>H.includes(x));
  if(has("account","date","payee","outflow","inflow")&&(H.includes("category")||H.includes("category group/category")))return importYNABRegister(H,body,name);
  if(has("month","category")&&(H.includes("assigned")||H.includes("budgeted"))&&H.includes("available"))return importYNABPlan(H,body,name);
  if(has("date","description","amount","transaction type","category","account name"))return importApp("Mint",H,body,name);
  if(has("date","merchant","category","account","amount"))return importApp("Monarch",H,body,name);
  if(has("date","name","amount","category","account")&&(H.includes("parent category")||H.includes("type")))return importApp("Copilot",H,body,name);
  mappingStep(rows,hi,name);

let downloads=null,sampleCap=null,desktop=null;
async function saveFile(filename,data){
  if(!downloads){toast(T("Saving files needs the Claude app. Open Budget there to export or back up.","保存文件需要在 Claude 应用中打开。"));return false}
  try{await downloads.save({filename,data});toast(T(`Saved ${filename}`,`已保存 ${filename}`));return true}
  catch(e){const c=e?.code;if(c==="declined")toast(T("Not saved","未保存"));else if(c==="rate_limited")toast(T("Another save is waiting for your answer. Try again in a moment.","另一个保存正在等你确认，稍后再试。"));else toast(T("Couldn't save the file here. Try again from the Claude app.","这里无法保存文件，请在 Claude 应用里再试。"));return false}
}
const stamp=()=>today();

const ERRS={rate_limited:()=>T("Claude is busy or you hit your usage limit. Try again later.","Claude 正忙，或你已达到用量上限，请稍后再试。"),not_granted:()=>T("Claude isn't allowed for this app.","此应用未获准使用 Claude。"),sampling_disabled:()=>T("Claude isn't available on this account.","此账号无法使用 Claude。"),refused:()=>T("Claude declined this request.","Claude 拒绝了这个请求。"),session_expired:()=>T("Sign in to Claude again.","请重新登录 Claude。"),prompt_too_large:()=>T("That's too much at once. Try a shorter range.","内容太多了，换小一点的范围试试。"),invalid_json:()=>T("Claude's answer couldn't be read. Try again.","没读懂 Claude 的回答，请重试。")};

let catCtl=null;
async function aiCategorize(){
  if(!sampleCap){toast(T("Claude isn't available here. Open Budget in the Claude app, or categorize by hand.","这里用不了 Claude。请在 Claude 应用中打开，或手动分类。"));return}
  if(catCtl){catCtl.abort();return}
  const todo=S.txns.filter(t=>needsCat(t)||(t.rev&&t.by==="import"&&!t.cat)).slice(0,600);
  if(!todo.length){toast(T("Nothing left to categorize","没有需要分类的交易了"));return}
  const cats=[...liveCats().filter(c=>!c.hide)];if(!cats.length){toast(T("Add some categories first","请先添加分类"));return}
  const I=ix();const catList=`${RTA} | Inflow: Ready to Assign (income, paychecks, refunds that are income)\n`+cats.map(c=>`${c.id} | ${I.G[c.gid]?.name||""} > ${c.name}`).join("\n");
  const examples=S.rules.filter(r=>!r.off).sort((a,b)=>(b.n||0)-(a.n||0)).slice(0,40).map(r=>`"${r.p}" -> ${r.cat}`).join("\n");
  catCtl=new AbortController();const my=catCtl;let done=0,applied=0;
  toast(T(`Claude is categorizing ${todo.length} transactions…`,`Claude 正在给 ${todo.length} 笔交易分类…`),T("Stop","停止"),()=>my.abort(),60000);
  const snap=snapshot();let changed=false;
  try{
    for(let i=0;i<todo.length;i+=60){if(my.signal.aborted)break;const chunk=todo.slice(i,i+60);
      const lines=chunk.map((t,k)=>`${k} | ${t.date} | ${t.payee||""} | ${t.memo||""} | ${(t.amt/1000).toFixed(2)} ${acur(I.A[t.acct])} | ${I.A[t.acct]?.name||""}`).join("\n");
      const prompt=`You categorize personal finance transactions for a zero-based budget.\nCategories (id | group > name):\n${catList}\n\n${examples?`The person's own past choices (payee -> category id):\n${examples}\n\n`:""}Transactions (index | date | payee | memo | amount, negative = money out | account):\n${lines}\n\nFor each transaction pick the single best category id from the list. Use "${RTA}" only for income. If nothing fits or you can't tell, use "". Return JSON exactly like {"items":[{"i":0,"cat":"<id>"}]} with one entry per transaction.`;
      const r=await sampleCap.json(prompt,{signal:my.signal,modelTier:"quick",cache:false});
      const items=Array.isArray(r?.items)?r.items:[];
      for(const it of items){const t=chunk[+it.i];if(!t)continue;const c=String(it.cat||"");if(c&&(c===RTA||I.C[c])&&!I.C[c]?.cc){const live=S.txns.find(x=>x.id===t.id);if(live&&!live.cat){live.cat=c;live.rev=1;live.by="claude";applied++;changed=true}}}
      done+=chunk.length;
      if(changed){ver++;renderSide();if(["acct","all","review"].includes(UI.view)&&!UI.edit)renderRegister()}
      if(i+60<todo.length)toast(T(`Claude categorized ${applied} of ${todo.length}…`,`Claude 已分类 ${applied}/${todo.length}…`),T("Stop","停止"),()=>my.abort(),60000);
    }
    if(changed){past.push(snap);future=[];S.dirty++;ver++;save();render()}
    toast(T(`Claude suggested ${applied} categories. They're marked ✦ — approve or change them.`,`Claude 建议了 ${applied} 个分类，标有 ✦，请确认或修改。`),T("Review","去复核"),()=>{UI.filter="rev";go("review")},8000);
  }catch(e){if(changed){past.push(snap);future=[];ver++;save();render()}
    if(e?.code==="cancelled"||my.signal.aborted)toast(T(`Stopped. ${applied} categorized.`,`已停止，分好 ${applied} 笔。`));else{toast(errText(e));if(e?.code==="not_granted"){sampleCap=null;render()}}}
  finally{if(catCtl===my)catCtl=null}
}

function md2html(s){let h=esc(s);
  h=h.replace(/^\|(.+)\|\s*\n\|[-:\s|]+\|\s*\n((?:\|.*\|\s*(?:\n|$))+)/gm,(m,head,rows)=>`<table><tr>${head.split("|").map(c=>`<th>${c.trim()}</th>`).join("")}</tr>${rows.trim().split("\n").map(r=>`<tr>${r.replace(/^\||\|\s*$/g,"").split("|").map(c=>`<td>${c.trim()}</td>`).join("")}</tr>`).join("")}</table>`);
  h=h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>");
  h=h.replace(/^#{1,4}\s*(.+)$/gm,"<b>$1</b>");
  h=h.replace(/(?:^|\n)((?:[-•*] .+(?:\n|$))+)/g,(m,b)=>`\n<ul>${b.trim().split("\n").map(l=>`<li>${l.replace(/^[-•*] /,"")}</li>`).join("")}</ul>`);
  h=h.replace(/(?:^|\n)((?:\d+\. .+(?:\n|$))+)/g,(m,b)=>`\n<ol>${b.trim().split("\n").map(l=>`<li>${l.replace(/^\d+\. /,"")}</li>`).join("")}</ol>`);
  return h.split(/\n{2,}/).map(p=>/^\s*<(ul|ol|table)/.test(p)?p:`<p>${p.replace(/\n/g,"<br>")}</p>`).join("")}

function financeContext(){
  const I=ix(),B=balances(),E=engine(),cm=curMk();
  const acc=S.accounts.filter(a=>!a.del).map(a=>`${a.name} | ${typeName(a.type)} | ${a.on?"on-budget":"tracking"}${a.closed?" (closed)":""} | balance ${fm(B[a.id]?.w||0,acur(a))}${acur(a)!==base()?` (≈${fm(toBase(B[a.id]?.w||0,a))})`:""}`).join("\n");

  const ms=monthsIn(addM(cm,-11),cm);const F=flows(addM(cm,-11),cm);
  const catTot={};for(const x of F){if(x.cat===RTA)continue;const k=catName(x.cat,true);(catTot[k]||(catTot[k]={}))[x.mk]=((catTot[k]||{})[x.mk]||0)-x.v}
  const spendTable="category | "+ms.join(" | ")+"\n"+Object.entries(catTot).map(([k,o])=>k+" | "+ms.map(m=>((o[m]||0)/1000).toFixed(0)).join(" | ")).join("\n");
  const inc=ms.map(m=>`${m}: ${((sum(F.filter(x=>x.mk===m&&x.cat===RTA).map(x=>x.v)))/1000).toFixed(0)}`).join(", ");
  const rec=detectRecurring().filter(r=>r.status!=="no").map(r=>`${r.name} | ${r.cad.en} | ${fm(-r.amt)} | next ${r.next}${r.status==="cancel"?" | plans to cancel":""}${r.change>0.03?` | price up ${Math.round(r.change*100)}%`:""}`).join("\n");
  return `Today is ${today()}. Budget currency ${base()}. Amounts: negative = money out.\n\nACCOUNTS\n${acc}\n\nTHIS MONTH'S BUDGET (${cm}), Ready to Assign ${fm(md.rta)}\n${budget}\n\nSPENDING BY CATEGORY PER MONTH (last 12 months, whole ${base()})\n${spendTable}\n\nINCOME PER MONTH: ${inc}\n\nRECURRING CHARGES\n${rec||"none detected"}\n\nUncategorized transactions: ${S.txns.filter(needsCat).length}. Total transactions: ${S.txns.length}, from ${S.txns.map(t=>t.date).sort()[0]||"-"}.`;
}
function searchTx(q){const I=ix();let list=S.txns.filter(t=>I.A[t.acct]&&!I.A[t.acct].del);
  if(q.text){const s=String(q.text).toLowerCase();list=list.filter(t=>(t.payee||"").toLowerCase().includes(s)||(t.memo||"").toLowerCase().includes(s))}
  if(q.category){const s=String(q.category).toLowerCase();list=list.filter(t=>lines(t).some(l=>catName(l.cat,true).toLowerCase().includes(s)))}
  if(q.account){const s=String(q.account).toLowerCase();list=list.filter(t=>I.A[t.acct].name.toLowerCase().includes(s))}
  if(q.from)list=list.filter(t=>t.date>=q.from);if(q.to)list=list.filter(t=>t.date<=q.to);
  if(q.min_amount!=null)list=list.filter(t=>Math.abs(t.amt)>=mu(+q.min_amount));
  if(q.direction==="out")list=list.filter(t=>t.amt<0);if(q.direction==="in")list=list.filter(t=>t.amt>0);
  list.sort((a,b)=>a.date<b.date?1:-1);
  const total=sum(list.map(t=>toBase(t.amt,I.A[t.acct])));
  return {count:list.length,total:fm(total),total_number:total/1000,transactions:list.slice(0,Math.min(+q.limit||40,120)).map(t=>({date:t.date,account:I.A[t.acct].name,payee:payeeLabel(t),category:t.splits?.length?t.splits.map(s=>catName(s.cat,true)).join(" + "):catName(t.cat,true),memo:t.memo||"",amount:t.amt/1000,currency:acur(I.A[t.acct])}))}}

    if((e.key==="ArrowLeft"||e.key==="ArrowRight")&&UI.view==="budget"&&!typing(e.target)){e.preventDefault();shiftMonth(e.key==="ArrowLeft"?-1:1);return}
  }

});

text><\/g><rect x=\"3\" y=\"3\" width=\"1018\" height=\"1018\" rx=\"228\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".14\" stroke-width=\"6\"/><\/svg>";
function dockIconArt(){return new Promise(res=>{const img=new Image();img.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");x.shadowColor="rgba(0,0,0,.3)";x.shadowBlur=20;x.shadowOffsetY=8;x.drawImage(img,50,44,412,412);res(c.toDataURL("image/png"))}catch{res(dockIcon())}};img.onerror=()=>res(dockIcon());img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(DOCK_SVG)})}
/*END_DOCK_ART*/
function dockIcon(){
  const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,"#2fb37a");g.addColorStop(1,"#13704a");
  x.fillStyle=g;x.beginPath();x.roundRect(8,8,240,240,54);x.fill();
  const bars=[[52,120,"#ffffff"],[96,80,"rgba(255,255,255,.85)"],[140,150,"#ffffff"],[184,104,"rgba(255,255,255,.7)"]];
  for(const[bx,h,col]of bars){x.fillStyle=col;x.beginPath();x.roundRect(bx,206-h,30,h,8);x.fill()}
  x.fillStyle="rgba(255,255,255,.95)";x.font="bold 54px -apple-system,Helvetica,Arial";x.textAlign="center";x.textBaseline="middle";x.fillText("$",128,64);
  return c.toDataURL("image/png");
}

<script>
/*INSTALL_PROMPT*/
/* When this artifact is open in Claude Desktop but not installed as an app yet, invite the person
   to install it. Shows once per session; the install itself is Claude's own dialog, started from
   the person's click (install.request() needs a click). Silent in browsers, on mobile and inside the
   installed app. */
(async()=>{
  if(!window.claude||!claude.use)return;
  try{if(sessionStorage.getItem("appstore.installAsked"))return}catch{}
  const d=await claude.use("desktop").catch(()=>null);
  if(!d||d.fs||!d.install)return;                       // d.fs exists only inside the installed app
  const st=await d.install.state().catch(()=>"unavailable");
  if(st!=="available")return;
  await new Promise(r=>setTimeout(r,900));
  if(document.querySelector(".aspi"))return;
  const zh=window.__ZH??/^zh/i.test(navigator.language||"");
  const T=(en,c)=>zh?c:en;
  const name=(document.title||"").trim()||T("this app","这个 app");
  const icon=typeof DOCK_SVG==="string"?DOCK_SVG:(typeof ICON_SVG==="object"&&ICON_SVG.store)||"";
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const st2=document.createElement("style");
  st2.textContent=`.aspi{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:rgba(20,20,19,.42);padding:16px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}

@media (prefers-color-scheme:dark){.aspi .b{--bg:#262624;--fg:#FAF9F5;--mu:#A6A39A;--pill:#3A3632;--ac:#E08A6A;--on:#1F1E1D}}

.aspi .y{background:var(--ac);color:var(--on)}.aspi .n{background:var(--pill);color:var(--fg)}`;
  const m=document.createElement("div");m.className="aspi";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("data-no-i18n","");
  m.innerHTML=`<div class="b"><div class="ic">${icon}</div>
    <h3>${esc(T(`Install ${name} as an app?`,`把「${name}」安装为 app？`))}</h3>
    <p>${esc(T("It gets its own window and Dock icon, opens like any other app, and keeps working on your Claude plan.","装好后有自己的窗口和 Dock 图标，像普通 app 一样打开，继续用你的 Claude 套餐。"))}</p>
    <div class="row"><button class="y">${esc(T("Install","安装"))}</button><button class="n">${esc(T("Not now","以后再说"))}</button></div></div>`;
  const close=()=>{m.remove();st2.remove();try{sessionStorage.setItem("appstore.installAsked","1")}catch{}};
  m.addEventListener("click",async e=>{
    if(e.target===m||e.target.closest(".n"))return close();
    if(e.target.closest(".y")){const r=await d.install.request().catch(()=>"failed");close();
      if(r==="failed"||r==="unavailable"){const n=document.createElement("div");n.textContent=T("Couldn't install. Use Install as app in the artifact's menu.","没装上。可以在工件菜单里选“安装为 app”。");n.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141413;color:#fff;padding:10px 14px;border-radius:10px;z-index:2147483000;font:13px system-ui";document.body.appendChild(n);setTimeout(()=>n.remove(),5000)}}
  });
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"&&m.isConnected){close();document.removeEventListener("keydown",k)}});
  document.head?document.head.appendChild(st2):document.body.appendChild(st2);document.body.appendChild(m);
  m.querySelector(".y").focus();
})();

</script>
