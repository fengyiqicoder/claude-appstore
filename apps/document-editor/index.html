<title>AI Document Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Word-like editor. Top bar (title, open/export, Draft), formatting ribbon, then three columns:
   sidebar (outline / recent), the page on a grey canvas, and the Claude panel (assistant chat / review changes). */
:root{
  --bg:#eef0f3; --chrome:#f8f9fb; --panel:#ffffff; --fg:#17191d; --muted:#6b7280; --line:#e1e4e9; --chip:#eef1f5; --hover:#e9ecf1;
  --accent:#2f5bd3; --accent-fg:#fff; --accent-soft:#e8eefc;
  --ins:#0f7b3f; --ins-bg:rgba(22,163,74,.12); --del:#b42318; --del-bg:rgba(220,38,38,.09); --you:#1d4ed8; --you-bg:rgba(37,99,235,.10);
  --page:#ffffff; --page-fg:#1b1c1f; --shadow:0 1px 3px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --docfont:Aptos,Calibri,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121417;--chrome:#1a1d21;--panel:#1d2025;--fg:#eceef2;--muted:#9097a3;--line:#2d3138;--chip:#272b31;--hover:#2b3037;--accent:#7a9cff;--accent-fg:#0b1430;--accent-soft:#232c45;--shadow:0 1px 3px rgba(0,0,0,.5),0 8px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121417;--chrome:#1a1d21;--panel:#1d2025;--fg:#eceef2;--muted:#9097a3;--line:#2d3138;--chip:#272b31;--hover:#2b3037;--accent:#7a9cff;--accent-fg:#0b1430;--accent-soft:#232c45;--shadow:0 1px 3px rgba(0,0,0,.5),0 8px 30px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--font);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:6px;background:var(--chrome);padding:7px max(12px,env(safe-area-inset-right,0px)) 7px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);min-width:0}
body.app .top{app-region:drag;-webkit-app-region:drag}
body.app.inset .top{padding-left:max(80px,env(safe-area-inset-left,0px))}
.top>*{app-region:no-drag;-webkit-app-region:no-drag}
.top .sp{flex:1;min-width:4px;app-region:drag;-webkit-app-region:drag}
#title{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 7px;font-weight:600;font-size:14px;min-width:60px;width:clamp(90px,28vw,360px);text-overflow:ellipsis}
#title:hover{border-color:var(--line)}#title:focus{outline:none;border-color:var(--accent);background:var(--panel)}
#saved{color:var(--muted);font-size:12px;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 10px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.ic{width:30px;height:30px;padding:0;justify-content:center;border-radius:7px;border:0;background:transparent;font-size:14px;display:inline-flex;align-items:center}
.ic:hover{background:var(--hover)}
.ic.on{background:var(--accent-soft);color:var(--accent)}
.lbl{display:inline}
/* ribbon */
.ribbon{display:flex;align-items:center;gap:2px;padding:4px max(10px,env(safe-area-inset-right,0px)) 4px max(10px,env(safe-area-inset-left,0px));background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.ribbon::-webkit-scrollbar{display:none}
.ribbon .sep{width:1px;height:20px;background:var(--line);margin:0 5px;flex-shrink:0}
.ribbon .ic{flex-shrink:0}
.ribbon b,.ribbon i,.ribbon u,.ribbon s{pointer-events:none}
#styleSel{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 6px;width:118px;flex-shrink:0}
.colorbtn{position:relative}
.colorbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.swatch{display:block;width:14px;height:3px;border-radius:2px;margin-top:-2px}
.ai-btn{color:var(--accent);font-weight:600;width:auto;padding:0 9px;gap:4px;flex-shrink:0;white-space:nowrap}
/* main */
.main{flex:1;display:flex;min-height:0;position:relative}
#side{width:240px;flex-shrink:0;background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#panel{width:340px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:6px 10px 8px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .x{margin-left:auto;border:0}
.count{background:var(--accent);color:var(--accent-fg);border-radius:9px;font-size:11px;padding:0 6px;line-height:17px;min-width:17px;text-align:center}
.scroll{flex:1;overflow:auto;min-height:0}
#outline{padding:8px 6px}
#outline a{display:block;padding:4px 8px;border-radius:6px;color:var(--fg);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#outline a:hover{background:var(--hover)}
#outline a.l2{padding-left:20px;color:var(--muted)}#outline a.l3{padding-left:32px;color:var(--muted);font-size:12px}
#outline a.cur{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);padding:14px 12px;font-size:12.5px;line-height:1.5}
#recent{padding:6px}
.rec{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer}
.rec:hover{background:var(--hover)}.rec.cur{background:var(--accent-soft)}
.rec .t{flex:1;min-width:0}.rec .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .m{font-size:11.5px;color:var(--muted)}
.rec .del{opacity:0;border:0;background:transparent;color:var(--muted);font-size:14px;border-radius:5px;padding:2px 6px}
.rec:hover .del{opacity:1}.rec .del:hover{background:var(--line)}
.side-foot{padding:8px;border-top:1px solid var(--line);display:flex;gap:6px}
/* canvas + page */
#canvas{flex:1;overflow:auto;min-width:0;position:relative;padding:22px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
.sheet{width:816px;max-width:100%;margin:0 auto;background:var(--page);color:var(--page-fg);box-shadow:var(--shadow);border-radius:2px;padding:72px 96px 96px;min-height:1056px;position:relative;transform-origin:top center;color-scheme:light}
.hf{color:#8a8f98;font:11px/1.4 var(--font);white-space:pre-wrap;user-select:none;min-height:0}
.hf.top{margin:-40px 0 24px;border-bottom:1px dashed #e3e5e8;padding-bottom:6px}
.hf.bottom{margin-top:36px;border-top:1px dashed #e3e5e8;padding-top:6px}
.doc{outline:none;font:11pt/1.5 var(--docfont);min-height:800px;caret-color:#1b1c1f;word-wrap:break-word;overflow-wrap:break-word;tab-size:4}
.doc:empty::before,.doc>p:only-child:has(>br:only-child)::before{content:"Start typing, paste from Word or Google Docs, or press ⌥I to draft with Claude.";color:#9aa0a8;position:absolute;pointer-events:none}
.doc p{margin:0 0 8pt}
.doc h1,.doc h2,.doc h3,.doc h4,.doc h5,.doc h6{color:#0f4761;font-weight:600;line-height:1.25;margin:18pt 0 6pt}
.doc h1{font-size:20pt}.doc h2{font-size:16pt}.doc h3{font-size:14pt}.doc h4{font-size:12pt;font-style:italic}.doc h5,.doc h6{font-size:11pt}
.doc>*:first-child{margin-top:0}
.doc ul,.doc ol{margin:0 0 8pt;padding-left:28px}
.doc li{margin:0 0 2pt}.doc li>p{margin:0}
.doc blockquote{margin:6pt 0 10pt;padding:2px 0 2px 16px;border-left:3px solid #c9ced6;color:#454a52;font-style:italic}
.doc pre{font:10pt/1.45 Menlo,Consolas,"Courier New",monospace;background:#f4f5f7;padding:10px 12px;border-radius:4px;white-space:pre-wrap;margin:0 0 8pt}
.doc code{font:0.92em Menlo,Consolas,"Courier New",monospace;background:#f1f2f4;padding:0 3px;border-radius:3px}
.doc pre code{background:none;padding:0}
.doc a{color:#0563c1;text-decoration:underline}
.doc table{color:inherit;font:inherit;line-height:inherit;border-collapse:collapse;width:100%;margin:4pt 0 10pt;table-layout:auto}
.doc td,.doc th{color:inherit;border:1px solid #a9adb4;padding:4px 7px;vertical-align:top;min-width:30px}
.doc th{background:#f3f4f6;font-weight:600;text-align:left}
.doc td>p:last-child,.doc th>p:last-child{margin-bottom:0}
.doc img{max-width:100%;height:auto;vertical-align:bottom}
.doc img.sel{outline:2px solid var(--accent);outline-offset:2px}
.doc hr{border:0;border-top:1px solid #c9ced6;margin:12pt 0}
.doc hr.pagebreak{border-top:1px dashed #9aa3af;margin:18pt 0;position:relative;overflow:visible}
.doc hr.pagebreak::after{content:"Page break";position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:#fff;color:#8a8f98;font:10px var(--font);padding:0 6px}
.doc .tab{white-space:pre}
.doc mark{background:#fff59d;color:inherit}
/* tracked changes */
.doc ins.tc{text-decoration:underline;text-decoration-color:var(--ins);color:var(--ins);background:var(--ins-bg);border-radius:2px}
.doc del.tc{text-decoration:line-through;color:var(--del);background:var(--del-bg);border-radius:2px}
.doc ins.tc[data-mine]{color:var(--you);text-decoration-color:var(--you);background:var(--you-bg)}
.doc del.tc[data-mine]{color:#8b1d1d}
.doc [data-tcb="ins"]{background:var(--ins-bg);box-shadow:-8px 0 0 -4px var(--ins);color:var(--ins)}
.doc [data-tcb="del"]{text-decoration:line-through;color:var(--del);background:var(--del-bg);box-shadow:-8px 0 0 -4px var(--del)}
.doc table[data-tcb]{box-shadow:none;outline:2px solid currentColor;outline-offset:2px}
.doc [data-tc].flash{animation:flash 1.1s ease}
@keyframes flash{0%,60%{outline:3px solid #f59e0b;outline-offset:1px}100%{outline:3px solid transparent}}
.doc .ghost{border-left:3px solid var(--accent);padding-left:12px;margin-left:-15px;color:#2b3a67}
.doc .ghost:empty::before{content:"Claude is writing…";color:#8a8f98;font-style:italic}
.doc .cmt{background:rgba(250,204,21,.22);border-bottom:2px solid rgba(217,160,6,.75);cursor:pointer}
.doc .cmt .cmt{background:rgba(250,204,21,.35)}
.doc .cmt.hot{background:rgba(250,204,21,.6)}
.doc .cmt.pt{border:0;background:none;font-size:11px;vertical-align:super}
.doc{counter-reset:fn}
.doc sup.fn{color:#0563c1;cursor:pointer;font-size:.72em;padding:0 1px}
.doc sup.fn::after{counter-increment:fn;content:counter(fn)}
.notes{margin-top:28px;border-top:1px solid #d5d8de;padding-top:8px;font:9.5pt/1.45 var(--docfont);color:#30343a;counter-reset:nt}
.notes div{cursor:pointer;padding:1px 0}.notes div:hover{background:#f3f5f8}
.notes div::before{counter-increment:nt;content:counter(nt) ". ";color:#0563c1}
.card.cm{border-left:3px solid #eab308}
.card .q{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:7px;margin:2px 0 6px;max-height:54px;overflow:hidden}
.card textarea{width:100%;min-height:60px;border:1px solid var(--accent);border-radius:7px;padding:6px 8px;background:var(--panel);resize:vertical;outline:none}
.card.hot{box-shadow:0 0 0 2px #eab308}
.rv-sec{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:6px 2px 0}
.rv-name{display:flex;gap:6px;align-items:center;padding:0 12px 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.rv-name input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--panel)}
.doc .lowc-d{color:#1b1c1f!important}.doc .lowc-l{color:#ffffff!important}
::highlight(find){background:#fde68a;color:#111}
::highlight(findcur){background:#f59e0b;color:#111}
/* panel */
.pbody{display:flex;flex-direction:column;flex:1;min-height:0}
#msgs{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.hello h3{margin:6px 0 4px;font-size:15px}.hello p{margin:0 0 12px;color:var(--muted);line-height:1.5}
.qa{display:flex;flex-direction:column;gap:2px}
.qa button{border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:7px;display:flex;gap:9px;align-items:center}
.qa button:hover{background:var(--hover)}
.qa .g{width:18px;text-align:center;color:var(--accent)}
.qa .grp{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 8px 3px;font-weight:600}
.msg{line-height:1.5;font-size:13.5px}
.msg.user{align-self:flex-end;background:var(--accent-soft);padding:7px 11px;border-radius:12px 12px 3px 12px;max-width:88%;white-space:pre-wrap}
.msg.bot{align-self:stretch}
.msg.bot p{margin:0 0 8px}.msg.bot ul,.msg.bot ol{margin:0 0 8px;padding-left:20px}.msg.bot h1,.msg.bot h2,.msg.bot h3{font-size:14px;margin:10px 0 4px}
.msg.bot table{color:inherit;font-size:12.5px;border-collapse:collapse;margin:4px 0 8px;font-size:12.5px}.msg.bot td,.msg.bot th{border:1px solid var(--line);padding:3px 6px}
.msg.bot code{background:var(--chip);padding:0 3px;border-radius:3px}
.msg.err{color:var(--del)}
.macts{display:flex;gap:4px;margin-top:2px}
.macts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--muted)}
.macts button:hover{color:var(--fg);background:var(--hover)}
.composer{border-top:1px solid var(--line);padding:10px 12px max(10px,env(safe-area-inset-bottom,0px))}
.cbox{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px 8px 6px}
.cbox:focus-within{border-color:var(--accent)}
#ask{width:100%;border:0;outline:0;background:transparent;resize:none;min-height:38px;max-height:160px;line-height:1.4}
.crow{display:flex;align-items:center;gap:6px}
.crow .ctx{font-size:11.5px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sendBtn{width:28px;height:28px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-size:14px;display:grid;place-items:center}
#sendBtn:disabled{opacity:.4}
.rv-head{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.rv-head .grow{flex:1}
#rvList{padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;background:var(--panel)}
.card:hover{border-color:var(--accent)}
.card .k{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:4px}
.card .k .dot{width:7px;height:7px;border-radius:50%;background:var(--ins)}
.card .k .dot.d{background:var(--del)}.card .k .dot.r{background:#d97706}
.card .tx{font-size:13px;line-height:1.45;word-break:break-word;max-height:88px;overflow:hidden}
.card .tx s{color:var(--del);background:var(--del-bg)}.card .tx ins{color:var(--ins);background:var(--ins-bg);text-decoration:none}
.card .why{font-size:12px;color:var(--muted);margin-top:4px}
.card .acts{display:flex;gap:6px;margin-top:8px}
.card .acts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 10px;font-size:12px}
.card .acts .ok{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
/* status */
.status{display:flex;align-items:center;gap:14px;padding:4px max(12px,env(safe-area-inset-right,0px)) max(4px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--chrome);border-top:1px solid var(--line);color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}
.status .grow{flex:1}
.status button{border:0;background:transparent;color:var(--muted);padding:2px 6px;border-radius:5px;font-size:12px}
.status button:hover{background:var(--hover);color:var(--fg)}
#aiState{color:var(--accent);display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis}
#aiState button{color:var(--accent);border:1px solid var(--accent);padding:0 7px}
.spin{width:11px;height:11px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
/* floating */
.float{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.16);color:var(--fg)}
#bubble{display:flex;padding:3px;gap:1px;align-items:center}
#bubble .ic{width:28px;height:28px}
#bubble .ai-btn{height:28px;border-radius:7px;width:auto;padding:0 9px}
#aimenu{width:300px;max-height:min(460px,70vh);overflow:auto;padding:6px}
#aimenu .in{display:flex;gap:6px;padding:4px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
#aiIn{flex:1;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--panel);outline:none;min-width:0}
#aiIn:focus{border-color:var(--accent)}
.mi{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:6px}
.mi:hover,.mi.hl{background:var(--hover)}
.mi .g{width:18px;text-align:center;color:var(--accent);flex-shrink:0}
.mi .k{margin-left:auto;color:var(--muted);font-size:11px}
.mh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px 8px 2px;font-weight:600}
.sub{display:flex;flex-wrap:wrap;gap:4px;padding:2px 8px 6px 35px}
.sub button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:2px 9px;font-size:12px}
.sub button:hover{border-color:var(--accent);color:var(--accent)}
.menu{position:fixed;z-index:60;padding:5px;min-width:220px}
.menu .note{font-size:11.5px;color:var(--muted);padding:6px 8px 2px;max-width:260px;line-height:1.4}
#opbar{display:flex;align-items:center;gap:4px;padding:4px;font-size:12.5px}
#opbar .t{padding:0 6px;color:var(--muted);white-space:nowrap}
#tcpop{padding:8px;max-width:300px;font-size:12.5px}
#tcpop .why{color:var(--muted);margin-bottom:6px}
#tcpop .row{display:flex;gap:6px}
#findbar{display:flex;gap:6px;align-items:center;padding:6px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));background:var(--chrome);border-bottom:1px solid var(--line);flex-wrap:wrap}
#findbar input[type=text]{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--panel);width:180px;min-width:0;outline:none}
#findbar input[type=text]:focus{border-color:var(--accent)}
#findCount{color:var(--muted);font-size:12px;min-width:56px}
.dlg-back{position:fixed;inset:0;background:rgba(10,12,16,.35);z-index:80;display:grid;place-items:center;padding:16px}
.dlg{background:var(--panel);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px}
.dlg h2{margin:0 0 4px;font-size:16px}.dlg .sub2{color:var(--muted);margin:0 0 12px}
.dlg textarea,.dlg input[type=text],.dlg input[type=url],.dlg select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);outline:none}
.dlg textarea{min-height:110px;resize:vertical;line-height:1.45}
.dlg textarea:focus,.dlg input:focus{border-color:var(--accent)}
.dlg .row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.dlg .row label{color:var(--muted);font-size:12px}

async function saveNow(){
  clearTimeout(saveT);if(!dirty)return;

  if(!cur.id)cur.id=uid();
  if(cur.title===UNTITLED){const first=leaves().map(l=>ownText(l).trim()).find(Boolean);if(first){setTitle(first.slice(0,60).replace(/[.,;:]+$/,""));}}
  const html=cleanHtml(), words=countWords(textOf(page,true)).words;
  const ok=await dbPut({id:cur.id,title:cur.title,html,pkg:cur.pkg,css:cur.css,hf:cur.hf,source:cur.source,chat:cur.chat.slice(-40),comments:cur.comments,pg:cur.pg,updated:Date.now()});

function loadDoc(d){

/* ============ text helpers ============ */
function isTcDeleted(n){for(let e=n.nodeType===1?n:n.parentElement;e&&e!==page;e=e.parentElement){if(e.matches?.("del.tc,[data-tcb='del']"))return true;}return false;}
// Plain text of a node. accepted=true hides tracked deletions (the "final" view).
function textOf(root,accepted){
  let out="";
  const walk=n=>{
    if(n.nodeType===3){out+=n.data;return;}
    if(n.nodeType!==1)return;
    if(accepted&&n.matches("del.tc,[data-tcb='del']"))return;
    if(n.tagName==="BR"){out+="\n";return;}
    if(n.classList.contains("eq")){out+=" $"+(n.dataset.tex||"")+"$ ";return;}
    if(n.classList.contains("pgsp"))return;
    if(n.tagName==="TD"||n.tagName==="TH"){for(const c of n.childNodes)walk(c);out=out.replace(/\n+$/,"")+"\t";return;}
    const blk=BLOCK_TAGS.has(n.tagName);
    if(blk&&out&&!out.endsWith("\n"))out+="\n";
    for(const c of n.childNodes)walk(c);
    if(blk&&!out.endsWith("\n"))out+="\n";
    if(n.tagName==="P"||/^H\d$/.test(n.tagName))out+="\n";
  };
  for(const c of root.childNodes)walk(c);
  return out.replace(/\t\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}
function countWords(t){const cjk=(t.match(/[぀-ヿ㐀-鿿豈-﫿가-힯]/g)||[]).length;const rest=t.replace(/[぀-ヿ㐀-鿿豈-﫿가-힯]/g," ");const w=(rest.match(/[\p{L}\p{N}][\p{L}\p{N}'’\-_.]*/gu)||[]).length;return{words:w+cjk,chars:t.replace(/\s/g,"").length};}

/* leaves: blocks whose own content is inline text */

function leaves(root=page){const out=[];const walk=el=>{for(const c of el.children){if(c.matches("[data-tcb='del']"))continue;if(c.classList.contains("ghost")||c.classList.contains("toc"))continue;if(LEAF_TAGS.has(c.tagName)){if(!hasBlockChild(c))out.push(c);else{if(ownText(c).trim())out.push(c);walk(c);}}else if(BLOCK_TAGS.has(c.tagName))walk(c);}};walk(root);return out;}

const ownText=leaf=>leafNodes(leaf).map(t=>t.data).join("");
function pointOffset(leaf,container,offset){

  const r=document.createRange();r.setStart(leaf,0);r.setEnd(container,offset);let n=0;

function segments(leaf,a,b){const segs=[];let pos=0;for(const t of leafNodes(leaf)){const s=pos,e=pos+t.length;pos=e;if(e<=a||s>=b)continue;segs.push([t,Math.max(0,a-s),Math.min(t.length,b-s)]);}return segs;}

const nowIso=()=>new Date().toISOString().replace(/\.\d+Z$/,"Z");
let myName=store.get("name","");const meName=()=>myName||zh("You","我");
function tcEl(tag,meta){const e=document.createElement(tag);e.className="tc";e.dataset.tc=meta.id;e.dataset.by=meta.by||"Claude";if(meta.mine)e.dataset.mine="1";e.dataset.at=meta.at||nowIso();if(meta.why)e.dataset.why=meta.why;if(meta.op)e.dataset.op=meta.op;if(tag==="del")e.contentEditable="false";return e;}
function wrapDel(leaf,a,b,meta){let last=null,first=null;for(const[t0,i,j]of segments(leaf,a,b)){let t=t0;if(i>0)t=t.splitText(i);if(j-i<t.length)t.splitText(j-i);const pi=t.parentElement.closest("ins.tc");if(pi&&leaf.contains(pi)){const nx=t.nextSibling;t.remove();if(!pi.textContent)pi.remove();continue;}const d=tcEl("del",meta);t.parentNode.insertBefore(d,t);d.appendChild(t);const prev=d.previousSibling;if(prev&&prev.nodeType===1&&prev.matches("del.tc")&&prev.dataset.tc===meta.id){prev.append(...d.childNodes);d.remove();last=prev;}else last=d;first=first||last;}if(last){last.__first=first;}return last;}

function diffChanges(a,b){

// Replace leaf text [a,b) with newText as tracked changes. Returns number of change groups.

let tcSeq=0;
function markBlockDel(el,meta){el.dataset.tcb="del";el.dataset.tc=meta.id;el.dataset.by=meta.by||"Claude";el.dataset.at=nowIso();if(meta.op)el.dataset.op=meta.op;if(meta.why)el.dataset.why=meta.why;el.contentEditable="false";}
function markBlockIns(el,meta){el.dataset.tcb="ins";el.dataset.tc=meta.id;el.dataset.by=meta.by||"Claude";if(meta.mine)el.dataset.mine="1";el.dataset.at=nowIso();if(meta.op)el.dataset.op=meta.op;if(meta.why)el.dataset.why=meta.why;}

function tidy(p){while(p&&p!==page&&(p.tagName==="UL"||p.tagName==="OL"||p.tagName==="TBODY"||p.tagName==="TR"||p.tagName==="TABLE")&&!p.children.length){const q=p.parentElement;p.remove();p=q;}if(!page.firstChild)page.innerHTML="<p><br></p>";}

function fixStructure(){
  // stray text at top level -> paragraph; normalise <div> lines from Enter into <p>
  for(const n of[...page.childNodes]){if((n.nodeType===3&&n.data.trim())||(n.nodeType===1&&!BLOCK_TAGS.has(n.tagName)&&n.tagName!=="BR"&&n.tagName!=="STYLE")){const p=document.createElement("p");n.replaceWith(p);p.appendChild(n);}}

  for(const p of page.querySelectorAll("p")){const blocks=[...p.children].filter(c=>BLOCK_TAGS.has(c.tagName));if(!blocks.length)continue;const sel=getSelection();const keep=sel.rangeCount?sel.getRangeAt(0).cloneRange():null;const frag=[];let cur2=null;for(const n of[...p.childNodes]){if(n.nodeType===1&&BLOCK_TAGS.has(n.tagName)){cur2=null;frag.push(n);}else{if(n.nodeType===3&&!n.data.trim()&&!cur2)continue;if(n.nodeName==="BR"&&!cur2)continue;if(!cur2){cur2=document.createElement("p");frag.push(cur2);}cur2.append(n);}}p.replaceWith(...frag);if(keep)try{sel.removeAllRanges();sel.addRange(keep);}catch{}}

  if(!page.firstChild)page.innerHTML="<p><br></p>";

function ensureFocus(){if(!page.contains(getSelection().anchorNode)){page.focus();const sel=getSelection();if(lastRange)try{sel.removeAllRanges();sel.addRange(lastRange);}catch{}}}

function exec(cmd,val){

// Editing next to (or across) a page-split spacer: Chrome treats the spacer as a block and inserts <br>s, eats spaces
// or deletes nothing, so drop those spacers first (pagination puts them back)
function dropSpacers(){const s=getSelection();if(!s.rangeCount||!page.contains(s.anchorNode))return;const r=s.getRangeAt(0);const ls=new Set([leafOf(r.startContainer),leafOf(r.endContainer)]);
  let[a,ao,b,bo]=[r.startContainer,r.startOffset,r.endContainer,r.endOffset];let n=0;
  for(const l of ls){if(!l)continue;for(const sp of l.querySelectorAll(".pgsp:not(.colsp)")){const par=sp.parentNode,k=[...par.childNodes].indexOf(sp);if(r.collapsed){const g=document.createRange();try{if(r.comparePoint(par,k)<0){g.setStartAfter(sp);g.setEnd(a,ao);}else{g.setStart(a,ao);g.setEndBefore(sp);}}catch{continue;}if(g.toString().trim())continue;}if(a===par&&ao>k)ao--;if(b===par&&bo>k)bo--;sp.remove();n++;}}
  if(n)try{s.setBaseAndExtent(a,ao,b,bo);}catch{}}
page.addEventListener("keydown",e=>{
  const mod=isMac?e.metaKey:e.ctrlKey;
  if((e.key==="Backspace"||e.key==="Delete"||e.key==="Enter")&&!e.isComposing&&paged)dropSpacers();
  if(e.key==="Tab"){e.preventDefault();const l=leafOf(getSelection().anchorNode);if(l&&l.tagName==="LI")exec(e.shiftKey?"outdent":"indent");else if(l&&(l.tagName==="TD"||l.tagName==="TH"))moveCell(l,e.shiftKey?-1:1);else if(!e.shiftKey){cp();document.execCommand("insertHTML",false,'<span class="tab">\t</span>​');afterChange();}return;}
  if(!mod)return;
  const k=e.key.toLowerCase();
  if(e.shiftKey&&(e.key===">"||e.key==="<"||e.code==="Period"||e.code==="Comma")){e.preventDefault();growFont(e.key===">"||e.code==="Period"?1:-1);return;}
  if(e.code==="Equal"&&!e.altKey){e.preventDefault();exec(e.shiftKey?"superscript":"subscript");return;}
  if(e.altKey&&/^Digit[0-4]$/.test(e.code)){e.preventDefault();exec("formatBlock",e.code==="Digit0"?"p":"h"+e.code.slice(5));return;}
  if(k==="b"&&!e.shiftKey){e.preventDefault();exec("bold");}
  else if(k==="i"&&!e.shiftKey){e.preventDefault();exec("italic");}
  else if(k==="u"&&!e.shiftKey){e.preventDefault();exec("underline");}
  else if(k==="x"&&e.shiftKey){e.preventDefault();exec("strikeThrough");}
  else if(k==="k"){e.preventDefault();linkDialog();}
  else if(k==="l"&&e.shiftKey){e.preventDefault();exec("insertUnorderedList");}
  else if(e.code==="Digit7"&&e.shiftKey){e.preventDefault();exec("insertOrderedList");}

const NARY_TEX={"∑":"\\sum","∏":"\\prod","∐":"\\coprod","∫":"\\int","∬":"\\iint","∭":"\\iiint","∮":"\\oint","⋃":"\\bigcup","⋂":"\\bigcap","⋁":"\\bigvee","⋀":"\\bigwedge"};
const ACC_TEX={"̂":"\\hat","̃":"\\tilde","̄":"\\bar","⃗":"\\vec","̇":"\\dot","̈":"\\ddot","́":"\\acute","̀":"\\grave","̆":"\\breve","̌":"\\check","^":"\\hat","~":"\\tilde","¯":"\\bar"};
const TEX_ESC=s=>s.replace(/[\\{}#%&$_^~]/g,c=>({"\\":"\\backslash ","{":"\\{","}":"\\}","#":"\\#","%":"\\%","&":"\\&","$":"\\$","_":"\\_","^":"\\hat{}","~":"\\sim "}[c]));
function o2t(el){if(!el)return"";const n=el.localName;const C=nm=>o2t(kid(el,nm));const pr=(p,nm)=>{const e=kid(kid(el,p),nm);return e?(e.getAttributeNS(NS_M,"val")??e.getAttribute("m:val")):null;};const on=v=>v!=null&&!/^(0|false|off)$/.test(v);
  switch(n){
    case "oMathPara":return kids(el,"oMath").map(o2t).join(" \\\\ ");
    case "r":{const t=[...el.children].filter(c=>c.localName==="t").map(c=>c.textContent).join("");const rp=kid(el,"rPr");const nor=!!kid(rp,"nor");const sty=pr("rPr","sty");const s=TEX_ESC(t);if(!s)return"";if(nor)return`\\text{${s}}`;if(sty==="p"&&/[A-Za-z]{2,}/.test(t))return`\\mathrm{${s}}`;return s;}
    case "f":{const ty=pr("fPr","type");return ty==="noBar"?`\\binom{${C("num")}}{${C("den")}}`:ty==="lin"?`{${C("num")}}/{${C("den")}}`:`\\frac{${C("num")}}{${C("den")}}`;}
    case "sSup":return`{${C("e")}}^{${C("sup")}}`;
    case "sSub":return`{${C("e")}}_{${C("sub")}}`;
    case "sSubSup":return`{${C("e")}}_{${C("sub")}}^{${C("sup")}}`;
    case "sPre":return`{}_{${C("sub")}}^{${C("sup")}}{${C("e")}}`;
    case "rad":{const d=C("deg");return on(pr("radPr","degHide"))||!d.trim()?`\\sqrt{${C("e")}}`:`\\sqrt[${d}]{${C("e")}}`;}
    case "nary":{const ch=pr("naryPr","chr")||"∫";const op=NARY_TEX[ch]||TEX_ESC(ch);const s=on(pr("naryPr","subHide"))?"":C("sub"),u=on(pr("naryPr","supHide"))?"":C("sup");return`${op}${s.trim()?`_{${s}}`:""}${u.trim()?`^{${u}}`:""} ${C("e")}`;}
    case "d":{const b=pr("dPr","begChr"),e=pr("dPr","endChr"),sp=pr("dPr","sepChr")??"|";const L=x=>x===""?".":({"{":"\\{","}":"\\}","⟨":"\\langle","⟩":"\\rangle","‖":"\\|","⌊":"\\lfloor","⌋":"\\rfloor","⌈":"\\lceil","⌉":"\\rceil"}[x]||x);return`\\left${L(b??"(")} ${kids(el,"e").map(o2t).join(sp==="|"?" \\middle| ":` ${TEX_ESC(sp)} `)} \\right${L(e??")")}`;}
    case "acc":{const c=pr("accPr","chr")??"̂";return`${ACC_TEX[c]||"\\hat"}{${C("e")}}`;}
    case "bar":return pr("barPr","pos")==="top"?`\\overline{${C("e")}}`:`\\underline{${C("e")}}`;
    case "limLow":{const e=C("e").trim();const m=e.match(/^(?:\\mathrm\{)?(lim|max|min|sup|inf)\}?$/);return m?`\\${m[1]}_{${C("lim")}}`:`\\underset{${C("lim")}}{${e}}`;}
    case "limUpp":return`\\overset{${C("lim")}}{${C("e")}}`;
    case "func":{const f=C("fName").trim();const nm=f.replace(/^\\mathrm\{([^}]*)\}$/,"$1");return`${/^(sin|cos|tan|cot|sec|csc|log|ln|exp|lim|max|min|det|arcsin|arccos|arctan|sinh|cosh|tanh|deg|gcd)$/.test(nm)?"\\"+nm:f} {${C("e")}}`;}
    case "groupChr":{const c=pr("groupChrPr","chr")||"⏟";return c==="⏞"||pr("groupChrPr","pos")==="top"?`\\overbrace{${C("e")}}`:`\\underbrace{${C("e")}}`;}
    case "m":return`\\begin{matrix} ${kids(el,"mr").map(r=>kids(r,"e").map(o2t).join(" & ")).join(" \\\\ ")} \\end{matrix}`;
    case "eqArr":return`\\begin{aligned} ${kids(el,"e").map(o2t).join(" \\\\ ")} \\end{aligned}`;
    case "borderBox":return`\\boxed{${C("e")}}`;
    default:if(/Pr$/.test(n))return"";return[...el.children].map(o2t).join("");
  }}

/* shapes (inserted as pictures, so they print and export everywhere) */
const SHAPES={rect:"Rectangle",round:"Rounded rectangle",ellipse:"Oval",triangle:"Triangle",diamond:"Diamond",arrow:"Arrow",star:"Star",callout:"Callout",line:"Line",larrow:"Line arrow",hexagon:"Hexagon",heart:"Heart"};
function shapeSvg(k,fill,stroke,text,w,h){const s=2.5,m=s;const W=w-m*2,H=h-m*2;let b="";const pts=a=>a.map(([x,y])=>`${(m+x*W).toFixed(1)},${(m+y*H).toFixed(1)}`).join(" ");
  if(k==="rect")b=`<rect x="${m}" y="${m}" width="${W}" height="${H}"/>`;
  else if(k==="round")b=`<rect x="${m}" y="${m}" width="${W}" height="${H}" rx="${Math.min(W,H)*.18}"/>`;
  else if(k==="ellipse")b=`<ellipse cx="${w/2}" cy="${h/2}" rx="${W/2}" ry="${H/2}"/>`;
  else if(k==="triangle")b=`<polygon points="${pts([[.5,0],[1,1],[0,1]])}"/>`;
  else if(k==="diamond")b=`<polygon points="${pts([[.5,0],[1,.5],[.5,1],[0,.5]])}"/>`;
  else if(k==="hexagon")b=`<polygon points="${pts([[.25,0],[.75,0],[1,.5],[.75,1],[.25,1],[0,.5]])}"/>`;
  else if(k==="arrow")b=`<polygon points="${pts([[0,.3],[.62,.3],[.62,0],[1,.5],[.62,1],[.62,.7],[0,.7]])}"/>`;
  else if(k==="star"){const a=[];for(let i=0;i<10;i++){const r=i%2?.4:1,t=-Math.PI/2+i*Math.PI/5;a.push([.5+.5*r*Math.cos(t),.52+.5*r*Math.sin(t)]);}b=`<polygon points="${pts(a)}"/>`;}
  else if(k==="callout")b=`<path d="M${m} ${m}H${m+W}V${m+H*.72}H${m+W*.42}L${m+W*.2} ${m+H}L${m+W*.25} ${m+H*.72}H${m}Z"/>`;
  else if(k==="heart")b=`<path d="M${w/2} ${m+H}C${m-W*.1} ${m+H*.55} ${m+W*.05} ${m-H*.05} ${w/2} ${m+H*.28}C${m+W*.95} ${m-H*.05} ${m+W*1.1} ${m+H*.55} ${w/2} ${m+H}Z"/>`;
  else if(k==="line")b=`<line x1="${m}" y1="${h/2}" x2="${w-m}" y2="${h/2}" fill="none"/>`;
  else if(k==="larrow")b=`<line x1="${m}" y1="${h/2}" x2="${w-m-10}" y2="${h/2}" fill="none"/><polygon points="${w-m},${h/2} ${w-m-14},${h/2-7} ${w-m-14},${h/2+7}" fill="${stroke}"/>`;
  const tc=relLum((fill||"#ffffff").replace("#","").padEnd(6,"f"))>.45?"#1b1c1f":"#ffffff";
  const ty=k==="callout"?m+H*.36:k==="triangle"?m+H*.66:h/2;
  return`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><g fill="${/line|larrow/.test(k)?"none":fill}" stroke="${stroke}" stroke-width="${s}" stroke-linejoin="round">${b}</g>${text&&!/line|larrow/.test(k)?`<text x="${w/2}" y="${ty}" dominant-baseline="middle" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="${Math.max(11,Math.min(22,H/4))}" fill="${tc}">${xe(text)}</text>`:""}</svg>`;}
const svgUrl=svg=>"data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svg)));
function shapeDialog(img){const saved=lastRange?lastRange.cloneRange():null;let st={k:"rect",fill:"#dbe6ff",stroke:"#2f5bd3",text:"",w:200,h:110};try{if(img?.dataset.shape)st={...st,...JSON.parse(img.dataset.shape)};}catch{}
  openDlg(`<h2>${img?"Edit shape":"Insert shape"}</h2><div class="shapegrid" id="shG">${Object.entries(SHAPES).map(([k,n])=>`<button data-k="${k}" title="${n}" class="${k===st.k?"on":""}"><img alt="${n}" src="${svgUrl(shapeSvg(k,"#e8eefc","#2f5bd3","",56,34))}" style="width:56px;height:34px"></button>`).join("")}</div>
  <div class="row"><label>Fill</label><input type="color" id="shF" value="${st.fill}"><label>${zh("Outline","轮廓")}</label><input type="color" id="shS" value="${st.stroke}"><label>Size</label><input type="text" id="shW" value="${st.w}" style="width:56px">×<input type="text" id="shH" value="${st.h}" style="width:56px"><label>px</label></div>
  <div class="row"><input type="text" id="shT" placeholder="Text inside the shape (optional)" value="${esc(st.text)}"></div>
  <div class="eqprev" id="shP" style="background:#fff"></div>
  <div class="foot"><button class="btn" data-close>Cancel</button><button class="btn pri" id="shOk">${img?"Save":"Insert"}</button></div>`);
  const read=()=>{st.fill=$("shF").value;st.stroke=$("shS").value;st.text=$("shT").value.trim();st.w=Math.min(800,Math.max(20,parseInt($("shW").value)||200));st.h=Math.min(800,Math.max(10,parseInt($("shH").value)||110));};
  const upd=()=>{read();$("shP").innerHTML=`<img alt="" src="${svgUrl(shapeSvg(st.k,st.fill,st.stroke,st.text,st.w,st.h))}" style="max-width:100%;max-height:160px">`;};
  $("shG").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.k=b.dataset.k;$("shG").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));if(/line|larrow/.test(st.k)&&+$("shH").value>40)$("shH").value=24;upd();};
  for(const id of["shF","shS","shT","shW","shH"])$(id).oninput=upd;upd();
  $("shOk").onclick=()=>{read();const src=svgUrl(shapeSvg(st.k,st.fill,st.stroke,st.text,st.w,st.h));const meta=JSON.stringify(st);closeDlg();
    if(img){cp();img.src=src;img.dataset.shape=meta;img.alt=st.text||trUI(SHAPES[st.k]);img.style.width=st.w+"px";afterChange();return;}
    page.focus();if(saved){const s=getSelection();s.removeAllRanges();s.addRange(saved);}cp();const id="sh"+uid();
    document.execCommand("insertHTML",false,`<img src="${src}" alt="${esc(st.text||trUI(SHAPES[st.k]))}" data-shid="${id}" style="width:${st.w}px">`);
    const n=page.querySelector(`[data-shid="${id}"]`);if(n){n.removeAttribute("data-shid");n.dataset.shape=meta;}afterChange();};
}

/* fonts, sizes, spacing, lists, case, painter */
const FONTS=["Aptos","Calibri","Arial","Helvetica Neue","Times New Roman","Georgia","Cambria","Garamond","Palatino","Book Antiqua","Verdana","Tahoma","Trebuchet MS","Segoe UI","Gill Sans","Futura","Avenir","Courier New","Consolas","Menlo","Comic Sans MS","Impact","PingFang SC","Microsoft YaHei","SimSun","Songti SC","Hiragino Sans","Yu Gothic","Malgun Gothic"];
const SIZES=[8,9,10,10.5,11,12,14,16,18,20,22,24,26,28,36,48,72];
$("fontSel").innerHTML=FONTS.map(f=>`<option value="${esc(f)}" style="font-family:'${esc(f)}'">${esc(f)}</option>`).join("");
$("sizeSel").innerHTML=SIZES.map(s=>`<option value="${s}">${s}</option>`).join("");$("sizeSel").value="11";
function anchorEl(){const n=getSelection().anchorNode||lastRange?.startContainer;const e=n?(n.nodeType===1?n:n.parentElement):null;return e&&page.contains(e)?e:null;}
function updateFontUi(){const e=anchorEl();if(!e)return;const cs=getComputedStyle(e);const fam=cs.fontFamily.split(",")[0].replace(/["']/g,"").trim();const fs=$("fontSel");if(document.activeElement!==fs){if(![...fs.options].some(o=>o.value===fam)){const o=document.createElement("option");o.value=o.textContent=fam;fs.prepend(o);}fs.value=fam;}
  const pt=Math.round(parseFloat(cs.fontSize)*.75*2)/2;const ss=$("sizeSel");if(document.activeElement!==ss){if(![...ss.options].some(o=>+o.value===pt)){const o=document.createElement("option");o.value=o.textContent=String(pt);ss.append(o);}ss.value=String(pt);}}
function applyFont(name){ensureFocus();cp();document.execCommand("styleWithCSS",false,true);document.execCommand("fontName",false,name);document.execCommand("styleWithCSS",false,false);fixStructure();afterChange();}
function sizeRaw(pt){document.execCommand("styleWithCSS",false,true);document.execCommand("fontSize",false,"7");document.execCommand("styleWithCSS",false,false);page.querySelectorAll('span[style*="xxx-large"],font[size="7"]').forEach(e=>{let el=e;if(e.tagName==="FONT"){el=document.createElement("span");el.append(...e.childNodes);e.replaceWith(el);}el.style.fontSize=pt+"pt";});}
function applySize(pt){ensureFocus();const s=getSelection();if(!s.rangeCount||s.isCollapsed){toast("Select the text to resize first.");return;}cp();const sel=getSel();sizeRaw(pt);fixStructure();setSel(sel);afterChange();updateFontUi();}
function growFont(d){const e=anchorEl();if(!e)return;const pt=parseFloat(getComputedStyle(e).fontSize)*.75;let i=SIZES.findIndex(s=>s>pt+0.01);if(d<0){i=SIZES.length-1;while(i>0&&SIZES[i]>=pt-0.01)i--;}else if(i<0)i=SIZES.length-1;applySize(SIZES[Math.max(0,i)]);}
$("fontSel").onchange=e=>{applyFont(e.target.value);page.focus();};
$("sizeSel").onchange=e=>{applySize(+e.target.value);page.focus();};
function selLeaves(){const s=getSelection();const r=s.rangeCount&&page.contains(s.anchorNode)?s.getRangeAt(0):lastRange;if(!r)return[];const ls=leaves().filter(l=>r.intersectsNode(l));if(!ls.length){const l=leafOf(r.startContainer);if(l)ls.push(l);}return ls;}
function setSpacing(kind,v){const ls=selLeaves();if(!ls.length){toast("Put the cursor in a paragraph first.");return;}cp();for(const l of ls){if(kind==="line")l.style.lineHeight=String(+(v*1.15).toFixed(3));else if(kind==="before")l.style.marginTop=v?"12pt":"";else l.style.marginBottom=v?"":"0pt";}afterChange();}
function applyStyle(v){if(v==="title"||v==="subtitle"){exec("formatBlock",v==="title"?"h1":"p");const l=leafOf(getSelection().anchorNode);if(l){l.dataset.style=v==="title"?"Title":"Subtitle";afterChange();}return;}
  exec("formatBlock",v);const l=leafOf(getSelection().anchorNode);if(l&&(l.dataset.style==="Title"||l.dataset.style==="Subtitle")){delete l.dataset.style;afterChange();}}
function setListStyle(kind,type){ensureFocus();const tag=kind==="ul"?"UL":"OL";let l=leafOf(getSelection().anchorNode);let list=l?.closest("ul,ol");
  if(!list||list.tagName!==tag||!page.contains(list)){exec(kind==="ul"?"insertUnorderedList":"insertOrderedList");l=leafOf(getSelection().anchorNode);list=l?.closest("ul,ol");}
  if(!list||!page.contains(list))return;cp();list.classList.remove("checklist");
  let top=list;while(top.parentElement?.closest("ol,ul")&&page.contains(top.parentElement.closest("ol,ul")))top=top.parentElement.closest("ol,ul");
  if(type==="ml"){top.style.listStyleType="";top.dataset.ml="1";top.querySelectorAll("ol").forEach(o=>o.style.listStyleType="");}
  else{delete top.dataset.ml;list.style.listStyleType=type==="decimal"||type==="disc"?"":type;}
  afterChange();}
function setNumberingValue(){const l=leafOf(getSelection().anchorNode)?.closest("ol");if(!l){toast("Put the cursor in a numbered list.");return;}
  openDlg(`<h2>Set numbering value</h2><div class="row"><label>Start at</label><input type="text" id="nvIn" value="${l.getAttribute("start")||1}" style="width:80px"></div><div class="foot"><button class="btn" data-close>Cancel</button><button class="btn pri" id="nvOk">OK</button></div>`);$("nvIn").focus();$("nvIn").select();
  $("nvOk").onclick=()=>{const v=Math.max(0,parseInt($("nvIn").value)||1);cp();if(v===1)l.removeAttribute("start");else l.setAttribute("start",v);closeDlg();afterChange();};$("nvIn").onkeydown=e=>{if(e.key==="Enter")$("nvOk").click();};}
function changeCase(mode){ensureFocus();const s=getSelection();if(!s.rangeCount||s.isCollapsed){toast("Select the text to change first.");return;}const r=s.getRangeAt(0);const sel=getSel();
  const root=r.commonAncestorContainer.nodeType===3?r.commonAncestorContainer.parentNode:r.commonAncestorContainer;const segs=[];const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let t;
  while((t=w.nextNode())){if(!r.intersectsNode(t)||isTcDeleted(t))continue;const a=t===r.startContainer?r.startOffset:0,b=t===r.endContainer?r.endOffset:t.length;if(b>a)segs.push([t,a,b]);}
  const str=segs.map(([t,a,b])=>t.data.slice(a,b)).join("");const ch=str.split("");const up=c=>{const u=c.toUpperCase();return u.length===1?u:c;},lo=c=>{const u=c.toLowerCase();return u.length===1?u:c;};
  let out;if(mode==="upper")out=ch.map(up);else if(mode==="lower")out=ch.map(lo);else if(mode==="toggle")out=ch.map(c=>c===up(c)?lo(c):up(c));
  else{out=ch.map(lo);let start=true;for(let i=0;i<out.length;i++){const c=out[i];const letter=/\p{L}/u.test(c);if(mode==="title"){if(letter&&(i===0||!/[\p{L}'’]/u.test(out[i-1])))out[i]=up(c);}else{if(letter&&start){out[i]=up(c);start=false;}else if(/[.!?\n]/.test(c))start=true;}}}
  const res=out.join("");if(res===str)return;cp();let pos=0;for(const[t,a,b]of segs){t.replaceData(a,b-a,res.slice(pos,pos+b-a));pos+=b-a;}setSel(sel);afterChange();}
let painter=null;
function captureFmt(){const e=anchorEl();if(!e)return null;const base=getComputedStyle(leafOf(e)||page);const cs=getComputedStyle(e);const has=sel=>!!e.closest(sel)&&page.contains(e.closest(sel));
  const bgEl=e.closest('[style*="background"],mark');
  return{b:parseInt(cs.fontWeight)>=600&&parseInt(base.fontWeight)<600,i:cs.fontStyle==="italic"&&base.fontStyle!=="italic",u:has("u"),s:has("s,strike"),sub:has("sub"),sup:has("sup"),color:cs.color!==base.color?cs.color:null,bg:bgEl&&page.contains(bgEl)?getComputedStyle(bgEl).backgroundColor:null,font:cs.fontFamily!==base.fontFamily?cs.fontFamily.split(",")[0].replace(/["']/g,"").trim():null,size:cs.fontSize!==base.fontSize?Math.round(parseFloat(cs.fontSize)*.75*2)/2:null};}
function setPainter(f){painter=f;$("painterBtn").classList.toggle("on",!!f);if(f)toast("Select text to apply the copied formatting. Press Esc to cancel.");}
$("painterBtn").onclick=()=>{if(painter){setPainter(null);return;}const f=captureFmt();if(!f){toast("Click in formatted text first, then press the brush.");return;}setPainter(f);};
page.addEventListener("mouseup",()=>{if(!painter)return;setTimeout(()=>{const s=getSelection();if(!s.rangeCount||s.isCollapsed||!page.contains(s.anchorNode))return;const f=painter;setPainter(null);cp();const sel=getSel();
  document.execCommand("removeFormat");const st=c=>{try{return document.queryCommandState(c);}catch{return false;}};
  for(const[c,k]of[["bold","b"],["italic","i"],["underline","u"],["strikeThrough","s"],["subscript","sub"],["superscript","sup"]])if(!!f[k]!==st(c))document.execCommand(c);
  document.execCommand("styleWithCSS",false,true);if(f.color)document.execCommand("foreColor",false,f.color);if(f.bg)document.execCommand("hiliteColor",false,f.bg);if(f.font)document.execCommand("fontName",false,f.font);document.execCommand("styleWithCSS",false,false);
  if(f.size)sizeRaw(f.size);fixStructure();setSel(sel);afterChange();},0);});

let desktop=null,capsKnown=false;
/*DOCK_ART*/
const DOCK_SVG="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\"><defs><linearGradient id=\"document-editor-bg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#3D7BFF\"/><stop offset=\"1\" stop-color=\"#1638B5\"/><\/linearGradient><radialGradient id=\"document-editor-sh\" cx=\".28\" cy=\".05\" r=\".9\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\"0.22\"/><stop offset=\".6\" stop-color=\"#fff\" stop-opacity=\"0\"/><\/radialGradient><filter id=\"document-editor-ds\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"150%\"><feDropShadow dx=\"0\" dy=\"22\" stdDeviation=\"26\" flood-color=\"#000\" flood-opacity=\".28\"/><\/filter><filter id=\"document-editor-ds2\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"150%\"><feDropShadow dx=\"0\" dy=\"10\" stdDeviation=\"12\" flood-color=\"#000\" flood-opacity=\".22\"/><\/filter><linearGradient id=\"document-editor-gold\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FFE08A\"/><stop offset=\"1\" stop-color=\"#E0A21C\"/><\/linearGradient><\/defs><rect width=\"1024\" height=\"1024\" rx=\"230\" fill=\"url(#document-editor-bg)\"/><rect width=\"1024\" height=\"1024\" rx=\"230\" fill=\"url(#document-editor-sh)\"/><g filter=\"url(#document-editor-ds)\" transform=\"rotate(-7 512 520)\"><path d=\"M282 190h360l118 118v526a30 30 0 0 1-30 30H282a30 30 0 0 1-30-30V220a30 30 0 0 1 30-30z\" fill=\"#fff\"/><path d=\"M642 190v88a30 30 0 0 0 30 30h88z\" fill=\"#D7E2FF\"/><rect x=\"320\" y=\"290\" width=\"250\" height=\"40\" rx=\"20\" fill=\"#2F64F5\"/><rect x=\"320\" y=\"380\" width=\"380\" height=\"24\" rx=\"12\" fill=\"#C9D3E8\"/><rect x=\"320\" y=\"436\" width=\"380\" height=\"24\" rx=\"12\" fill=\"#C9D3E8\"/><rect x=\"320\" y=\"492\" width=\"300\" height=\"24\" rx=\"12\" fill=\"#C9D3E8\"/><rect x=\"320\" y=\"572\" width=\"380\" height=\"24\" rx=\"12\" fill=\"#C9D3E8\"/><rect x=\"320\" y=\"628\" width=\"220\" height=\"24\" rx=\"12\" fill=\"#C9D3E8\"/><\/g><g filter=\"url(#document-editor-ds2)\" transform=\"translate(690 690) rotate(45)\"><path d=\"M-62-230h124v150c0 40-14 80-40 118L0 70l-22-32c-26-38-40-78-40-118z\" fill=\"url(#document-editor-gold)\"/><path d=\"M0-70v128\" stroke=\"#7A4A06\" stroke-width=\"10\" stroke-linecap=\"round\"/><circle cx=\"0\" cy=\"-78\" r=\"18\" fill=\"#7A4A06\"/><rect x=\"-70\" y=\"-300\" width=\"140\" height=\"84\" rx=\"16\" fill=\"#20242E\"/><\/g><rect x=\"3\" y=\"3\" width=\"1018\" height=\"1018\" rx=\"228\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".14\" stroke-width=\"6\"/><\/svg>";
function dockIconArt(){return new Promise(res=>{const img=new Image();img.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");x.shadowColor="rgba(0,0,0,.3)";x.shadowBlur=20;x.shadowOffsetY=8;x.drawImage(img,50,44,412,412);res(c.toDataURL("image/png"))}catch{res(dockIcon())}};img.onerror=()=>res(dockIcon());img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(DOCK_SVG)})}
/*END_DOCK_ART*/
function dockIcon(){const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");const g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,"#3d6cf0");g.addColorStop(1,"#1f3f9e");x.fillStyle=g;x.beginPath();x.roundRect(8,8,240,240,54);x.fill();
  x.fillStyle="#fff";x.beginPath();x.roundRect(62,40,132,176,12);x.fill();x.fillStyle="#c9d5f7";for(let i=0;i<6;i++){x.fillRect(82,72+i*20,i===5?52:92,8);}
  x.fillStyle="#2a51c9";x.font="bold 64px -apple-system,Helvetica,Arial";x.textAlign="center";x.textBaseline="middle";x.fillText("✦",186,186);return c.toDataURL("image/png");}
(async()=>{
  const use=window.claude?.use?n=>window.claude.use(n).catch(()=>null):async()=>null;

<script>
/*INSTALL_PROMPT*/
/* When this artifact is open in Claude Desktop but not installed as an app yet, invite the person
   to install it. Shows once per session; the install itself is Claude's own dialog, started from
   the person's click (install.request() needs a click). Silent in browsers, on mobile and inside the
   installed app. */
(async()=>{
  if(!window.claude||!claude.use)return;
  try{if(sessionStorage.getItem("appstore.installAsked"))return}catch{}
  const d=await claude.use("desktop").catch(()=>null);
  if(!d||d.fs||!d.install)return;                       // d.fs exists only inside the installed app
  const st=await d.install.state().catch(()=>"unavailable");
  if(st!=="available")return;
  await new Promise(r=>setTimeout(r,900));
  if(document.querySelector(".aspi"))return;
  const zh=window.__ZH??/^zh/i.test(navigator.language||"");
  const T=(en,c)=>zh?c:en;
  const name=(document.title||"").trim()||T("this app","这个 app");
  const icon=typeof DOCK_SVG==="string"?DOCK_SVG:(typeof ICON_SVG==="object"&&ICON_SVG.store)||"";
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const st2=document.createElement("style");
  st2.textContent=`.aspi{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:rgba(20,20,19,.42);padding:16px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.aspi .b{--bg:#FAF9F5;--fg:#141413;--mu:#6B6A64;--pill:#EDE6DA;--ac:#B9532F;--on:#fff;background:var(--bg);color:var(--fg);border-radius:18px;max-width:380px;width:100%;padding:24px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
@media (prefers-color-scheme:dark){.aspi .b{--bg:#262624;--fg:#FAF9F5;--mu:#A6A39A;--pill:#3A3632;--ac:#E08A6A;--on:#1F1E1D}}
.aspi .ic{width:72px;height:72px}.aspi .ic svg{width:72px;height:72px;display:block}
.aspi h3{margin:2px 0 0;font-size:18px;font-weight:700;line-height:1.25}
.aspi p{margin:0;color:var(--mu)}
.aspi .row{display:flex;flex-direction:column;gap:8px;align-self:stretch;margin-top:6px}
.aspi button{font-family:inherit;font-weight:600;font-size:15px;line-height:1;border:0;border-radius:999px;padding:12px 16px;cursor:pointer}
.aspi .y{background:var(--ac);color:var(--on)}.aspi .n{background:var(--pill);color:var(--fg)}`;
  const m=document.createElement("div");m.className="aspi";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("data-no-i18n","");
  m.innerHTML=`<div class="b"><div class="ic">${icon}</div>
    <h3>${esc(T(`Install ${name} as an app?`,`把「${name}」安装为 app？`))}</h3>
    <p>${esc(T("It gets its own window and Dock icon, opens like any other app, and keeps working on your Claude plan.","装好后有自己的窗口和 Dock 图标，像普通 app 一样打开，继续用你的 Claude 套餐。"))}</p>
    <div class="row"><button class="y">${esc(T("Install","安装"))}</button><button class="n">${esc(T("Not now","以后再说"))}</button></div></div>`;
  const close=()=>{m.remove();st2.remove();try{sessionStorage.setItem("appstore.installAsked","1")}catch{}};
  m.addEventListener("click",async e=>{
    if(e.target===m||e.target.closest(".n"))return close();
    if(e.target.closest(".y")){const r=await d.install.request().catch(()=>"failed");close();
      if(r==="failed"||r==="unavailable"){const n=document.createElement("div");n.textContent=T("Couldn't install. Use Install as app in the artifact's menu.","没装上。可以在工件菜单里选“安装为 app”。");n.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141413;color:#fff;padding:10px 14px;border-radius:10px;z-index:2147483000;font:13px system-ui";document.body.appendChild(n);setTimeout(()=>n.remove(),5000)}}
  });
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"&&m.isConnected){close();document.removeEventListener("keydown",k)}});
  document.head?document.head.appendChild(st2):document.body.appendChild(st2);document.body.appendChild(m);
  m.querySelector(".y").focus();
})();
/*END_INSTALL_PROMPT*/
</script>
