<title>Party Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a game-show stage on one screen. A big prompt card in the middle, players along the bottom, one action at a time. Single dark look: it's a party on a shared screen. */
:root{
  --bg:#16102a; --stage:#211845; --card:#fff8e7; --ink:#1b1430; --fg:#f6f1ff; --muted:#b4a8d6; --line:#3a2e66;
  --hot:#ff5d8f; --gold:#ffc94a; --mint:#5fe3b8;
  --display:"Bungee","Arial Black",Impact,system-ui,sans-serif;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#3a2580 0%,var(--bg) 60%) fixed,var(--bg);color:var(--fg);font:15px/1.5 var(--font)}
.drag{height:30px;app-region:drag;-webkit-app-region:drag}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:6px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font:400 clamp(30px,7vw,46px)/1 var(--display);letter-spacing:.01em;margin:0;text-align:center;color:var(--gold);text-shadow:0 3px 0 #b3471f}
.sub{text-align:center;color:var(--muted);margin:-8px 0 0}
.panel{background:var(--stage);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);color:var(--ink);border-radius:16px;padding:22px;font:600 clamp(19px,3.6vw,26px)/1.3 var(--font);text-wrap:balance;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.card small{display:block;font:700 11px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:#8a6d2c;margin-bottom:10px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input[type=text],textarea{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#120d24;color:var(--fg)}
textarea{min-height:90px;resize:vertical;font-size:17px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:700 15px/1 var(--font);border:0;border-radius:999px;padding:14px 22px;cursor:pointer;background:var(--line);color:var(--fg)}
.btn.go{background:var(--hot);color:#fff;box-shadow:0 4px 0 #a8264f}
.btn.go:active{transform:translateY(2px);box-shadow:0 2px 0 #a8264f}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#120d24;border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 12px;font-size:14px}
.chip button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
.chip.on{border-color:var(--gold);color:var(--gold)}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ans{background:#120d24;border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left;color:var(--fg);font:600 16px/1.35 var(--font);cursor:pointer;display:flex;flex-direction:column;gap:8px}
.ans:hover{border-color:var(--muted)}
.ans.mine{opacity:.45;cursor:not-allowed}
.ans .meta{font:500 12.5px/1.35 var(--font);color:var(--muted)}
.ans .who{font:700 12px/1 var(--font);color:var(--gold);letter-spacing:.04em;text-transform:uppercase}
.ans.pick{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,74,.25)}
.ans .votes{color:var(--mint);font-weight:700}
.board{display:flex;flex-direction:column;gap:6px}
.board div{display:flex;justify-content:space-between;background:#120d24;border-radius:10px;padding:10px 14px;font-weight:600}
.board div b{font-variant-numeric:tabular-nums;color:var(--gold)}
.host{display:flex;gap:12px;align-items:flex-start;background:#120d24;border-radius:14px;padding:14px}
.host i{flex:none;width:34px;height:34px;border-radius:50%;background:conic-gradient(from 30deg,#d97757,#ffc94a,#d97757);display:block}
.host p{margin:0}
.st{color:var(--muted);font-size:13px;text-align:center;margin:0}
.big{font:400 clamp(22px,4.5vw,32px)/1.1 var(--display);text-align:center;margin:0;color:var(--fg)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">

<div class="drag"></div>
<div class="wrap">
  <h1 class="logo">PARTY GAME</h1>
  <p class="sub">A party game on one screen. Claude writes the prompts and judges the jokes.</p>
  <div id="stage"></div>
  <p class="st" id="st"></p>
</div>

<script>
const $=id=>document.getElementById(id);
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const store={get(k,d){try{const v=localStorage.getItem("punchline."+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem("punchline."+k,JSON.stringify(v))}catch{}}};
const THEMES=["Anything goes","Office life","Dating","Family dinner","Tech and AI","Travel","School","Food"];
const LANG=(()=>{const n=(navigator.language||"en").toLowerCase();return n.startsWith("zh")?"Chinese":({ja:"Japanese",ko:"Korean",es:"Spanish",fr:"French",de:"German",pt:"Portuguese"}[n.slice(0,2)]||"English")})();
let sample=null;
let G={phase:"lobby",players:store.get("players",[]),theme:store.get("theme","Anything goes"),lang:store.get("lang",LANG),rounds:3,round:0,prompts:[],answers:[],turn:0,voter:0,votes:[],host:null,scores:{}};
const ERR={rate_limited:"Claude is busy or you hit your usage limit. Try again in a bit.",not_granted:"Claude isn't allowed for this game.",sampling_disabled:"Claude isn't available on this account.",refused:"Claude passed on that one. Try another theme.",session_expired:"Sign in to Claude again."};
const say=t=>$("st").textContent=t||"";

function view(){
  const s=$("stage");
  if(G.phase==="lobby"){
    s.innerHTML=`<div class="panel">
      <label class="f" for="pn">Players (3 to 8). Type a name and press Enter.</label>
      <div class="row"><input id="pn" type="text" maxlength="16" placeholder="Name" style="flex:1;min-width:0"><button class="btn" id="add">Add</button></div>
      <div class="chips">${G.players.map((p,i)=>`<span class="chip">${esc(p)}<button data-rm="${i}" aria-label="Remove ${esc(p)}">✕</button></span>`).join("")||`<span class="st" style="text-align:left">No players yet.</span>`}</div>
      <label class="f">Theme</label>
      <div class="chips">${THEMES.map(t=>`<button class="chip ${t===G.theme?"on":""}" data-theme="${esc(t)}" style="cursor:pointer;padding:6px 12px">${esc(t)}</button>`).join("")}</div>
      <label class="f" for="lg">Language</label>
      <select id="lg" style="font:inherit;padding:8px;border-radius:10px;background:#120d24;color:var(--fg);border:1px solid var(--line);max-width:220px">${["English","Chinese","Japanese","Korean","Spanish","French","German","Portuguese"].map(l=>`<option ${l===G.lang?"selected":""}>${l}</option>`).join("")}</select>
      <div class="row"><button class="btn go" id="start" ${G.players.length<3||!sample?"disabled":""}>Start · ${G.rounds} rounds</button><span class="st" style="text-align:left">${sample?"Pass the computer around. Everyone answers in secret, then everyone votes.":"Open Party Game in the Claude app to play."}</span></div>
    </div>`;
    const add=()=>{const v=$("pn").value.trim();if(v&&G.players.length<8&&!G.players.includes(v)){G.players.push(v);store.set("players",G.players);}view();$("pn").focus();};
    $("add").onclick=add;$("pn").onkeydown=e=>{if(e.key==="Enter")add();};
    s.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{G.players.splice(+b.dataset.rm,1);store.set("players",G.players);view();});
    s.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{G.theme=b.dataset.theme;store.set("theme",G.theme);view();});
    $("lg").onchange=e=>{G.lang=e.target.value;store.set("lang",G.lang);};
    $("start").onclick=start;
    return;
  }
  const prompt=G.prompts[G.round];
  const head=`<div class="card"><small>Round ${G.round+1} of ${G.rounds} · ${esc(G.theme)}</small>${esc(prompt)}</div>`;
  if(G.phase==="pass"){
    s.innerHTML=`<div class="panel">${head}<p class="big">Pass to ${esc(G.players[G.turn])}</p><div class="row" style="justify-content:center"><button class="btn go" id="ready">I'm ${esc(G.players[G.turn])}, show me</button></div></div>`;
    $("ready").onclick=()=>{G.phase="write";view();};return;
  }
  if(G.phase==="write"){
    s.innerHTML=`<div class="panel">${head}<label class="f" for="a">${esc(G.players[G.turn])}, your funniest answer. Nobody's looking.</label><textarea id="a" maxlength="140" placeholder="Keep it short."></textarea><div class="row"><button class="btn go" id="lock">Lock it in</button><span class="st">Stuck? Leave it blank and Claude will answer for you.</span></div></div>`;
    $("a").focus();
    $("lock").onclick=async()=>{
      let v=$("a").value.trim();
      if(!v){$("lock").disabled=true;say("Claude is bailing you out…");try{v=(await sample(`Party game prompt: "${prompt}". Write one short, funny answer (under 15 words) in ${G.lang}. Output only the answer.`,{modelTier:"quick",cache:false})).text.trim().replace(/^"|"$/g,"");}catch{v="…";}say("");}
      G.answers.push({p:G.turn,text:v.slice(0,140)});
      G.turn++;
      if(G.turn<G.players.length){G.phase="pass";view();}
      else{G.order=shuffle(G.answers.map((_,i)=>i));G.voter=0;G.votes=[];G.phase="vote-pass";view();}
    };return;
  }
  if(G.phase==="vote-pass"){
    s.innerHTML=`<div class="panel">${head}<p class="big">Voting: pass to ${esc(G.players[G.voter])}</p><div class="row" style="justify-content:center"><button class="btn go" id="ready">Show the answers</button></div></div>`;
    $("ready").onclick=()=>{G.phase="vote";view();};return;
  }
  if(G.phase==="vote"){
    s.innerHTML=`<div class="panel">${head}<p class="st">${esc(G.players[G.voter])}, tap the funniest. You can't vote for your own.</p><div class="answers">${G.order.map(i=>`<button class="ans ${G.answers[i].p===G.voter?"mine":""}" data-i="${i}" ${G.answers[i].p===G.voter?"disabled":""}>${esc(G.answers[i].text)}</button>`).join("")}</div></div>`;
    s.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{G.votes.push(+b.dataset.i);G.voter++;if(G.voter<G.players.length){G.phase="vote-pass";view();}else judge();});
    return;
  }
  if(G.phase==="judging"){
    s.innerHTML=`<div class="panel">${head}<div class="host"><i></i><p>Claude is reading the answers…</p></div></div>`;return;
  }
  if(G.phase==="reveal"){
    const counts=G.answers.map((_,i)=>G.votes.filter(v=>v===i).length);
    s.innerHTML=`<div class="panel">${head}
      <div class="host"><i></i><p>${esc(G.host?.line||"")}</p></div>
      <div class="answers">${G.order.map(i=>`<div class="ans ${G.host?.pick===i?"pick":""}"><span class="who">${esc(G.players[G.answers[i].p])}${G.host?.pick===i?" · Claude's pick +200":""}</span>${esc(G.answers[i].text)}<span class="meta">${esc(G.host?.notes?.[i]||"")}</span><span class="votes">${counts[i]?`${counts[i]} vote${counts[i]>1?"s":""} · +${counts[i]*100}`:""}</span></div>`).join("")}</div>
      ${board()}
      <div class="row" style="justify-content:center"><button class="btn go" id="next">${G.round+1<G.rounds?"Next round":"Final results"}</button></div></div>`;
    $("next").onclick=()=>{if(G.round+1<G.rounds){G.round++;G.answers=[];G.turn=0;G.phase="pass";view();}else{G.phase="end";view();}};return;
  }
  if(G.phase==="end"){
    const top=Object.entries(G.scores).sort((a,b)=>b[1]-a[1])[0];
    s.innerHTML=`<div class="panel"><p class="big">${esc(top?top[0]:"")} wins!</p>${board()}<div class="row" style="justify-content:center"><button class="btn go" id="again">Play again</button><button class="btn" id="lobby">Change players</button></div></div>`;
    $("again").onclick=start;$("lobby").onclick=()=>{G.phase="lobby";view();};
  }
}
function board(){const rows=G.players.map(p=>[p,G.scores[p]||0]).sort((a,b)=>b[1]-a[1]);return `<div class="board">${rows.map(([p,n])=>`<div><span>${esc(p)}</span><b>${n}</b></div>`).join("")}</div>`}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
async function start(){
  $("start")&&($("start").disabled=true);say("Claude is writing the prompts…");
  try{
    const r=await sample.json(`Write ${G.rounds} prompts for a fill-in-the-blank party game like Quiplash, theme: ${G.theme}. Each prompt sets up a short funny answer (a blank or a question), is under 18 words, works for friends of any background, and stays playful rather than mean or explicit. Write them in ${G.lang}. Reply with only a JSON array of ${G.rounds} strings.`,{modelTier:"default",cache:false});
    const list=(Array.isArray(r)?r:[]).map(String).filter(Boolean).slice(0,G.rounds);
    if(list.length<G.rounds) throw {code:"empty_completion"};
    Object.assign(G,{prompts:list,round:0,answers:[],turn:0,votes:[],scores:Object.fromEntries(G.players.map(p=>[p,0])),phase:"pass"});
    say("");view();
  }catch(e){say(ERR[e?.code]||"Couldn't start. Try again.");if($("start"))$("start").disabled=false;}
}
async function judge(){
  G.phase="judging";view();
  G.answers.forEach((a,i)=>{const n=G.votes.filter(v=>v===i).length;G.scores[G.players[a.p]]+=n*100;});
  try{
    const r=await sample.json(`You host a party game. Prompt: "${G.prompts[G.round]}". The players' answers, numbered:\n${G.answers.map((a,i)=>`${i}. ${a.text}`).join("\n")}\nPick the one you find funniest. For each answer write a short playful host comment (under 12 words, teasing but kind). Then one opening line for the reveal (under 20 words). Write in ${G.lang}. Don't use player names. Reply with only JSON: {"pick": number, "notes": [string per answer, same order], "line": string}.`,{modelTier:"default",cache:false});
    const pick=Number.isInteger(r?.pick)&&r.pick>=0&&r.pick<G.answers.length?r.pick:null;
    G.host={pick,notes:Array.isArray(r?.notes)?r.notes.map(String):[],line:String(r?.line||"")};
    if(pick!==null) G.scores[G.players[G.answers[pick].p]]+=200;
  }catch(e){G.host={pick:null,notes:[],line:ERR[e?.code]||"Claude lost its cue cards. Votes only this round."};}
  G.phase="reveal";view();
}

function dockIcon(){
  const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,"#4b2fa8");g.addColorStop(1,"#1d1240");
  x.fillStyle=g;x.beginPath();x.roundRect(8,8,240,240,54);x.fill();
  x.fillStyle="#ffc94a";x.beginPath();x.roundRect(46,58,164,104,24);x.fill();
  x.beginPath();x.moveTo(88,160);x.lineTo(76,200);x.lineTo(124,160);x.fill();
  x.fillStyle="#1b1430";x.font="900 64px 'Arial Black',Impact,sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText("HA",128,112);
  return c.toDataURL("image/png");
}
view();
(async()=>{
  const use=window.claude?.use?n=>window.claude.use(n).catch(()=>null):async()=>null;
  let desktop;[sample,desktop]=await Promise.all([use("sample"),use("desktop")]);
  view();
  if(desktop?.tray){desktop.app.dock.setIcon(dockIcon()).catch(()=>{});desktop.window.setOptions({titleBarStyle:"hiddenInset",dragHeight:30,width:820,height:780,minWidth:420,minHeight:560}).catch(()=>{});}
  else if(desktop&&await desktop.install.state().catch(()=>"")==="available"){const b=document.createElement("button");b.className="btn";b.textContent="Install as app";b.style.alignSelf="center";b.onclick=()=>desktop.install.request().catch(()=>{});document.querySelector(".wrap").append(b);}
})();
</script>
