function collectEditor(){
  if(!E)return;
  viewEl.querySelectorAll(".rich[data-k]").forEach(el=>{let h=el.innerHTML.replace(/<br>$/,"");if(!text(h)&&!hasImg(h))h="";E.f[el.dataset.k]=clean(h)});
  const t=$("#eTags");if(t)E.tags=t.value;
}
let lastRange=null;
document.addEventListener("selectionchange",()=>{const s=getSelection();if(s.rangeCount){const r=s.getRangeAt(0);const el=r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement;if(el&&el.closest&&el.closest(".rich"))lastRange={r:r.cloneRange(),el:el.closest(".rich")}}});
function wireEditor(){
  $("#eType").onclick=e=>{const b=e.target.closest("button");if(!b)return;setEditorType(b.dataset.v)};
  $("#eDeck").onchange=e=>{if(e.target.value==="__new"){collectEditor();askNewDeck(id=>{E.deckId=id;renderEditor()});e.target.value=E.deckId||""}else E.deckId=e.target.value};
  $("#eSave").onclick=saveEditor;$("#eCancel").onclick=closeEditor;
  $("#eDel")&&($("#eDel").onclick=()=>{const id=E.noteId;const ret=E.ret;tx("Delete card",()=>deleteNotes([id]));toast(T("Card deleted","卡片已删除"),T("Undo","撤销"),undo);E.noteId=null;closeEditor(true)});
  viewEl.querySelectorAll(".tb[data-for]").forEach(tb=>{
    tb.addEventListener("mousedown",e=>{if(e.target.closest("button"))e.preventDefault()});
    tb.onclick=async e=>{const b=e.target.closest("[data-cmd]");if(!b)return;const ed=viewEl.querySelector(`.rich[data-k="${tb.dataset.for}"]`);const cmd=b.dataset.cmd;
      if(document.activeElement!==ed){ed.focus();if(lastRange&&lastRange.el===ed){const s=getSelection();s.removeAllRanges();s.addRange(lastRange.r)}}
      if(cmd==="cloze")makeCloze(ed);
      else if(cmd==="img"){const r=lastRange&&lastRange.el===ed?lastRange.r.cloneRange():null;const fs=await pickFiles("image/*",true);if(!fs.length)return;ed.focus();if(r){const s=getSelection();s.removeAllRanges();s.addRange(r)}for(const f of fs)await insertImage(ed,f)}
      else document.execCommand(cmd,false,null);
    };
  });
  viewEl.querySelectorAll(".rich").forEach(ed=>{
    ed.addEventListener("paste",async e=>{const cd=e.clipboardData;if(!cd)return;const files=[...cd.files].filter(f=>f.type.startsWith("image/"));
      if(files.length){e.preventDefault();for(const f of files)await insertImage(ed,f);return}
      const html=cd.getData("text/html");if(html){e.preventDefault();const c=clean(html.replace(/<!--[\s\S]*?-->/g,"")).replace(/ class="[^"]*"/g,"");document.execCommand("insertHTML",false,c);return}
    });
    ed.addEventListener("drop",async e=>{const fs=[...(e.dataTransfer?.files||[])].filter(f=>f.type.startsWith("image/"));if(!fs.length)return;e.preventDefault();
      const pos=document.caretRangeFromPoint?.(e.clientX,e.clientY);if(pos){const s=getSelection();s.removeAllRanges();s.addRange(pos)}for(const f of fs)await insertImage(ed,f)});
    ed.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.shiftKey&&(e.key==="c"||e.key==="C")){e.preventDefault();makeCloze(ed,e.altKey)}});
  });
  if(E.type==="occlusion")wireOcc();
  const first=viewEl.querySelector(".rich");if(first&&E.type!=="occlusion"){first.focus();placeCaretEnd(first)}
  else if(E.type==="occlusion"&&!E.f.image)$("#occDrop")?.focus();
}
function placeCaretEnd(el){try{const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch{}}
async function insertImage(ed,file){const u=await imageToDataURL(file);ed.focus();document.execCommand("insertHTML",false,`<img src="${u}" alt="">`)}
function makeCloze(ed,same){
  if(E.type!=="cloze"){toast(T("Switch the card type to Cloze to hide words.","请把卡片类型切换为“填空”再挖空。"));return}
  const cur=clozeOrds(ed.innerHTML);let n=cur.length?Math.max(...cur)+(same?0:1):1;
  const s=getSelection();const sel=s.rangeCount?s.toString():"";
  if(sel)document.execCommand("insertText",false,`{{c${n}::${sel}}}`);
  else{document.execCommand("insertText",false,`{{c${n}::}}`);const r=s.getRangeAt(0);try{r.setStart(r.startContainer,Math.max(0,r.startOffset-2));r.collapse(true);s.removeAllRanges();s.addRange(r)}catch{}}
}
function setEditorType(t){
  if(t===E.type)return;collectEditor();const f=E.f;const from=E.type;
  if((from==="basic"||from==="reverse")&&t==="cloze"){f.text=f.text||f.front||"";f.extra=f.extra||f.back||""}
  if(from==="cloze"&&(t==="basic"||t==="reverse")){f.front=f.front||(f.text||"").replace(/\{\{c\d+::([\s\S]*?)(?:::[\s\S]*?)?\}\}/g,"$1");f.back=f.back||f.extra||""}
  E.type=t;if(!E.noteId)setMeta({lastType:t});renderEditor();
}
function closeEditor(deleted){
  const ret=E?.ret,deckId=E?.deckId;
  if(ret==="study"&&ST){if(ST.card&&!DB.cards[ST.card.id])ST.card=null;E=null;V={name:"study",deckId:ST.deckId};render();return}
  if(ret==="flash"&&FL){E=null;V={name:"flash",deckId:FL.deckId};render();return}
  E=null;go("deck",{deckId:deckId&&DB.decks[deckId]?deckId:V.deckId});
}
function saveEditor(){
  collectEditor();const f=E.f;
  if(E.type==="basic"||E.type==="reverse"){if(!text(f.front)&&!hasImg(f.front)){toast(T("Write something on the front first.","先写正面内容。"));viewEl.querySelector('.rich[data-k="front"]')?.focus();return}}
  else if(E.type==="cloze"){if(!clozeOrds(f.text).length){toast(T("Hide at least one part: select text and press ⌘⇧C.","至少挖一个空：选中文字后按 ⌘⇧C。"));viewEl.querySelector('.rich[data-k="text"]')?.focus();return}}
  else{if(!f.image){toast(T("Add an image first.","先添加图片。"));return}if(!(f.masks||[]).length){toast(T("Draw at least one box on the image.","至少在图片上画一个遮挡块。"));return}}
  const tags=E.tags.split(/[\s,]+/).map(s=>s.trim()).filter(Boolean);
  let fields;
  if(E.type==="basic"||E.type==="reverse")fields={front:f.front||"",back:f.back||""};
  else if(E.type==="cloze")fields={text:f.text||"",extra:f.extra||""};
  else fields={image:f.image,masks:f.masks,mode:f.mode||"all",header:f.header||"",extra:f.extra||""};
  if(E.noteId){
    const n=DB.notes[E.noteId];if(!n){closeEditor();return}
    tx("Edit card",()=>{let deck=E.deckId;if(!deck||!DB.decks[deck])deck=newDeck(T("My cards","我的卡片"));const nn={...n,type:E.type,deckId:deck,f:fields,tags,mod:Date.now()};put("notes",n.id,nn);syncCards(nn)});
    toast(T("Saved","已保存"));closeEditor();
  }else{
    tx("Add card",()=>{if(!E.deckId||!DB.decks[E.deckId])E.deckId=newDeck(T("My cards","我的卡片"));addNote({deckId:E.deckId,type:E.type,f:fields,tags})});
    E.added++;E.f={};E.sel=null;renderEditor();toast(T("Card added","已添加卡片"),T("Undo","撤销"),()=>{undo();E&&(E.added=Math.max(0,E.added-1));V.name==="edit"&&renderEditor()});renderNav();
  }
}
/* image occlusion drawing */
async function setOccImage(file){const u=await imageToDataURL(file,1800);collectEditor();E.f.image=u;E.f.masks=[];E.sel=null;renderEditor()}
function wireOcc(){
  const drop=$("#occDrop");
  if(drop){drop.onclick=async()=>{const fs=await pickFiles("image/*");if(fs[0])setOccImage(fs[0])};drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();drop.click()}};
    drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};drop.ondragleave=()=>drop.classList.remove("over");
    drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");const f=[...(e.dataTransfer?.files||[])].find(f=>f.type.startsWith("image/"));if(f)setOccImage(f)}}
  viewEl.querySelector('[data-occ="img"]')?.addEventListener("click",async()=>{const fs=await pickFiles("image/*");if(fs[0])setOccImage(fs[0])});
  viewEl.querySelector('[data-occ="del"]')?.addEventListener("click",()=>occDelete());
  viewEl.querySelector('[data-occ="clear"]')?.addEventListener("click",()=>{collectEditor();E.f.masks=[];E.sel=null;renderEditor()});
  $("#occMode")&&($("#occMode").onclick=e=>{const b=e.target.closest("button");if(!b)return;collectEditor();E.f.mode=b.dataset.v;renderEditor()});
  const ed=$("#occEd");if(!ed)return;
  ed.addEventListener("pointerdown",e=>{
    if(e.button!==0)return;e.preventDefault();
    const box=ed.getBoundingClientRect();const fx=x=>clamp((x-box.left)/box.width,0,1),fy=y=>clamp((y-box.top)/box.height,0,1);
    const mEl=e.target.closest("[data-m]");
    if(mEl){const m=E.f.masks.find(x=>x.id===mEl.dataset.m);E.sel=m.id;ed.querySelectorAll(".m").forEach(x=>x.classList.toggle("on",x===mEl));viewEl.querySelector('[data-occ="del"]')?.removeAttribute("disabled");
      const sx=fx(e.clientX),sy=fy(e.clientY),ox=m.x,oy=m.y;
      const mv=ev=>{m.x=clamp(ox+fx(ev.clientX)-sx,0,1-m.w);m.y=clamp(oy+fy(ev.clientY)-sy,0,1-m.h);mEl.style.left=m.x*100+"%";mEl.style.top=m.y*100+"%"};
      const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up)};addEventListener("pointermove",mv);addEventListener("pointerup",up);return}
    const sx=fx(e.clientX),sy=fy(e.clientY);const nEl=document.createElement("div");nEl.className="m on";ed.append(nEl);
    let r={x:sx,y:sy,w:0,h:0};
    const mv=ev=>{const x=fx(ev.clientX),y=fy(ev.clientY);r={x:Math.min(sx,x),y:Math.min(sy,y),w:Math.abs(x-sx),h:Math.abs(y-sy)};Object.assign(nEl.style,{left:r.x*100+"%",top:r.y*100+"%",width:r.w*100+"%",height:r.h*100+"%"})};
    const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);
      if(r.w*box.width<6||r.h*box.height<6){nEl.remove();E.sel=null;ed.querySelectorAll(".m").forEach(x=>x.classList.remove("on"));return}
      collectEditor();const masks=E.f.masks||(E.f.masks=[]);const ord=masks.length?Math.max(...masks.map(m=>m.ord))+1:1;const id=uid();masks.push({id,ord,...r});E.sel=id;renderEditor()};
    addEventListener("pointermove",mv);addEventListener("pointerup",up);
  });
}
function occDelete(){if(!E?.sel)return;collectEditor();const m=E.f.masks.find(x=>x.id===E.sel);E.f.masks=E.f.masks.filter(x=>x.id!==E.sel);
  if(m&&!E.noteId){const used=new Set(E.f.masks.map(x=>x.ord));const ords=[...used].sort((a,b)=>a-b);const map=new Map(ords.map((o,i)=>[o,i+1]));E.f.masks.forEach(x=>x.ord=map.get(x.ord))}
  E.sel=null;renderEditor()}

<script>
"use strict";
/* ===== libraries loaded on demand ===== */
const LIB={jszip:"https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",sql:"https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-asm.js",zstd:"https://cdn.jsdelivr.net/npm/fzstd@0.1.1/umd/index.js",
  pdf:"https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js",pdfw:"https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js",mammoth:"https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"};
const _ls={};
function loadScript(src){return _ls[src]||(_ls[src]=new Promise((res,rej)=>{const el=document.createElement("script");el.src=src;el.onload=res;el.onerror=()=>{delete _ls[src];rej(new Error("load"))};(document.head||document.documentElement).append(el)}))}

/* ===== saving files ===== */
async function saveFile(filename,data,{silent}={}){
  if(!downloads){
    if(typeof data==="string"){try{await navigator.clipboard.writeText(data);toast(T("Saving files isn't available here, so it was copied to the clipboard.","这里无法保存文件，已复制到剪贴板。"));return "copied"}catch{}}
    toast(T("Saving files works when this app is open in Claude.","在 Claude 中打开本应用才能保存文件。"));return null;
  }
  try{const r=await downloads.save({filename,data});if(!silent)toast(T("Saved ","已保存 ")+filename);return r?.status||"saved"}
  catch(e){if(e?.code==="declined")return null;toast({too_large:T("That file is too big to save.","文件太大，无法保存。"),rate_limited:T("Too many saves at once. Try again in a moment.","保存太频繁，请稍后再试。"),rejected_extension:T("This file type can't be saved.","无法保存这种文件类型。")}[e?.code]||T("Couldn't save the file.","无法保存文件。"));return null}
}
const fileSafe=s=>(String(s||"flashcards").replace(/::/g," - ").replace(/\s*:\s*/g," - ").replace(/[\\/:*?"<>|]+/g,"-").trim().slice(0,60))||"flashcards";
const stamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};

/* ===== export ===== */
const plainForExport=h=>text(h).replace(/\s+/g," ").trim();
function csvCell(v){v=String(v??"");return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function tsvCell(v){v=String(v??"").replace(/\r?\n/g,"<br>");return /[\t"]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportDeck(deckId,fmt){
  const scope=deckScope(deckId);const notes=notesInScope(scope).sort((a,b)=>a.created-b.created);const name=deckId?DB.decks[deckId].name:T("All decks","全部牌组");
  let out="",skipped=0;
  if(fmt==="csv"){
    out="Front,Back,Tags,Deck,Type\n";
    for(const n of notes){if(n.type==="occlusion"){skipped++;continue}const dn=DB.decks[n.deckId]?.name||"";
      const [a,b]=n.type==="cloze"?[n.f.text,n.f.extra]:[n.f.front,n.f.back];
      out+=[a,b].map(plainForExport).concat([(n.tags||[]).join(" "),dn,n.type]).map(csvCell).join(",")+"\n"}
    saveFile(fileSafe(name)+".csv",out);
  }else if(fmt==="anki"){
    out="#separator:tab\n#html:true\n#notetype column:1\n#deck column:2\n#tags column:5\n";
    const NT={basic:"Basic",reverse:"Basic (and reversed card)",cloze:"Cloze"};
    for(const n of notes){if(n.type==="occlusion"){skipped++;continue}const dn=DB.decks[n.deckId]?.name||"Default";
      const [a,b]=n.type==="cloze"?[n.f.text,n.f.extra]:[n.f.front,n.f.back];
      out+=[NT[n.type],dn,a||"",b||"",(n.tags||[]).join(" ")].map(tsvCell).join("\t")+"\n"}
    saveFile(fileSafe(name)+" (Anki).txt",out);
  }else{
    for(const n of notes){
      if(n.type==="occlusion"){skipped++;continue}
      if(n.type==="cloze"){for(const o of noteOrds(n)){const q=(n.f.text||"").replace(/\{\{c(\d+)::([\s\S]*?)(?:::[\s\S]*?)?\}\}/g,(m,k,ans)=>+k===o?"____":ans);out+=plainForExport(q)+"\t"+plainForExport(clozeAnswers(n.f.text,o).join(", "))+"\n"}}
      else out+=plainForExport(n.f.front)+"\t"+plainForExport(n.f.back)+"\n";
    }
    saveFile(fileSafe(name)+" (Quizlet).txt",out);
  }

VIEWS.stats=()=>{

  const cs=cardsInScope(scope);const c=counts(scope);

  const tot=cs.length||1;
  // heatmap: last 26 weeks
  const per={};for(const r of logs){const k=dayKey(r.t);per[k]=(per[k]||0)+1}
  const maxDay=Math.max(1,...Object.values(per));
  const ds0=dayStartMs();const start=new Date(ds0-7*25*DAY);start.setDate(start.getDate()-start.getDay());
  let heat="";for(let t=+start;t<=ds0;t+=DAY){const k=dayKey(t+3600e3*S().dayStart);const v=per[k]||0;const lvl=v?Math.ceil(v/maxDay*4):0;
    heat+=`<i data-tip="${new Date(t).toLocaleDateString()}: ${v} ${T("reviews","次复习")}" style="${v?`background:color-mix(in srgb,var(--accent) ${20+lvl*20}%,var(--panel))`:""}"></i>`}
  // forecast next 30 days
  const fc=new Array(30).fill(0);const end0=ds0+DAY;for(const x of cs){if(x.susp||x.fs.state===0)continue;const i=x.fs.due<end0?0:Math.floor((x.fs.due-ds0)/DAY);if(i>=0&&i<30)fc[i]++}

    <div class="tile"><div class="v">${today.length}</div><div class="l">${T("Reviewed today","今天已复习")}</div></div>
    <div class="tile"><div class="v">${st}</div><div class="l">${T("Day streak","连续学习天数")}</div></div>
    <div class="tile"><div class="v">${ret==null?"–":Math.round(ret*100)+"%"}</div><div class="l">${T("Retention, last 30 days","近 30 天记住率")}</div></div>
    <div class="tile"><div class="v">${cs.length}</div><div class="l">${T(`Cards · ${nM} mature`,`张卡片 · ${nM} 张已熟记`)}</div></div>
  </div>
  <div class="card chart"><h4>${T("Reviews, last 6 months","近半年复习")}</h4><div class="heat">${heat}</div><div class="small muted" style="margin-top:6px">${T(`${logs.length} reviews in total`,`共复习 ${logs.length} 次`)}</div></div>
  <div class="card chart"><h4>${T("Due in the next 30 days","未来 30 天到期")}</h4><div class="bars">${fc.map((v,i)=>`<div class="bw" data-tip="${i===0?T("Today","今天"):new Date(ds0+i*DAY).toLocaleDateString()}: ${v} ${T("cards","张")}"><i style="height:${v/fmax*100}%"></i></div>`).join("")}</div><div class="axis"><span>${T("Today","今天")}</span><span>+15</span><span>+29 ${T("days","天")}</span></div></div>
  <div class="card chart"><h4>${T("Card states","卡片状态")}</h4><div class="stack">${[[nNew,"var(--new)",T("New","新卡片")],[nL,"var(--learn)",T("Learning","学习中")],[nY,"color-mix(in srgb,var(--good) 55%,var(--panel))",T("Young","短期")],[nM,"var(--good)",T("Mature (21+ days)","已熟记（21 天以上）")],[nS,"var(--faint)",T("Suspended","已暂停")]].filter(x=>x[0]).map(([v,col,l])=>`<i style="width:${v/tot*100}%;background:${col}" data-tip="${l}: ${v}"></i>`).join("")}</div>
    <div class="legend">${[[nNew,"var(--new)",T("New","新卡片")],[nL,"var(--learn)",T("Learning","学习中")],[nY,"color-mix(in srgb,var(--good) 55%,var(--panel))",T("Young","短期")],[nM,"var(--good)",T("Mature","已熟记")],[nS,"var(--faint)",T("Suspended","已暂停")]].map(([v,col,l])=>`<span><i style="background:${col}"></i>${l} ${v}</span>`).join("")}</div></div>
  <div class="card chart"><h4>${T("Answers, last 30 days","近 30 天作答")}</h4><div class="legend" style="margin:0">${[T("Again","重来"),T("Hard","困难"),T("Good","良好"),T("Easy","简单")].map((l,i)=>`<span>${l}: <b>${byR[i]}</b>${r30.length?` (${Math.round(byR[i]/r30.length*100)}%)`:""}</span>`).join("")}</div></div>
  </div>`;
  $("#stScope").onchange=e=>{V.deckId=e.target.value||null;refresh()};
};

    <div class="row" style="margin-top:8px"><button class="btn" id="gFile" ${dis}>${T("Add files…","添加文件…")}</button><span class="small muted">${T("PDF, .docx, .txt, .md, images. You can also paste or drop them here.","支持 PDF、.docx、.txt、.md、图片，也可以直接粘贴或拖进来。")}</span></div>

async function addGenFiles(files){
  for(const f of files){
    const ext=(f.name.split(".").pop()||"").toLowerCase();
    try{
      if(f.type.startsWith("image/")){if(!imgCaps){toast(T("Sending images to Claude isn't available here. Paste the text instead.","这里无法把图片发给 Claude，请粘贴文字。"));continue}G.files.push({name:f.name||T("Pasted image","粘贴的图片"),kind:"image",blob:f});continue}
      if(ext==="pdf"){toast(T("Reading ","正在读取 ")+f.name+"…");const r=await pdfText(await f.arrayBuffer());if(r.text.replace(/\s/g,"").length>100*Math.max(1,r.pages/4))G.files.push({name:f.name,kind:"text",text:r.text});else if(imgCaps){toast(T("This PDF looks scanned, so its pages are sent as images.","这个 PDF 像是扫描件，页面会按图片发送。"));G.files.push({name:f.name,kind:"pdfimg",blobs:await pdfImages(await f.arrayBuffer(),20)})}else toast(T("This PDF has no text to read.","这个 PDF 里没有可读取的文字。"));continue}
      if(ext==="docx"){await loadScript(LIB.mammoth);const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});G.files.push({name:f.name,kind:"text",text:r.value});continue}
      if(ext==="html"||ext==="htm"){G.files.push({name:f.name,kind:"text",text:text(await f.text())});continue}
      G.files.push({name:f.name,kind:"text",text:await f.text()});
    }catch(e){console.warn(e);toast(T("Couldn't read ","无法读取 ")+f.name)}
  }
  if(V.name==="gen")refresh();
}
async function pdfLib(){if(!window.pdfjsLib)await loadScript(LIB.pdf);if(!window.pdfjsWorker)await loadScript(LIB.pdfw);return window.pdfjsLib}
async function pdfText(buf){const lib=await pdfLib();const pdf=await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false,disableAutoFetch:true,disableStream:true}).promise;let out="";
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();let last=null,line="";for(const it of tc.items){if(last!=null&&Math.abs(it.transform[5]-last)>2){out+=line+"\n";line=""}line+=it.str;last=it.transform[5]}out+=line+"\n\n"}
  const pages=pdf.numPages;pdf.destroy();return {text:out,pages}}
async function pdfImages(buf,max){const lib=await pdfLib();const pdf=await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise;const out=[];
  for(let i=1;i<=Math.min(max,pdf.numPages);i++){const pg=await pdf.getPage(i);const vp0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:Math.min(2,1500/Math.max(vp0.width,vp0.height))});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",.85)))}
  pdf.destroy();return out}
function cardPrompt(material,n,avoid){

  return `You turn study material into excellent flashcards for spaced repetition.
${n?`Make about ${n} cards.`:"Make as many cards as the material deserves: roughly one per distinct, test-worthy fact, concept, term or step, and at most 60."}
${style}
Rules:
- One idea per card (minimum information principle). Split lists and compound facts into separate cards.
- Fronts are specific and unambiguous, so only one answer fits. Backs are short and precise (ideally under 20 words).
- Cover the important material, skip trivia (page numbers, author names, filler). Keep technical terms, formulas and numbers exactly.

- ${LANG_RULE()}
- Plain text inside fields; no Markdown.${G.focus?`\n- The learner asked to focus on: ${G.focus.slice(0,400)}`:""}${avoid?`\n- These cards already exist; don't repeat them:\n${avoid}`:""}

<<<
${material}
>>>`;

function parseCardLine(line){

    if(o.type==="cloze"&&o.text&&/\{\{c\d+::/.test(o.text))return {id:uid(),on:true,type:"cloze",a:String(o.text),b:String(o.extra||"")};

  }catch{}return null;
}
async function runGen(){

  G.busy=true;G.results=G.more?G.results:[];G.parts=jobs.length;G.part=0;const ctl=G.ctl=new AbortController();
  const status=()=>{G.status=(G.parts>1?T(`Part ${G.part} of ${G.parts} · `,`第 ${G.part}/${G.parts} 部分 · `):"")+(G.results.length?T(`${G.results.length} cards so far…`,`已生成 ${G.results.length} 张…`):T("Claude is reading your material…","Claude 正在阅读资料…"));const s=$("#gStatus");if(s)s.textContent=G.status};
  const avoid=G.more?G.results.slice(-80).map(r=>"- "+text(r.a).slice(0,80)).join("\n"):"";
  refresh();let err=null;
  try{
    for(const job of jobs){
      G.part++;status();
      const n=total?Math.max(3,Math.round(total/jobs.length)):0;
      const material=job.text||T("(The material is in the attached images: photos or scans of notes or pages. Read all of the text in them.)","(The material is in the attached images: photos or scans of notes or pages. Read all of the text in them.)");
      let pending="";
      const eat=({delta})=>{if(ctl!==G.ctl)return;const lines=(pending+delta).split("\n");pending=lines.pop();for(const l of lines){const c=parseCardLine(l);if(c)G.results.push(c)}status()};
      await sample(cardPrompt(material,n,avoid),{signal:ctl.signal,modelTier:"default",cache:false,onText:eat,...(job.images?{images:job.images}:{})});
      const c=parseCardLine(pending);if(c)G.results.push(c);
    }
  }catch(e){if(e?.code!=="cancelled")err=e}
  G.busy=false;G.ctl=null;G.more=false;
  if(err&&!G.results.length){toast(aiErr(err),null,null,7000)}
  else if(err)toast(aiErr(err)+" "+T("Showing the cards made so far.","先显示已生成的卡片。"),null,null,7000);
  else if(!G.results.length)toast(T("Claude didn't find anything to make cards from. Try more detailed notes.","Claude 没找到能做卡片的内容，请提供更详细的笔记。"));
  if(G.results.length&&G.deckId==="__new"&&!G.newName)G.newName=(G.files[0]?.name||"").replace(/\.[a-z0-9]{2,5}$/i,"")||(text(G.text).slice(0,30)||T("New cards","新卡片"));
  if(V.name==="gen")refresh();
}
function renderGenReview(){
  const on=G.results.filter(r=>r.on).length;
  viewEl.innerHTML=`<div class="wrap"><h2>${T("Review the cards","检查卡片")}</h2><p class="sub">${T("Edit anything by clicking it, untick cards you don't want, then add them.","点击即可修改，不要的取消勾选，然后添加。")}</p>
  <div class="row" style="margin-bottom:8px"><button class="btn" id="grAll">${T("Select all","全选")}</button><button class="btn" id="grNone">${T("Select none","取消选择")}</button><span style="flex:1"></span><span class="small muted">${T(`${on} of ${G.results.length} selected`,`已选 ${on} / ${G.results.length}`)}</span></div>
  <div class="card" id="grList">${G.results.map((r,i)=>`<div class="grow ${r.on?"":"off"}" data-i="${i}"><input type="checkbox" ${r.on?"checked":""} aria-label="${T("Include","包含")}"><div class="ce uc" contenteditable="plaintext-only" data-f="a">${esc(r.a)}</div><div class="ce b uc" contenteditable="plaintext-only" data-f="b">${esc(r.b)}</div><button class="iconbtn" data-del="${i}" title="${T("Remove","移除")}" aria-label="${T("Remove","移除")}">${ICON.x}</button></div>`).join("")}</div>
  <div class="sticky-actions"><label class="row" style="gap:8px">${T("Add to","添加到")} <select id="grDeck"><option value="__new" ${G.deckId==="__new"?"selected":""}>${T("New deck","新牌组")}</option>${decksSorted().map(d=>`<option value="${d.id}" ${G.deckId===d.id?"selected":""}>${esc(d.name)}</option>`).join("")}</select></label>${G.deckId==="__new"?`<input type="text" id="grName" value="${esc(G.newName)}" placeholder="${T("Deck name","牌组名称")}">`:""}
    <button class="btn pri" id="grAdd" ${on?"":"disabled"}>${T(`Add ${on} cards`,`添加 ${on} 张卡片`)}</button><button class="btn" id="grMore">${ICON.spark} ${T("Make more","再生成一些")}</button><button class="btn ghost" id="grBack">${T("Discard","放弃")}</button></div></div>`;
  const list=$("#grList");
  list.addEventListener("input",e=>{const ce=e.target.closest(".ce");if(!ce)return;const r=G.results[+ce.closest(".grow").dataset.i];r[ce.dataset.f]=ce.textContent;if(ce.dataset.f==="a")r.type=/\{\{c\d+::/.test(r.a)?"cloze":"basic"});
  list.addEventListener("change",e=>{if(e.target.type!=="checkbox")return;const row=e.target.closest(".grow");G.results[+row.dataset.i].on=e.target.checked;row.classList.toggle("off",!e.target.checked);updGenCount()});
  list.addEventListener("click",e=>{const d=e.target.closest("[data-del]");if(!d)return;G.results.splice(+d.dataset.del,1);if(!G.results.length){refresh();return}renderGenReview()});
  $("#grAll").onclick=()=>{G.results.forEach(r=>r.on=true);renderGenReview()};$("#grNone").onclick=()=>{G.results.forEach(r=>r.on=false);renderGenReview()};

  $("#grAdd").onclick=addGenerated;$("#grMore").onclick=()=>{G.more=true;runGen()};
  $("#grBack").onclick=()=>{const keep=G.results;G.results=[];refresh();toast(T("Cards discarded","已放弃这些卡片"),T("Undo","撤销"),()=>{G.results=keep;if(V.name==="gen")refresh()})};
}
function updGenCount(){const on=G.results.filter(r=>r.on).length;const b=$("#grAdd");if(b){b.disabled=!on;b.textContent=T(`Add ${on} cards`,`添加 ${on} 张卡片`)}const s=viewEl.querySelector(".wrap>.row .small");if(s)s.textContent=T(`${on} of ${G.results.length} selected`,`已选 ${on} / ${G.results.length}`)}
function addGenerated(){
  const pick=G.results.filter(r=>r.on&&r.a.trim());if(!pick.length)return;let deckId=G.deckId;

    for(const r of pick){if(r.type==="cloze"&&/\{\{c\d+::/.test(r.a))addNote({deckId,type:"cloze",f:{text:plainToHtml(r.a),extra:plainToHtml(r.b)},tags:["claude"]});else addNote({deckId,type:"basic",f:{front:plainToHtml(r.a),back:plainToHtml(r.b)},tags:["claude"]})}});

/* --- practice quiz --- */
async function runQuiz(material,imgs,deckId,fromDeck){
  const n=G&&G.count!=="auto"?+G.count:(fromDeck?15:12);
  const ctl=new AbortController();if(G){G.busy=true;G.ctl=ctl;G.status=T("Claude is writing your quiz…","Claude 正在出题…");refresh()}
  else modal(`<div class="row"><span class="spin"></span><span>${T("Claude is writing your quiz…","Claude 正在出题…")}</span><span style="flex:1"></span><button class="btn" data-x="stop">${T("Stop","停止")}</button></div>`,b=>{b.querySelector("[data-x=stop]").onclick=()=>{ctl.abort();closeModal()}},()=>ctl.abort());
  const prompt=`Write a practice quiz of about ${n} questions that tests real understanding of the material below, like a good teacher's exam.
Mix question types: mostly multiple choice (4 options, exactly one correct, plausible wrong options of similar length), some true/false statements, and a few short written answers (answer of 1-4 words).
${LANG_RULE().replace("cards","questions")}${G?.focus?`\nFocus on: ${G.focus.slice(0,400)}`:""}
Reply with only JSON: {"questions":[{"type":"mc","q":"question","choices":["A","B","C","D"],"answer":0,"explain":"one sentence why"},{"type":"tf","q":"a statement","answer":true,"explain":"..."},{"type":"written","q":"question","answer":"short answer","explain":"..."}]}

Material:
<<<
${(material||"(The material is in the attached images. Read all of the text in them.)").slice(0,120000)}
>>>`;
  try{
    const o=await sample.json(prompt,{signal:ctl.signal,modelTier:"default",cache:false,...(imgs?.length?{images:imgs.slice(0,Math.max(1,imgCaps?.maxCount||5))}:{})});
    const qs=(o?.questions||[]).map(x=>{const ex=String(x.explain||"");
      if(x.type==="mc"&&Array.isArray(x.choices)&&x.choices.length>=2){const ci=clamp(+x.answer||0,0,x.choices.length-1);const opts=x.choices.map(c=>esc(c));return {type:"mc",prompt:esc(x.q),opts,correct:ci,answer:opts[ci],explain:ex}}
      if(x.type==="tf")return {type:"tf",prompt:esc(x.q),shown:null,correct:x.answer===true||x.answer==="true",answer:x.answer===true||x.answer==="true"?T("True","对"):T("False","错"),explain:ex};
      if(x.q&&x.answer!=null)return {type:"wr",prompt:esc(x.q),answer:esc(String(x.answer)),explain:ex};return null}).filter(Boolean);
    if(G){G.busy=false;G.ctl=null}else closeModal();
    if(!qs.length){toast(T("Claude couldn't write questions from this. Try more material.","Claude 没能出题，请提供更多资料。"));if(V.name==="gen")refresh();return}
    TS={deckId:deckId||null,qs,done:false,claude:true};go("test",{deckId:deckId||null});
  }catch(e){if(G){G.busy=false;G.ctl=null;if(V.name==="gen")refresh()}else closeModal();if(e?.code!=="cancelled")toast(aiErr(e),null,null,7000)}
}
function quizFromDeck(deckId){
  const ps=pairsFor(deckScope(deckId));let m="";for(const p of shuffle(ps)){const l=`Q: ${p.tt}\nA: ${p.dt}\n`;if(m.length+l.length>60000)break;m+=l}
  G=null;runQuiz(`Flashcards from the learner's deck "${DB.decks[deckId]?.name}" (question and answer pairs):\n`+m,[],deckId,true);
}
function saveQuizCards(){
  if(!TS)return;let deckId=TS.deckId&&DB.decks[TS.deckId]?TS.deckId:null;
  tx("Save quiz as cards",()=>{if(!deckId)deckId=newDeck(T("Quiz questions","测验题"));for(const q of TS.qs){const back=q.answer+(q.explain?"<br><br>"+esc(q.explain):"");addNote({deckId,type:"basic",f:{front:q.prompt+(q.type==="mc"?"<br>"+q.opts.map((o,i)=>String.fromCharCode(65+i)+". "+o).join("<br>"):""),back},tags:["quiz"]})}});
  toast(T(`Saved ${TS.qs.length} questions as cards`,`已把 ${TS.qs.length} 道题存为卡片`),T("Undo","撤销"),undo,7000);TS.deckId=deckId;renderNav();
}

<script>
"use strict";
/* ===== keyboard ===== */
function goBack(){
  switch(V.name){
    case "study":leaveStudy();break;
    case "edit":closeEditor();break;
    case "flash":case "learn":case "testsetup":case "match":clearInterval(mtTimer);DB.decks[V.deckId]?go("deck",{deckId:V.deckId}):go("home");break;
    case "test":TS&&TS.deckId&&DB.decks[TS.deckId]?go("deck",{deckId:TS.deckId}):go("home");break;
    case "gen":if(G?.busy)return;go(V.deckId&&DB.decks[V.deckId]?"deck":"home",{deckId:V.deckId});break;
    case "import":case "stats":go(V.deckId&&DB.decks[V.deckId]?"deck":"home",{deckId:V.deckId});break;
    case "deck":go("home");break;
  }
}
document.addEventListener("keydown",e=>{
  if(e.isComposing||e.keyCode===229)return;
  const t=e.target;const inField=!!t.closest?.('input:not([type=checkbox]):not([type=radio]),textarea,select,[contenteditable="true"],[contenteditable="plaintext-only"]');
  const mod=e.metaKey||e.ctrlKey;const k=e.key;const lk=k.length===1?k.toLowerCase():k;
  if(!$("#modal").hidden){if(k==="Escape"){e.preventDefault();closeModal()}return}
  if(menuEl){if(k==="Escape"){e.preventDefault();closeMenu()}return}
  if(mod&&lk==="z"&&!inField){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&lk==="y"&&!inField){e.preventDefault();redo();return}
  if(mod&&lk==="s"){e.preventDefault();downloadBackup();return}
  if(mod&&lk==="o"){e.preventDefault();go("import",{deckId:V.deckId});return}
  if(mod&&k==="Enter"){
    if(V.name==="edit"){e.preventDefault();saveEditor()}
    else if(V.name==="test"&&TS&&!TS.done){e.preventDefault();submitTest()}
    else if(V.name==="gen"&&G&&!G.busy){e.preventDefault();G.results.length?addGenerated():runGen()}
    else if(V.name==="import"&&IM?.src&&IM.src.kind!=="busy"){e.preventDefault();$("#imGo")?.click()}
    return;
  }
  if(k==="Escape"){
    if(inField&&V.name!=="edit"){t.blur();return}
    if(document.body.classList.contains("drawer")){document.body.classList.remove("drawer");return}
    e.preventDefault();goBack();return;
  }
  if(inField||mod||e.altKey)return;
  const onBtn=!!t.closest?.("button,a,[role=button],input[type=checkbox]");
  if(onBtn&&(k===" "||k==="Enter")&&!(V.name==="study"||V.name==="flash"||V.name==="learn"))return;
  if(k==="?"){e.preventDefault();openHelp();return}
  const v=V.name;let h=true;
  if(v==="study"&&ST){
    if(k===" "||k==="Enter"){if(!ST.card)h=false;else if(!ST.shown)showAnswer();else rate(3)}
    else if(ST.shown&&ST.card&&"1234".includes(k))rate(+k);
    else if(lk==="e"&&ST.card)openEditor({noteId:ST.card.noteId,deckId:deckOfCard(ST.card),ret:"study"});
    else if(k==="*"&&ST.card)toggleStar(ST.card.id);
    else if(k==="@"&&ST.card)suspendCurrent();
    else if(lk==="x"&&ST.shown)explainCard();
    else if(lk==="z")undo();
    else h=false;
  }else if(v==="flash"&&FL){
    if(FL.done){if(lk==="r"||k==="Enter"||k===" ")$("#fRe")?.click();else h=false}
    else if(k===" "||k==="ArrowUp"||k==="ArrowDown"||k==="Enter")flashFlip();
    else if(k==="ArrowRight")flashMove(1);else if(k==="ArrowLeft")flashMove(-1);
    else if(lk==="s")flashShuffle();else if(lk==="k")$("#fKnow")?.click();else if(k==="*")$("#fStarBtn")?.click();else if(lk==="e")$("#fEdit")?.click();
    else h=false;
  }else if(v==="learn"&&LN){
    if(LN.phase==="q"&&LN.q.type==="mc"&&/^[1-9]$/.test(k)&&+k<=LN.q.opts.length)learnAnswer(+k-1);
    else if(LN.phase==="fb"&&(k==="Enter"||k===" "))learnNext();
    else if(LN.phase==="sum"&&(k==="Enter"||k===" "))learnContinue();
    else h=false;
  }else if(v==="match"&&MT){
    if((k==="Enter"||k===" ")&&MT.phase==="ready")matchStart();
    else if((k==="Enter"||k===" ")&&MT.phase==="done"){startMatch(MT.deckId);matchStart()}
    else h=false;
  }else if(v==="testsetup"&&k==="Enter")$("#tGo")?.click();
  else if(v==="edit"&&E){if((k==="Delete"||k==="Backspace")&&E.sel)occDelete();else h=false}
  else if(v==="deck"&&V.deckId){
    if(k===" ")$("#dStudy")&&!$("#dStudy").disabled?startStudy(V.deckId):h=false;
    else if(lk==="a")openEditor({deckId:V.deckId});
    else if(lk==="g"&&sample)go("gen",{deckId:V.deckId});
    else if(lk==="f"||lk==="l"||lk==="t"||lk==="m"){const b=viewEl.querySelector(`[data-mode="${{f:"flash",l:"learn",t:"test",m:"match"}[lk]}"]`);if(b&&!b.disabled)startMode(b.dataset.mode,V.deckId);else h=false}
    else if(k==="/")$("#dq")?.focus();
    else h=false;
  }else if(v==="home"){
    if(k===" "&&$("#studyAll")&&!$("#studyAll").disabled)startStudy(null);
    else if(lk==="a"&&decksSorted().length)openEditor({});
    else if(lk==="g"&&sample)go("gen",{});
    else h=false;
  }else h=false;
  if(h)e.preventDefault();
});

<script>
/*INSTALL_PROMPT*/
/* When this artifact is open in Claude Desktop but not installed as an app yet, invite the person
   to install it. Shows once per session; the install itself is Claude's own dialog, started from
   the person's click (install.request() needs a click). Silent in browsers, on mobile and inside the
   installed app. */
(async()=>{
  if(!window.claude||!claude.use)return;
  try{if(sessionStorage.getItem("appstore.installAsked"))return}catch{}
  const d=await claude.use("desktop").catch(()=>null);
  if(!d||d.fs||!d.install)return;                       // d.fs exists only inside the installed app
  const st=await d.install.state().catch(()=>"unavailable");
  if(st!=="available")return;
  await new Promise(r=>setTimeout(r,900));
  if(document.querySelector(".aspi"))return;
  const zh=window.__ZH??/^zh/i.test(navigator.language||"");
  const T=(en,c)=>zh?c:en;
  const name=(document.title||"").trim()||T("this app","这个 app");
  const icon=typeof DOCK_SVG==="string"?DOCK_SVG:(typeof ICON_SVG==="object"&&ICON_SVG.store)||"";
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const st2=document.createElement("style");
  st2.textContent=`.aspi{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:rgba(20,20,19,.42);padding:16px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.aspi .b{--bg:#FAF9F5;--fg:#141413;--mu:#6B6A64;--pill:#EDE6DA;--ac:#B9532F;--on:#fff;background:var(--bg);color:var(--fg);border-radius:18px;max-width:380px;width:100%;padding:24px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
@media (prefers-color-scheme:dark){.aspi .b{--bg:#262624;--fg:#FAF9F5;--mu:#A6A39A;--pill:#3A3632;--ac:#E08A6A;--on:#1F1E1D}}
.aspi .ic{width:72px;height:72px}.aspi .ic svg{width:72px;height:72px;display:block}
.aspi h3{margin:2px 0 0;font-size:18px;font-weight:700;line-height:1.25}
.aspi p{margin:0;color:var(--mu)}
.aspi .row{display:flex;flex-direction:column;gap:8px;align-self:stretch;margin-top:6px}
.aspi button{font-family:inherit;font-weight:600;font-size:15px;line-height:1;border:0;border-radius:999px;padding:12px 16px;cursor:pointer}
.aspi .y{background:var(--ac);color:var(--on)}.aspi .n{background:var(--pill);color:var(--fg)}`;
  const m=document.createElement("div");m.className="aspi";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("data-no-i18n","");
  m.innerHTML=`<div class="b"><div class="ic">${icon}</div>
    <h3>${esc(T(`Install ${name} as an app?`,`把「${name}」安装为 app？`))}</h3>
    <p>${esc(T("It gets its own window and Dock icon, opens like any other app, and keeps working on your Claude plan.","装好后有自己的窗口和 Dock 图标，像普通 app 一样打开，继续用你的 Claude 套餐。"))}</p>
    <div class="row"><button class="y">${esc(T("Install","安装"))}</button><button class="n">${esc(T("Not now","以后再说"))}</button></div></div>`;
  const close=()=>{m.remove();st2.remove();try{sessionStorage.setItem("appstore.installAsked","1")}catch{}};
  m.addEventListener("click",async e=>{
    if(e.target===m||e.target.closest(".n"))return close();
    if(e.target.closest(".y")){const r=await d.install.request().catch(()=>"failed");close();
      if(r==="failed"||r==="unavailable"){const n=document.createElement("div");n.textContent=T("Couldn't install. Use Install as app in the artifact's menu.","没装上。可以在工件菜单里选“安装为 app”。");n.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141413;color:#fff;padding:10px 14px;border-radius:10px;z-index:2147483000;font:13px system-ui";document.body.appendChild(n);setTimeout(()=>n.remove(),5000)}}
  });
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"&&m.isConnected){close();document.removeEventListener("keydown",k)}});
  document.head?document.head.appendChild(st2):document.body.appendChild(st2);document.body.appendChild(m);
  m.querySelector(".y").focus();
})();
/*END_INSTALL_PROMPT*/
</script>
