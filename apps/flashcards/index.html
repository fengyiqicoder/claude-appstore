<title>Flashcards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: decks in a sidebar on the left; the main pane shows Today, a deck (cards + study modes), a study session,
   the card editor, Claude's card generator, import, or stats. Under 760px the sidebar becomes a drawer. */
:root{
  --bg:#f4f5f7; --panel:#ffffff; --fg:#16181d; --muted:#6a7180; --faint:#9aa1ad; --line:#e2e5ea; --chip:#eef0f3; --hover:#f0f2f5;
  --accent:#2d6cdf; --accent-fg:#ffffff; --accent-soft:rgba(45,108,223,.11);
  --again:#d64545; --again-soft:rgba(214,69,69,.11); --hard:#8a6a1f; --hard-soft:rgba(176,132,32,.13);
  --good:#1e9459; --good-soft:rgba(30,148,89,.12); --easy:#2d6cdf; --easy-soft:rgba(45,108,223,.11);
  --new:#2d6cdf; --learn:#d0582c; --due:#1e9459;
  --mask:#ffb547; --mask2:#8f97a6;
  --shadow:0 8px 30px rgba(15,20,40,.12),0 1px 3px rgba(15,20,40,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--panel:#1d2026;--fg:#eceef2;--muted:#9299a6;--faint:#6b7280;--line:#2d3139;--chip:#272b33;--hover:#252930;--accent:#6b9bff;--accent-fg:#0b1630;--accent-soft:rgba(107,155,255,.16);--again:#ff6b6b;--again-soft:rgba(255,107,107,.15);--hard:#e0b65a;--hard-soft:rgba(224,182,90,.15);--good:#4cc98f;--good-soft:rgba(76,201,143,.15);--easy:#6b9bff;--easy-soft:rgba(107,155,255,.16);--new:#6b9bff;--learn:#ff8a5c;--due:#4cc98f;--mask:#e8a23a;--mask2:#5b6372;--shadow:0 10px 34px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171b;--panel:#1d2026;--fg:#eceef2;--muted:#9299a6;--faint:#6b7280;--line:#2d3139;--chip:#272b33;--hover:#252930;--accent:#6b9bff;--accent-fg:#0b1630;--accent-soft:rgba(107,155,255,.16);--again:#ff6b6b;--again-soft:rgba(255,107,107,.15);--hard:#e0b65a;--hard-soft:rgba(224,182,90,.15);--good:#4cc98f;--good-soft:rgba(76,201,143,.15);--easy:#6b9bff;--easy-soft:rgba(107,155,255,.16);--new:#6b9bff;--learn:#ff8a5c;--due:#4cc98f;--mask:#e8a23a;--mask2:#5b6372;--shadow:0 10px 34px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13.5px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:var(--fg)}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app{display:flex;height:100vh;height:100dvh;width:100vw;overflow:hidden}
/* sidebar */
#side{width:236px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg);min-height:0}
.sidehead{display:flex;align-items:center;gap:6px;padding:12px 8px 6px max(12px,env(safe-area-inset-left,0px));min-height:44px}
body.app .sidehead{padding-left:80px;padding-top:14px;app-region:drag;-webkit-app-region:drag}
body.app .sidehead>*{app-region:no-drag;-webkit-app-region:no-drag}
.sidehead h1{font-size:13px;font-weight:650;margin:0;flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.app .sidehead h1{app-region:drag;-webkit-app-region:drag}
.iconbtn{border:0;background:transparent;border-radius:7px;width:28px;height:28px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--hover);color:var(--fg)}
#nav{flex:1;overflow:auto;padding:4px 6px 8px max(6px,env(safe-area-inset-left,0px))}
.navi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;border-radius:7px;padding:6px 8px;cursor:pointer;text-align:left;color:var(--fg);min-height:30px}
.navi:hover{background:var(--hover)}
.navi.on{background:var(--accent-soft);color:var(--accent)}
.navi .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navi .ic{color:var(--muted)} .navi.on .ic{color:var(--accent)}
.navsec{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;padding:12px 8px 4px}
.cnt{font-size:11.5px;font-variant-numeric:tabular-nums;display:flex;gap:6px}
.cnt .n{color:var(--new)} .cnt .l{color:var(--learn)} .cnt .d{color:var(--due)} .cnt .z{color:var(--faint)}
.sidefoot{border-top:1px solid var(--line);padding:6px 6px max(8px,env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
.bknote{font-size:11.5px;color:var(--muted);padding:2px 8px 4px}
.bknote.warn{color:var(--learn)}
#scrim{display:none}
/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;position:relative}
.top{display:flex;align-items:center;gap:6px;min-height:44px;padding:6px max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg)}
body.app .top{app-region:drag;-webkit-app-region:drag;padding-top:12px;min-height:50px}
body.app .top>*{app-region:no-drag;-webkit-app-region:no-drag}
body.app .top .sp,body.app .top .crumb{app-region:drag;-webkit-app-region:drag}
.top .sp{flex:1}
#topActs{flex-wrap:nowrap;flex:none}
.crumb{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#menuBtn{display:none}
#view{flex:1;overflow:auto;min-height:0;padding:20px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.wrap{max-width:860px;margin:0 auto}
.narrow{max-width:680px;margin:0 auto}
h2{font-size:22px;letter-spacing:-.02em;margin:0 0 4px;font-weight:700}
h3{font-size:14px;margin:22px 0 8px;font-weight:650}
.sub{color:var(--muted);margin:0 0 16px}
.btn{font:600 13px/1 var(--font);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--panel);color:var(--fg);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:32px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--again)}
.btn.big{font-size:15px;padding:12px 20px;border-radius:10px;min-height:44px}
.btn:disabled{opacity:.45;cursor:default}
.btn .k{font-weight:500;color:inherit;opacity:.6;font-size:11.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.muted{color:var(--muted)} .small{font-size:12px}
kbd{font:500 11px/1 var(--font);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:var(--panel);color:var(--muted)}
input[type=text],input[type=number],input[type=search],select,textarea.ta{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px;outline:none;min-height:32px}
input:focus,select:focus,textarea.ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.ta{width:100%;resize:vertical;line-height:1.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:600 12.5px/1 var(--font);padding:7px 10px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
label.ck{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
/* today / deck */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0 18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted)}
.decks{display:flex;flex-direction:column}
.drow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.drow:last-child{border-bottom:0}
.drow:hover{background:var(--hover)}
.drow .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:17px;color:var(--fg);font-weight:650;margin-bottom:6px}
.welcome{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:18px;text-align:left}
.wbtn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.wbtn:hover{border-color:var(--accent)}
.wbtn b{font-size:14px}
.wbtn span{color:var(--muted);font-size:12.5px}
.deckhead{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.deckhead .t{flex:1;min-width:200px}
.dname{font-size:22px;font-weight:700;letter-spacing:-.02em;border:1px solid transparent;border-radius:6px;padding:1px 4px;margin-left:-5px;background:transparent;width:100%;outline:none}
.dname:hover{border-color:var(--line)}
.dname:focus{border-color:var(--accent);background:var(--panel)}
.studybox{display:flex;align-items:center;gap:16px;padding:16px;margin:16px 0;flex-wrap:wrap}
.studybox .cnt{font-size:13px;gap:14px}
.studybox .cnt div{display:flex;flex-direction:column;align-items:center}
.studybox .cnt b{font-size:20px;font-weight:700}
.studybox .cnt small{font-size:11px;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.mode{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left}
.mode:hover{border-color:var(--accent)}
.mode .ic{width:20px;height:20px;color:var(--accent)}
.mode b{font-size:13.5px}
.mode span{font-size:11.5px;color:var(--muted)}
.listbar{display:flex;gap:8px;align-items:center;margin:18px 0 8px;flex-wrap:wrap}
.listbar input[type=search]{flex:1;min-width:150px}
.clist{overflow:hidden}
.crow{display:grid;grid-template-columns:22px 1fr 1fr auto;gap:12px;align-items:start;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--hover)}
.crow.sel{background:var(--accent-soft)}
.crow .f,.crow .b{min-width:0;overflow:hidden;max-height:4.4em;word-break:break-word}
.crow .f img,.crow .b img{max-height:44px;max-width:120px;vertical-align:middle;border-radius:4px}
.crow .b{color:var(--muted)}
.crow .meta{font-size:11.5px;color:var(--faint);text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:999px;background:var(--chip);color:var(--muted)}
.tag.new{color:var(--new);background:var(--accent-soft)} .tag.lrn{color:var(--learn);background:rgba(208,88,44,.12)} .tag.rev{color:var(--due);background:var(--good-soft)} .tag.sus{color:var(--hard);background:var(--hard-soft)}
.star{color:#e0a400}
.selbar{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--accent-soft);border-radius:10px;margin-bottom:8px;flex-wrap:wrap}
/* study */
.study{max-width:760px;margin:0 auto;display:flex;flex-direction:column;min-height:100%}
.sbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sbar .cnt{font-size:13px;gap:10px}
.sbar .cnt .cur{text-decoration:underline;text-underline-offset:3px;font-weight:700}
.qa{flex:1;padding:28px 28px;font-size:20px;line-height:1.5;text-align:center;word-break:break-word;min-height:200px;display:flex;flex-direction:column;gap:14px;justify-content:flex-start}
.qa img{max-width:100%;max-height:52vh;border-radius:6px}
.qa hr{border:0;border-top:1px solid var(--line);margin:8px 0;width:100%}
.qa .extra{font-size:15px;color:var(--muted)}
.cz{color:var(--accent);font-weight:700}
.cz.on{color:var(--accent);font-weight:700;background:var(--accent-soft);border-radius:4px;padding:0 3px}
.occ{position:relative;display:inline-block;max-width:100%;align-self:center;line-height:0}
.occ img{max-width:100%;max-height:60vh;display:block;border-radius:6px}
.occ .m{position:absolute;border-radius:3px;background:var(--mask2);border:1.5px solid rgba(0,0,0,.25)}
.occ .m.t{background:var(--mask);border-color:#b26b00}
.occ .m.rv{background:transparent;border:2.5px solid var(--again)}
.answerbar{position:sticky;bottom:0;padding:12px 0 4px;background:linear-gradient(transparent,var(--bg) 30%)}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:650}
.rate small{font-weight:500;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rate .kk{font-size:10.5px;color:var(--faint);font-weight:500}
.rate.r1{color:var(--again)} .rate.r1:hover{background:var(--again-soft)}
.rate.r2{color:var(--hard)} .rate.r2:hover{background:var(--hard-soft)}
.rate.r3{color:var(--good)} .rate.r3:hover{background:var(--good-soft)}
.rate.r4{color:var(--easy)} .rate.r4:hover{background:var(--easy-soft)}
.showbtn{width:100%;justify-content:center}
.explain{margin-top:10px;padding:12px 14px;font-size:14px;line-height:1.55;white-space:pre-wrap;text-align:left}
.done{text-align:center;padding:50px 16px}
.done .big{font-size:20px;font-weight:700;margin-bottom:6px}
/* flashcards mode */
.flip{perspective:1600px;height:min(52vh,420px);min-height:220px;cursor:pointer;margin:8px 0 14px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:24px;font-size:22px;text-align:center;overflow:auto;word-break:break-word;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.flip .fc img{max-width:100%;max-height:30vh}
.flip .fc.bk{transform:rotateY(180deg)}
.flip .side{position:absolute;top:10px;left:14px;font-size:11.5px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){.flip .in{transition:none}}
/* learn / test */
.qcard{padding:22px 22px 18px}
.qcard .lbl{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.qcard .prompt{font-size:19px;line-height:1.45;margin-bottom:18px;word-break:break-word}
.qcard .prompt img{max-width:100%;max-height:30vh;border-radius:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:flex-start;min-height:48px;word-break:break-word}
.opt:hover{border-color:var(--faint)}
.opt .n{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 5px;flex:none;margin-top:2px}
.opt img{max-height:60px;max-width:100%}
.opt.ok{border-color:var(--good);border-style:dashed;background:var(--good-soft)}
.opt.bad{border-color:var(--learn);background:rgba(208,88,44,.08)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.wr{display:flex;gap:8px}
.wr input{flex:1;font-size:15px;padding:10px 12px}
.fb{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:13.5px}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.bad{background:rgba(208,88,44,.1);color:var(--learn)}
.fb .ans{color:var(--fg);margin-top:4px}
.prog{height:6px;border-radius:99px;background:var(--chip);overflow:hidden;display:flex;gap:2px}
.prog i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:6px 0 14px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tq{padding:18px 20px;margin-bottom:12px}
.tq.right{border-color:var(--good)} .tq.wrong{border-color:var(--learn)}
.tq .tfrow{display:flex;gap:8px}
.score{font-size:40px;font-weight:800;letter-spacing:-.03em}
/* match */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tilem{min-height:110px;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;word-break:break-word;overflow:hidden;transition:opacity .25s,transform .25s}
.tilem img{max-height:70px;max-width:100%}
.tilem.sel{border-color:var(--accent);background:var(--accent-soft)}
.tilem.miss{border-color:var(--again);animation:shake .3s}
.tilem.hit{border-color:var(--good);background:var(--good-soft)}
.tilem.gone{opacity:0;transform:scale(.9);pointer-events:none}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.timer{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
/* editor */
.ed{padding:16px}
.field{margin-bottom:14px}
.field>.lab{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.rich{min-height:70px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--panel);outline:none;font-size:15px;line-height:1.5;word-break:break-word;overflow:auto;max-height:46vh}
.rich:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rich:empty::before{content:attr(data-ph);color:var(--faint)}
.rich img{max-width:100%;max-height:260px;border-radius:4px}
.tb{display:flex;gap:2px;margin-left:auto}
.tb button{border:0;background:transparent;border-radius:5px;padding:3px 7px;cursor:pointer;color:var(--muted);font-weight:700;font-size:12px;min-height:24px}
.tb button:hover{background:var(--hover);color:var(--fg)}
.occed{position:relative;display:inline-block;line-height:0;user-select:none;touch-action:none;cursor:crosshair;max-width:100%}
.occed img{max-width:100%;max-height:56vh;display:block;border-radius:6px;pointer-events:none}
.occed .m{position:absolute;background:rgba(255,181,71,.55);border:2px solid #d98a00;border-radius:3px;cursor:move;line-height:1.2}
.occed .m.on{border-color:var(--accent);background:rgba(45,108,223,.35)}
.occed .m span{position:absolute;top:2px;left:4px;font:700 11px/1 var(--font);color:#5a3700}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;background:var(--panel)}
.drop.over,.drop:hover{border-color:var(--accent);color:var(--accent)}
.sticky-actions{position:sticky;bottom:-40px;padding:12px 0 2px;background:linear-gradient(transparent,var(--bg) 35%);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* generate */
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:4px 6px 4px 10px;font-size:12px;max-width:100%}
.fchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.fchip button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0 4px;font-size:14px;line-height:1}
.gopts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:12px 0}
.gopts .lab{font-size:12px;color:var(--muted);margin-right:6px}
.grow{display:grid;grid-template-columns:22px 1fr 1fr 28px;gap:10px;align-items:start;padding:10px 12px;border-bottom:1px solid var(--line)}
.grow.off{opacity:.45}
.grow .ce{outline:none;border-radius:6px;padding:4px 6px;border:1px solid transparent;min-height:28px;word-break:break-word}
.grow .ce:hover{border-color:var(--line)}
.grow .ce:focus{border-color:var(--accent);background:var(--panel)}
.grow .ce.b{color:var(--muted)}
.status{display:flex;align-items:center;gap:10px;padding:10px 12px;color:var(--muted)}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
/* import */
table.pv{width:100%;border-collapse:collapse;font-size:12.5px}
table.pv td,table.pv th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;max-width:320px;overflow:hidden;word-break:break-word}
table.pv th{color:var(--muted);font-weight:600}
table.pv img{max-height:36px}
/* stats */
.chart{padding:14px 16px;margin-bottom:12px;position:relative}
.chart h4{margin:0 0 10px;font-size:13px;font-weight:650}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:11px;height:11px;border-radius:2px;background:var(--chip);display:block}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line)}
.bars .bw{flex:1;height:100%;display:flex;align-items:flex-end;cursor:default}
.bars .bw i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.bars .bw:hover i{filter:brightness(1.15)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:4px}
.stack{display:flex;height:14px;border-radius:5px;overflow:hidden;gap:2px;background:var(--panel)}
.stack i{display:block;height:100%}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap}
/* modal, toast, menu */
#modal{position:fixed;inset:0;z-index:40;background:rgba(15,18,25,.38);display:grid;place-items:center;padding:16px}
#modal .box{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px}
#modal h3{margin:0 0 8px;font-size:16px}
#modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.menu{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:200px}
.menu button{display:flex;width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:6px;cursor:pointer;gap:8px;align-items:center}
.menu button:hover,.menu button:focus{background:var(--hover);outline:none}
.menu button.danger{color:var(--again)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#toast{position:fixed;left:50%;top:54px;transform:translateX(-50%);z-index:70;background:#1f232a;color:#fff;border:1px solid rgba(255,255,255,.12);padding:9px 10px 9px 14px;border-radius:10px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);max-width:calc(100vw - 32px);font-size:13px}
#toast button{border:0;background:transparent;color:#8fb4ff;font-weight:700;cursor:pointer;padding:2px 6px}
#banner{background:var(--hard-soft);color:var(--hard);font-size:12.5px;padding:7px 14px;border-bottom:1px solid var(--line)}
.kgrid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
/* narrow */
@media (max-width:760px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow);background:var(--panel)}
  body.drawer #side{transform:none}
  body.drawer #scrim{display:block;position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.25)}
  #menuBtn{display:inline-grid}
  body.app .top{padding-left:max(80px,env(safe-area-inset-left,0px))}
  #view{padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .modes{grid-template-columns:repeat(2,1fr)}
  .opts{grid-template-columns:1fr}
  .mgrid{grid-template-columns:repeat(3,1fr)}
  .crow{grid-template-columns:22px 1fr auto}
  .crow .b{grid-column:2/3}
  .qa{padding:20px 14px;font-size:18px}
  .grow{grid-template-columns:22px 1fr 28px}
  .grow .ce.b{grid-column:2/3}
  .top .hide-n{display:none}
}
@media (max-width:460px){.mgrid{grid-template-columns:repeat(2,1fr)}.rates{gap:5px}.rate{padding:8px 2px}}

<script>

/* ===== HTML sanitising and text ===== */

/* ===== data store with undo ===== */
const KINDS=["decks","notes","cards","revlog","meta"];
const DB={decks:{},notes:{},cards:{},revlog:{},meta:{}};

function undo(){

/* ===== persistence: IndexedDB, else localStorage, else memory ===== */
let idb=null,backend="memory",persistTimer=0,persisting=null;
function openIDB(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open("claude-flashcards",1)}catch(e){rej(e);return}
  r.onupgradeneeded=()=>{const d=r.result;for(const k of KINDS)if(!d.objectStoreNames.contains(k))d.createObjectStore(k)};

    await Promise.all(KINDS.map(k=>new Promise((res,rej)=>{const q=t.objectStore(k).getAll();q.onsuccess=()=>{for(const v of q.result)if(v&&v.id!=null)DB[k][v.id]=v;res()};q.onerror=()=>rej(q.error)})));
    backend="idb";
    try{navigator.storage?.persist?.()}catch{}
    return;
  }catch(e){idb=null}
  try{const raw=localStorage.getItem("flashcards.db");localStorage.setItem("flashcards.probe","1");backend="ls";if(raw){const o=JSON.parse(raw);for(const k of KINDS)DB[k]=o[k]||{}}return}catch{}
  backend="memory";
}
function schedulePersist(){clearTimeout(persistTimer);persistTimer=setTimeout(persist,300)}
async function persist(){
  clearTimeout(persistTimer);
  if(!dirty.size)return;
  const keys=[...dirty];dirty.clear();
  if(backend==="idb"&&idb){
    try{
      await new Promise((res,rej)=>{const t=idb.transaction(KINDS,"readwrite");
        for(const key of keys){const [k,id]=key.split("\u0001");const v=DB[k][id];const st=t.objectStore(k);if(v===undefined)st.delete(id);else st.put(v,id)}
        t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
      return;
    }catch(e){keys.forEach(k=>dirty.add(k));storageProblem(e);return}
  }
  if(backend==="ls"){
    try{localStorage.setItem("flashcards.db",JSON.stringify(DB))}catch(e){storageProblem(e)}
  }
}
let warnedStorage=false;

  const b=$("#banner");b.hidden=false;b.textContent=/quota/i.test(String(e?.name||e))?T("This computer's storage for the app is full. Download a backup now, then delete unused decks or large images.","本机给应用的存储空间已满。请立即下载备份，再删除不用的牌组或大图片。"):T("Couldn't save your latest changes. Download a backup to keep them.","最近的修改没能保存。请下载备份以免丢失。")}

/* ===== model helpers ===== */
const decksSorted=()=>Object.values(DB.decks).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:"base"}));
function deckScope(deckId){
  if(!deckId)return new Set(Object.keys(DB.decks));

}
const noteOf=c=>DB.notes[c.noteId];
const deckOfCard=c=>DB.notes[c.noteId]?.deckId;
function cardsInScope(scope){const out=[];for(const c of Object.values(DB.cards)){const n=DB.notes[c.noteId];if(n&&scope.has(n.deckId))out.push(c)}return out}
function notesInScope(scope){return Object.values(DB.notes).filter(n=>scope.has(n.deckId))}
function clozeOrds(t){const s=new Set();String(t||"").replace(/\{\{c(\d+)::/g,(m,n)=>{s.add(+n);return m});return [...s].sort((a,b)=>a-b)}
function noteOrds(n){
  if(n.type==="reverse")return [0,1];
  if(n.type==="cloze"){const o=clozeOrds(n.f.text);return o.length?o:[1]}
  if(n.type==="occlusion"){const s=[...new Set((n.f.masks||[]).map(m=>m.ord))].sort((a,b)=>a-b);return s.length?s:[1]}
  return [0];
}
function newFs(t=Date.now()){return {due:t,stability:0,difficulty:0,elapsed_days:0,scheduled_days:0,reps:0,lapses:0,state:0,last_review:null}}
/* create/remove cards so the note has one card per ord (call inside tx) */
function syncCards(note){
  const want=new Set(noteOrds(note));const have=Object.values(DB.cards).filter(c=>c.noteId===note.id);
  for(const c of have)if(!want.has(c.ord))del("cards",c.id);
  const haveOrds=new Set(have.map(c=>c.ord));
  let i=0;for(const o of want)if(!haveOrds.has(o)){const id=uid();put("cards",id,{id,noteId:note.id,ord:o,fs:newFs(),created:Date.now()+(i++),susp:false,star:false})}
}
function addNote(n){const id=n.id||uid();const note={id,created:Date.now(),mod:Date.now(),tags:[],...n,id};put("notes",id,note);syncCards(note);return note}
function deleteNotes(ids){for(const id of ids){for(const c of Object.values(DB.cards))if(c.noteId===id)del("cards",c.id);del("notes",id)}}
function newDeck(name){name=String(name||"").split("::").map(s=>s.trim()).filter(Boolean).join("::");const parts=name.split("::");for(let i=1;i<parts.length;i++){const pn=parts.slice(0,i).join("::");if(!deckByName(pn)){const pid=uid();put("decks",pid,{id:pid,name:pn,created:Date.now()})}}const id=uid();put("decks",id,{id,name:uniqueDeckName(name),created:Date.now()});return id}
function uniqueDeckName(name){name=(name||"").trim()||T("Untitled deck","未命名牌组");const names=new Set(Object.values(DB.decks).map(d=>d.name.toLowerCase()));if(!names.has(name.toLowerCase()))return name;let i=2;while(names.has((name+" "+i).toLowerCase()))i++;return name+" "+i}
function deckByName(name){name=name.trim().toLowerCase();return Object.values(DB.decks).find(d=>d.name.toLowerCase()===name)}

/* ===== card rendering ===== */
function clozeHTML(html,ord,reveal){
  return clean(html).replace(/\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g,(m,n,ans,hint)=>{
    if(+n!==ord)return ans;
    return reveal?`<span class="cz on">${ans}</span>`:`<span class="cz">[${hint?esc(text(hint)):"…"}]</span>`});
}
function clozeAnswers(html,ord){const out=[];String(html||"").replace(/\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g,(m,n,ans)=>{if(+n===ord)out.push(ans);return m});return out}
function occHTML(n,ord,reveal){
  const masks=(n.f.masks||[]);
  const hideAll=(n.f.mode||"all")==="all";
  let h=`<div class="occ"><img src="${esc(n.f.image||"")}" alt="">`;
  for(const m of masks){
    const tgt=m.ord===ord;
    if(!tgt&&!hideAll)continue;
    const cls=tgt?(reveal?"m rv":"m t"):"m";
    h+=`<div class="${cls}" style="left:${m.x*100}%;top:${m.y*100}%;width:${m.w*100}%;height:${m.h*100}%"></div>`;
  }
  return h+"</div>";
}
function cardQA(c){
  const n=noteOf(c);if(!n)return {q:"",a:""};
  if(n.type==="cloze"){
    const q=clozeHTML(n.f.text,c.ord,false),a=clozeHTML(n.f.text,c.ord,true);
    const ex=n.f.extra?`<div class="extra">${clean(n.f.extra)}</div>`:"";
    return {q,a:a+(ex?"<hr>"+ex:"")};
  }
  if(n.type==="occlusion"){
    const hd=n.f.header?`<div>${clean(n.f.header)}</div>`:"";
    const ex=n.f.extra?`<div class="extra">${clean(n.f.extra)}</div>`:"";
    return {q:hd+occHTML(n,c.ord,false),a:hd+occHTML(n,c.ord,true)+ex};
  }
  const f=clean(n.f.front),b=clean(n.f.back);
  if(n.type==="reverse"&&c.ord===1)return {q:b,a:b+"<hr>"+f};
  return {q:f,a:f+"<hr>"+b};
}
/* term/definition pairs for Learn, Test, Match, Flashcards */
function pairsFor(scope,withOcc=false){
  const out=[];
  for(const n of notesInScope(scope).sort((a,b)=>a.created-b.created)){
    if(n.type==="basic"||n.type==="reverse"){
      const tt=text(n.f.front),dt=text(n.f.back);
      if((tt||hasImg(n.f.front))&&(dt||hasImg(n.f.back)))out.push({id:n.id,noteId:n.id,t:clean(n.f.front),d:clean(n.f.back),tt,dt});
    }else if(n.type==="cloze"){
      for(const o of noteOrds(n)){const ans=clozeAnswers(n.f.text,o);if(!ans.length)continue;
        const d=ans.map(clean).join(", ");out.push({id:n.id+":"+o,noteId:n.id,t:clozeHTML(n.f.text,o,false),d,tt:text(clozeHTML(n.f.text,o,false)),dt:text(d)})}
    }else if(withOcc&&n.type==="occlusion"){
      for(const o of noteOrds(n))out.push({id:n.id+":"+o,noteId:n.id,t:occHTML(n,o,false),d:occHTML(n,o,true),tt:"",dt:"",occ:true});
    }
  }
  return out;
}
function cardFront(c){const n=noteOf(c);if(!n)return "";if(n.type==="cloze")return n.f.text;if(n.type==="occlusion")return n.f.header||T("Image occlusion","图片遮挡");return c.ord===1?n.f.back:n.f.front}

/* ===== scheduler (FSRS via ts-fsrs) ===== */
let FS=null,FSret=0;
function sched(){
  if(!window.FSRS)return null;
  const r=S().retention;
  if(!FS||FSret!==r){try{FS=FSRS.fsrs(FSRS.generatorParameters({request_retention:r,maximum_interval:36500,enable_fuzz:true,enable_short_term:true}));FSret=r}catch{FS=null}}
  return FS;
}
const toC=f=>({due:new Date(f.due),stability:f.stability,difficulty:f.difficulty,elapsed_days:f.elapsed_days||0,scheduled_days:f.scheduled_days||0,reps:f.reps||0,lapses:f.lapses||0,state:f.state||0,last_review:f.last_review?new Date(f.last_review):undefined});
const fromC=c=>({due:+c.due,stability:c.stability,difficulty:c.difficulty,elapsed_days:c.elapsed_days,scheduled_days:c.scheduled_days,reps:c.reps,lapses:c.lapses,state:c.state,last_review:c.last_review?+c.last_review:null});
/* fallback when the FSRS library could not load: a small SM-2 style scheduler */
function fallbackNext(f,g,now){
  const n={...f,reps:(f.reps||0)+1,last_review:now};
  const ivl=Math.max(1,f.scheduled_days||0);
  if(f.state===0||f.state===1||f.state===3){
    if(g===1){n.state=f.state===3?3:1;n.due=now+60e3;n.scheduled_days=0}
    else if(g===2){n.state=f.state||1;n.due=now+6*60e3;n.scheduled_days=0}
    else if(g===3){if(f.state===1&&f.reps>0||f.state===3){n.state=2;n.scheduled_days=1;n.due=now+DAY}else{n.state=1;n.due=now+10*60e3;n.scheduled_days=0}}
    else{n.state=2;n.scheduled_days=4;n.due=now+4*DAY}
    n.stability=n.scheduled_days||0.1;n.difficulty=5;return n;
  }
  if(g===1){n.state=3;n.lapses=(f.lapses||0)+1;n.due=now+10*60e3;n.scheduled_days=0}
  else{const m=g===2?1.2:g===3?2.5:3.5;n.scheduled_days=Math.max(ivl+1,Math.round(ivl*m));n.due=now+n.scheduled_days*DAY;n.state=2}
  n.stability=n.scheduled_days;n.difficulty=5;return n;
}
function previews(c,now=Date.now()){
  const s=sched();
  if(s){try{const r=s.repeat(toC(c.fs),new Date(now));return [1,2,3,4].map(g=>fromC(r[g].card))}catch(e){console.warn(e)}}
  return [1,2,3,4].map(g=>fallbackNext(c.fs,g,now));
}
function fmtIvl(ms){
  const m=ms/60e3;
  if(m<1)return T("<1m","<1分");
  if(m<60)return Math.round(m)+T("m","分");
  const h=m/60;if(h<24)return Math.round(h)+T("h","时");
  const d=h/24;if(d<30)return Math.round(d)+T("d","天");
  const mo=d/30.4;if(mo<12)return (mo<10?mo.toFixed(1).replace(/\.0$/,""):Math.round(mo))+T("mo","月");
  return (d/365).toFixed(1).replace(/\.0$/,"")+T("y","年");
}
function dayStartMs(t=Date.now()){const d=new Date(t);const h=S().dayStart;if(d.getHours()<h)d.setDate(d.getDate()-1);d.setHours(h,0,0,0);return +d}
function dayKey(t){const d=new Date(dayStartMs(t));return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todaysLogs(){const ds=dayStartMs();return Object.values(DB.revlog).filter(r=>r.t>=ds)}
/* due counts for a scope, with Anki-style daily limits */
function counts(scope,logs=todaysLogs()){
  const now=Date.now(),end=dayStartMs()+DAY;
  let nw=0,lr=0,rv=0,total=0,newDone=0,revDone=0;
  for(const r of logs){const c=DB.cards[r.c];const d=c?deckOfCard(c):r.d;if(!scope.has(d))continue;if(r.s===0)newDone++;else if(r.s===2)revDone++}
  for(const c of cardsInScope(scope)){
    total++;if(c.susp)continue;const st=c.fs.state;
    if(st===0)nw++;else if(st===1||st===3){if(c.fs.due<end)lr++}else if(c.fs.due<end)rv++;
  }
  const s=S();
  return {new:Math.min(nw,Math.max(0,s.newPerDay-newDone)),learn:lr,review:Math.min(rv,Math.max(0,s.maxReviews-revDone)),total,newDone,revDone,newAll:nw};
}
/* next card to study in a scope */
function nextCard(scope,session){
  const now=Date.now(),end=dayStartMs()+DAY*(1+(session.ahead||0)),s=S();
  const logs=todaysLogs();
  const cnt=counts(scope,logs);cnt.new=Math.min(cnt.newAll,cnt.new+(session.bonus||0));if(session.ahead){let r=0;for(const c of cardsInScope(scope))if(!c.susp&&c.fs.state===2&&c.fs.due<end)r++;cnt.review=r}
  const seenNotes=new Map();if(s.bury)for(const r of logs)if(r.n){if(!seenNotes.has(r.n))seenNotes.set(r.n,new Set());seenNotes.get(r.n).add(r.c)}
  const buried=c=>{const x=seenNotes.get(c.noteId);if(!x)return false;for(const id of x)if(id!==c.id)return true;return false};
  const lrn=[],rev=[],nw=[];let laterLearn=null;
  for(const c of cardsInScope(scope)){
    if(c.susp||session.skip.has(c.id))continue;const st=c.fs.state;
    if(st===1||st===3){if(c.fs.due<=now)lrn.push(c);else if(c.fs.due<end&&(!laterLearn||c.fs.due<laterLearn.fs.due))laterLearn=c}
    else if(st===2){if(c.fs.due<end&&!buried(c))rev.push(c)}
    else if(st===0){if(!buried(c))nw.push(c)}
  }
  if(lrn.length){lrn.sort((a,b)=>a.fs.due-b.fs.due);return {card:lrn[0],cnt}}
  rev.sort((a,b)=>a.fs.due-b.fs.due);
  nw.sort((a,b)=>(DB.notes[a.noteId]?.created||0)-(DB.notes[b.noteId]?.created||0)||a.ord-b.ord);
  const revOK=cnt.review>0&&rev.length,newOK=cnt.new>0&&nw.length;
  if(revOK&&newOK){const ratio=Math.max(1,Math.round(cnt.review/Math.max(1,cnt.new)));return {card:(session.n%(ratio+1)===ratio)?nw[0]:rev[0],cnt}}
  if(revOK)return {card:rev[0],cnt};
  if(newOK)return {card:nw[0],cnt};
  if(laterLearn&&laterLearn.fs.due-now<=20*60e3)return {card:laterLearn,cnt};
  return {card:null,cnt,laterLearn};
}
function stateTag(c){
  if(c.susp)return `<span class="tag sus">${T("Suspended","已暂停")}</span>`;
  const st=c.fs.state;
  if(st===0)return `<span class="tag new">${T("New","新")}</span>`;
  if(st===1||st===3)return `<span class="tag lrn">${T("Learning","学习中")}</span>`;
  const d=c.fs.due-Date.now();
  return `<span class="tag rev">${d<=0?T("Due","到期"):T("in ","")+fmtIvl(d)+T("","后")}</span>`;
}

function streakDays(){
  const days=new Set(Object.values(DB.revlog).map(r=>dayKey(r.t)));
  let n=0;let t=dayStartMs()+12*3600e3; // midday of the study day, so a 23 h or 25 h DST day never skips or repeats a day
  if(!days.has(dayKey(t)))t-=DAY; // today not done yet: streak still counts through yesterday
  while(days.has(dayKey(t))){n++;t-=DAY}
  return n;
}
function retention(scope,days=30){
  const since=Date.now()-days*DAY;let tot=0,ok=0;
  for(const r of Object.values(DB.revlog)){if(r.t<since||r.s!==2)continue;if(scope){const c=DB.cards[r.c];const d=c?deckOfCard(c):r.d;if(!scope.has(d))continue}tot++;if(r.r>1)ok++}
  return tot?ok/tot:null;
}

function wireDeckHead(d){

  inp.addEventListener("blur",commit);
  $("#dStudy").onclick=()=>startStudy(d.id);
  $("#dCustom")&&($("#dCustom").onclick=()=>studyExtra(d.id));
  viewEl.querySelector(".modes").onclick=e=>{const b=e.target.closest("[data-mode]");if(!b||b.disabled)return;startMode(b.dataset.mode,d.id)};
}
function startMode(m,deckId){if(m==="flash")startFlash(deckId);else if(m==="learn")startLearn(deckId);else if(m==="test")go("testsetup",{deckId});else if(m==="match")startMatch(deckId)}
function renameDeck(id,name){
  const d=DB.decks[id];if(!d)return;const old=d.name;
  const clash=Object.values(DB.decks).find(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase());
  if(clash){toast(T("A deck with that name already exists.","已有同名牌组。"));$("#dname")&&($("#dname").value=old);return}
  tx("Rename deck",()=>{put("decks",id,{...d,name});for(const x of Object.values(DB.decks))if(x.name.startsWith(old+"::"))put("decks",x.id,{...x,name:name+x.name.slice(old.length)})});
  refresh();
}

function resetCards(ids){
  if(!ids.length)return;
  tx("Reset progress",()=>{for(const id of ids){const c=DB.cards[id];if(c)put("cards",id,{...c,fs:newFs()})}});
  refresh();toast(T(`Reset ${ids.length} cards to new`,`已把 ${ids.length} 张卡片重置为新卡片`),T("Undo","撤销"),undo);
}
function filteredCards(){
  const scope=deckScope(V.deckId);const q=deckQ.trim().toLowerCase();const now=Date.now(),end=dayStartMs()+DAY;
  let cs=cardsInScope(scope);
  cs=cs.filter(c=>{const st=c.fs.state;
    if(deckFilter==="new"&&!(st===0&&!c.susp))return false;
    if(deckFilter==="learn"&&!(st===1||st===3))return false;
    if(deckFilter==="review"&&st!==2)return false;
    if(deckFilter==="due"&&!(st!==0&&c.fs.due<end&&!c.susp))return false;
    if(deckFilter==="star"&&!c.star)return false;
    if(deckFilter==="susp"&&!c.susp)return false;
    return true});
  if(q){cs=cs.filter(c=>{const n=noteOf(c);return (text(n.f.front||"")+" "+text(n.f.back||"")+" "+text(n.f.text||"")+" "+text(n.f.extra||"")+" "+text(n.f.header||"")+" "+(n.tags||[]).join(" ")).toLowerCase().includes(q)})}
  cs.sort((a,b)=>(DB.notes[b.noteId]?.created||0)-(DB.notes[a.noteId]?.created||0)||a.ord-b.ord);
  return cs;
}
function cardBackPreview(c){const n=noteOf(c);if(n.type==="cloze"){return clozeAnswers(n.f.text,c.ord).map(clean).join(", ")}if(n.type==="occlusion")return T(`Box ${c.ord}`,`遮挡块 ${c.ord}`);return clean(c.ord===1?n.f.front:n.f.back)}
function cardFrontPreview(c){const n=noteOf(c);if(n.type==="cloze")return clozeHTML(n.f.text,c.ord,false);if(n.type==="occlusion")return `<img src="${esc(n.f.image)}" alt=""> ${esc(text(n.f.header||""))}`;return clean(c.ord===1?n.f.back:n.f.front)}

    if(a==="all"){filteredCards().forEach(c=>deckSel.add(c.id));renderCardList()}

    else if(a==="del"){const nids=[...new Set(ids.map(id=>DB.cards[id].noteId))];tx("Delete cards",()=>deleteNotes(nids));deckSel.clear();refresh();toast(T(`Deleted ${nids.length} notes`,`已删除 ${nids.length} 条笔记`),T("Undo","撤销"),undo,7000)}
    else if(a==="star"){const on=!sel.every(c=>c.star);tx("Star",()=>ids.forEach(id=>put("cards",id,{...DB.cards[id],star:on})));renderCardList()}
    else if(a==="susp"){tx(anyS?"Suspend":"Unsuspend",()=>ids.forEach(id=>put("cards",id,{...DB.cards[id],susp:anyS})));refresh()}
    else if(a==="reset"){resetCards(ids)}
    else if(a==="move"){menu(b,decksSorted().filter(x=>x.id!==V.deckId).map(x=>({label:x.name,fn:()=>{const nids=[...new Set(ids.map(id=>DB.cards[id].noteId))];tx("Move cards",()=>nids.forEach(n=>put("notes",n,{...DB.notes[n],deckId:x.id})));deckSel.clear();refresh();toast(T(`Moved to ${x.name}`,`已移动到 ${x.name}`),T("Undo","撤销"),undo)}})).concat(decksSorted().length<2?[{label:T("No other decks","没有其他牌组"),disabled:true,fn:()=>{}}]:[]))}
  };
}
</script>
<script>

/* ===== Study (spaced repetition) ===== */

function startStudy(deckId,opt={}){ST={deckId,scope:deckScope(deckId),skip:new Set(),n:0,card:null,shown:false,t0:0,explain:"",bonus:opt.bonus||0,ahead:opt.ahead||0};go("study",{deckId})}

  const c=DB.cards[ST.card.id];ST.card=c;

  const pv=ST.shown?previews(c):null;const now=Date.now();
  viewEl.innerHTML=`<div class="study">
    <div class="sbar"><button class="btn ghost" id="sLeave">${ICON.back} ${T("Done","结束")}</button><span style="flex:1"></span>
      <span class="cnt"><span class="n ${kind==="n"?"cur":""}">${cnt.new}</span><span class="l ${kind==="l"?"cur":""}">${cnt.learn}</span><span class="d ${kind==="d"?"cur":""}">${cnt.review}</span></span></div>
    <div class="card qa uc" id="qa">${ST.shown?qa.a:qa.q}</div>

    <div class="answerbar">${ST.shown?`<div class="rates">${[1,2,3,4].map(g=>`<button class="rate r${g}" data-g="${g}"><small>${fmtIvl(pv[g-1].due-now)}</small>${[T("Again","重来"),T("Hard","困难"),T("Good","良好"),T("Easy","简单")][g-1]}<span class="kk">${g}</span></button>`).join("")}</div>
      ${sample&&noteOf(c).type!=="occlusion"?`<div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost" id="sExplain">${ICON.spark} ${T("Explain this card","讲解这张卡片")} <span class="k">X</span></button></div>`:""}`
      :`<button class="btn pri big showbtn" id="sShow">${T("Show answer","显示答案")} <span class="k">Space</span></button>`}</div></div>`;
  renderExplain();
  $("#sLeave").onclick=leaveStudy;
  $("#sEdit").onclick=()=>openEditor({noteId:c.noteId,deckId:deckOfCard(c),ret:"study"});
  $("#sStar").onclick=()=>toggleStar(c.id);
  $("#sMore").onclick=e=>menu(e.currentTarget,[
    {label:T("Suspend card (@)","暂停这张卡片 (@)"),fn:()=>suspendCurrent()},
    {label:T("Skip for now","先跳过"),fn:()=>{ST.skip.add(c.id);ST.card=null;renderStudy()}},
    {label:T("Reset to new","重置为新卡片"),fn:()=>{tx("Reset progress",()=>put("cards",c.id,{...c,fs:newFs()}));ST.card=null;renderStudy()}},
    {label:T("Delete card","删除卡片"),danger:true,fn:()=>{tx("Delete card",()=>deleteNotes([c.noteId]));ST.card=null;renderStudy();renderNav();toast(T("Card deleted","卡片已删除"),T("Undo","撤销"),undo)}}
  ]);
  if(ST.shown){viewEl.querySelector(".rates").onclick=e=>{const b=e.target.closest("[data-g]");if(b)rate(+b.dataset.g)};$("#sExplain")&&($("#sExplain").onclick=explainCard)}
  else $("#sShow").onclick=showAnswer;
}
function countLater(scope){const end=dayStartMs()+DAY;return cardsInScope(scope).filter(c=>!c.susp&&(c.fs.state===1||c.fs.state===3)&&c.fs.due<end).length}
function leaveStudy(){const d=ST?.deckId;ST=null;d&&DB.decks[d]?go("deck",{deckId:d}):go("home")}
function showAnswer(){if(!ST?.card)return;ST.shown=true;renderStudy()}
function rate(g){
  if(!ST?.card||!ST.shown)return;
  const c=DB.cards[ST.card.id];const now=Date.now();const nf=previews(c,now)[g-1];
  const t=tx("Rating",()=>{put("cards",c.id,{...c,fs:nf});const rid=uid();put("revlog",rid,{id:rid,c:c.id,n:c.noteId,d:deckOfCard(c),r:g,s:c.fs.state,t:now,iv:nf.scheduled_days,dur:Math.min(now-ST.t0,600e3)})});
  t.cardId=c.id;ST.n++;ST.card=null;ST.shown=false;ST.explain="";
  renderStudy();renderNav();
}
function toggleStar(id){const c=DB.cards[id];if(!c)return;tx("Star",()=>put("cards",id,{...c,star:!c.star}));if(V.name==="study")renderStudy();else if(V.name==="flash")renderFlash();toast(c.star?T("Star removed","已取消标星"):T("Starred","已标星"))}
function suspendCurrent(){const c=ST?.card;if(!c)return;tx("Suspend",()=>put("cards",c.id,{...DB.cards[c.id],susp:true}));ST.card=null;renderStudy();renderNav();toast(T("Card suspended. It won't come up until you unsuspend it.","已暂停，恢复前不会再出现。"),T("Undo","撤销"),undo)}

/* ===== Flashcards (flip through) ===== */
let FL=null;
function startFlash(deckId){
  const scope=deckScope(deckId);
  const cs=cardsInScope(scope).filter(c=>{const n=noteOf(c);return !(n.type==="reverse"&&c.ord===1)}).sort((a,b)=>(DB.notes[a.noteId].created-DB.notes[b.noteId].created)||a.ord-b.ord);
  FL={deckId,all:cs.map(c=>c.id),list:cs.map(c=>c.id),i:0,flip:false,starOnly:false,backFirst:false,shuffled:false,known:new Set(),done:false};
  go("flash",{deckId});
}
function flashFaces(c){
  const n=noteOf(c);
  if(n.type==="basic"||n.type==="reverse")return [clean(n.f.front),clean(n.f.back)];
  const qa=cardQA(c);return [qa.q,qa.a];
}
VIEWS.flash=()=>renderFlash();
function renderFlash(){
  if(!FL){go("home");return}
  const d=DB.decks[FL.deckId];crumb((d?.name||"")+" · "+T("Flashcards","翻卡"));
  FL.list=FL.list.filter(id=>DB.cards[id]);
  const list=FL.starOnly?FL.list.filter(id=>DB.cards[id].star):FL.list;

  $("#fBack").onclick=()=>go("deck",{deckId:FL.deckId});
  if(!list.length){viewEl.innerHTML=`<div class="narrow empty"><div class="big">${FL.starOnly?T("No starred cards","没有标星的卡片"):T("No cards","没有卡片")}</div>${FL.starOnly?`<button class="btn" id="fAll">${T("Show all cards","显示全部卡片")}</button>`:""}</div>`;$("#fAll")&&($("#fAll").onclick=()=>{FL.starOnly=false;FL.i=0;renderFlash()});return}
  if(FL.done){
    viewEl.innerHTML=`<div class="narrow done"><div class="big">${T(`You went through all ${list.length} cards`,`${list.length} 张卡片全部看完了`)}</div>
    <div class="muted">${T(`You marked ${FL.known.size} as known.`,`其中 ${FL.known.size} 张标记为已掌握。`)}</div>
    <div class="row" style="justify-content:center;margin-top:16px"><button class="btn pri" id="fRe">${T("Start over","重新开始")} <span class="k">R</span></button>${list.length>FL.known.size&&FL.known.size?`<button class="btn" id="fMiss">${T("Go through the rest again","只看没掌握的")}</button>`:""}<button class="btn" id="fLearn">${T("Learn these","学习这些")}</button></div></div>`;
    $("#fRe").onclick=()=>{FL.i=0;FL.done=false;FL.flip=false;FL.known.clear();renderFlash()};
    $("#fMiss")&&($("#fMiss").onclick=()=>{FL.list=FL.list.filter(id=>!FL.known.has(id));FL.known.clear();FL.i=0;FL.done=false;FL.flip=false;renderFlash()});
    $("#fLearn").onclick=()=>startLearn(FL.deckId);
    return;
  }
  FL.i=clamp(FL.i,0,list.length-1);
  const c=DB.cards[list[FL.i]];const [fr,bk]=flashFaces(c);const a=FL.backFirst?bk:fr,b=FL.backFirst?fr:bk;
  viewEl.innerHTML=`<div class="narrow">
  <div class="row" style="justify-content:space-between"><b style="font-variant-numeric:tabular-nums">${FL.i+1} / ${list.length}</b>
    <div class="row"><label class="ck small"><input type="checkbox" id="fStar" ${FL.starOnly?"checked":""}> ${T("Starred only","只看标星")}</label>
    <label class="ck small"><input type="checkbox" id="fRev" ${FL.backFirst?"checked":""}> ${T("Answer first","先看答案")}</label></div></div>
  <div class="prog" style="margin:10px 0 4px"><i style="width:${(FL.i+1)/list.length*100}%;background:var(--accent)"></i></div>
  <div class="flip ${FL.flip?"on":""}" id="flip" role="button" tabindex="0" aria-label="${T("Flip card","翻面")}"><div class="in"><div class="fc uc"><span class="side">${FL.backFirst?T("Answer","答案"):T("Term","正面")}</span><div>${a}</div></div><div class="fc bk uc"><span class="side">${FL.backFirst?T("Term","正面"):T("Answer","答案")}</span><div>${b}</div></div></div></div>
  <div class="row" style="justify-content:center">
    <button class="btn" id="fPrev" ${FL.i?"":"disabled"} title="${T("Previous (←)","上一张 (←)")}">← ${T("Previous","上一张")}</button>
    <button class="btn" id="fFlip">${T("Flip","翻面")} <span class="k">Space</span></button>
    <button class="btn" id="fKnow" title="${T("Mark as known and go on (K)","标记已掌握并继续 (K)")}">${FL.known.has(c.id)?"✓ ":""}${T("Know it","已掌握")} <span class="k">K</span></button>
    <button class="btn" id="fNext" title="${T("Next (→)","下一张 (→)")}">${T("Next","下一张")} →</button></div>
  <div class="row" style="justify-content:center;margin-top:10px">
    <button class="btn ghost" id="fShuf">${ICON.shuffle} ${FL.shuffled?T("Unshuffle","取消打乱"):T("Shuffle","打乱")} <span class="k">S</span></button>
    <button class="btn ghost" id="fStarBtn">${c.star?ICON.starF:ICON.starO} ${c.star?T("Starred","已标星"):T("Star","标星")} <span class="k">*</span></button>
    <button class="btn ghost" id="fEdit">${ICON.edit} ${T("Edit","编辑")} <span class="k">E</span></button></div>
  <p class="small muted" style="text-align:center;margin-top:14px">${T("Flipping through doesn't change your review schedule. Use Study now for spaced repetition.","翻卡不会改变复习计划。间隔重复请用“开始学习”。")}</p></div>`;
  $("#flip").onclick=flashFlip;
  $("#fFlip").onclick=flashFlip;$("#fPrev").onclick=()=>flashMove(-1);$("#fNext").onclick=()=>flashMove(1);
  $("#fKnow").onclick=()=>{FL.known.add(c.id);flashMove(1)};
  $("#fShuf").onclick=flashShuffle;$("#fStarBtn").onclick=()=>toggleStar(c.id);
  $("#fEdit").onclick=()=>openEditor({noteId:c.noteId,deckId:FL.deckId,ret:"flash"});
  $("#fStar").onchange=e=>{FL.starOnly=e.target.checked;FL.i=0;FL.flip=false;renderFlash()};
  $("#fRev").onchange=e=>{FL.backFirst=e.target.checked;FL.flip=false;renderFlash()};
}
function flashFlip(){FL.flip=!FL.flip;$("#flip")?.classList.toggle("on",FL.flip)}
function flashMove(d){const list=FL.starOnly?FL.list.filter(id=>DB.cards[id]?.star):FL.list;if(FL.i+d>=list.length){FL.done=true;renderFlash();return}FL.i=clamp(FL.i+d,0,list.length-1);FL.flip=false;renderFlash()}
function flashShuffle(){FL.shuffled=!FL.shuffled;FL.list=FL.shuffled?shuffle(FL.list):FL.all.filter(id=>DB.cards[id]);FL.i=0;FL.flip=false;renderFlash();toast(FL.shuffled?T("Shuffled","已打乱"):T("Back in order","已恢复顺序"))}

/* ===== answer checking ===== */
function norm(s){return String(s||"").normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[\s\p{P}\p{S}]+/gu," ").trim()}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const q=[i];for(let j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[n]}
function checkTyped(typed,answer){
  const t=norm(typed);if(!t)return {ok:false};
  const full=text(answer);const cands=new Set([full,full.replace(/\([^)]*\)|（[^）]*）/g,""),...full.split(/\s*(?:[,;/、，；]|\bor\b)\s*/i)]);
  for(const c of cands){const a=norm(c);if(!a)continue;if(a===t)return {ok:true};if(a.length>=5&&lev(a,t)<=1)return {ok:true,close:true}}
  return {ok:false};
}
function distractors(pairs,p,side,k=3){
  const seen=new Set([norm(text(p[side]))]);const out=[];
  for(const q of shuffle(pairs)){if(q.id===p.id)continue;const key=norm(text(q[side]))||q[side];if(seen.has(key))continue;seen.add(key);out.push(q[side]);if(out.length>=k)break}
  return out;
}

/* ===== Learn (Quizlet-style rounds) ===== */
let LN=null;
function startLearn(deckId){
  const pairs=pairsFor(deckScope(deckId));
  if(pairs.length<2){toast(T("Learn needs at least 2 cards with text on both sides.","学习模式至少需要 2 张两面都有文字的卡片。"));return}
  const saved=S().learn[deckId]||{};
  LN={deckId,pairs,prog:Object.fromEntries(pairs.map(p=>[p.id,saved.p?.[p.id]||0])),dir:saved.dir||"t2d",mc:saved.mc!==false,wr:saved.wr!==false,round:[],ri:0,q:null,phase:"q",roundNo:0,res:[]};
  learnRound();go("learn",{deckId});
}
function learnSave(){const L=S().learn;setMeta({learn:{...L,[LN.deckId]:{p:LN.prog,dir:LN.dir,mc:LN.mc,wr:LN.wr}}})}
function learnRound(){
  const left=LN.pairs.filter(p=>LN.prog[p.id]<2);
  if(!left.length){LN.phase="done";return}
  const fam=shuffle(left.filter(p=>LN.prog[p.id]===1)),nw=shuffle(left.filter(p=>LN.prog[p.id]===0));
  LN.round=shuffle([...fam.slice(0,4),...nw].slice(0,7).concat(fam.slice(4)).slice(0,7));LN.ri=0;LN.res=[];LN.roundNo++;LN.phase="q";learnQ();
}
function learnQ(){
  const p=LN.round[LN.ri];const ask=LN.dir==="t2d"?"t":"d",ans=LN.dir==="t2d"?"d":"t";
  const type=(!LN.wr||(LN.prog[p.id]===0&&LN.mc))?"mc":"wr";
  const q={p,type,prompt:p[ask],answer:p[ans]};
  if(type==="mc"){const opts=shuffle([p[ans],...distractors(LN.pairs,p,ans)]);q.opts=opts;q.correct=opts.indexOf(p[ans])}
  LN.q=q;LN.phase="q";
}
VIEWS.learn=()=>renderLearn();
function renderLearn(){
  if(!LN){go("home");return}
  const d=DB.decks[LN.deckId];crumb((d?.name||"")+" · "+T("Learn","学习模式"));
  setTop(`<button class="btn ghost" id="lBack">${ICON.back} ${T("Deck","牌组")}</button><button class="btn ghost" id="lOpt">${T("Options","选项")}</button>`);
  $("#lBack").onclick=()=>go("deck",{deckId:LN.deckId});
  $("#lOpt").onclick=e=>learnOptions(e.currentTarget);
  const tot=LN.pairs.length;const m=LN.pairs.filter(p=>LN.prog[p.id]>=2).length,f=LN.pairs.filter(p=>LN.prog[p.id]===1).length;
  const bar=`<div class="prog"><i style="width:${m/tot*100}%;background:var(--good)"></i><i style="width:${f/tot*100}%;background:var(--learn)"></i></div>
    <div class="legend"><span><i style="background:var(--good)"></i>${T(`Mastered ${m}`,`已掌握 ${m}`)}</span><span><i style="background:var(--learn)"></i>${T(`Familiar ${f}`,`眼熟 ${f}`)}</span><span><i style="background:var(--chip)"></i>${T(`Not studied ${tot-m-f}`,`未学 ${tot-m-f}`)}</span></div>`;
  if(LN.phase==="done"){
    viewEl.innerHTML=`<div class="narrow">${bar}<div class="card done"><div class="big">${T(`You've mastered all ${tot} terms`,`${tot} 个词条全部掌握了`)}</div><div class="muted">${T("To keep them, study this deck with spaced repetition over the next days.","想长期记住，接下来几天用间隔重复继续学这个牌组。")}</div>
    <div class="row" style="justify-content:center;margin-top:16px"><button class="btn pri" id="lStudy">${T("Study with spaced repetition","用间隔重复学习")}</button><button class="btn" id="lTest">${T("Take a practice test","做模拟测试")}</button><button class="btn" id="lAgain">${T("Learn again from the start","从头再学一遍")}</button></div></div></div>`;
    $("#lStudy").onclick=()=>startStudy(LN.deckId);$("#lTest").onclick=()=>go("testsetup",{deckId:LN.deckId});
    $("#lAgain").onclick=()=>{for(const k in LN.prog)LN.prog[k]=0;learnSave();LN.roundNo=0;learnRound();renderLearn()};
    return;
  }
  if(LN.phase==="sum"){
    viewEl.innerHTML=`<div class="narrow">${bar}<div class="card qcard"><div style="font-size:18px;font-weight:700;margin-bottom:10px">${T(`Round ${LN.roundNo} done`,`第 ${LN.roundNo} 轮完成`)} · ${LN.res.filter(x=>x.ok).length}/${LN.res.length} ${T("correct","正确")}</div>
      ${LN.res.map(x=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:nowrap;align-items:flex-start"><span style="color:${x.ok?"var(--good)":"var(--learn)"};font-weight:700">${x.ok?"✓":"✗"}</span><div class="uc" style="flex:1;min-width:0">${x.p.t}</div><div class="uc muted" style="flex:1;min-width:0">${x.p.d}</div></div>`).join("")}
      <div class="row" style="margin-top:14px"><button class="btn pri" id="lCont">${T("Continue","继续")} <span class="k">Enter</span></button></div></div></div>`;
    $("#lCont").onclick=learnContinue;return;
  }
  const q=LN.q;const fb=LN.phase==="fb";

    <div class="row" style="margin-top:12px">${!q.ok&&q.type==="wr"&&q.typed?`<button class="btn" id="lover">${T("I was right","我答对了")}</button>`:""}<span style="flex:1"></span><button class="btn pri" id="lnext">${T("Continue","继续")} <span class="k">Enter</span></button></div>`;

function learnAnswer(x){
  const q=LN.q;if(LN.phase!=="q")return;
  q.prevProg=LN.prog[q.p.id];

  else{q.typed=String(x);const r=checkTyped(q.typed,q.answer);q.ok=r.ok;q.close=r.close}
  LN.prog[q.p.id]=!q.ok?0:q.type==="wr"?2:(LN.wr?Math.max(1,q.prevProg):Math.min(2,q.prevProg+1));

}

function startTest(deckId,ps,types,dir){
  const all=pairsFor(deckScope(deckId));

    if(type==="tf"){const other=distractors(all,p,ans,1)[0];const truth=!other||Math.random()<.5;q.shown=truth?p[ans]:other;q.correct=truth}

      <div class="tfrow">${[true,false].map(v=>{let cls=q.pick===v?"picked":"";if(TS.done){if(v===q.correct)cls="ok";else if(q.pick===v)cls="bad"}return `<button class="opt ${cls}" data-tf="${v}" style="flex:1;justify-content:center">${v?T("True","对"):T("False","错")}</button>`}).join("")}</div>`;

    }
    if(TS.done&&q.explain)h+=`<div class="small muted" style="margin-top:10px;white-space:pre-wrap">${esc(q.explain)}</div>`;
    h+=`</div>`;
  });

    $("#tNew").onclick=()=>{if(TS.claude||!DB.decks[TS.deckId]){TS={...TS,qs:shuffle(TS.qs.map(q=>({...q,pick:undefined,typed:"",ok:undefined}))),done:false};renderTest();viewEl.scrollTop=0}else go("testsetup",{deckId:TS.deckId})};
    $("#tSave")&&($("#tSave").onclick=saveQuizCards)}
}
function updLeft(){const el=$("#tLeft");if(!el)return;const n=TS.qs.filter(q=>q.type==="wr"?!(q.typed||"").trim():q.pick===undefined).length;el.textContent=n?T(`${n} unanswered`,`还有 ${n} 题没答`):T("All answered","都答完了")}
$("#view").addEventListener("click",e=>{
  if(V.name!=="test"||!TS)return;const card=e.target.closest("[data-q]");if(!card)return;const q=TS.qs[+card.dataset.q];

$("#view").addEventListener("input",e=>{if(V.name==="test"&&TS&&e.target.matches(".twr")){TS.qs[+e.target.dataset.wr].typed=e.target.value;updLeft()}});
$("#view").addEventListener("keydown",e=>{if(V.name==="test"&&e.target.matches(".twr")&&e.key==="Enter"&&!e.isComposing&&!(e.metaKey||e.ctrlKey)){e.preventDefault();const all=[...viewEl.querySelectorAll(".twr")];const nx=all[all.indexOf(e.target)+1];nx?nx.focus():$("#tSubmit")?.focus()}});
function submitTest(){
  if(!TS||TS.done)return;
  for(const q of TS.qs){if(q.type==="wr"){const r=checkTyped(q.typed||"",q.answer);q.ok=r.ok}else q.ok=q.pick!==undefined&&q.pick===q.correct}
  TS.done=true;const pct=Math.round(TS.qs.filter(q=>q.ok).length/TS.qs.length*100);
  if(!TS.claude&&TS.deckId&&DB.decks[TS.deckId]){const b=S().testBest;if(b[TS.deckId]==null||pct>b[TS.deckId])setMeta({testBest:{...b,[TS.deckId]:pct}})}

}

/* ===== Match ===== */
let MT=null,mtTimer=0;
function startMatch(deckId){
  const pairs=pairsFor(deckScope(deckId)).filter(p=>p.tt||p.dt);
  if(pairs.length<2){toast(T("Match needs at least 2 cards with text on both sides.","配对至少需要 2 张两面都有文字的卡片。"));return}
  const pick=[];const seen=new Set();for(const p of shuffle(pairs)){const k=norm(p.tt)+"|"+norm(p.dt);if(seen.has(norm(p.tt))||seen.has(norm(p.dt)))continue;seen.add(norm(p.tt));seen.add(norm(p.dt));pick.push(p);if(pick.length>=6)break}
  const tiles=shuffle(pick.flatMap((p,i)=>[{k:i,side:"t",html:p.t},{k:i,side:"d",html:p.d}])).map((t,i)=>({...t,i,gone:false}));
  MT={deckId,tiles,sel:null,start:0,pen:0,left:pick.length,phase:"ready",time:0};clearInterval(mtTimer);go("match",{deckId});
}
VIEWS.match=()=>renderMatch();
function renderMatch(){
  if(!MT){go("home");return}
  const d=DB.decks[MT.deckId];crumb((d?.name||"")+" · "+T("Match","配对"));
  setTop(`<button class="btn ghost" id="mBack">${ICON.back} ${T("Deck","牌组")}</button>`);$("#mBack").onclick=()=>{clearInterval(mtTimer);go("deck",{deckId:MT.deckId})};
  const best=S().matchBest[MT.deckId];
  if(MT.phase==="ready"){viewEl.innerHTML=`<div class="narrow done"><div class="big">${T("Match","配对")}</div><div class="muted">${T("Click a term, then its answer. Wrong matches add 1 second.","先点一个词条，再点它的答案。配错加 1 秒。")}${best?T(` Your best: ${best.toFixed(1)} s.`,` 最好成绩：${best.toFixed(1)} 秒。`):""}</div><div class="row" style="justify-content:center;margin-top:16px"><button class="btn pri big" id="mGo">${T("Start game","开始游戏")} <span class="k">Enter</span></button></div></div>`;$("#mGo").onclick=matchStart;return}
  if(MT.phase==="done"){const isBest=MT.best;viewEl.innerHTML=`<div class="narrow done"><div class="big">${T(`${MT.time.toFixed(1)} seconds`,`${MT.time.toFixed(1)} 秒`)}</div><div class="muted">${isBest?T("New personal best!","刷新个人最好成绩！"):best?T(`Your best: ${best.toFixed(1)} s`,`最好成绩：${best.toFixed(1)} 秒`):""}${MT.pen?T(` Includes ${MT.pen} s of penalties.`,` 含 ${MT.pen} 秒罚时。`):""}</div><div class="row" style="justify-content:center;margin-top:16px"><button class="btn pri" id="mAgain">${T("Play again","再玩一次")} <span class="k">Enter</span></button><button class="btn" id="mDeck">${T("Back to deck","返回牌组")}</button></div></div>`;
    $("#mAgain").onclick=()=>{startMatch(MT.deckId);matchStart()};$("#mDeck").onclick=()=>go("deck",{deckId:MT.deckId});return}
  viewEl.innerHTML=`<div class="wrap"><div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="timer" id="mTime">0.0</span><span class="small muted">${MT.pen?T(`+${MT.pen}s penalty`,`罚时 +${MT.pen} 秒`):""}</span></div>
  <div class="mgrid" id="mgrid">${MT.tiles.map(t=>`<button class="tilem uc ${t.gone?"gone":""} ${MT.sel===t.i?"sel":""}" data-t="${t.i}">${t.html}</button>`).join("")}</div></div>`;
  $("#mgrid").onclick=e=>{const b=e.target.closest("[data-t]");if(b)matchClick(+b.dataset.t,b)};
}
function matchStart(){MT.phase="play";MT.start=Date.now();renderMatch();clearInterval(mtTimer);mtTimer=setInterval(()=>{const el=$("#mTime");if(!el||V.name!=="match"||MT.phase!=="play"){return}el.textContent=((Date.now()-MT.start)/1000+MT.pen).toFixed(1)},100)}
function matchClick(i,el){
  if(MT.phase!=="play")return;const t=MT.tiles[i];if(t.gone)return;
  if(MT.sel==null){MT.sel=i;el.classList.add("sel");return}
  if(MT.sel===i){MT.sel=null;el.classList.remove("sel");return}
  const a=MT.tiles[MT.sel];const elA=viewEl.querySelector(`[data-t="${MT.sel}"]`);
  if(a.k===t.k&&a.side!==t.side){a.gone=t.gone=true;MT.sel=null;elA.classList.remove("sel");elA.classList.add("hit");el.classList.add("hit");setTimeout(()=>{elA.classList.add("gone");el.classList.add("gone")},180);
    MT.left--;if(!MT.left){clearInterval(mtTimer);MT.time=(Date.now()-MT.start)/1000+MT.pen;const b=S().matchBest;MT.best=!b[MT.deckId]||MT.time<b[MT.deckId];if(MT.best)setMeta({matchBest:{...b,[MT.deckId]:MT.time}});MT.phase="done";setTimeout(renderMatch,350)}}
  else{MT.pen++;MT.sel=null;elA.classList.remove("sel");elA.classList.add("miss");el.classList.add("miss");setTimeout(()=>{elA.classList.remove("miss");el.classList.remove("miss")},400);const pn=viewEl.querySelector(".small.muted");if(pn)pn.textContent=T(`+${MT.pen}s penalty`,`罚时 +${MT.pen} 秒`)}
}

<script>
"use strict";
/* ===== files and images ===== */
function pickFiles(accept,multiple=false){return new Promise(res=>{const i=$("#fileIn");i.value="";i.accept=accept||"";i.multiple=multiple;let done=false;i.onchange=()=>{done=true;res([...i.files])};
  const onFocus=()=>{setTimeout(()=>{if(!done)res([])},800);removeEventListener("focus",onFocus)};addEventListener("focus",onFocus);i.click()})}
function readAsDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)})}
async function imageToDataURL(blob,max=1400){
  const type=blob.type||"";
  if((type==="image/gif"||type==="image/svg+xml")&&blob.size<1.5e6)return readAsDataURL(blob);
  try{
    const url=URL.createObjectURL(blob);const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});URL.revokeObjectURL(url);
    const w=img.naturalWidth,h=img.naturalHeight;const sc=Math.min(1,max/Math.max(w,h));
    if(sc===1&&blob.size<400e3&&/png|jpe?g|webp/.test(type))return readAsDataURL(blob);
    const c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);const x=c.getContext("2d");
    if(type==="image/png"){x.drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/png").length<1.4e6?c.toDataURL("image/png"):(x.globalCompositeOperation="destination-over",x.fillStyle="#fff",x.fillRect(0,0,c.width,c.height),c.toDataURL("image/jpeg",.86))}
    x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.86);
  }catch{return readAsDataURL(blob)}
}
function dataURLtoBlob(u){const [h,b]=u.split(",");const mime=(h.match(/data:([^;]+)/)||[])[1]||"application/octet-stream";const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}

/* ===== card editor ===== */
let E=null;
const TYPES=()=>[["basic",T("Basic","问答")],["reverse",T("Basic + reverse","问答 + 反向")],["cloze",T("Cloze","填空")],["occlusion",T("Image occlusion","图片遮挡")]];

function richHTML(key,label,ph,cloze){
  return `<div class="field"><div class="lab"><span>${label}</span><div class="tb" data-for="${key}">
  <button data-cmd="bold" title="${T("Bold","加粗")} (${MOD}B)"><b>B</b></button><button data-cmd="italic" title="${T("Italic","斜体")} (${MOD}I)"><i>I</i></button><button data-cmd="underline" title="${T("Underline","下划线")} (${MOD}U)"><u>U</u></button>
  ${cloze?`<button data-cmd="cloze" title="${T("Make cloze from selection","把选中文字变成填空")} (${MOD}⇧C)">[…]</button>`:""}
  <button data-cmd="img" title="${T("Insert image (or paste one)","插入图片（也可直接粘贴）")}">${ICON.img}</button><button data-cmd="removeFormat" title="${T("Clear formatting","清除格式")}">T̸</button></div></div>
  <div class="rich uc" contenteditable="true" data-k="${key}" data-ph="${esc(ph)}" spellcheck="true">${clean(E.f[key]||"")}</div></div>`;
}
VIEWS.edit=()=>renderEditor();

  setTop("");

  else if(E.type==="cloze"){f=richHTML("text",T("Text","正文"),T("Select words and press ⌘⇧C to hide them, or type {{c1::answer}}","选中文字按 ⌘⇧C 挖空，或直接输入 {{c1::答案}}"),true)+richHTML("extra",T("Back extra","背面附加"),T("Optional: shown with the answer","可选：和答案一起显示"))}
  else{
    f=`<div class="field"><div class="lab"><span>${T("Image","图片")}</span>${E.f.image?`<div class="tb"><button data-occ="img">${T("Change image","换图片")}</button></div>`:""}</div>
    ${E.f.image?`<div class="occed" id="occEd"><img src="${esc(E.f.image)}" alt="" draggable="false">${(E.f.masks||[]).map(m=>`<div class="m ${E.sel===m.id?"on":""}" data-m="${m.id}" style="left:${m.x*100}%;top:${m.y*100}%;width:${m.w*100}%;height:${m.h*100}%"><span>${m.ord}</span></div>`).join("")}</div>
      <div class="row small muted" style="margin-top:8px">${T("Drag on the image to cover each label. Each box becomes its own card.","在图片上拖动，盖住每个标注。每个遮挡块是一张卡片。")}</div>
      <div class="row" style="margin-top:8px"><div class="seg" id="occMode"><button data-v="all" class="${(E.f.mode||"all")==="all"?"on":""}">${T("Hide all, guess one","全部遮住，猜一个")}</button><button data-v="one" class="${E.f.mode==="one"?"on":""}">${T("Hide one, guess one","只遮一个，猜它")}</button></div>
      <button class="btn" data-occ="del" ${E.sel?"":"disabled"}>${T("Delete box","删除遮挡块")} <span class="k">⌫</span></button><button class="btn ghost" data-occ="clear" ${(E.f.masks||[]).length?"":"disabled"}>${T("Remove all boxes","清除全部遮挡块")}</button><span class="small muted">${T(`${(E.f.masks||[]).length} boxes`,`${(E.f.masks||[]).length} 个遮挡块`)}</span></div>`
    :`<div class="drop" id="occDrop" tabindex="0">${ICON.img}<div style="margin-top:6px">${T("Paste an image (⌘V), drop one here, or click to choose","粘贴图片（⌘V）、拖到这里，或点击选择")}</div><div class="small" style="margin-top:4px">${T("Diagrams, maps, anatomy charts: cover the labels and quiz yourself.","适合示意图、地图、解剖图：把标注遮住来自测。")}</div></div>`}</div>`
    +richHTML("header",T("Header","标题"),T("Optional: e.g. Label the parts of the heart","可选：例如 标出心脏各部分"))+richHTML("extra",T("Back extra","背面附加"),T("Optional: shown with the answer","可选：和答案一起显示"));
  }
  viewEl.innerHTML=`<div class="narrow"><div class="card ed">
    <div class="row" style="margin-bottom:14px;justify-content:space-between"><div class="seg" id="eType">${TYPES().map(([v,l])=>`<button data-v="${v}" class="${E.type===v?"on":""}">${l}</button>`).join("")}</div>
    <label class="row small muted" style="gap:6px">${T("Deck","牌组")} <select id="eDeck">${ds.length?ds.map(d=>`<option value="${d.id}" ${d.id===E.deckId?"selected":""}>${esc(d.name)}</option>`).join(""):`<option value="">${T("New deck: My cards","新牌组：我的卡片")}</option>`}<option value="__new">${T("New deck…","新建牌组…")}</option></select></label></div>
    ${f}
    <div class="field"><div class="lab">${T("Tags","标签")}</div><input type="text" id="eTags" style="width:100%" value="${esc(E.tags)}" placeholder="${T("Optional, separated by spaces","可选，用空格分隔")}"></div>
  </div>
  <div class="sticky-actions">${E.noteId?`<button class="btn pri" id="eSave">${T("Save","保存")} <span class="k">${MOD}↩</span></button><button class="btn" id="eCancel">${T("Cancel","取消")} <span class="k">Esc</span></button><span style="flex:1"></span><button class="btn danger" id="eDel">${T("Delete card","删除卡片")}</button>`
    :`<button class="btn pri" id="eSave">${T("Add card","添加卡片")} <span class="k">${MOD}↩</span></button><button class="btn" id="eCancel">${T("Done","完成")} <span class="k">Esc</span></button><span class="small muted">${E.added?T(`${E.added} added`,`已添加 ${E.added} 张`):T("The editor stays open so you can add the next card.","添加后编辑器保持打开，方便继续添加。")}</span>`}</div></div>`;
