<title>Pomodoro Timer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script type="application/json" id="claude-artifacts-manifest">{"permissions":["menu-bar","notifications","shortcuts"]}</script>
<style>
/* Layout: one compact window. Mode tabs on top, a big countdown ring in the middle, controls below. */
:root{
  --bg:#fbf7f4; --fg:#2a1f1a; --muted:#8a7a72; --line:#ecdfd7; --chip:#f2e7e0;
  --focus:#e2513a; --short:#2f9e74; --long:#3b6fd4; --accent:var(--focus);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --num:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1817;--fg:#f6ece6;--muted:#a3938b;--line:#382e2a;--chip:#2b2321;--focus:#ff6a52;--short:#46c393;--long:#6d97ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1817;--fg:#f6ece6;--muted:#a3938b;--line:#382e2a;--chip:#2b2321;--focus:#ff6a52;--short:#46c393;--long:#6d97ff;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--font);-webkit-user-select:none;user-select:none}
.drag{height:30px;app-region:drag;-webkit-app-region:drag}
.wrap{min-height:calc(100% - 30px);display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:4px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{display:flex;gap:4px;background:var(--chip);padding:3px;border-radius:9px}
.tabs button{font:600 12.5px/1 var(--font);border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:7px;cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ring{position:relative;width:min(260px,72vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .track{stroke:var(--line)}
.ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .3s linear,stroke .3s}
.time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.time b{font:600 clamp(44px,15vw,64px)/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.time span{color:var(--muted);font-size:13px}
.ctrl{display:flex;gap:10px;align-items:center}
.btn{font:600 14px/1 var(--font);border:0;border-radius:999px;padding:12px 26px;cursor:pointer;background:var(--accent);color:#fff;min-width:120px}
.btn.ghost{background:var(--chip);color:var(--fg);min-width:0;padding:12px 16px}
.dots{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--focus)}
.plan{width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px}
.plan textarea{font:inherit;width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--fg);-webkit-user-select:text;user-select:text}
.plan .bar2{display:flex;gap:8px;align-items:center;justify-content:space-between}
.plan .small{font:600 12.5px/1 var(--font);border:0;border-radius:999px;padding:8px 12px;cursor:pointer;background:var(--chip);color:var(--fg)}
.plan .small.pri{background:var(--accent);color:#fff}
.plan .st{font-size:12px;color:var(--muted)}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tasks li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px}
.tasks li.cur{background:var(--chip)}
.tasks li.done span{text-decoration:line-through;color:var(--muted)}
.tasks li span{flex:1;min-width:0}
.tasks li small{color:var(--muted);font-variant-numeric:tabular-nums}
details{width:100%;max-width:300px;color:var(--muted);font-size:12.5px}
summary{cursor:pointer;text-align:center;list-style:none}
summary::-webkit-details-marker{display:none}
.set{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;margin-top:12px}
.set input[type=number]{width:64px;font:inherit;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);text-align:right}
.set label{color:var(--fg)}
.hint{font-size:12px;color:var(--muted);text-align:center;max-width:300px}
.install{font:600 12.5px/1 var(--font);border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ring .bar{transition:none}}
</style>

<div class="drag"></div>
<div class="wrap">
  <div class="tabs" role="tablist">
    <button id="m-focus" data-mode="focus" class="on">Focus</button>
    <button id="m-short" data-mode="short">Short break</button>
    <button id="m-long" data-mode="long">Long break</button>
  </div>
  <div class="ring">
    <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="44"/><circle class="bar" id="bar" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg>
    <div class="time"><b id="t">25:00</b><span id="lbl">Ready to focus</span></div>
  </div>
  <div class="ctrl">
    <button class="btn ghost" id="reset" title="Reset">Reset</button>
    <button class="btn" id="go">Start</button>
    <button class="btn ghost" id="skip" title="Skip to next">Skip</button>
  </div>
  <div class="dots" id="dots" aria-label="Sessions today"></div>
  <section class="plan" id="plan" hidden>
    <div id="dump"><textarea id="brain" placeholder="What do you want to get done today? Dump it all here, messy is fine." aria-label="What to get done"></textarea>
      <div class="bar2"><span class="st" id="pst">Claude turns it into focus sessions.</span><button class="small pri" id="mk">✦ Plan my sessions</button></div></div>
    <div id="tl" hidden><ul class="tasks" id="tasks"></ul>
      <div class="bar2"><span class="st" id="tst"></span><button class="small" id="clear">New plan</button></div></div>
  </section>
  <details>
    <summary>Settings</summary>
    <div class="set">
      <label for="d-focus">Focus (minutes)</label><input id="d-focus" type="number" min="1" max="120">
      <label for="d-short">Short break</label><input id="d-short" type="number" min="1" max="60">
      <label for="d-long">Long break</label><input id="d-long" type="number" min="1" max="60">
      <label for="auto">Start next session automatically</label><input id="auto" type="checkbox">
    </div>
  </details>
  <p class="hint" id="hint"></p>
</div>

<script>
/*I18N_RUNTIME*/
/* Chinese UI for Claude AppStore apps. When the viewer's language is Chinese, UI text nodes and
   placeholder/title/aria-label attributes whose text is in DICT are swapped for Chinese, including
   UI added later (menus, toasts, dialogs). User content is never touched: anything inside SKIP. */
(()=>{
  let ZH=/^zh/i.test(navigator.language||"");
  try{const o=localStorage.getItem("appstore.lang");if(o==="en")ZH=false;else if(o==="zh")ZH=true}catch{}
  window.__ZH=ZH; window.__t=(en,zh)=>ZH?zh:en;
  if(!ZH)return;
  const DICT={"Pomodoro Timer": "番茄钟", "Focus": "专注", "Short break": "短休息", "Long break": "长休息", "Ready to focus": "准备专注", "Focusing": "专注中", "On a break": "休息中", "Paused": "已暂停", "Time for a break": "该休息了", "Reset": "重置", "Start": "开始", "Pause": "暂停", "Resume": "继续", "Skip": "跳过", "Skip to next": "跳到下一段", "Sessions today": "今日完成数", "What do you want to get done today? Dump it all here, messy is fine.": "今天想完成什么？都写在这里，乱一点也没关系。", "What to get done": "要完成的事", "Claude turns it into focus sessions.": "Claude 会把它拆成一个个专注时段。", "✦ Plan my sessions": "✦ 帮我排时段", "New plan": "新计划", "Done": "已完成", "All done. Nice work.": "全部完成，干得漂亮。", "Write what you want to get done first.": "先写下你想完成的事。", "Thinking…": "思考中…", "Claude is busy or you hit your usage limit. Try later.": "Claude 正忙，或你已达到用量上限，请稍后再试。", "Claude isn't allowed for this app.": "此应用未获准使用 Claude。", "Claude declined this one. Try rewording.": "Claude 拒绝了这次请求，换个说法试试。", "Couldn't make a plan. Try again.": "没能生成计划，请重试。", "Settings": "设置", "Focus (minutes)": "专注（分钟）", "Start next session automatically": "自动开始下一段", "Press Option+Shift+P anywhere to start or pause. The countdown shows in your menu bar.": "在任何地方按 Option+Shift+P 开始或暂停，倒计时会显示在菜单栏。", "Start a session to turn on the menu bar timer and notifications.": "开始一个时段即可开启菜单栏计时和通知。", "Open this in Claude for Mac or Windows to install it as an app with a menu bar timer.": "在 Mac 或 Windows 版 Claude 中打开，即可安装为带菜单栏计时的应用。", "Install as app": "安装为应用", "Installed. Open Pomodoro Timer from your Applications or Start menu.": "已安装。请从“应用程序”或“开始”菜单打开番茄钟。"};
  const PATTERNS=([["(\\d+) today", "今天完成 $1 个"], ["(\\d+) sessions? left, about ([\\d.]+) h", "还剩 $1 个时段，约 $2 小时"]]).map(([re,rep])=>[new RegExp("^"+re+"$"),rep]);
  const SKIP='script,style,textarea,input,code,pre,[contenteditable]:not([contenteditable="false"]),[data-no-i18n]'+(",.tasks li span");
  const ATTRS=["placeholder","title","aria-label","data-tip","data-ph","alt"];
  const norm=s=>s.replace(/\s+/g," ").trim();
  function tr(s){
    const k=norm(s); if(!k||!/[A-Za-z]/.test(k)) return null;
    let v=DICT[k];
    if(v==null){for(const [re,rep] of PATTERNS){if(re.test(k)){v=k.replace(re,rep);break}}}
    if(v==null||v===k) return null;
    const lead=s.match(/^\s*/)[0], tail=s.match(/\s*$/)[0];
    return lead+v+tail;
  }
  window.__tr=s=>tr(String(s))??s;
  const skipped=el=>{try{return !!(el&&el.closest&&el.closest(SKIP))}catch{return false}};
  function doText(n){const p=n.parentElement;if(!p||skipped(p))return;const v=tr(n.nodeValue);if(v!=null)n.nodeValue=v}
  function doAttrs(el){if(el.nodeType!==1)return;for(const a of ATTRS){const x=el.getAttribute(a);if(!x)continue;if(a==="data-ph"||a==="alt"){if(skipped(el.parentElement))continue}const v=tr(x);if(v!=null)el.setAttribute(a,v)}}
  function walk(root){
    if(root.nodeType===3){doText(root);return}
    if(root.nodeType!==1&&root.nodeType!==11)return;
    if(root.nodeType===1){doAttrs(root);if(skipped(root))return}
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode(n){
      if(n.nodeType===1){doAttrs(n);return skipped(n)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_SKIP}
      return NodeFilter.FILTER_ACCEPT}});
    let n;while((n=w.nextNode()))doText(n);
  }
  const mo=new MutationObserver(ms=>{for(const m of ms){
    if(m.type==="childList")m.addedNodes.forEach(walk);
    else if(m.type==="characterData")doText(m.target);
    else if(m.type==="attributes")doAttrs(m.target);
  }});
  const start=()=>{document.documentElement.lang="zh-CN";const t=tr(document.title||"");if(t)document.title=t;walk(document.body);
    mo.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:ATTRS})};
  if(document.body)start();else document.addEventListener("DOMContentLoaded",start);
  const _a=window.alert,_c=window.confirm,_p=window.prompt;
  window.alert=m=>_a.call(window,tr(String(m))??m);window.confirm=m=>_c.call(window,tr(String(m))??m);window.prompt=(m,d)=>_p.call(window,tr(String(m))??m,d);
})();
/*END_I18N_RUNTIME*/

<script>


const $=id=>document.getElementById(id);
const T=window.__t;
const NAMES={focus:T("Focus","专注"),short:T("Short break","短休息"),long:T("Long break","长休息")};
const store={get(k,d){try{const v=localStorage.getItem("focus."+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem("focus."+k,JSON.stringify(v))}catch{}}};
const today=()=>new Date().toISOString().slice(0,10);
let S={
  dur:store.get("dur",{focus:25,short:5,long:15}),
  auto:store.get("auto",false),
  mode:"focus", running:false, endAt:0, left:0,
  done:(store.get("day","")===today())?store.get("done",0):0
};
S.left=S.dur[S.mode]*60;
let desktop=null, perms={}, lastTitle="";

function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function remaining(){return S.running?(S.endAt-Date.now())/1000:S.left}
function paint(){
  const r=remaining(), total=S.dur[S.mode]*60;
  document.documentElement.style.setProperty("--accent",`var(--${S.mode})`);
  $("t").textContent=fmt(r);
  $("bar").style.strokeDashoffset=(276.46*(1-Math.max(0,r)/total)).toFixed(2);
  const ct=curTask();
  $("lbl").toggleAttribute("data-no-i18n",!!(S.mode==="focus"&&ct));
  $("lbl").textContent=S.mode==="focus"&&ct?ct.task:(S.running?(S.mode==="focus"?"Focusing":"On a break"):(r<total?"Paused":S.mode==="focus"?"Ready to focus":"Time for a break"));
  $("go").textContent=S.running?"Pause":(r<total?"Resume":"Start");
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.mode===S.mode));
  const n=Math.max(4,S.done);
  $("dots").innerHTML=Array.from({length:Math.min(n,12)},(_,i)=>`<i class="${i<S.done?"on":""}"></i>`).join("")+`<span>${S.done} today</span>`;
  document.title=S.running?`${fmt(r)} · ${T("Pomodoro Timer","番茄钟")}`:T("Pomodoro Timer","番茄钟");
  syncDesktop(r);
}
function syncDesktop(r){
  if(!desktop?.tray) return;
  const title=S.running?fmt(r):"";
  if(title===lastTitle) return;
  lastTitle=title;
  desktop.app.dock.setBadge(title).catch(()=>{});
  setTray();
}
function setTray(){
  if(!desktop?.tray||perms["menu-bar"]!=="granted") return;
  const r=remaining(), total=S.dur[S.mode]*60;
  desktop.tray.set({
    icon:trayIcon(), title:S.running?fmt(r):"",
    toolTip:(S.running?T(`${NAMES[S.mode]}: ${fmt(r)} left`,`${NAMES[S.mode]}：剩余 ${fmt(r)}`):T(`${S.done} sessions today`,`今天已完成 ${S.done} 个`))+(curTask()?` · ${curTask().task}`:""),
    menu:[
      {label:S.running?T("Pause","暂停"):(r<total?T("Resume","继续"):T("Start ","开始")+NAMES[S.mode]),click:toggle},
      {label:T("Reset","重置"),click:reset,enabled:r<total},
      {label:T("Skip to next","跳到下一段"),click:skip},
      {type:"separator"},
      {label:T("Show Pomodoro Timer","显示番茄钟"),click:()=>desktop.window.show().catch(()=>{})}
    ]
  }).catch(()=>{});
}
function save(){store.set("dur",S.dur);store.set("auto",S.auto);store.set("done",S.done);store.set("day",today())}
async function toggle(){
  if(S.running){S.left=remaining();S.running=false;}
  else{await ensurePerms();S.endAt=Date.now()+S.left*1000;S.running=true;}
  paint();
}
function reset(){S.running=false;S.left=S.dur[S.mode]*60;paint();}
function setMode(m,start=false){S.mode=m;S.running=false;S.left=S.dur[m]*60;if(start){S.endAt=Date.now()+S.left*1000;S.running=true;}paint();}
function nextMode(){return S.mode!=="focus"?"focus":(S.done%4===0?"long":"short")}
function skip(){setMode(nextMode(),false)}
function finish(){
  const was=S.mode;
  const finishedTask=was==="focus"?curTask():null;
  if(was==="focus"){S.done++;save();if(finishedTask){finishedTask.spent=(finishedTask.spent||0)+1;if(finishedTask.spent>=finishedTask.sessions)finishedTask.done=true;saveTasks();renderTasks();}}
  chime();
  const next=nextMode();
  const msg=was==="focus"?T(`Focus session done${finishedTask?` on "${finishedTask.task.slice(0,80)}"`:""}. ${S.done} today. Time for a ${next==="long"?"long":"short"} break.`,`${finishedTask?`“${finishedTask.task.slice(0,80)}”的`:""}专注时段完成。今天已完成 ${S.done} 个，该${next==="long"?"长":"短"}休息了。`):T("Break's over. Ready for the next focus session?","休息结束。准备好开始下一个专注时段了吗？");
  notify(msg);
  setMode(next,S.auto);
}
function notify(body){
  if(desktop?.notification&&perms.notifications==="granted") desktop.notification.show({body}).catch(()=>{});
  else if("Notification" in window&&Notification.permission==="granted"){try{new Notification(T("Pomodoro Timer","番茄钟"),{body})}catch{}}
}
let ac=null;
function chime(){
  try{ac=ac||new AudioContext();const t=ac.currentTime;[0,0.18,0.36].forEach((d,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=[784,988,1175][i];g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.18,t+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.5);o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+0.55);});}catch{}
}
setInterval(()=>{if(S.running&&remaining()<=0){finish();}else if(S.running)paint();},250);

// AI planning
let tasks=store.get("tasks",[]);
const saveTasks=()=>store.set("tasks",tasks);
function curTask(){return tasks.find(t=>!t.done)}
function renderTasks(){
  $("dump").hidden=!!tasks.length;$("tl").hidden=!tasks.length;
  const c=curTask();
  $("tasks").innerHTML=tasks.map((t,i)=>`<li class="${t.done?"done":""} ${t===c?"cur":""}"><input type="checkbox" id="tk${i}" data-t="${i}" ${t.done?"checked":""} aria-label="Done"><span></span><small>${t.spent||0}/${t.sessions}</small></li>`).join("");
  [...$("tasks").querySelectorAll("li span")].forEach((el,i)=>el.textContent=tasks[i].task);
  const left=tasks.filter(t=>!t.done).reduce((a,t)=>a+Math.max(0,t.sessions-(t.spent||0)),0);
  $("tst").textContent=left?`${left} session${left===1?"":"s"} left, about ${Math.round(left*(S.dur.focus+S.dur.short)/6)/10} h`:"All done. Nice work.";
}
$("tasks").addEventListener("change",e=>{const i=e.target.dataset.t;if(i==null)return;tasks[+i].done=e.target.checked;saveTasks();renderTasks();paint();});
$("clear").onclick=()=>{tasks=[];saveTasks();renderTasks();paint();$("brain").focus();};
let sample=null;
$("mk").onclick=async()=>{
  const dump=$("brain").value.trim();
  if(!dump){$("pst").textContent="Write what you want to get done first.";return;}
  $("mk").disabled=true;$("pst").textContent="Thinking…";
  try{
    const out=await sample.json(`You plan pomodoro work. A focus session is ${S.dur.focus} minutes. Turn the person's notes into an ordered list of concrete tasks, most important or most blocking first, each with how many focus sessions it needs (1 to 4). Split vague items into doable steps, drop duplicates, keep the person's language${window.__ZH?" (Simplified Chinese if unclear)":""}, keep each task under 60 characters. Reply with only a JSON array like [{"task":"${window.__ZH?"写报告开头":"Draft the intro"}","sessions":2}].\n\nNotes:\n${dump.slice(0,8000)}`,{modelTier:"default",cache:false});
    const list=(Array.isArray(out)?out:[]).filter(t=>t&&t.task).slice(0,12).map(t=>({task:String(t.task).slice(0,80),sessions:Math.min(4,Math.max(1,Math.round(+t.sessions||1))),spent:0,done:false}));
    if(!list.length) throw {code:"empty_completion"};
    tasks=list;saveTasks();renderTasks();paint();$("pst").textContent="Claude turns it into focus sessions.";
  }catch(e){
    $("pst").textContent={rate_limited:"Claude is busy or you hit your usage limit. Try later.",not_granted:"Claude isn't allowed for this app.",refused:"Claude declined this one. Try rewording."}[e?.code]||"Couldn't make a plan. Try again.";
    if(e?.code==="not_granted"||e?.code==="sampling_disabled") $("plan").hidden=true;
  }finally{$("mk").disabled=false;}
};
renderTasks();
(async()=>{sample=window.claude?.use?await window.claude.use("sample").catch(()=>null):null;$("plan").hidden=!sample&&!tasks.length;if(!sample)$("dump").hidden=true;})();

// icons
/*DOCK_ART*/
const DOCK_SVG="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\"><defs><linearGradient id=\"pomodoro-bg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FFF3E6\"/><stop offset=\"1\" stop-color=\"#FFD3B8\"/><\/linearGradient><radialGradient id=\"pomodoro-sh\" cx=\".28\" cy=\".05\" r=\".9\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\"0.5\"/><stop offset=\".6\" stop-color=\"#fff\" stop-opacity=\"0\"/><\/radialGradient><filter id=\"pomodoro-ds\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"150%\"><feDropShadow dx=\"0\" dy=\"22\" stdDeviation=\"26\" flood-color=\"#000\" flood-opacity=\".28\"/><\/filter><filter id=\"pomodoro-ds2\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"150%\"><feDropShadow dx=\"0\" dy=\"10\" stdDeviation=\"12\" flood-color=\"#000\" flood-opacity=\".22\"/><\/filter><radialGradient id=\"pomodoro-tom\" cx=\".38\" cy=\".3\" r=\".8\"><stop offset=\"0\" stop-color=\"#FF7A5C\"/><stop offset=\"1\" stop-color=\"#D9271C\"/><\/radialGradient><\/defs><rect width=\"1024\" height=\"1024\" rx=\"230\" fill=\"url(#pomodoro-bg)\"/><rect width=\"1024\" height=\"1024\" rx=\"230\" fill=\"url(#pomodoro-sh)\"/><g filter=\"url(#pomodoro-ds)\"><ellipse cx=\"512\" cy=\"580\" rx=\"310\" ry=\"275\" fill=\"url(#pomodoro-tom)\"/><ellipse cx=\"400\" cy=\"450\" rx=\"90\" ry=\"44\" fill=\"#fff\" opacity=\".35\" transform=\"rotate(-28 400 450)\"/><path d=\"M512 318c-40-40-110-40-150-10 50 0 80 20 96 40-60 0-110 30-130 70 60-26 110-30 150-18 10 40 60 50 64 50s54-10 64-50c40-12 90-8 150 18-20-40-70-70-130-70 16-20 46-40 96-40-40-30-110-30-150 10z\" fill=\"#2FA84F\"/><path d=\"M512 330c0-50 10-90 40-120\" fill=\"none\" stroke=\"#1F7A38\" stroke-width=\"24\" stroke-linecap=\"round\"/><text x=\"512\" y=\"700\" text-anchor=\"middle\" font-family=\"-apple-system,'SF Pro Rounded',Helvetica,Arial\" font-weight=\"800\" font-size=\"210\" fill=\"#fff\" letter-spacing=\"-6\">25<\/text><\/g><rect x=\"3\" y=\"3\" width=\"1018\" height=\"1018\" rx=\"228\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".14\" stroke-width=\"6\"/><\/svg>";
function dockIconArt(){return new Promise(res=>{const img=new Image();img.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");x.shadowColor="rgba(0,0,0,.3)";x.shadowBlur=20;x.shadowOffsetY=8;x.drawImage(img,50,44,412,412);res(c.toDataURL("image/png"))}catch{res(dockIcon())}};img.onerror=()=>res(dockIcon());img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(DOCK_SVG)})}
/*END_DOCK_ART*/
function dockIcon(){
  const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,"#ff7a5c");g.addColorStop(1,"#d63a2a");
  x.fillStyle=g;x.beginPath();x.roundRect(8,8,240,240,54);x.fill();
  x.strokeStyle="rgba(255,255,255,.35)";x.lineWidth=18;x.beginPath();x.arc(128,136,72,0,Math.PI*2);x.stroke();
  x.strokeStyle="#fff";x.lineCap="round";x.beginPath();x.arc(128,136,72,-Math.PI/2,Math.PI*0.9);x.stroke();
  x.fillStyle="#fff";x.beginPath();x.roundRect(110,40,36,22,8);x.fill();
  x.lineWidth=12;x.beginPath();x.moveTo(128,136);x.lineTo(128,92);x.stroke();
  return c.toDataURL("image/png");
}
let trayCache=null;
function trayIcon(){
  if(trayCache) return trayCache;
  const c=document.createElement("canvas");c.width=c.height=36;const x=c.getContext("2d");
  x.strokeStyle="#000";x.lineWidth=3.4;x.beginPath();x.arc(18,20,12,0,Math.PI*2);x.stroke();
  x.fillStyle="#000";x.fillRect(14,3,8,4);x.lineCap="round";x.beginPath();x.moveTo(18,20);x.lineTo(18,13);x.stroke();
  return trayCache=c.toDataURL("image/png");
}
async function ensurePerms(){
  if(desktop?.permissions&&desktop.tray){
    try{perms=await desktop.permissions.request(["menu-bar","notifications","shortcuts"]);}catch{}
    setupDesktopFeatures();
  }else if("Notification" in window&&Notification.permission==="default"){try{await Notification.requestPermission()}catch{}}
}
let shortcutSet=false;
function setupDesktopFeatures(){
  lastTitle=null;setTray();
  if(!shortcutSet&&perms.shortcuts==="granted"){shortcutSet=true;desktop.globalShortcut.register("Alt+Shift+P",toggle).catch(()=>{shortcutSet=false});}
  hint();
}
function hint(){
  const h=$("hint");
  if(desktop?.tray) h.textContent=perms.shortcuts==="granted"?"Press Option+Shift+P anywhere to start or pause. The countdown shows in your menu bar.":"Start a session to turn on the menu bar timer and notifications.";
}

// wire up
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$("go").onclick=toggle;$("reset").onclick=reset;$("skip").onclick=skip;
["focus","short","long"].forEach(k=>{const i=$("d-"+k);i.value=S.dur[k];i.onchange=()=>{const v=Math.min(+i.max,Math.max(1,Math.round(+i.value||S.dur[k])));i.value=v;S.dur[k]=v;save();if(!S.running&&S.mode===k){S.left=v*60;}paint();};});
$("auto").checked=S.auto;$("auto").onchange=e=>{S.auto=e.target.checked;save();};
document.addEventListener("keydown",e=>{if(e.code==="Space"&&e.target.tagName!=="INPUT"&&e.target.tagName!=="BUTTON"){e.preventDefault();toggle();}});
paint();

(async()=>{
  desktop=window.claude?.use?await window.claude.use("desktop").catch(()=>null):null;
  if(!desktop) {$("hint").textContent="Open this in Claude for Mac or Windows to install it as an app with a menu bar timer.";return;}
  if(!desktop.tray){
    const st=await desktop.install.state().catch(()=>"unavailable");
    if(st==="available"){const b=document.createElement("button");b.className="install";b.textContent="Install as app";b.onclick=()=>desktop.install.request().catch(()=>{});$("hint").replaceChildren(b);}
    else $("hint").textContent=st==="installed"?"Installed. Open Pomodoro Timer from your Applications or Start menu.":"Open this in Claude for Mac or Windows to install it as an app with a menu bar timer.";
    return;
  }
  dockIconArt().then(u=>desktop.app.dock.setIcon(u)).catch(()=>{});
  desktop.window.setOptions({titleBarStyle:"hiddenInset",dragHeight:30,width:380,height:560,minWidth:320,minHeight:500}).catch(()=>{});
  try{perms=await desktop.permissions.state();}catch{}
  setupDesktopFeatures();paint();
})();
</script>
<script>
/*INSTALL_PROMPT*/
/* When this artifact is open in Claude Desktop but not installed as an app yet, invite the person
   to install it. Shows once per session; the install itself is Claude's own dialog, started from
   the person's click (install.request() needs a click). Silent in browsers, on mobile and inside the
   installed app. */
(async()=>{
  if(!window.claude||!claude.use)return;
  try{if(sessionStorage.getItem("appstore.installAsked"))return}catch{}
  const d=await claude.use("desktop").catch(()=>null);
  if(!d||d.fs||!d.install)return;                       // d.fs exists only inside the installed app
  const st=await d.install.state().catch(()=>"unavailable");
  if(st!=="available")return;
  await new Promise(r=>setTimeout(r,900));
  if(document.querySelector(".aspi"))return;
  const zh=window.__ZH??/^zh/i.test(navigator.language||"");
  const T=(en,c)=>zh?c:en;
  const name=(document.title||"").trim()||T("this app","这个 app");
  const icon=typeof DOCK_SVG==="string"?DOCK_SVG:(typeof ICON_SVG==="object"&&ICON_SVG.store)||"";
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const st2=document.createElement("style");
  st2.textContent=`.aspi{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:rgba(20,20,19,.42);padding:16px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.aspi .b{--bg:#FAF9F5;--fg:#141413;--mu:#6B6A64;--pill:#EDE6DA;--ac:#B9532F;--on:#fff;background:var(--bg);color:var(--fg);border-radius:18px;max-width:380px;width:100%;padding:24px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
@media (prefers-color-scheme:dark){.aspi .b{--bg:#262624;--fg:#FAF9F5;--mu:#A6A39A;--pill:#3A3632;--ac:#E08A6A;--on:#1F1E1D}}
.aspi .ic{width:72px;height:72px}.aspi .ic svg{width:72px;height:72px;display:block}
.aspi h3{margin:2px 0 0;font-size:18px;font-weight:700;line-height:1.25}
.aspi p{margin:0;color:var(--mu)}
.aspi .row{display:flex;flex-direction:column;gap:8px;align-self:stretch;margin-top:6px}
.aspi button{font-family:inherit;font-weight:600;font-size:15px;line-height:1;border:0;border-radius:999px;padding:12px 16px;cursor:pointer}
.aspi .y{background:var(--ac);color:var(--on)}.aspi .n{background:var(--pill);color:var(--fg)}`;
  const m=document.createElement("div");m.className="aspi";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("data-no-i18n","");
  m.innerHTML=`<div class="b"><div class="ic">${icon}</div>
    <h3>${esc(T(`Install ${name} as an app?`,`把「${name}」安装为 app？`))}</h3>
    <p>${esc(T("It gets its own window and Dock icon, opens like any other app, and keeps working on your Claude plan.","装好后有自己的窗口和 Dock 图标，像普通 app 一样打开，继续用你的 Claude 套餐。"))}</p>
    <div class="row"><button class="y">${esc(T("Install","安装"))}</button><button class="n">${esc(T("Not now","以后再说"))}</button></div></div>`;
  const close=()=>{m.remove();st2.remove();try{sessionStorage.setItem("appstore.installAsked","1")}catch{}};
  m.addEventListener("click",async e=>{
    if(e.target===m||e.target.closest(".n"))return close();
    if(e.target.closest(".y")){const r=await d.install.request().catch(()=>"failed");close();
      if(r==="failed"||r==="unavailable"){const n=document.createElement("div");n.textContent=T("Couldn't install. Use Install as app in the artifact's menu.","没装上。可以在工件菜单里选“安装为 app”。");n.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141413;color:#fff;padding:10px 14px;border-radius:10px;z-index:2147483000;font:13px system-ui";document.body.appendChild(n);setTimeout(()=>n.remove(),5000)}}
  });
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"&&m.isConnected){close();document.removeEventListener("keydown",k)}});
  document.head?document.head.appendChild(st2):document.body.appendChild(st2);document.body.appendChild(m);
  m.querySelector(".y").focus();
})();
/*END_INSTALL_PROMPT*/
</script>
