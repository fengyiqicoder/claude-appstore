<title>Claude AppStore</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A community catalog of Claude artifacts you can install as Mac and Windows apps.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: Mac store window. Fixed sidebar (nav + search) on the left, scrolling content on the right; on phones the sidebar becomes a top tab strip. */
:root{
  --bg:#FAF9F5; --side:#F0EEE6; --fg:#141413; --muted:#6B6A64; --line:#E3DFD3;
  --accent:#B9532F; --on-accent:#fff; --pill:#EDE6DA; --hover:#E8E3D7; --card:#F4F1EA;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --display:"Source Serif 4","Iowan Old Style","Charter",Georgia,"Songti SC","Noto Serif SC",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#262624; --side:#1F1E1D; --fg:#FAF9F5; --muted:#A6A39A; --line:#3A3935;
  --accent:#E08A6A; --on-accent:#1F1E1D; --pill:#3A3632; --hover:#34322F; --card:#2E2D2A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624; --side:#1F1E1D; --fg:#FAF9F5; --muted:#A6A39A; --line:#3A3935;
  --accent:#E08A6A; --on-accent:#1F1E1D; --pill:#3A3632; --hover:#34322F; --card:#2E2D2A; color-scheme:dark}
*{box-sizing:border-box}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);margin:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;font:500 17px/1 var(--display);letter-spacing:-.01em;padding:0 6px}
.brand svg,.brandic{flex:none}.brandic{width:24px;height:24px;display:inline-block}.brandic svg{width:24px;height:24px;display:block}
.search{position:relative}
.search input{width:100%;font:inherit;padding:6px 10px 6px 28px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted)}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:7px;color:var(--fg);font-size:14px}
nav a:hover{background:var(--hover);text-decoration:none}
nav a.on{background:var(--hover);font-weight:600}
nav a svg{color:var(--accent);flex:none}
.inst{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px 11px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--fg);text-decoration:none!important;cursor:pointer}
.inst:hover{border-color:var(--muted)}
.inst.done{cursor:default}.inst.done:hover{border-color:var(--line)}
.instic{width:38px;height:38px;flex:none}.instic svg{width:38px;height:38px;display:block}
.insttx{min-width:0}.insttx b{display:block;font-weight:600;font-size:13px;line-height:1.25}.insttx small{display:block;color:var(--muted);font-size:12px;line-height:1.3;margin-top:2px}
.inst:not([hidden])+.foot{margin-top:0}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px;display:flex;flex-direction:column;gap:6px}
main{overflow-y:auto;padding-block:28px 48px;padding-left:max(16px,4vw);padding-right:max(16px,env(safe-area-inset-right,0px),4vw)}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:34px}
h1{font:500 32px/1.12 var(--display);margin:0;letter-spacing:-.015em}
h2{font:500 22px/1.2 var(--display);margin:0;letter-spacing:-.01em}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.sec-head a{font-size:13px}
.lede{color:var(--muted);margin:6px 0 0;max-width:62ch}
/* featured */
.hero{display:flex;flex-direction:column;gap:14px;padding-block:8px 4px}
.hero h1{font:400 clamp(40px,7vw,72px)/1.02 var(--display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:clamp(15px,1.8vw,18px);color:var(--muted);margin:0;max-width:56ch}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero .cta{font:600 15px/1 var(--font);border-radius:999px;padding:13px 20px;text-decoration:none!important;display:inline-block}
.hero .cta.pri{background:var(--accent);color:var(--on-accent)}
.hero .cta.sec{background:var(--pill);color:var(--fg)}
.item .meta span.ai{display:inline-block;color:var(--accent);font-size:10.5px;margin-left:4px}
.swaps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.swap{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;min-width:0}
.swap:hover{border-color:var(--muted)}
.swap .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.swap .meta b{font-weight:600}
.swap .meta span{font-size:12.5px;color:var(--muted)}
.swap .was s{color:var(--fg);text-decoration-color:var(--accent);text-decoration-thickness:2px}
@media (max-width:720px){.swaps{grid-template-columns:1fr}}
.instead{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.instead s{color:var(--fg);text-decoration-color:var(--accent);text-decoration-thickness:2px;background:var(--pill);border-radius:6px;padding:3px 8px}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.fcard{border-radius:14px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:250px;padding:20px;position:relative;cursor:pointer;text-decoration:none!important}
.fcard .eyebrow{font:700 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.fcard h3{font:500 27px/1.1 var(--display);margin:8px 0 0;text-wrap:balance;max-width:16ch}
.fcard p{margin:6px 0 0;opacity:.9;max-width:40ch}
.fcard .row{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.22);backdrop-filter:blur(8px);border-radius:12px;padding:10px 12px}
.fcard .row .meta{flex:1;min-width:0}
.fcard .row b{display:block;font-size:14px}
.fcard .row span{font-size:12px;opacity:.85}
.fcard .get{background:rgba(255,255,255,.25);color:#fff}
.fcard canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.fcard > *:not(canvas){position:relative;z-index:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:26px 10px}
.tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:14px 6px 12px;border-radius:16px;cursor:pointer;min-width:0}
.tile:hover{background:var(--card)}
.tile .icon{margin-bottom:10px}
.tile b{font-weight:600;font-size:14px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile>span:not(.get){font-size:12px;color:var(--muted)}
.tile>span.pw{font-size:11px;color:var(--accent);opacity:.9}
.item.alt .meta b{white-space:normal;line-height:1.25}
.tile .get{margin-top:9px;padding:6px 14px;font-size:12px}
.tile.soon .icon{opacity:.55;filter:saturate(.7)}
@media (max-width:720px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 4px}.tile .icon{width:64px!important;height:64px!important}}
/* app rows */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 26px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.item .meta{flex:1;min-width:0;cursor:pointer}
.item .meta b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta span{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{flex:none;position:relative;overflow:hidden;border-radius:22.5%;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.12),0 6px 14px -6px rgba(0,0,0,.35)}
.icon::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 90% at 28% 0%,rgba(255,255,255,.28),rgba(255,255,255,0) 60%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);pointer-events:none}
.icon svg{width:56%;height:56%;position:relative;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.icon.art{background:none!important}.icon.art::after{display:none}.icon.art svg{width:100%;height:100%;filter:none}
.get{flex:none;font:700 13px/1 var(--font);letter-spacing:.02em;text-transform:uppercase;background:var(--pill);color:var(--accent);border-radius:999px;padding:7px 16px;border:0;cursor:pointer;text-decoration:none!important;display:inline-block}
.get:hover{filter:brightness(.96)}
.get.view{text-transform:none;font-weight:600}
.get.soon{text-transform:none;font-weight:600;color:var(--muted);cursor:default;white-space:nowrap}.get.soon:hover{filter:none}
.fcard .get.soon{color:#fff}
.ai{display:inline-block;font:700 10.5px/1 var(--font);letter-spacing:.02em;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:5px;padding:3px 5px;vertical-align:1px;white-space:nowrap}
.empty{color:var(--muted);padding:20px 0}
/* detail */
.back{font-size:13px;display:inline-flex;gap:4px;align-items:center}
.dhead{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.dhead .meta{flex:1;min-width:220px}
.dhead h1{font-size:32px}
.dhead p{margin:4px 0 12px;color:var(--muted);font-size:16px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));border-block:1px solid var(--line);padding-block:12px}
.facts div{padding:0 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;min-width:0}
.facts div:first-child{border-left:0}
.facts small{font:600 10.5px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts b{font:600 15px/1.2 var(--font);overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.prose{max-width:66ch;font-size:15px;line-height:1.55;margin:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:66ch}
.note{background:var(--card);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--muted);max-width:66ch}
/* reading list */
.list{display:flex;flex-direction:column}
.list a.li{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}
.list a.li b{color:var(--accent);font-weight:600}
.list a.li span{color:var(--muted);font-size:13px}
@media (max-width:1180px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{min-width:0}
  .side{border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px));gap:10px;overflow:visible}
  nav{flex-direction:row;overflow-x:auto;gap:4px}
  nav a{white-space:nowrap}
  .side .foot,.inst{display:none!important}
  .feat,.grid{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:12px}
  .facts div:nth-child(3){border-left:0}
  h1{font-size:26px}
}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(20,20,19,.45);padding:16px}
.modal .box{background:var(--bg);color:var(--fg);border-radius:18px;max-width:420px;width:100%;padding:26px 24px 20px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px;text-align:center;align-items:center}
.modal .box .mic{width:64px;height:64px}.modal .box .mic svg{width:64px;height:64px;display:block}
.modal h3{font:500 21px/1.25 var(--display);margin:4px 0 0}
.modal p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.modal ol{margin:0;padding-left:20px;text-align:left;font-size:14px;line-height:1.6;align-self:stretch}
.modal .acts{display:flex;flex-direction:column;gap:8px;align-self:stretch;margin-top:6px}
.modal .btn{font:600 15px/1 var(--font);border-radius:999px;padding:12px 18px;border:0;cursor:pointer;text-decoration:none!important;display:block}
.modal .btn.pri{background:var(--accent);color:var(--on-accent)}
.modal .btn.sec{background:var(--pill);color:var(--fg)}
.modal .lnk{font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    <div class="brand"><span class="brandic" aria-hidden="true"></span>Claude AppStore</div>

</div>

    <ol><li>${t("Download and open Claude, then sign in.","下载并打开 Claude，登录账号。")}</li><li>${t("Come back and click Get again. It opens right in Claude.","回到这里再点一次获取，会直接在 Claude 里打开。")}</li><li>${t("Choose <b>Install as app</b>. Install Claude AppStore the same way to get apps in one click.","选<b>安装为 app</b>。用同样的方法装上 Claude AppStore，以后一键获取。")}</li></ol>
    <div class="acts"><a class="btn pri" href="https://claude.ai/download" target="_blank" rel="noopener">${t("Download Claude","下载 Claude")}</a>
    <button class="btn sec" data-retry>${t("I have it, try again","已经装了，再试一次")}</button></div>
    <button class="lnk" data-web>${t("Open in the browser instead","先在浏览器里打开")}</button></div>`;
  m.innerHTML=opening;
  const timer=setTimeout(()=>{m.innerHTML=help;m.querySelector(".btn.pri")?.focus()},1500);
  const close=()=>{clearTimeout(timer);m.remove();document.removeEventListener("keydown",onKey);window.removeEventListener("blur",away);document.removeEventListener("visibilitychange",onVis)};
  const away=()=>close(), onVis=()=>{if(document.hidden)close()}, onKey=e=>{if(e.key==="Escape")close()};
  window.addEventListener("blur",away);document.addEventListener("visibilitychange",onVis);document.addEventListener("keydown",onKey);
  m.addEventListener("click",e=>{if(e.target===m)close();else if(e.target.closest("[data-retry]")){close();openInDesktop(url)}else if(e.target.closest("[data-web]")){close();window.open(url,"_blank","noopener")}});
  document.body.appendChild(m);
}

/* Sidebar card: install the store itself as an app.
   ask  = this Claude window can install it now (click calls install.request)
   done = already installed on this computer
   open = elsewhere on a Mac or Windows computer: open the store artifact in the Claude desktop app, where it can be installed */
function setInst(mode,onClick){
  const a=document.getElementById("selfinstall");if(!a)return;
  a.querySelector(".instic").innerHTML=ICON_SVG.store||"";
  const tx={ask:[t("Install Claude AppStore","安装 Claude AppStore"),t("Get it as a Mac or Windows app","装成 Mac 或 Windows 上的 app")],
            done:[t("Claude AppStore is installed","Claude AppStore 已安装"),t("Open it from your Dock or Start menu","在程序坞或开始菜单里打开")],
            open:[t("Install Claude AppStore","安装 Claude AppStore"),t("Opens in the Claude desktop app","在 Claude 桌面端里打开安装")]}[mode];
  a.querySelector("b").textContent=tx[0];a.querySelector("small").textContent=tx[1];
  a.classList.toggle("done",mode==="done");a.hidden=false;
  if(mode==="ask"){a.removeAttribute("href");a.onclick=e=>{e.preventDefault();onClick()};}
  else if(mode==="done"){a.removeAttribute("href");a.onclick=e=>e.preventDefault();}
  else{const id=STORE_ARTIFACT.split("/").pop();
    if(SITE){a.href=STORE_ARTIFACT;a.target="_blank";a.onclick=e=>{if(openInDesktop(STORE_ARTIFACT))e.preventDefault();};}
    else{a.href="claude://claude.ai/artifact/"+id;a.target="_top";a.onclick=null;}}
}
if(DESKTOP_OS&&STORE_ARTIFACT&&!STORE_ARTIFACT.startsWith("/*"))setInst("open");
function storeIcon(){
  return new Promise(res=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");
    x.shadowColor="rgba(0,0,0,.3)";x.shadowBlur=20;x.shadowOffsetY=8;x.drawImage(img,50,44,412,412);res(c.toDataURL("image/png"))};
    img.onerror=()=>res(null);img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(ICON_SVG.store)});
}
(async()=>{
  const desktop=window.claude?.use?await window.claude.use("desktop").catch(()=>null):null;
  if(!desktop) return;
  if(desktop.tray){document.getElementById("selfinstall").hidden=true;storeIcon().then(u=>u&&desktop.app.dock.setIcon(u)).catch(()=>{});return;}
  const st=await desktop.install.state().catch(()=>"unavailable");
  if(st==="available"){setInst("ask",()=>desktop.install.request().then(r=>{if(r==="installed")setInst("done")}).catch(()=>{}));}
  else if(st==="installed")setInst("done");
})();
</script>
<script>
/*INSTALL_PROMPT*/
/* When this artifact is open in Claude Desktop but not installed as an app yet, invite the person
   to install it. Shows once per session; the install itself is Claude's own dialog, started from
   the person's click (install.request() needs a click). Silent in browsers, on mobile and inside the
   installed app. */
(async()=>{
  if(!window.claude||!claude.use)return;
  try{if(sessionStorage.getItem("appstore.installAsked"))return}catch{}
  const d=await claude.use("desktop").catch(()=>null);
  if(!d||d.fs||!d.install)return;                       // d.fs exists only inside the installed app
  const st=await d.install.state().catch(()=>"unavailable");
  if(st!=="available")return;
  await new Promise(r=>setTimeout(r,900));
  if(document.querySelector(".aspi"))return;
  const zh=window.__ZH??/^zh/i.test(navigator.language||"");
  const T=(en,c)=>zh?c:en;
  const name=(document.title||"").trim()||T("this app","这个 app");
  const icon=typeof DOCK_SVG==="string"?DOCK_SVG:(typeof ICON_SVG==="object"&&ICON_SVG.store)||"";
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const st2=document.createElement("style");
  st2.textContent=`.aspi{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:rgba(20,20,19,.42);padding:16px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.aspi .b{--bg:#FAF9F5;--fg:#141413;--mu:#6B6A64;--pill:#EDE6DA;--ac:#B9532F;--on:#fff;background:var(--bg);color:var(--fg);border-radius:18px;max-width:380px;width:100%;padding:24px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
@media (prefers-color-scheme:dark){.aspi .b{--bg:#262624;--fg:#FAF9F5;--mu:#A6A39A;--pill:#3A3632;--ac:#E08A6A;--on:#1F1E1D}}
.aspi .ic{width:72px;height:72px}.aspi .ic svg{width:72px;height:72px;display:block}
.aspi h3{margin:2px 0 0;font-size:18px;font-weight:700;line-height:1.25}
.aspi p{margin:0;color:var(--mu)}
.aspi .row{display:flex;flex-direction:column;gap:8px;align-self:stretch;margin-top:6px}
.aspi button{font-family:inherit;font-weight:600;font-size:15px;line-height:1;border:0;border-radius:999px;padding:12px 16px;cursor:pointer}
.aspi .y{background:var(--ac);color:var(--on)}.aspi .n{background:var(--pill);color:var(--fg)}`;
  const m=document.createElement("div");m.className="aspi";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("data-no-i18n","");
  m.innerHTML=`<div class="b"><div class="ic">${icon}</div>
    <h3>${esc(T(`Install ${name} as an app?`,`把「${name}」安装为 app？`))}</h3>
    <p>${esc(T("It gets its own window and Dock icon, opens like any other app, and keeps working on your Claude plan.","装好后有自己的窗口和 Dock 图标，像普通 app 一样打开，继续用你的 Claude 套餐。"))}</p>
    <div class="row"><button class="y">${esc(T("Install","安装"))}</button><button class="n">${esc(T("Not now","以后再说"))}</button></div></div>`;
  const close=()=>{m.remove();st2.remove();try{sessionStorage.setItem("appstore.installAsked","1")}catch{}};
  m.addEventListener("click",async e=>{
    if(e.target===m||e.target.closest(".n"))return close();
    if(e.target.closest(".y")){const r=await d.install.request().catch(()=>"failed");close();
      if(r==="failed"||r==="unavailable"){const n=document.createElement("div");n.textContent=T("Couldn't install. Use Install as app in the artifact's menu.","没装上。可以在工件菜单里选“安装为 app”。");n.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#141413;color:#fff;padding:10px 14px;border-radius:10px;z-index:2147483000;font:13px system-ui";document.body.appendChild(n);setTimeout(()=>n.remove(),5000)}}
  });
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"&&m.isConnected){close();document.removeEventListener("keydown",k)}});
  document.head?document.head.appendChild(st2):document.body.appendChild(st2);document.body.appendChild(m);
  m.querySelector(".y").focus();
})();
/*END_INSTALL_PROMPT*/
</script>
